<style>
/* 版面：頂部名稱與分頁固定，下方為可搜尋的清單；區域分頁左為地圖、右為房間與 NPC。
   色彩取自青瓷與朱砂印泥：青瓷綠為主色，朱砂只用在唯一、劇毒這類警示標記。 */
:root {
  --bg: #edf1ee;
  --panel: #f8faf8;
  --sunk: #e3e9e5;
  --fg: #1b2420;
  --muted: #5b6a63;
  --line: #cdd7d1;
  --accent: #2c6a58;
  --accent-soft: #d5e6de;
  --seal: #a3372a;
  --seal-soft: #f3dcd7;
  --gold: #7d6310;
  --room: #ffffff;
  --room-line: #9fb3a9;
  --c-black: #6b7470; --c-red: #b3261e; --c-green: #1f7a3d; --c-yellow: #8a6a00;
  --c-blue: #1f4fb3; --c-magenta: #8e2f8e; --c-cyan: #0b7385; --c-white: #4f5b66;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --panel: #171e1b; --sunk: #0d1210; --fg: #e1e8e4; --muted: #92a39a; --line: #2a3530;
    --accent: #72c2a6; --accent-soft: #1d3530; --seal: #e57866; --seal-soft: #3a1f1b; --gold: #d8b64f;
    --room: #1d2622; --room-line: #3d4f47;
    --c-black: #8d9894; --c-red: #ff7b72; --c-green: #6fd08c; --c-yellow: #e8c547;
    --c-blue: #7aa7ff; --c-magenta: #e08ae0; --c-cyan: #5fd3e0; --c-white: #f2f5f4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --panel: #171e1b; --sunk: #0d1210; --fg: #e1e8e4; --muted: #92a39a; --line: #2a3530;
  --accent: #72c2a6; --accent-soft: #1d3530; --seal: #e57866; --seal-soft: #3a1f1b; --gold: #d8b64f;
  --room: #1d2622; --room-line: #3d4f47;
  --c-black: #8d9894; --c-red: #ff7b72; --c-green: #6fd08c; --c-yellow: #e8c547;
  --c-blue: #7aa7ff; --c-magenta: #e08ae0; --c-cyan: #5fd3e0; --c-white: #f2f5f4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top .wrap { padding-block: 0; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding-block: 14px 8px; }
.brand h1 { margin: 0; font-family: var(--serif); font-size: 1.55rem; letter-spacing: 0.08em; }
.brand .tally { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: 0 0 auto; border: 0; background: none; color: var(--muted); font: 500 0.98rem var(--sans); padding: 8px 14px; border-bottom: 2px solid transparent; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, .chip:focus-visible, .row-head:focus-visible, .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 16px 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 100px)); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line); }
.search { flex: 1 1 260px; min-width: 0; font: 0.95rem var(--sans); padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 3px 12px; font: 0.88rem var(--sans); cursor: pointer; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; font-size: 0.8rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chip[aria-pressed="true"] .n { color: var(--panel); opacity: 0.8; }
.hint { color: var(--muted); font-size: 0.85rem; }
.list { }
.row { border-bottom: 1px solid var(--line); }
.row-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr) 7.5em; gap: 4px 16px; align-items: baseline; padding: 9px 4px; cursor: pointer; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; }
.row-head:hover { background: var(--sunk); }
.row.open > .row-head { background: var(--accent-soft); }
.nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.nm .en { font-weight: 400; color: var(--muted); font-size: 0.82rem; margin-left: 6px; }
.sum { color: var(--muted); font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--muted); }
.tag { display: inline-block; font-size: 0.72rem; letter-spacing: 0.04em; padding: 0 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.tag.seal { border-color: var(--seal); color: var(--seal); background: var(--seal-soft); }
.tag.gold { border-color: var(--gold); color: var(--gold); }
.tag.ok { border-color: var(--accent); color: var(--accent); }
.detail { padding: 4px 4px 18px; display: grid; gap: 14px; }
.detail .long { white-space: pre-wrap; font-family: var(--serif); line-height: 1.8; max-width: 44em; margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.88rem; min-width: 18em; }
th, td { text-align: left; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
td.v { font-variant-numeric: tabular-nums; text-align: right; padding-right: 20px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.trait-group h4 { margin: 0 0 4px; font: 500 0.82rem var(--sans); color: var(--muted); letter-spacing: 0.05em; }
code, .file { font-family: var(--mono); font-size: 0.82rem; }
.file { color: var(--muted); overflow-wrap: anywhere; }
pre.code { font-family: var(--mono); font-size: 0.8rem; background: var(--sunk); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 0; white-space: pre; }
.linkish { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.copy { font: 0.75rem var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 4px; padding: 0 6px; margin-left: 8px; cursor: pointer; }
.empty { color: var(--muted); padding: 24px 4px; }
/* 區域 */
.area-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.map-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
.map-scroll { overflow: auto; max-height: 70vh; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.8rem; padding: 6px 2px 0; }
.layer-title { font: 600 0.9rem var(--serif); color: var(--muted); margin: 6px 2px 2px; }
svg.map text { font-family: var(--sans); font-size: 12px; fill: var(--fg); pointer-events: none; }
svg.map .room rect { fill: var(--room); stroke: var(--room-line); stroke-width: 1; rx: 5; }
svg.map .room.has-npc rect { stroke: var(--accent); stroke-width: 1.6; }
svg.map .room.sel rect { fill: var(--accent); stroke: var(--accent); }
svg.map .room.sel text { fill: var(--panel); }
svg.map .room.hl rect { stroke: var(--seal); stroke-width: 2.4; }
svg.map .room { cursor: pointer; }
svg.map .room:focus-visible rect { stroke: var(--seal); stroke-width: 2.4; }
svg.map line { stroke: var(--room-line); stroke-width: 2; }
svg.map .cmd { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
svg.map .dot { fill: var(--accent); }
svg.map .ud { font-size: 10px; fill: var(--muted); }
.side { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 1.1rem; }
.npc-list { display: flex; flex-wrap: wrap; gap: 6px; }
.npc-list .chip { font-size: 0.85rem; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
/* NPC 視窗 */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 13, 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--panel); color: var(--fg); border-radius: 10px; border: 1px solid var(--line); width: min(640px, 100%); max-height: 88vh; overflow: auto; padding: 18px 20px 20px; display: grid; gap: 12px; }
.dialog h2 { margin: 0; font-family: var(--serif); font-size: 1.35rem; }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; }
.dlg-head h2 { flex: 1 1 auto; min-width: 0; }
.dialog .close { flex: none; margin: 0; min-width: 4.5em; min-height: 32px; padding: 4px 12px; font-size: 0.85rem; line-height: 1.2; }
/* 遊戲裡的 ANSI 顏色 */
.a1 { font-weight: 700; }
.a30 { color: var(--c-black); } .a31 { color: var(--c-red); } .a32 { color: var(--c-green); } .a33 { color: var(--c-yellow); }
.a34 { color: var(--c-blue); } .a35 { color: var(--c-magenta); } .a36 { color: var(--c-cyan); } .a37 { color: var(--c-white); }
@media (max-width: 760px) {
  .area-grid { grid-template-columns: minmax(0, 1fr); }
  .row-head { grid-template-columns: minmax(0, 1fr) auto; }
  .row-head .sum { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) { .row-head { transition: background 0.12s; } }
</style>

atus":"live","users":["d/snowkeep/npc/yu_lan_jian_yi.c","custom/armor/hand/celestial_tigers_claw.c"],"cat":"其他","desc":"天邪神掌（NEW 新版武功寫法）。雪吟莊以天邪虎的形象研習出的掌法，enable 在 unarmed。 出掌後有機會定人、發出虎嘯、回氣（機率看自己的行動力）； 絕招 perform unarmed:cele zarn（天邪掌）。設計見 docs/martial_arts/雪吟莊_武功.md。","formula":"【武功引擎參數】整套傷害加成 0%；武術造詣 lv × 10；lv ≥ 30 起武學之道 (lv − 29) × 10","gp":"無","ga":"無","growth":[],"notes":["依自己的行動力成長的機率：base% + 行動力/div，最高 max%。"],"file":"source/upstream/mudlib/daemon/skill/celestial_palm.c","detail":""},{"code":"taiyie","name":"太乙劍法","impl":true,"status":"live","users":["d/taiyi/npc/hsuan_ching.c"],"cat":"劍術、拆招卸力之法","desc":"太乙劍法（NEW 新版武功寫法）。道士共通劍法，可當劍術與招架；五招，沒有特技。 設計見 docs/martial_arts/道士共通_太乙劍法.md。","formula":"【調整共同規則】\n  學成等級：20 級（0 級累積到門檻後直接學成到 20 級）\n  學成所需累積點數：40,000（20² × 100 基數）\n【武功引擎參數】整套傷害加成 0%；武術造詣 lv × 10；lv ≥ 41 起武學之道 (lv − 40) × 10","gp":"無","ga":"無","growth":[],"notes":[],"file":"source/upstream/mudlib/daemon/skill/taiyie.c","detail":""},{"code":"taoism of darkness","name":"茅山奇術","impl":true,"status":"live","users":["d/lee/npc/du_feng_ling.c","custom/weapon/sword/red_of_sword.c","d/baobao/npc/obj/angry_whip.c"],"cat":"咒術","desc":"茅山奇術（taoism of darkness）。幻霧觀專長咒術，enable 在咒術（spells）上，以 cast 施展； 每次施展消耗一張少陰符，不另外消耗精、氣、神。 ghost_fire 鬼火術、smoke 鬼煙術、hell_fire 幽冥之火。 設計見 docs/martial_arts/幻霧觀_茅山奇術與奇門術.md。","formula":"【調整共同規則】\n  學成等級：20 級（0 級累積到門檻後直接學成到 20 級）\n  學成所需累積點數：30,000（技能檔指定）\n【升級獎勵】戰鬥 gain；法術 random(me->query_attr(\"spi\") / 2) + 1","gp":"無","ga":"無","growth":[],"notes":[],"file":"source/upstream/mudlib/daemon/skill/taoism_of_darkness.c","detail":"茅山奇術（幻霧觀）。enable 在咒術上，指令 cast <咒文>。\n學習條件：幻霧觀弟子（只收阿修羅、巫首、雨師妾、無腸、夜叉）。累積 30,000 點學成 20 級。\n每次施展消耗一張少陰符，不另外消耗精、氣、神。\n命中：50 + 咒文技巧 × 2 %，限 5～95%；沒有陰火抗性，不看對方抗性，也不吃裝備的元素加成。\n咒文強度借用天師的公式（見共同規則）。\n\n咒文：\n  1 鬼火術　　習得 0 級　停頓 1　重數 1　傷害 = D × 33%（打氣）\n  2 鬼煙術　　習得 30 級　停頓 1　重數 2　脫離戰鬥並隱藏；隱藏值 = 1 + random((潛行 + 茅山奇術) ÷ 2 × 2)；\n                                         對手警覺性高於隱藏值就看得穿，看得穿的只停手一次；沒在交手時不能施展\n  3 幽冥之火　習得 50 級　停頓 1　重數 3　傷害 = D ],"file":"","detail":""},{"code":"mao-shan lightning","name":"茅山【五雷術】","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"法術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""},{"code":"taoism of conviction","name":"天師道法【桃山密籙】","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"法術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""},{"code":"taoism-cloud","name":"天師道法【素雲書】","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"法術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""}],"rules":[{"title":"升級規則（所有技能）","body":"● 拿到的點數先累積，下 gain 時才判定升級，一次最多升一級。\n● 升到某一級所需累積點數 = 等級² × 基數\n● 基數：\n1–60 級 100\n61–90 級 125\n91–120 級 150\n121–160 級 175\n161–180 級 200\n181-200 級 250\n\n程式：`feature/char/skill.c` 的 `restored_skill_threshold()`。"},{"title":"點數與等級（所有技能）","body":"● 取得點數：每次得到的點數 × (1 + random(人物等級 ÷ 8))。\n● 玩家要下 gain 才升級；NPC 不會下 gain，拿到點數就照同一套門檻升級。\n● 還沒學成（0 級）的技能累積到「學成等級」的門檻時，gain 後直接學成到那一級；沒指定的學成等級是 1。\n● 等級上限 200。每個玩家的每項技能還有「個人上限」：得到技能的當下，從 140、145、……、200 擇一（機率平均），\n  之後不再改變；舊角色已經練過頭的技能，上限設成目前等級。NPC 上限 200。\n● 技能檔可以改共同規則的四個地方（各技能細節只列有改的）：\n  學成等級（query_entry_level）、學成所需累積點數（query_entry_threshold）、\n  門檻打折的百分比（query_threshold_percent）、等級上限（query_skill_cap，與個人上限取較低的）。\n● 放棄（abandon）的技能不再累積點數。\n● 有效等級：沒有對應其他技能時就是技能等級；對應（enable）了其他技能時是（原技能 + 對應技能）÷ 2；\n  再加臨時加成（裝備等 apply/技能），最高 200。"},{"title":"升級時自動給的獎勵（只對玩家）","body":"● 基本兵器技能升級給武術造詣：徒手、閃躲、招架、刀、劍、斧、槍、杖、錘、匕首、針、鞭，\n  含雙手、副手各版本。每升到第 sk 級給 sk × 10 點武術造詣；一次升多級時每一級都給。\n● 法術道行：能 enable 在法術（magic）上的技能，每升到第 n 級給 n × 10 點法術道行（基本法術本身不算）。\n● 咒術道行：基本咒術（spells）與能 enable 在咒術上的技能（天師道法四系、茅山奇術、茅山幻術等），\n  每升到第 sk 級給 sk × 30 點咒術道行；一次升多級時每一級都給。\n● 新版武功引擎（std/martial_art.c）的武功：每升一級給武術造詣 lv × ma_coef；\n  lv ≥ mm_start 時另給武學之道 (lv − mm_minus) × mm_coef。學成等級大於 1 的武功，\n  學成那一級本身不給（art_entry_reward = 1 才給），之後每級給。各武功的 ma_coef、mm_start 等數字列在各技能裡。"},{"title":"屬性成長（對應表內的技能）","body":"對應表（`feature/char/skill.c` 的 ATTR_GROWTH）：\n徒手→膂力、內功→根骨、閃躲→機敏、招架→定力、潛行→機敏、咒術→靈性、法術→靈性、\n偷襲暗算→膽識、殺手本能→膽識、讀書識字→悟性、古文造詣→悟性、五行陰陽之學→悟性（2026-11-14）、善想禪要→慧根。\n\n● 技能等級每到 5 的倍數擲一次，成功則該屬性（裸值，不含裝備）+1，沒有上限（2026-11-12 取消上限 50）。例外：偷襲暗算（backstab，增加膽識）、潛行（sneak，增加機敏）盜賊逢 5 擲一次，其他職業逢 10 擲一次（使用者定案，2026-10-30；潛行 2026-11-02）。\n● 機率 = 基礎機率 × (100 + 技能等級) × 0.9 %，最高 100%（2026-11-12 整體倍率由 0.6 提高為 0.9；屬性沒有上限）\n● 基礎機率（看屬性目前的裸值）：\n1–10 100%\n11–15 90%\n16–20 80%\n21–25 60%\n26–30 40%\n31–40 30%\n41–45 15%\n46 以上 10%\n● 每個門檻一生只擲一次（記在 attr_growth/<技能>），已經練過的等級不補擲。善想禪要 100 級改為固定慧根 +3。"},{"title":"經驗值（點數）的來源通則","body":"預設公式（沒有另外設定的技能都用這條）：\n  智力公式 = (random(智力) + 1) × (random(智力) + 1) + random(智力)\n  程式：`COMBAT_D->int_formula_exp()`。\n\n攻擊命中時（`adm/daemons/combatd.c` 的 restored_hit_gain）：\n● 基本兵器技能：自己的智力公式一次。\n● 新版武功：基本技能與武功本身各擲一次智力公式；瘋虎刀法本身另加 random(膽識)。\n● 徒手且沒有用武功：(random(膂力)+1) × (random(膂力)+1) + random(膂力)。\n● 空手打中、且內功設定成特殊內功：基本內功另得 (random(膂力) × random(定力) + random(膂力)) × max(1, 智力 ÷ 7)。\n● 非基本攻擊技能（用 enable 的武功）造成傷害，每次 1 點武術造詣。\n\n防守成功時：\n● d = 對手等級 − 自己等級，限制在 2～10。\n● 閃躲：基本閃躲與身法各擲一次 (random(機敏)+1) × (random(d)+1) × max(1, 智力 ÷ 7)。\n● 招架（格擋成功，含保底、完全擋下）：基本招架 (random(定力)+1) × (random(d)+1) × max(1, 智力 ÷ 7)；\n  學過強力格擋再得該點數的 (定力 × 1.5 ～ 100)%，定力 67 以上固定 100%。\n  enable 在招架上的武功不從格擋拿點數，武功檔有 parry_gains_exp() 傳回 1 才給。\n● 招架不及：點數取 1/4（至少 1）、不給實戰經驗。\n● 閃躲或格擋成功時另得實戰經驗：對手是玩家 random(2)；對手是 NPC 時隨機取 1 ～ 對手等級，自己等級大於對手則減半（最少 1 點）。\n\n內功打坐每次心跳（`restored_force_tick_exp`）：基本內功得 random(根骨) + random(定力) × max(1, 智力 ÷ 7)；\n內功本身再加各自的公式（見各內功）。"},{"title":"戰鬥公式（基本）","body":"完整說明見 `docs/martial_arts/戰鬥流程說明.md`，下列是摘要：\n\n● 攻勢等級 = 膽識 × 膂力 ÷ 10 + 目前的氣 ÷ 32 + 裝備加成；守勢等級 = 定力 × 慧根 ÷ 10 + 目前的氣 ÷ 16 + 裝備加成。\n  多個敵人時出手機率 = 50 + (我的攻勢 − 對方守勢) × 2，限制在 20%～80%。\n● 技巧（決定能不能打中）= 攻擊能力 + 攻擊技能有效等級 + 招式命中值 − random(對方對同一技能的等級) − 對方上一招的防守值；\n  攻擊能力 = 機敏 × 膽識 ÷ 10 + 目前的精 ÷ 32 + 裝備加成。\n● 力道（決定威力）= 膂力 × 膽識 × 150 + 目前的氣 × 30 + 內功加成；\n  內功加成 = 內功等級 × 目前的氣 × (出手功力 + 招式內力值) ÷ 25。\n● 閃躲值 = 防禦能力 + 閃躲技能有效等級；防禦能力 = 機敏 × 定力 ÷ 10 + 目前的精 ÷ 32 + 裝備加成。\n  命中率 = 50 + (攻擊技巧 − 閃躲值) × 2，限制在 5%～95%。\n● 招架：格擋力道上限 = (膂力 × 定力 × 150 + 目前的氣 × 30 + 自己的內功加成) × (100 + 招架等級)%；\n  學過強力格擋，對方有內功 ×5、沒有 ×2。力道不足時仍有 5% + 招架等級 ÷ 4 %（最多 50%）的保底格擋。\n● 傷害：空手 = 1 + 力道 ÷ 10,000 + random(力道 ÷ 10,000) + 裝備傷害加成；\n  拿武器 = 武器倍數 × (1 + random(武器範圍)) + 武器固定值 + 力道加成 + 裝備傷害加成；\n  再套招式傷害加成與招架減傷，最後扣防具（空手整個扣、武器扣 random(防具值)）。\n● 重擊術發動機率 = 10% + 重擊術等級 ÷ 5。"},{"title":"咒術共用規則（天師道法四系；茅山奇術借用強度與命中）","body":"程式：`daemon/skill/taoism-spells.c`，火術、冰咒、風符、雷法四系都繼承它；各系的咒文表在各技能裡。\n\n● 咒文強度 D = (慧根² ÷ 10 + 施咒當時的神 ÷ 32 + random(慧根)) × 咒術倍數\n  咒術倍數：基本咒術（spells）未滿 100 級為 100%，100 級起為 (50 + 咒術等級)%。\n● 咒文技巧 = 咒術有效等級 + 咒文能力\n● 命中率 = 50 + (咒文技巧 − 對方抗性) × 2，限制在 5%～95%（四系相同）。\n  無視抗性的咒文，命中不扣抗性。\n● 傷害 = 咒文強度 × 該咒文百分比 + 裝備的元素傷害力（apply/damage_vs_元素） − 對方抗性（apply/armor_vs_元素）；最低 1。\n  火、冰、雷每 1 點抗性減 1 點傷害；風每 2 點才減 1 點。\n● 每次施咒：消耗神、得法術修為 random(慧根 ÷ 6) + 1（慧根 6 以上才有 random 部分，否則固定 1）。\n● 打中時得實戰經驗 1 + 傷害 ÷ 40，最多 20。\n● 增幅（overload）狀態：咒文強度 ×1.5，施展後解除（六卦熒雷不消耗）。\n● 技能點數（每次施咒各自擲一次；沒命中只給 1/4、至少 1 點；咒文重數就是第幾道咒文）：\n  基本咒術：((random(慧根)+1) × (random(慧根)+1) + random(慧根)) × (random(重數) + 1)\n  該系咒術：(random(悟性) × random(慧根) + random(慧根)) × (random(重數) + 1)\n● 求教後還沒 gain 的 0 級，也能施展需求 0 級的第一道咒文。"},{"title":"法術（茅山派）共用規則","body":"適用茅山法術、茅山奇術（咒術）、茅山幻術、遁甲書、奇門術、丹道兩門。\n\n● 法術點數（施法成功各自擲一次）：\n  基本法術：((random(靈性)+1) × (random(靈性)+1) + random(靈性)) × (random(層級) + 1)\n  茅山法術類技能：((random(悟性)+1) × (random(靈性)+1) + random(靈性)) × (random(層級) + 1)\n  層級是各法術自己定的（見各技能）。\n● 咒術系（茅山奇術、茅山幻術）改用咒術共用規則的技能點數公式（慧根、悟性）。"}],"weapons":[{"id":"/custom/weapon/blade/black_kris","file":"source/upstream/mudlib/custom/weapon/blade/black_kris.c","name":"黑風刀","ids":["black kris","blade"],"long":"一把黑漆漆的短刀, 刀面上隱隱散發出一陣陣的黑氣!","weight":8500,"value":"850 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"刀法","code":"blade","dmg":"2 - 26","bonus":"80%","mult":2},{"skill":"左手刀法","code":"secondhand blade","dmg":"2 - 12","bonus":"80%","mult":2}],"traits":{"刀法":[["拆招卸力之法",10,"parry"],["膂力",1,"str"]],"左手刀法":[["拆招卸力之法",10,"parry"],["膂力",1,"str"]]}},{"id":"/custom/weapo "縱躍閃躲之法",-5,"dodge"],["冰寒傷害防禦力",20,"armor_vs_ice"],["防禦力",30,"armor"]]}},{"id":"/d/swaylan/buxuan/npc/obj/black_harness","file":"source/upstream/mudlib/d/swaylan/buxuan/npc/obj/black_harness.c","name":"\u001b[1;30m玄晦戰甲\u001b[m","ids":["black harness","harness"],"long":"這是一副黑色有如長袍的甲冑，摸起來非絲非革，而且出乎意料之外的沉重。\n甲冑上刻著許多密密麻麻的古文。","weight":5000,"value":"2500 兩","unit":"件","flags":["可研讀"],"slot":"armor","traits":{"護甲":[["定力",2,"cps"],["內功",10,"force"],["防禦力",25,"armor"]]}},{"id":"/custom/armor/armor/brimstony_armor","file":"source/upstream/mudlib/custom/armor/armor/brimstony_armor.c","name":"赤龍鱗","ids":["brimstony armor","armor"],"long":"這是一件用赤龍的龍鱗做成的盔甲﹐不僅具有不同凡響的防禦力﹐\n還具有一定的法術防禦力。","weight":5000,"value":"250 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["風擊傷害防禦力",20,"armor_vs_wind"],["防禦力",30,"armor"],["火焰傷害防禦力",20,"armor_vs_fire"],["膂力",2,"str"]]}},{"id":"/d/swaylan/lunmay/npc/obj/chain_shirt","file":"source/upstream/mudlib/d/swaylan/lunmay/npc/obj/chain_shirt.c","name":"鎖鏈背心","ids":["chain shirt","shirt"],"long":"一件用許多細小的金屬圈連成的鎖鏈背心，重量不算太重，也能提供不錯\n的防禦力。","weight":8000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["機敏",-1,"dex"],["防禦力",27,"armor"]]}},{"id":"/d/snowkeep/npc/obj/dark_armor","file":"source/upstream/mudlib/d/snowkeep/npc/obj/dark_armor.c","name":"\u001b[1;30m闇之絲甲\u001b[m","ids":["dark armor","armor"],"long":"一套由黑色細絲製作而成的護甲，這套護甲對一些法術似乎有些擋抗力。","weight":3000,"value":"100 兩","unit":"件","flags":["限盜賊"],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"],["風擊傷害防禦力",20,"armor_vs_wind"],["潛行伏進之技",10,"sneak"],["警覺性",50,"awarness"]]}},{"id":"/custom/armor/armor/double_cloudy_plate","file":"source/upstream/mudlib/custom/armor/armor/double_cloudy_plate.c","name":"\u001b[1;37m兩儀雲龍甲\u001b[m","ids":["double cloudy plate","plate"],"long":"這是一件用白銀打造的鎧甲，鎧甲的正面鑲有一條白金的雲龍，雲\n龍的四周還精心的雕有許多白雲。這件鎧甲的價值想來不低，但是\n防禦能力似乎不是很好。","weight":12000,"value":"200 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",15,"armor"],["風擊傷害防禦力",75,"armor_vs_wind"],["攻勢等級",50,"intimidate"]]}},{"id":"/d/snowkeep/npc/obj/dragon_armor","file":"source/upstream/mudlib/d/snowkeep/npc/obj/dragon_armor.c","name":"\u001b[1;31m怒龍錦冑\u001b[m","ids":["dragon armor","armor"],"long":"這是一件武林中的至寶﹐據說是由練火大山的幻黑龍皮所製成\n的寶甲﹐不但尋常刀槍難以透入﹐也能防火燄冰霜的侵害﹐最\n重要的是質地輕軟﹐絲毫不妨礙行動。","weight":5000,"value":"1000 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",45,"armor"],["火焰傷害防禦力",40,"armor_vs_fire"],["冰寒傷害防禦力",40,"armor_vs_ice"]]}},{"id":"/d/swaylan/forest/npc/obj/dragon_jade_robe","file":"source/upstream/mudlib/d/swaylan/forest/npc/obj/dragon_jade_robe.c","name":"\u001b[1;36m龍鱗璧玉袍\u001b[m","ids":["dragon armor","armor"],"long":"一套看來相當華麗的巨大鎧甲﹐外圍相傳是用龍鱗和綠玉合製而成的﹐內部則是以相\n當輕飄的鳳凰羽編製﹐是不可多得的傳奇神器。","weight":5000,"value":"200 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"],["防禦能力值",10,"defense"],["火焰傷害防禦力",10,"armor_vs_fire"],["冰寒傷害防禦力",20,"armor_vs_ice"]]}},{"id":"/custom/armor/armor/dragon_plate_of_knights","file":"source/upstream/mudlib/custom/armor/armor/dragon_plate_of_knights.c","name":"\u001b[1;33m龍騎戰甲\u001b[m","ids":["dragon plate of knights","plate"],"long":"一件厚重的鎧甲, 為軒轅心塵特地請匠師打造給領兵出爭的將軍們穿著的戰甲, 戰\n甲極為厚實, 非體格魁偉之人是無法穿戴的, 此外也因只有高階將領才會配發此甲\n所以穿著了這件龍騎甲, 在軒轅軍中也象徵了階級與地位。","weight":12000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["根骨",2,"con"],["防禦力",30,"armor"],["機敏",-1,"dex"]]}},{"id":"/custom/armor/armor/full_plate_of_fire_hawk","file":"source/upstream/mudlib/custom/armor/armor/full_plate_of_fire_hawk.c","name":"\u001b[1;31m火鷹戰鎧\u001b[m","ids":["full plate of fire hawk","plate"],"long":"一件火紅色鎧甲, 胸前雕著一隻展翅的大鷹, 鷹勾褐黃, 羽毛赤紅, 似以精鋼加火\n熔岩練成，厚重堅實，為不可多得之寶甲, 只是稍嫌笨重, 非魁武者難適應。","weight":12000,"value":"1000 兩","unit":"件","flags":["唯一"],"slot":"armor","traits":{"護甲":[["攻勢等級",20,"intimidate"],["防禦力",35,"armor"],["膽識",2,"cor"],["火焰傷害防禦力",50,"armor_vs_fire"]]}},{"id":"/custom/armor/armor/ghost_hell_plate","file":"source/upstream/mudlib/custom/armor/armor/ghost_hell_plate.c","name":"\u001b[1;37m冥魂戰鎧\u001b[m","ids":["ghost-hell plate","plate"],"long":"一件散發著陰氣的戰甲﹐上面細細的雕滿了一百又八個不同樣式的冤魂\n野鬼。據說﹐這種雕花是一種來自陰間的詛咒﹐在提昇某種能力的同時\n會大幅度的降低其他的能力﹐所以﹐天朝的工匠們稱這類裝備為詛咒系\n裝備。","weight":12000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"],["傷害力",10,"damage"],["膽識",1,"cor"]]}},{"id":"/d/snowkeep/npc/obj/heart_armor","file":"source/upstream/mudlib/d/snowkeep/npc/obj/heart_armor.c","name":"掩心甲","ids":["heart armor","armor"],"long":"一件輕便的皮甲，在心口處強化防禦，讓裝備者行動自如的同時還兼顧要害的防禦。","weight":10000,"value":"20 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",8,"armor"],["定力",1,"cps"]]}},{"id":"/d/snowkeep/npc/obj/heart_plate","file":"source/upstream/mudlib/d/snowkeep/npc/obj/heart_plate.c","name":"護心鏡","ids":["heart plate","plate"],"long":"一面打磨得發亮的圓形銅鏡，用皮帶繫在胸前，正好護住心口要害。","weight":6000,"value":"20 兩","unit":"面","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",10,"armor"],["守勢等級",10,"wittiness"]]}},{"id":"/custom/armor/armor/hell_dragon_armor","file":"source/upstream/mudlib/custom/armor/armor/hell_dragon_armor.c","name":"冥龍甲","ids":["hell dragon armor","armor"],"long":"一件看起來十分沉重的盔甲。由于整件盔甲是用生鐵製成的﹐\n所以有著良好的防禦能力﹐不過多少會帶來一些行動上的不便。","weight":12000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["縱躍閃躲之法",-5,"dodge"],["守勢等級",20,"wittiness"],["防禦力",30,"armor"]]}},{"id":"/custom/armor/armor/holy_dragon_armor","file":"source/upstream/mudlib/custom/armor/armor/holy_dragon_armor.c","name":"聖龍甲","ids":["dragon armor","armor"],"long":"一件金鏤內襯，外披精鋼鐵環的鍊子甲，乃是專為沙場戰將所打造\n的上品戰甲，有著強大的防護力。","weight":8000,"value":"1200 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["膂力",2,"str"],["膽識",2,"cor"],["防禦能力值",10,"defense"],["防禦力",40,"armor"]]}},{"id":"/custom/armor/armor/iron_armor","file":"source/upstream/mudlib/custom/armor/armor/iron_armor.c","name":"\u001b[1;33m鐵戰甲\u001b[m","ids":["iron armor","armor"],"long":"一件鐵甲, 是做來打仗的時候穿的,  可以提供相當嚴密的防護,\n但是相當笨重。","weight":12000,"value":"500 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"]]}},{"id":"/custom/armor/armor/iron_torso","file":"source/upstream/mudlib/custom/armor/armor/iron_torso.c","name":"鑌鐵胸鎧","ids":["iron torso","torso"],"long":"這件胸鎧上面綴了許多鑌鐵鎖片﹐從胸至腰。","weight":12000,"value":"150 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["火焰傷害防禦力",5,"armor_vs_fire"],["雷電傷害防禦力",5,"armor_vs_lightning"],["防禦力",12,"armor"]]}},{"id":"/custom/armor/armor/light_plate","file":"source/upstream/mudlib/custom/armor/armor/light_plate.c","name":"\u001b[1;37m光鎧\u001b[m","ids":["light plate","plate"],"long":"一件有著柔柔白光的鎧甲。材質不明，是凌承軒的一位故人所贈的\n異世寶物。因為輕巧，凌月蘅都隨身穿著它。","weight":12000,"value":"33 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["風擊傷害防禦力",25,"armor_vs_wind"],["雷電傷害防禦力",100,"armor_vs_lightning"],["防禦力",5,"armor"],["縱躍閃躲之法",10,"dodge"]]}},{"id":"/d/kangping/npc/obj/magic_armor","file":"source/upstream/mudlib/d/kangping/npc/obj/magic_armor.c","name":"法胄","ids":["magic armor","armor"],"long":"這是一件畫著闢邪符咒的甲冑，硬皮護肩連著保護胸口後心要害的銅鎖片。","weight":3000,"value":"250 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",10,"armor"],["法術",10,"magic"],["天師道法【桃山密籙】",10,"taoism of conviction"]]}},{"id":"/custom/armor/armor/monkey_armor","file":"source/upstream/mudlib/custom/armor/armor/monkey_armor.c","name":"猿仙絲冑","ids":["monkey armor","armor"],"long":"相傳乃陷空島島主路經幻仙池遇一八尺雪猿, 與之酣鬥七天七\n夜終將雪猿斬殺, 見雪猿皮厚異常乃神物也, 於是割其皮, 食\n其肉, 突感功力大增。再將猿皮製成寶甲, 穿上後風寒不侵刀\n劍難傷! 終於獨步武林, 成為一代大俠。","weight":3000,"value":"800 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["冰寒傷害防禦力",20,"armor_vs_ice"],["風擊傷害防禦力",20,"armor_vs_wind"],["茅山法術",10,"mao-shan magic"],["防禦力",20,"armor"]]}},{"id":"/d/npc/obj/padded_armor","file":"source/upstream/mudlib/d/npc/obj/padded_armor.c","name":"軟櫬甲","ids":["padded armor","armor"],"long":"這是一種輕型的甲冑，在棉花中夾縫著一片片的鐵片，防護力中等，也\n不會妨礙行動，不過大熱天穿起來非常悶熱。","weight":3000,"value":"95 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["冰寒傷害防禦力",20,"armor_vs_ice"],["防禦力",14,"armor"]]}},{"id":"/d/snowkeep/npc/obj/purple_cloud_mail","file":"source/upstream/mudlib/d/snowkeep/npc/obj/purple_cloud_mail.c","name":"\u001b[1;36m紫雲戰甲\u001b[m","ids":["purple-cloud mail","mail"],"long":"一副看來非常神氣的鎧甲, 在整副鎧甲上都雕滿著紫色的祥雲, 令人\n感到非常的祥和, 簡直一點都不像是副作戰用的鎧甲.","weight":12000,"value":"100 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"],["定力",2,"cps"]]}},{"id":"/custom/armor/armor/raw_iron_armor","file":"source/upstream/mudlib/custom/armor/armor/raw_iron_armor.c","name":"生鐵戰甲","ids":["iron armor","armor"],"long":"一件十分輕便的盔甲不過看起來防禦力不錯。","weight":12000,"value":"450 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",25,"armor"]]}},{"id":"/d/qiaoyin/npc/obj/red_scale_plate","file":"source/upstream/mudlib/d/qiaoyin/npc/obj/red_scale_plate.c","name":"火鱗胸鎧","ids":["red_scale plate","plate"],"long":"一件滿飾火紅色鱗片的鎧甲，鱗片上微微透出暗紅色的光暈。相傳柳東蘆早年\n遊經祈國與練火大山邊境時，曾仗著手中玄蘇劍，用計斬殺了一隻頭生雙角、\n口吐火燄的巨蟒，之後以巨蟒皮製成幾套防具，看來這就是其中一件了。","weight":5000,"value":"500 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",35,"armor"],["雙握劍術",10,"twohanded sword"],["火焰傷害防禦力",50,"armor_vs_fire"],["雷電傷害防禦力",100,"armor_vs_lightning"]]}},{"id":"/d/npc/obj/ring_armor","file":"source/upstream/mudlib/d/npc/obj/ring_armor.c","name":"連身鎖子甲","ids":["ring armor","armor"],"long":"一件連身鎖子甲﹐由鐵鍊接合許多鐵片﹐構成保護全身的一件戰甲﹐因\n為嵌上鐵片﹐所以比一般的鎖子鎧有更好的防禦效果﹐但是重量也重得\n多。","weight":8000,"value":"50 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["縱躍閃躲之法",-5,"dodge"],["防禦力",9,"armor"]]}},{"id":"/d/swaylan/npc/obj/ring_mail","file":"source/upstream/mudlib/d/swaylan/npc/obj/ring_mail.c","name":"鎖子鎧","ids":["ring mail","mail"],"long":"一件用上千個鐵環嵌結而成的鎖子鎧﹐雖然防禦力比不上戰場上\n常用的重型戰鎧﹐但是輕便堅固﹐不會妨礙行動則是戰鎧所沒有\n的優點。","weight":8000,"value":"80 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",5,"armor"]]}},{"id":"/d/baihua/npc/obj/ringmail","file":"source/upstream/mudlib/d/baihua/npc/obj/ringmail.c","name":"鎖子甲","ids":["ringmail"],"long":"一件由金屬環, 環環相扣所造成的鎖子甲, 防護力略差, 但由於輕便, 為實戰上極為常見的護甲。","weight":8000,"value":"80 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["膽識",1,"cor"],["防禦力",5,"armor"],["膂力",1,"str"],["攻擊能力值",10,"attack"]]}},{"id":"/d/baobao/npc/obj/royal_armor","file":"source/upstream/mudlib/d/baobao/npc/obj/royal_armor.c","name":"\u001b[1;37m霸王鎧\u001b[m","ids":["royal armor","armor"],"long":"亮白色的寶甲，護著肩部的地方是兩個虎頭，正中一面雪亮的護\n心鏡。","weight":12000,"value":"150 兩","unit":"件","flags":["限軍人"],"slot":"armor","traits":{"護甲":[["拆招卸力之法",10,"parry"],["重擊術",10,"powerblow"],["防禦力",25,"armor"]]}},{"id":"/custom/armor/armor/scale_armor","file":"source/upstream/mudlib/custom/armor/armor/scale_armor.c","name":"鐵披甲","ids":["scale armor","armor"],"long":"一套用圓形鐵片釘在鎖子甲上，用來提高防護力的鐵披戰甲，因為鐵片\n的重量很重，因此這種鎧甲只做半身，俗稱「鐵背心」。","weight":8000,"value":"90 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",10,"armor"]]}},{"id":"/custom/armor/armor/shapeless_heartguard","file":"source/upstream/mudlib/custom/armor/armor/shapeless_heartguard.c","name":"\u001b[1;34m無形心鏡\u001b[m","ids":["shapeless heartguard","heartguard"],"long":"一面閃著深藍色光芒的護心鏡，觸手冰涼，份量也不輕。","weight":2000,"value":"250 兩","unit":"面","flags":[],"slot":"armor","traits":{"護甲":[["根骨",1,"con"],["風擊傷害防禦力",50,"armor_vs_wind"],["防禦力",5,"armor"],["雷電傷害防禦力",50,"armor_vs_lightning"]]}},{"id":"/custom/armor/armor/shoulder_armor","file":"source/upstream/mudlib/custom/armor/armor/shoulder_armor.c","name":"\u001b[1;34m藍鋼肩甲\u001b[m","ids":["shoulder armor","armor"],"long":"一件發著暗藍光芒的肩甲，穿上這件甲胄可以保護左肩以及重要的\n心臟部位，肩甲下方還有兩條皮帶可緊緊的將肩甲固定在肩上，是\n一種極簡便又實用的戰甲。","weight":2000,"value":"95 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",10,"armor"]]}},{"id":"/d/npc/obj/side_armor","file":"source/upstream/mudlib/d/npc/obj/side_armor.c","name":"肩鎧","ids":["side armor","armor"],"long":"這是一副精鐵打造的肩鎧，天朝內地並不常見，是屬於南方光右族\n所用的護具，肩鎧用一條皮帶穿過一個護殼縛在肩測，如果力氣不\n夠大動作會受到妨礙。","weight":2000,"value":"10 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",4,"armor"]]}},{"id":"/d/swaylan/lunmay/npc/obj/silver_platemail_of_frost","file":"source/upstream/mudlib/d/swaylan/lunmay/npc/obj/silver_platemail_of_frost.c","name":"\u001b[1;37m銀霜鎧\u001b[m","ids":["silver platemail of frost","platemail"],"long":"這是一件銀白色的鎧甲，是梅影風特地託奐族人打造的﹒奐族工匠打\n造的武器乃是天朝武林人士夢寐以求的寶物，不但堅固耐用，而且輕\n便﹒梅影風這件鎧甲，尤為上品。","weight":12000,"value":"2500 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["攻勢等級",25,"intimidate"],["防禦力",35,"armor"],["冰寒傷害防禦力",50,"armor_vs_ice"]]}},{"id":"/custom/armor/armor/sky_cloud_mail","file":"source/upstream/mudlib/custom/armor/armor/sky_cloud_mail.c","name":"\u001b[1;34m天羅雲翳\u001b[m","ids":["sky cloud mail","mail"],"long":"一件通體蔚藍，質輕而柔軟的的鎧甲，甲冑的質料非鐵非革，柔\n韌而貼身，能將內勁消弭於無形","weight":3000,"value":"600 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["定力",2,"cps"],["防禦力",25,"armor"],["防禦能力值",20,"defense"]]}},{"id":"/custom/armor/armor/soul_lapis_lazuli_plate","file":"source/upstream/mudlib/custom/armor/armor/soul_lapis_lazuli_plate.c","name":"\u001b[1;34m靈中樞甲\u001b[m","ids":["soul lapis lazuli plate","plate"],"long":"一件湛藍色的寶甲，由無數片青金石以烏金絲線縫合，由內以外共縫合\n了五層。仔細的看，可看到每一片青金石上都面雕刻了一個骷髏頭。","weight":12000,"value":"1400 兩","unit":"件","flags":["限道士"],"slot":"armor","traits":{"護甲":[["防禦力",40,"armor"],["守勢等級",20,"wittiness"],["慧根",3,"wis"]]}},{"id":"/d/ziyan/npc/obj/steel_chain_armor","file":"source/upstream/mudlib/d/ziyan/npc/obj/steel_chain_armor.c","name":"鋼戰甲","ids":["steel armor","armor"],"long":"一件外披精鋼鐵環的鍊子甲，有著強大的防護力。","weight":8000,"value":"450 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["膽識",1,"cor"],["防禦力",20,"armor"]]}},{"id":"/d/swaylan/npc/obj/studded_armor","file":"source/upstream/mudlib/d/swaylan/npc/obj/studded_armor.c","name":"鑲釘皮鎧","ids":["studded armor","armor"],"long":"一副用好幾層牛皮疊在一起，用釘子穿過連結而成的皮鎧甲。","weight":5000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["攻勢等級",-5,"intimidate"],["防禦力",25,"armor"],["冰寒傷害防禦力",10,"armor_vs_ice"]]}},{"id":"/custom/armor/armor/tiger_armor","file":"source/upstream/mudlib/custom/armor/armor/tiger_armor.c","name":"破蠡虎皮","ids":["tiger armor","armor"],"long":"這是從神獸破蠡身上撕下來的一張虎皮, 它散發出的濃厚血腥味令你感到有\n些興奮...","weight":5000,"value":"910 兩","unit":"張","fla /upstream/mudlib/d/npc/obj/cowhide_vest.c","name":"牛皮背心","ids":["leather vest","vest"],"long":"用牛皮縫製的短背心，方便穿戴者的活動。","weight":4000,"value":"150 兩","unit":"件","flags":[],"slot":"cloth","traits":{"衣服":[["防禦力",7,"armor"]]}},{"id":"/custom/armor/cloth/crocodile_dress","file":"source/upstream/mudlib/custom/armor/cloth/crocodile_dress.c","name":"\u001b[1;32m鱷神戰袍\u001b[m","ids":["crocodile dress","dress"],"long":"這是一件用巨鱷王鱷皮製成的戰袍，相傳江渲少年時，亦水河畔傳聞\n出現一群巨鱷為患鄉里，失去牲畜時有所聞，生人被鱷群襲擊亦有之\n江渲聞此消息，遂與親族十數人前往除之，花了七晝夜，終於擊斃群\n鱷，唯獨為首的巨鱷王，身長二十餘尺，龐然大物，怪力異常不說，\n其鱷皮之厚，更非平常兵刃能傷，眾人圍攻之而不可取，在大伙都已\n精疲力盡，只剩江渲獨力與之搏鬥之時，一黑衣少年手中刀光一閃，\n隨即翩然而去。在江渲驚異之際，一股刀氣從巨鱷王額間迸發而出。\n鱷王死後，江渲取其皮製成數件器物，此鱷神戰袍便是其一。","weight":4000,"value":"300 兩","unit":"件","flags":[],"slot":"cloth","traits":{"衣服":[["膽識",2,"cor"],["雙握鎚法",10,"twohanded blunt"],["防禦力",10,"armor"]]}},{"id":"/d/qiaoyin/npc/obj/cyan_cloth","file":"source/upstream/mudlib/d/qiaoyin/npc/obj/cyan_cloth.c","name":"青布官服","ids":["cyan cloth","cloth"],"long":"青色綢緞製成的官服，上有金絲繡成的花紋。","weight":1000,"value":"170 兩","unit":"件","flags":[],"slot":"cloth","traits":{"衣服":[["防禦力",3,"armor"],["悟性",1,"int"],["五行陰陽之學",5,"mysticism"]]}},{"id":"/d/qiaoyin_east/npc/obj/cyan_taoist_robe","file":"source/upstream/mudlib/d/qiaoyin_east/npc/obj/cyan_taoist_robe.c","name":"青色道袍","ids":["cyan taoist robe","taoist robe","robe"],"long":"一件青色的道袍，布料細密，衣襟上繡著隱隱的雲紋，穿在身上隱約能抵擋火、風、冰、雷四種術法的侵襲。","weight":1200,"value":"300 兩","unit":"件","flags":[],"slot":"cloth","traits":{"衣服":[["防禦力",5,"armor"],["火焰傷害防禦力",20,"armor_vs_fire"],["風擊傷害防禦力",20,"armor_vs_wind"],["冰寒傷害防禦力",20,"armor_vs_ice"],["雷電傷害防禦力",20,"armor_vs_lightning"],["慧根",1,"wis"]]}},{"id":"/custom/armor/cloth/dark_cloth","file":"source/upstream/mudlib/custom/armor/cloth/dark_cloth.c","name":"\u001b[1;30m闇之絲衣\u001b[m","ids":["dark cloth","cloth"],"long":"一件全黑的衣服，其材質為黑色細絲所縫製而成的。","weight":1000,"value":"200 兩","unit":"件","flags":["限盜賊"],"slot":"cloth","traits":{"衣服":[["防禦力",10,"armor"],["機敏",1,"dex"],["潛行伏進之技",20,"sneak"]]}},{"id":"/custom/armor/cloth/devilis b/obj/alchemist/black_pill.c","name":"烏心丹","ids":["black pill","pill"],"long":"烏心丹是一種民間很普遍的藥方﹐用來恢復因操練、工作所耗的體力\n有不錯的效果﹐缺點是吃了以後會昏昏沈沈想睡覺﹐且容易口渴。","weight":5,"value":"80 文","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -30","食物 +5","神實格 -1","神 -4","精 +15","氣 +15"]},{"id":"/obj/alchemist/green_pill","file":"source/upstream/mudlib/obj/alchemist/green_pill.c","name":"甘靈清毒丹","ids":["green pill","pill"],"long":"甘靈清毒丹是一種清熱解毒的丹藥,由黃芩, 川貝母, 木通, 飛滑石\n等多種藥材鍊製而成, 為相當普遍的解藥藥物之一。","weight":5,"value":"6 兩 50 文","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -10","食物 +5","神 +2","解毒"]},{"id":"/obj/alchemist/lavage_pill","file":"source/upstream/mudlib/obj/alchemist/lavage_pill.c","name":"清腹丹","ids":["lavage pill","pill"],"long":"清腹丹是一種藥性峻烈的方家丹藥，由大黃、芒硝、枳實及厚朴等數種藥材煉製而成，具有通腑導滯、蕩除積穢之效。其藥力猛烈，服用後往往腹中翻攪、腸鳴不止，令人便意難抑，若非必要，實不宜輕易服用。","weight":5,"value":"10 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -10","食物 -30"]},{"id":"/obj/alchemist/major_heal_pill","file":"source/upstream/mudlib/obj/alchemist/major_heal_pill.c","name":"大還丹","ids":["major heal pill","major","pill"],"long":"大還丹是一種極神奇的仙丹, 具強大的療效可以讓服用者的\n內外傷在瞬間癒合, 不過煉製大還丹所需的藥材除了小還丹\n所需的幾樣藥材外, 還必需找尋雪蓮, 千年人蔘等數種罕見\n的珍貴藥材。因此, 大還丹除了燒煉困難外, 藥材之價格亦\n極昂貴。","weight":5,"value":"300 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -18","食物 +7","氣實格 +70","氣 +100","形體實格 +10","形體 +25"]},{"id":"/obj/alchemist/mana_pill","file":"source/upstream/mudlib/obj/alchemist/mana_pill.c","name":"醒神丹","ids":["mana pill","pill"],"long":"醒神丹是一種提神醒腦、恢復神思的丹藥，由遠志、石菖蒲、茯神、人蔘及甘草等數種藥材煉\n製而成。此丹具有寧神益智之效，能使因過度耗神而疲憊的精神迅速恢復，為方士常用的丹藥\n之一。","weight":5,"value":"30 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -10","食物 +5","神實格 +15～20","神 +30～35","精實格 -1","精 -5"]},{"id":"/obj/alchemist/minor_heal_pill","file":"source/upstream/mudlib/obj/alchemist/minor_heal_pill.c","name":"小還丹","ids":["minor heal pill","minor","pill"],"long":"小還丹是一種相當神奇的仙丹，可以讓服用者的外傷在瞬間癒合，換句\n話說，相對於一般只能恢復精氣神的普通丹藥，小還丹還能夠恢復形體\n所受的損傷，不過煉製小還丹所需的藥材頗為昂貴，而且燒煉時必須用\n大量的汞護住丹爐，因此所費不貲，很少有藥舖會販賣這種丹藥。","weight":5,"value":"60 兩" "id":"/obj/example/es2_bottle","file":"source/upstream/mudlib/obj/example/es2_bottle.c","name":"精緻玻璃瓶","ids":["bottle"],"long":"一個透明又很華麗的精緻玻璃瓶，這是 workshop 的紀念品。","weight":null,"value":"0 文","unit":null,"flags":[],"cat":"飲品"}],"npcs":{"/d/baihua/npc/dou_foo":{"id":"/d/baihua/npc/dou_foo","file":"source/upstream/mudlib/d/baihua/npc/dou_foo.c","name":"杜福","ids":["dou foo","dou","foo"],"long":"杜福是近幾年才搬進百花村定居的村民，平日沉默寡言，總是拄著一根長杖在崖邊散步。村裡的人都知道他棍法了得，曾經一個人打退過上山搶劫的盜匪，但問起他的來歷，他總是笑而不答。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/d/baihua/npc/obj/sinia_staff","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/cliff",1]]},"/d/baihua/npc/girl":{"id":"/d/baihua/npc/girl","file":"source/upstream/mudlib/d/baihua/npc/girl.c","name":"小姑娘","ids":["girl"],"long":"一個模樣清秀的小姑娘，烏黑的頭髮梳成兩條辮子，笑起來臉頰上有兩個淺淺的酒窩。她心地善良，常常煮了熱騰騰的羹湯送給村裡的老人家，說起阿三哥的時候，眼神總是特別溫柔。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"female","title":null,"equip":[{"path":"/d/baihua/npc/obj/rainbow_ribbon","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/alley",1]]},"/d/baihua/npc/innkeeper":{"id":"/d/baihua/npc/innkeeper","file":"source/upstream/mudlib/d/baihua/npc/innkeeper.c","name":"掌櫃","ids":["innkeeper"],"long":"紅燈客棧的掌櫃，一個瘦小的中年人，整天坐在櫃臺後面劈哩啪啦地打著算盤，嘴裡還念念有詞，客人上門也不太抬頭，算盤珠子倒是一刻也沒停過。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/inn",1]]},"/d/baihua/npc/kao_yeu":{"id":"/d/baihua/npc/kao_yeu","file":"source/upstream/mudlib/d/baihua/npc/kao_yeu.c","name":"高玉","ids":["kao yeu","kao","yeu"],"long":"高玉是江湖上小有名氣的槍法好手，一桿長槍使得出神入化，人稱「穿雲槍」。此刻他倚著岩壁坐在平台一角，衣襟上血跡斑斑，臉色蒼白，胸口纏著的布條還隱隱滲出血來，顯然受了不輕的傷，只是一雙眼睛依舊銳利，始終緊握著手中的長槍。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"male","title":null,"equip":[{"path":"/d/baihua/npc/obj/dragon_bone_pike","use":"wield"},{"path":"/d/npc/obj/golden_feather_helm","use":"wear"},{"path":"/d/baihua/npc/obj/ringmail","use":"wear"},{"path":"/d/npc/obj/forgod_boots","use":"wear"}],"skills":[["穹槍訣",105,"sky_pike"]],"wander":false,"ghost":false,"rooms":[["/d/baihua/platform",1]]},"/d/baihua/npc/nan_kong_hen":{"id":"/d/baihua/npc/nan_kong_hen","file":"source/upstream/mudlib/d/baihua/npc/nan_kong_hen.c","name":"南宮恨","ids":["nan kong hen","nan","hen"],"long":"南宮恨一臉秀氣, 身著白淨衣裳, 徐風吹來身形搖蕩, 似乎有些瘦弱. 平時不問人間俗事, 山林為屋, 草木為衣, 枕流漱石修身養性, 故以中年之齡在道術上已有相當領悟.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":40,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/road2",1]]},"/d/baihua/npc/old_wang":{"id":"/d/baihua/npc/old_wang","file":"source/upstream/mudlib/d/baihua/npc/old_wang.c","name":"老王","ids":["old wang","wang"],"long":"百花村最德高望重的人，慈祥和藹的樣子背後藏著令人辛酸的往事。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/wang_home",1]]},"/d/baihua/npc/san":{"id":"/d/baihua/npc/san","file":"source/upstream/mudlib/d/baihua/npc/san.c","name":"阿三哥","ids":["san"],"long":"一個身材壯碩的青年，皮膚曬得黝黑，兩條臂膀結實有力，村裡搬重物、修屋頂的粗活多半少不了他。他為人憨厚，說起話來有些靦腆，一見到村裡的小姑娘，臉就紅到了耳根。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/alley",1]]},"/d/baihua/npc/shepherd":{"id":"/d/baihua/npc/shepherd","file":"source/upstream/mudlib/d/baihua/npc/shepherd.c","name":"牧童","ids":["boy","shepherd"],"long":"年輕的小童，每日照看牲畜很是悠哉。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[{"path":"/d/baihua/npc/obj/shepherd_cane","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/wang_home",1]]},"/d/npc/stone_lion":{"id":"/d/npc/stone_lion","file":"source/upstream/mudlib/d/npc/stone_lion.c","name":"石獅子","ids":["stone lion","lion","石獅子"],"long":"一尊蹲坐在廟門口的石獅子，石身佈滿青苔與裂紋，鬃毛的雕紋卻依舊清晰。它張著大口、瞪著圓眼，神態威武，不時有路過的人朝它比劃幾下拳腳，它也只是默默地承受著。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/temple",1],["/d/taiyi/gate",2]]},"/d/baihua/npc/student":{"id":"/d/baihua/npc/student","file":"source/upstream/mudlib/d/baihua/npc/student.c","name":"小學童","ids":["student","students"],"long":"跟著先生念詩的小學童，心不在焉的想跑出去玩。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":3,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/school",3]]},"/d/baihua/npc/traveller":{"id":"/d/baihua/npc/traveller","file":"source/upstream/mudlib/d/baihua/npc/traveller.c","name":"過路客","ids":["traveller"],"long":"一位行色匆匆, 滿臉風霜的過路客, 一身勁裝, 似乎隨時又要上路去.","weight":null,"value":null,"unit":"位","flags":[],"race":"jiaojao","class":"thief","level":20,"gender":"female","title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/shortsword","use":"wield"}],"skills":[["拆招卸力之法",50,"parry"],["縱躍閃躲之法",50,"dodge"],["刀法",60,"blade"]],"wander":false,"ghost":false,"rooms":[["/d/baihua/inn",1]]},"/d/baihua/npc/wang_yean":{"id":"/d/baihua/npc/wang_yean","file":"source/upstream/mudlib/d/baihua/npc/wang_yean.c","name":"王燕","ids":["wang yean","wang","yean"],"long":"一個滿身藥味, 神情專注的女子正在清理一些木材, 似乎沒有注意到你正在看她. 由她的裝束來看, 不像學武之人, 反倒像是到處尋藥之神醫. 她師兄陳度好管閒事, 反倒在藥材的研究上, 比不上默默鑽研的王燕. 尤其專注的神貌, 似乎正在調理重要的配方.","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"alchemist","level":20,"gender":"female","title":null,"equip":[{"path":"/d/baihua/npc/obj/shennong_dagger","use":"wield"},{"path":"/d/npc/obj/green_cloth","use":"wear"},{"path":"/d/baihua/npc/obj/goat_hat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/tile_house",1]]},"/d/baobao/npc/shi_yu":{"id":"/d/baobao/npc/shi_yu","file":"source/upstream/mudlib/d/baobao/npc/shi_yu.c","name":"施鈺","ids":["shi yu","shi","yu"],"long":"施鈺武功並不高，但不只知從何處學到了極為高深的下毒之術，不論對手有多麼\n高強的武功都會莫名其妙的中了他下的毒。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/d/baobao/npc/obj/hundreds_poison_sword","use":"wield"},{"path":"/d/npc/obj/padded_armor","use":"wear"},{"path":"/d/npc/obj/cloud_boots","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baobao/illusion_realm",1]]},"/d/fengcheng/npc/chen_xue_liang":{"id":"/d/fengcheng/npc/chen_xue_liang","file":"source/upstream/mudlib/d/fengcheng/npc/chen_xue_liang.c","name":"陳學亮","ids":["chen xue-liang","chen","xue-liang"],"long":"劍甲門的傳人，身形精瘦，雙手布滿了打鐵留下的老繭。劍甲門無門戶之見，但凡對鑄兵鍛甲有天份的人，他都肯傾囊相授。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":60,"gender":"male","title":"劍甲門傳人","equip":[],"skills":[["徒手搏鬥",60,"unarmed"],["縱躍閃躲之法",60,"dodge"],["拆招卸力之法",60,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/crossroad",1]]},"/d/fengcheng/npc/child":{"id":"/d/fengcheng/npc/child","file":"source/upstream/mudlib/d/fengcheng/npc/child.c","name":"小孩","ids":["child"],"long":"一個蹲在牆根的小孩，手裡捏著一截石灰，眼睛骨碌碌地轉，一看就是滿肚子鬼點子。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[["徒手搏鬥",2,"unarmed"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",2,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/alley",1]]},"/d/fengcheng/npc/fortune_teller":{"id":"/d/fengcheng/npc/fortune_teller","file":"source/upstream/mudlib/d/fengcheng/npc/fortune_teller.c","name":"神算子","ids":["fortune teller","teller"],"long":"面容清瘦，帶著一種看透世事的微笑，桌上擺著龜殼與銅錢，等待想探知自身前程的人上門。","weight":null,"value":null,"unit":null,"verbs":["inquire"],"flags":[],"race":"human","class":"alchemist","level":10,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/crossroad",1]]},"/d/fengcheng/npc/gate_guard":{"id":"/d/fengcheng/npc/gate_guard","file":"source/upstream/mudlib/d/fengcheng/npc/gate_guard.c","name":"將軍府門衛","ids":["guard"],"long":"將軍府大門前的守衛，一身鐵甲擦得雪亮，手按刀柄，目光銳利地打量著每一個走近的人。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/broadsword","use":"wield"}],"skills":[["刀法",80,"blade"],["縱躍閃躲之法",60,"dodge"],["拆招卸力之法",60,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/general_gate",2]]},"/d/fengcheng/npc/hua_zi_yi":{"id":"/d/fengcheng/npc/hua_zi_yi","file":"source/upstream/mudlib/d/fengcheng/npc/hua_zi_yi.c","name":"華子儀","ids":["hua zi-yi","hua","zi-yi"],"long":"青雲觀主華子儀，當世少數掌握天師四破雷咒的佼佼者。早年斬妖除魔、保家衛國，如今在青雲觀潛心修行，鬚髮雖已斑白，眼神卻清亮如電。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"taoist","level":60,"gender":"male","title":"青雲觀主","equip":[{"path":"/d/fengcheng/npc/obj/numinous_sword","use":"wield"},{"path":"/d/fengcheng/npc/obj/purple_helmet","use":"wear"},{"path":"/d/npc/obj/purple_taoist_robe","use":"wear"}],"skills":[["天師道法【雷法】",140,"taoism-thunder"],["劍術",100,"sword"],["縱躍閃躲之法",100,"dodge"],["拆招卸力之法",100,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/qingyun_temple",1]]},"/d/fengcheng/npc/seller":{"id":"/d/fengcheng/npc/seller","file":"source/upstream/mudlib/d/fengcheng/npc/seller.c","name":"小販","ids":["seller"],"long":"一個年輕的小販，守著一副擔子在街邊做買賣。你可以用 list 看他賣些什麼，用 buy 購買。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":5,"gender":"male","title":null,"equip":[],"skills":[["徒手搏鬥",10,"unarmed"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/south_street",1]]},"/d/fengcheng/npc/waiter":{"id":"/d/fengcheng/npc/waiter","file":"source/upstream/mudlib/d/fengcheng/npc/waiter.c","name":"店小二","ids":["waiter"],"long":"春風客棧的店小二，肩上搭著一條白毛巾，見人就笑，手腳勤快得很。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":"male","title":null,"equip":[],"skills":[["徒手搏鬥",10,"unarmed"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/inn",1]]},"/d/graveyard/npc/barbarian":{"id":"/d/graveyard/npc/barbarian","file":"source/upstream/mudlib/d/graveyard/npc/barbarian.c","name":"野人","ids":["barbarian"],"long":"一個赤身露體的野人﹐看起來相當孔武有力。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":12,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/graveyard/forest_e",2]]},"/d/graveyard/npc/dirty_taoist":{"id":"/d/graveyard/npc/dirty_taoist","file":"source/upstream/mudlib/d/graveyard/npc/dirty_taoist.c","name":"邋遢道士","ids":["dirty taoist","taoist"],"long":"一個蓬頭垢面的道士，一身紫色道袍又皺又髒，前襟沾滿了酒漬，渾身酒氣薰人。他倚著供桌醉眼惺忪，嘴裏不知在嘟囔些什麼，偶爾抬眼看人，目光卻清醒得出奇。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":10,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/purple_taoist_robe","use":"wear"},{"path":"/d/npc/obj/chrysoberyl_ring","use":"wear"},{"path":"/d/npc/obj/urn","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/graveyard/shrine",1]]},"/d/graveyard/npc/old_bonze":{"id":"/d/graveyard/npc/old_bonze","file":"source/upstream/mudlib/d/graveyard/npc/old_bonze.c","name":"老和尚","ids":["old bonze","bonze"],"long":"一位鬚眉皆白的老和尚，身上的灰布僧袍洗得發白，手中捻著一串念珠，口中低聲誦著往生咒。他神情慈和，步履卻沉穩得很，那根沉甸甸的禪杖在他手裏，竟似輕若無物。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"monk","level":20,"gender":"male","title":null,"equip":[{"path":"/d/graveyard/npc/obj/brass_zenstaff","use":"wield"},{"path":"/d/graveyard/npc/obj/rosary","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/graveyard/grave7",1]]},"/d/graveyard/npc/young_bonze":{"id":"/d/graveyard/npc/young_bonze","file":"source/upstream/mudlib/d/graveyard/npc/young_bonze.c","name":"小和尚","ids":["young bonze","bonze"],"long":"一個年紀幼小的小和尚，剃得光溜溜的腦袋圓滾滾的，一身僧衣顯得太大，袖口捲了好幾摺。他跟在老和尚身邊有模有樣地敲著木魚，眼睛卻忍不住偷偷往四下的墳堆瞄。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"monk","level":1,"gender":"male","title":null,"equip":[{"path":"/d/graveyard/npc/obj/rosary","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/graveyard/grave7",1]]},"/d/kangping/npc/innkeeper":{"id":"/d/kangping/npc/innkeeper","file":"source/upstream/mudlib/d/kangping/npc/innkeeper.c","name":"客店主人","ids":["innkeeper"],"long":"小客店的主人，一個面容和善的中年漢子。店裡就他一個人，既是掌櫃也是店小二，一會兒在櫃臺後算帳，一會兒又端著飯菜在桌間穿梭，忙得滿頭大汗，卻始終笑臉迎人。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/inn",1]]},"/d/kangping/npc/kid":{"id":"/d/kangping/npc/kid","file":"source/upstream/mudlib/d/kangping/npc/kid.c","name":"阿桂","ids":["kid","a-gui"],"long":"一個機靈的小男孩，臉蛋曬得紅通通的，見了外地人一點也不怕生，總是熱心地跑上前來，七嘴八舌地介紹村裡哪家的井水最甜、哪條路通到谷口，還不忘提醒你夜裡別往谷裡去。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/square",1]]},"/d/lee/npc/child":{"id":"/d/lee/npc/child","file":"source/upstream/mudlib/d/lee/npc/child.c","name":"小孩","ids":["child","lee child"],"long":"一個在村裡跑來跑去的小孩，衣角沾著灰土，像是剛從廣場玩回來。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":null,"title":null,"equip":[{"path":"/d/npc/obj/tummy_cover","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/school",3],["/d/lee/square_c",3]]},"/d/lee/npc/farmer":{"id":"/d/lee/npc/farmer","file":"source/upstream/mudlib/d/lee/npc/farmer.c","name":"農夫","ids":["farmer","lee farmer"],"long":"一名常年在田裡工作的農夫，皮膚曬得黝黑，手掌粗糙，對田裡作物看得很緊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/watermelon_n1",3],["/d/lee/watermelon_n2",3]]},"/d/lee/npc/guard":{"id":"/d/lee/npc/guard","file":"source/upstream/mudlib/d/lee/npc/guard.c","name":"守衛","ids":["guard","lee guard"],"long":"一名負責巡看李家村出入口的守衛，穿著便於行動的短裝，目光時常警覺地掃視著來往的行人。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":15,"gender":null,"title":null,"equip":[{"path":"/d/lee/npc/obj/brow_staff","use":"wield"},{"path":"/d/npc/obj/hemp_cloth","use":"wear"},{"path":"/d/lee/npc/obj/hemp_boots","use":"wear"}],"skills":[["杖法",50,"staff"],["拆招卸力之法",20,"parry"],["縱躍閃躲之法",20,"dodge"]],"wander":false,"ghost":false,"rooms":[["/d/lee/gate_e",1],["/d/lee/gate_n",2],["/d/lee/gate_s",2],["/d/lee/gate_w",2]]},"/d/lee/npc/hawthorn_seller":{"id":"/d/lee/npc/hawthorn_seller","file":"source/upstream/mudlib/d/lee/npc/hawthorn_seller.c","name":"冰糖葫蘆小販","ids":["seller","hawthorn seller"],"long":"一名挑著小擔的冰糖葫蘆小販，正在這裡叫賣。\n擔子上插滿了一串串裹著糖衣的山楂，村中的孩子們都喜歡來找他買冰糖葫蘆。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/street2",1]]},"/d/lee/npc/herb_boy":{"id":"/d/lee/npc/herb_boy","file":"source/upstream/mudlib/d/lee/npc/herb_boy.c","name":"小藥童","ids":["boy","apprentice","herb boy"],"long":"一個在醫館裡跑進跑出的藥童，衣袖上沾著搗藥留下的藥漬，手裡還捧著幾株曬乾的藥草，看來是聶晟身邊打雜幫手的孩子。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":3,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/shrine",2]]},"/d/lee/npc/hunter":{"id":"/d/lee/npc/hunter","file":"source/upstream/mudlib/d/lee/npc/hunter.c","name":"獵戶","ids":["hunter","lee hunter"],"long":"村裡的獵戶，腰間掛著繩索與小刀，身上帶著山林和煙火混合的氣味。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/lee/npc/lee_hsu_hsien":{"id":"/d/lee/npc/lee_hsu_hsien","file":"source/upstream/mudlib/d/lee/npc/lee_hsu_hsien.c","name":"李勖賢","ids":["lee hsu hsien","hsu hsien","lee","hsu","hsien"],"long":"李勖賢是村裡的文士，有秀才的頭銜，矮小的身裁給人很瘦弱的感覺，現在正\n指導學童唸著書。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":10,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/school",1]]},"/d/lee/npc/lee_xiao_tian":{"id":"/d/lee/npc/lee_xiao_tian","file":"source/upstream/mudlib/d/lee/npc/lee_xiao_tian.c","name":"李嘯天","ids":["lee xiao tian","li xiao tian","manager lee","lee","li","xiao","tian"],"long":"李員外家的二總管為人精明，年少時好舞刀弄槍，被派任當鋪掌櫃之後，諸事都處理得緊緊有條。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":null,"title":null,"equip":[{"path":"/d/npc/obj/yellow_jade_ring","use":"wear"},{"path":"/d/lee/npc/obj/willow_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/pawnshop",1]]},"/d/lee/npc/lee_yen":{"id":"/d/lee/npc/lee_yen","file":"source/upstream/mudlib/d/lee/npc/lee_yen.c","name":"李岩","ids":["lee yen","li yan","herbalist","lee","yen","li","yan"],"long":"李家村藥鋪的掌櫃，熟悉常用藥材與丹藥。你可以用 list 查看目前已恢復且功能可核對的商品。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":4,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/herb_shop",1]]},"/d/lee/npc/lee_yong":{"id":"/d/lee/npc/lee_yong","file":"source/upstream/mudlib/d/lee/npc/lee_yong.c","name":"李勇","ids":["lee yong","li yong","lee","li","yong"],"long":"李勇是村子裡惟一的獵戶，雖然沒學過甚麼武功，天生的神力卻讓他足以打敗\n普通好手，從他家裡滿屋子的獸皮你就能了解他的實力。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":15,"gender":null,"title":null,"equip":[{"path":"/d/lee/npc/obj/leather_boots","use":"wear"},{"path":"/d/lee/npc/obj/tight_cloth","use":"wear"},{"path":"/d/lee/npc/obj/hunter_pike","use":"wield"}],"skills":[["單手槍法",30,"pike"]],"wander":false,"ghost":false,"rooms":[["/d/lee/hunter",1]]},"/d/lee/npc/lee_zhong":{"id":"/d/lee/npc/lee_zhong","file":"source/upstream/mudlib/d/lee/npc/lee_zhong.c","name":"李忠","ids":["lee zhong","li zhong","zhong","lee","li"],"long":"李忠是賣雜貨小夥計，整天笑嘻嘻的，一臉老實樣。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/grocery",1]]},"/d/lee/npc/li_ban_xian":{"id":"/d/lee/npc/li_ban_xian","file":"source/upstream/mudlib/d/lee/npc/li_ban_xian.c","name":"李半仙","ids":["li ban xian","ban xian","storyteller","li","ban","xian"],"long":"一位常在小旅店落腳的說書先生，鬍鬚微白，說起江湖舊聞時總是愛故意壓低聲音。目前階段只保留已經確認的角色與位置，完整的說書關鍵字和能力成長事件都待後續逐條復原。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/inn",1]]},"/d/lee/npc/nee_cheng":{"id":"/d/lee/npc/nee_cheng","file":"source/upstream/mudlib/d/lee/npc/nee_cheng.c","name":"聶晟","ids":["nee cheng","nee","cheng"],"long":"聶晟是李家村裡惟一不姓李的住民。十多年前，村裡許多的居民曾經得了一種怪病，聶晟\n恰巧路過，治好了村民，於是李員外請他留下，成為村裡的大夫。\n聶晟身形削瘦，做文人打扮，表情冷漠，似乎不太容易親近。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":40,"gender":null,"title":null,"equip":[{"path":"/d/npc/obj/white_dress","use":"wear"},{"path":"/d/lee/npc/obj/crystal_ring","use":"wear"},{"path":"/obj/area/obj/leather_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/shrine",1]]},"/d/lee/npc/teacher":{"id":"/d/lee/npc/teacher","file":"source/upstream/mudlib/d/lee/npc/teacher.c","name":"私塾先生","ids":["teacher","school teacher"],"long":"私塾裡的先生，衣著樸素，說話慢條斯理。原圖雖有私塾人物線索，但姓名與完整功能仍待核對，因此暫不用未證實的專名。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/lee/npc/traveller":{"id":"/d/lee/npc/traveller","file":"source/upstream/mudlib/d/lee/npc/traveller.c","name":"旅客","ids":["traveller"],"long":"路上來來往往的旅人，每天都能碰上十來個。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/shortsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/entrance_s",3]]},"/d/lee/npc/waiter":{"id":"/d/lee/npc/waiter","file":"source/upstream/mudlib/d/lee/npc/waiter.c","name":"店小二","ids":["waiter","lee waiter"],"long":"李家村小旅店的店小二，動作俐落，忙著替往來客人端茶送飯。你可以用 list 看菜單，再用 buy 購買。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":2,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/inn",1]]},"/d/lee/npc/woman":{"id":"/d/lee/npc/woman","file":"source/upstream/mudlib/d/lee/npc/woman.c","name":"婦人","ids":["woman","lee woman"],"long":"一名住在李家村的婦人，手裡忙著家務，遇上熟人便停下來聊幾句村裡近況。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/farm_w1",1],["/d/lee/riverside_n1",1],["/d/lee/riverside_s",4]]},"/d/mengjia/npc/meng_yi_rou":{"id":"/d/mengjia/npc/meng_yi_rou","file":"source/upstream/mudlib/d/mengjia/npc/meng_yi_rou.c","name":"孟憶柔","ids":["meng yi-rou","meng","yi-rou"],"long":"孟家的掌上明珠，受兩位哥哥百般照顧，眉眼間還帶著幾分未脫的稚氣。近日被田由纏上，神色間總有些煩惱。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":10,"gender":"female","title":null,"equip":[],"skills":[["徒手搏鬥",20,"unarmed"],["縱躍閃躲之法",30,"dodge"],["拆招卸力之法",20,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/mengjia/backyard",1]]},"/d/mengjia/npc/meng_zhao_zhan":{"id":"/d/mengjia/npc/meng_zhao_zhan","file":"source/upstream/mudlib/d/mengjia/npc/meng_zhao_zhan.c","name":"孟昭展","ids":["meng zhao-zhan","meng","zhao-zhan"],"long":"孟家莊的莊主，年紀輕輕便練成了祖傳的五虎斷門刀，成為江湖中的新勢力。孟昭展不僅武功高強，而且英俊瀟灑，行走江湖期間，迷倒了無數的才女俠女，但他好像已經有了意中人，對其他少女都是以禮相待，他也因此得了個多情刀的綽號。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"male","title":"多情刀","equip":[{"path":"/d/npc/obj/white_scholar_dress","use":"wear"},{"path":"/d/mengjia/npc/obj/red_dust_legs","use":"wear"},{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/d/npc/obj/ghosts_blade","use":"wield"}],"skills":[["刀法",160,"blade"],["五虎斷門刀",160,"five-tiger blade"],["縱躍閃躲之法",120,"dodge"],["拆招卸力之法",120,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/mengjia/street",1]]},"/d/mengjia/npc/tian_shen":{"id":"/d/mengjia/npc/tian_shen","file":"source/upstream/mudlib/d/mengjia/npc/tian_shen.c","name":"田申","ids":["tian shen","tian","shen"],"long":"田申是塞北雙熊中的老大，長得高高大大，打人全靠一身蠻力。自從弟弟田由迷戀孟憶柔起，他就待在這裡等待時機。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":30,"gender":"male","title":"塞北雙熊","equip":[{"path":"/d/npc/obj/cloud_boots","use":"wear"},{"path":"/d/mengjia/npc/obj/star_studded_legs","use":"wear"},{"path":"/d/mengjia/npc/obj/copper_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/mengjia/inn2",1]]},"/d/mengjia/npc/tomb_guard":{"id":"/d/mengjia/npc/tomb_guard","file":"source/upstream/mudlib/d/mengjia/npc/tomb_guard.c","name":"守墓人","ids":["tomb guard","guard"],"long":"一個長髮披肩，半人半鬼的老人，雖然已經瘦的不成樣子，但一雙鷹眼閃閃發光，一看就知道內力渾厚無比。只是不知他為何會將自己與死人一起關在這個古墓裏。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":50,"gender" ":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/inn",1]]},"/d/npc/wild_dog":{"id":"/d/npc/wild_dog","file":"source/upstream/mudlib/d/npc/wild_dog.c","name":"野狗","ids":["wild dog","dog"],"long":"路邊的一條野狗，髒兮兮的，看起來有點可憐。","weight":null,"value":null,"unit":"條","flags":[],"race":"beast","class":"commoner","level":1,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/mid_lane1",1],["/d/ziyan/inn_gate",1]]},"/d/qiaoyin_east/npc/stone_stake":{"id":"/d/qiaoyin_east/npc/stone_stake","file":"source/upstream/mudlib/d/qiaoyin_east/npc/stone_stake.c","name":"石假人","ids":["stone stake","stake","石假人","假人"],"long":"一具石頭雕成的人形假人，肩頭與胸口佈滿深淺不一的拳痕與劍痕，石面被磨得光亮。它一動也不動，任憑人拳打腳踢也不會還手，白雲觀的道士常拿它來磨練招式。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin_east/ground_e",3],["/d/qiaoyin_east/ground_w",3]]},"/d/qiaoyin_east/npc/tianfong":{"id":"/d/qiaoyin_east/npc/tianfong","file":"source/upstream/mudlib/d/qiaoyin_east/npc/tianfong.c","name":"天風道長","ids":["Tianfong taoist","tianfong","taoist","天風道長"],"long":"天風道長是白雲觀的觀主，原本出身天師道，精研火、風、冰、雷\n四種破敵咒法。他不願循著前人的路子打磨攻伐之術，反倒另闢蹊\n徑，將天師四破逐一拆解，推演每一種法術的來龍去脈，進而悟出\n抵禦元素傷害的防禦法門，這便是流傳於道士與方士之間的「紫薇\n心經」。如今他避世而不隱世，在觀中修道，也指點有緣人。","weight":null,"value":null,"unit":null,"flags":["限道士","限方士"],"race":"malik","class":"taoist","level":40,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/peachwood_sword","use":"wield"},{"path":"/d/qiaoyin_east/npc/obj/cyan_taoist_robe","use":"wear"},{"path":"/d/npc/obj/copper_hat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin_east/hall",1]]},"/d/shuiyue/npc/innkeeper":{"id":"/d/shuiyue/npc/innkeeper","file":"source/upstream/mudlib/d/shuiyue/npc/innkeeper.c","name":"老闆娘","ids":["woman","innkeeper","landlady"],"long":"福安客棧的老闆娘，圓圓的臉上掛著熱誠的笑，腰間繫著油漬斑斑的圍裙，招呼客人手腳俐落，嘴裡不停地吆喝。你可以用 list 看她賣些什麼，用 buy 購買。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":5,"gender":"female","title":null,"equip":[],"skills":[["徒手搏鬥",10,"unarmed"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/shuiyue/inn",1]]},"/d/shuiyue/npc/leopard":{"id":"/d/shuiyue/npc/leopard","file":"source/upstream/mudlib/d/shuiyue/npc/leopard.c","name":"炎豹","ids":["leopard"],"long":"一頭身上帶著火焰般橙紅斑紋的猛豹，兩眼在暗處閃著冷光，正無聲地盯著你。","weight":null,"value":null,"unit":"頭","flags":[],"race":"beast","class":"commoner","level":1,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/shuiyue/tree_hollow",4]]},"/d/shuiyue/npc/old_tu":{"id":"/d/shuiyue/npc/old_tu","file":"source/upstream/mudlib/d/shuiyue/npc/old_tu.c","name":"老土","ids":["old tu","tu","chief"],"long":"老土是水月村的村長，花白的頭髮、滿臉的皺紋，精神卻十分矍鑠，手裡總握著一桿旱煙。村裡大小事務他都要過問，說起話來慢條斯理。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":"male","title":"村長","equip":[],"skills":[["徒手搏鬥",10,"unarmed"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/shuiyue/chief_house",1]]},"/d/shuiyue/npc/wei_feng":{"id":"/d/shuiyue/npc/wei_feng","file":"source/upstream/mudlib/d/shuiyue/npc/wei_feng.c","name":"蔚楓","ids":["wei feng","wei","feng"],"long":"蔚楓是古劍派的傳人，如今隱居在這間石屋裡，看上去不過三十出頭，神情淡泊，一身舊布衣漿洗得乾乾淨淨。他早已不問江湖事，眉宇之間卻仍隱隱透著劍客特有的鋒芒。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":60,"gender":"male","title":"劍領風騷","equip":[{"path":"/d/shuiyue/npc/obj/au_han_sword","use":"wield"},{"path":"/d/shuiyue/npc/obj/colosus_sword","use":"wield"},{"path":"/d/npc/obj/iron_cloth","use":"wear"},{"path":"/d/npc/obj/forgod_boots","use":"wear"}],"skills":[["劍術",140,"sword"],["縱躍閃躲之法",120,"dodge"],["拆招卸力之法",120,"parry"],["內功",120,"force"]],"wander":false,"ghost":false,"rooms":[["/d/shuiyue/stone_house",1]]},"/d/shuiyue/npc/yu_tian_shan":{"id":"/d/shuiyue/npc/yu_tian_shan","file":"source/upstream/mudlib/d/shuiyue/npc/yu_tian_shan.c","name":"余天山","ids":["yu tian-shan","yu","tian-shan"],"long":"余天山是附近有名的獵戶，一手箭術在山裡無人不曉，人稱「百步穿楊」。他年輕時常為鄉親打造弓箭與各式獵具，如今眉間總帶著愁容，望著牆上的舊獵具發呆，嘴裡嘆著手邊缺了好材料，否則還能替人打造幾件趁手的傢伙。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":"百步穿楊","equip":[],"skills":[["徒手搏鬥",80,"unarmed"],["縱躍閃躲之法",80,"dodge"],["拆招卸力之法",80,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/shuiyue/hunter_hut",1]]},"/d/snow/npc/alchemist":{"id":"/d/snow/npc/alchemist","file":"source/upstream/mudlib/d/snow/npc/alchemist.c","name":"陳維俠","ids":["chen weisha","weisha","chen"],"long":"陳維俠是個著名的方士﹐經常來往於天邪國與喬陰縣之間採藥及尋覓\n珍奇礦物﹐他和雪亭鎮的王員外是舊日同窗﹐這幾日原本要往野羊山\n採藥﹐但是因為盜賊肆虐所以暫時在王員外家盤桓數日。\n陳維俠本名陳度﹐維俠是他的學生們送給他的稱號﹐意思是說他相當\n有俠氣﹐喜歡打抱不平﹐若不是給王員外的獨子纏住了講養生之術﹐\n只怕早幾日前就上野羊山剷除盜匪去了。","weight":null,"value":null,"unit":null,"flags":["限平民","限平民"],"race":"human","class":"alchemist","level":30,"gender":null,"title":"龍圖丹派弟子","equip":[{"path":"/d/snow/npc/obj/silversword","use":"wield"},{"path":"/obj/area/obj/cloth","use":"wear"}],"skills":[["內功",70,"force"],["經脈穴道之學",100,"kee anatomy"],["龍圖心經",60,"dragon force"],["丹道【神農之術】",140,"alchemy-medication"],["丹道【黃白之術】",40,"alchemy-wealth"],["丹道【仙異之術】",80,"alchemy-magic"],["丹道【長生之術】",30,"alchemy-immortality"]],"wander":false,"ghost":false,"rooms":[["/d/snow/school",1]]},"/d/snow/npc/child":{"id":"/d/snow/npc/child","file":"source/upstream/mudlib/d/snow/npc/child.c","name":"阿寶","ids":["arbao","__ID_ARBAO__"],"long":"這個十五、六歲的小姑娘就是「阿寶」了﹐她身上雖然穿著粗布\n衣服﹐但卻十足是個美人胚子﹐一雙水汪汪的大眼睛骨碌碌地轉\n著﹐還不時盯著你看﹐使你不禁覺得有些發窘。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":10,"gender":"female","title":null,"equip":[{"path":"/d/snow/npc/obj/blue_cloth","use":"wear"},{"path":"/obj/area/obj/dagger","use":"wield"}],"skills":[["妙手空空之技",40,"stealing"],["縱躍閃躲 :null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/swaylan/buxuan/field1",2],["/d/swaylan/buxuan/field2",2]]},"/d/swaylan/buxuan/npc/luo_yun_feng":{"id":"/d/swaylan/buxuan/npc/luo_yun_feng","file":"source/upstream/mudlib/d/swaylan/buxuan/npc/luo_yun_feng.c","name":"駱雲峰","ids":["luo yun-feng","luo","yun-feng"],"long":"人稱駱老三，一身白色長袍，手中握著一支判官筆，舉手投足間帶著一股書卷氣。他在落雲峰上獨居多年，從山川雲氣中悟出雲峰筆招、雲體風身術與虛空斬三套絕技。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":40,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/white_scholar_dress","use":"wear"},{"path":"/obj/area/obj/pen","use":"wield"},{"path":"/obj/area/obj/pen","use":"wield"}],"skills":[["徒手搏鬥",80,"unarmed"],["縱躍閃躲之法",80,"dodge"],["拆招卸力之法",80,"parry"],["讀書識字",120,"literate"],["錐法",80,"dagger"],["左手錐法",80,"secondhand dagger"],["雲峰筆招",80,"uenfon"]],"wander":false,"ghost":false,"rooms":[["/d/swaylan/buxuan/hut",1]]},"/d/swaylan/forest/npc/bandit":{"id":"/d/swaylan/forest/npc/bandit","file":"source/upstream/mudlib/d/swaylan/forest/npc/bandit.c","name":"盜賊","ids":["bandit"],"long":"一個滿臉橫肉的盜賊，身穿粗布衣，手裡提著一柄長劍，眼神兇狠，見了生人便撲上來，下手毫不留情。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":10,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/longsword","use":"wield"},{"path":"/d/npc/obj/coarse_cloth","use":"wear"}],"skills":[["劍術",20,"sword"],["縱躍閃躲之法",20,"dodge"],["拆招卸力之法",20,"parry"],["徒手搏鬥",20,"unarmed"]],"wander":false,"ghost":false,"rooms":[["/d/swaylan/forest/clearing",2],["/d/swaylan/forest/entrance",2],["/d/swaylan/forest/forest1",3],["/d/swaylan/forest/forest2",3],["/d/swaylan/forest/stele",2],["/d/swaylan/forest/tunnel",2]]},"/d/swaylan/forest/npc/bandit_captain":{"id":"/d/swaylan/forest/npc/bandit_captain","file":"source/upstream/mudlib/d/swaylan/forest/npc/bandit_captain.c","name":"大統領","ids":["bandit captain","captain"],"long":"一個身形魁梧的形天，雙手各握一柄大斧，渾身筋肉虯結，一開口便是震耳欲聾的大嗓門。據說他與振武軍的魯熙年有不共戴天之仇。","weight":null,"value":null,"uni it_leader","file":"source/upstream/mudlib/d/swaylan/forest/npc/bandit_leader.c","name":"小頭目","ids":["bandit leader","leader"],"long":"盜賊裡管著一小隊人的頭目，身上穿著一副翠玉甲，在一群破衣爛衫的盜賊中顯得格外神氣，說話時總愛揚著下巴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":15,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/longsword","use":"wield"},{"path":"/d/swaylan/forest/npc/obj/jade_armor","use":"wear"}],"skills":[["劍術",30,"sword"],["縱躍閃躲之法",30,"dodge"],["拆招卸力之法",30,"parry"],["徒手搏鬥",30,"unarmed"]],"wander":false,"ghost":false,"rooms":[["/d/swaylan/forest/clearing",1],["/d/swaylan/forest/stele",1],["/d/swaylan/forest/tunnel",1]]},"/d/swaylan/forest/npc/cooker":{"id":"/d/swaylan/forest/npc/cooker","file":"source/upstream/mudlib/d/swaylan/forest/npc/cooker.c","name":"老王","ids":["cooker","wang"],"long":"賊窩裡掌勺的廚子，圍著一條油膩膩的圍裙，揮著菜刀剁肉剁得砰砰作響，對來人愛理不理。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[["徒手搏鬥",10,"unarmed"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/swaylan/forest/kitchen",1]]},"/d/swaylan/lunmay/npc/apprentice3":{"id":"/d/swaylan/lunmay/npc/apprentice3","file":"source/upstream/mudlib/d/swaylan/lunmay/npc/apprentice3.c","name":"冷梅莊三代弟子","ids":["apprentice"],"long":"冷梅莊弟子，在劍法上稍有成就，尚未涉足更深入的武學。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":10,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/longsword","use":"wield"},{"path":"/obj/area/obj/cloth","use":"wear"}],"skills":[["徒手搏鬥",20,"unarmed"],["縱躍閃躲之法",20,"dodge"],["拆招卸力之法",20,"parry"],["劍術",20,"sword"]],"wander":false,"ghost":false,"rooms":[["/d/swaylan/lunmay/drill_s",1],["/d/swaylan/lunmay/gate",2]]},"/d/swaylan/lunmay/npc/goo":{"id":"/d/swaylan/lunmay/npc/goo","file":"source/upstream/mudlib/d/swaylan/lunmay/npc/goo.c","name":"古大叔","ids":["goo"],"long":"梅家的老長工，背已經有些駝了，手腳卻還俐落，整天在莊裡忙進忙出。他在冷梅莊待了大半輩子，莊裡大小事沒有他 lib/custom/legacy_npc/ai_xiao_hu.c","name":"艾小虎","ids":["ai xiao-hu","ai","xiao-hu"],"long":"這位黑衣漢子正是黑道上號稱「六大殺手」之一的艾小虎，一手霸絕、狠絕的刀法\n曾讓追殺他的人死傷無數。","weight":null,"value":null,"unit":null,"flags":[],"race":"blackteeth","class":"fighter","level":45,"gender":"male","title":"殺手","equip":[{"path":"/d/swaylan/lunmay/npc/obj/chain_shirt","use":"wear"},{"path":"/custom/armor/cloth/gray_robe","use":"wear"},{"path":"/custom/weapon/blade/poison_wind_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/bai_jian_fei":{"id":"/custom/legacy_npc/bai_jian_fei","file":"source/upstream/mudlib/custom/legacy_npc/bai_jian_fei.c","name":"白劍飛","ids":["bai jian fei","bai","fei"],"long":"白劍飛是水路第一大幫 \"漕幫\" 的仁堂分舵主，也是漕幫總舵主蕭尹的長子，白\n劍飛自幼師從蕭尹的義兄 \"玉面劍儒  白靖堂\" 門下，由於白靖堂膝下無子，對\n白劍飛視如己出，並將其一生鑽研劍術之精華豪不藏私的教授於白劍飛，蕭尹感\n其恩情，並體念其義兄年歲已高，遂令白劍飛改從白姓。\n白劍飛一方面因血緣因素，另一方面也因其精湛的劍法及輕功成為漕幫 \"仁義禮\n智信\" 五個堂口中為首位的仁堂舵主。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":25,"gender":"male","title":"漕幫仁堂分舵主","equip":[{"path":"/d/qiaoyin_east/npc/obj/boots_of_cleanse","use":"wear"},{"path":"/d/swaylan/lunmay/npc/obj/silver_girth","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/weapon/sword/cherry_blossoms_sword","use":"wield"},{"path":"/custom/weapon/sword/white_dragon_fang","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/baobao/npc/bai_yu":{"id":"/d/baobao/npc/bai_yu","file":"source/upstream/mudlib/d/baobao/npc/bai_yu.c","name":"白魚","ids":["bai yu","bai","yu"],"long":"白魚是大漠八魔的老大，但為人優柔寡斷，所以凡事都由老二來主持。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":50,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/copper_hat","use":"wear"},{"path":"/d/baobao/npc/obj/seven_star_robe","use":"wear"},{"path":"/d/baobao/npc/obj/angry_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baobao/magic_realm",1]]},"/d/graveyard/npc/barbarian_chief":{"id":"/d/graveyard/npc/barbarian_chief","file":"source/upstream/mudlib/d/graveyard/npc/barbarian_chief.c","name":"野人酋長","ids":["barbarian chief","barbarian","chief"],"long":"一個赤身露體的野人﹐正張大了嘴對著你疵牙裂嘴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":15,"gender":"male","title":null,"equip":[{"path":"/d/graveyard/npc/obj/bone_staff","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/graveyard/forest_e",1]]},"/custom/legacy_npc/black_hell_agent":{"id":"/custom/legacy_npc/black_hell_agent","file":"source/upstream/mudlib/custom/legacy_npc/black_hell_agent.c","name":"黑無常","ids":["black hell agent","black","agent"],"long":"勾魂使者黑無常是負責將因戰亂和意外而喪生的人的靈魂引去接受\n閻王的審判。一般來說，活人是見不到他的。而現在他就在你的面\n前，不過他似乎正在忙著找亂殺無辜之人。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":50,"gender":"male","title":"勾魂使者","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/blade_man":{"id":"/custom/legacy_npc/blade_man","file":"source/upstream/mudlib/custom/legacy_npc/blade_man.c","name":"葬心","ids":["blade man","blade","man"],"long":"一個正獨自在喝著酒的灰衣少年，看他帶點憂慮的神情，不知道他碰上了什麼困\n難，眼光一轉看到他手中把玩的奇特單刀，這種紅色透明的武器不知是用什麼所\n鑄造成的，如果說這把刀是兵器，不如把它當成藝品還比較恰當。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"fighter","level":30,"gender":"male","title":"青邪宮禁衛","equip":[{"path":"/custom/weapon/blade/blood_blade","use":"wield"},{"path":"/d/npc/obj/flying_boots","use":"wear"},{"path":"/custom/armor/cloth/red_cloth","use":"wear"},{"path":"/custom/armor/armor/raw_iron_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/captain_huang":{"id":"/custom/legacy_npc/captain_huang","file":"source/upstream/mudlib/custom/legacy_npc/captain_huang.c","name":"黃靖國","ids":["captain huang","captain","huang"],"long":"黃靖國近年來轉戰各地，積功無數，以勇猛及鐵槍威震四方，年僅三\n十而能榮膺總兵官要職，可說是少年有成。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"總兵","equip":[{"path":"/custom/weapon/pike/iron_pike","use":"wield"},{"path":"/d/baobao/npc/obj/steel_bracers","use":"wear"},{"path":"/d/npc/obj/steel_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/chang_ba":{"id":"/custom/legacy_npc/chang_ba","file":"source/upstream/mudlib/custom/legacy_npc/chang_ba.c","name":"張霸","ids":["chang ba","chang","ba"],"long":"張霸乃是黑風寨的五頭目, 原為虎刀門中的好手, 平素行止不端\n, 於十數年前遭武林正道圍攻後消聲匿跡, 數個月後重現師門,\n盜走師門寶刀「虎紋刀」後投入黑風寨中, 目前是黑風寨的刀術\n教頭, 他仗恃著一手爐火純青的瘋虎刀法已是一流高手, 如今寶\n刀在手更如虎添翼, 近年來不少高手魂飛虎紋刀下, 在武林中已\n是惡名昭彰, 他正滿臉邪氣惡狠狠地盯著你。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":50,"gender":"male","title":"黑風寨五頭目","equip":[{"path":"/custom/armor/armor/shoulder_armor","use":"wear"},{"path":"/d/snowkeep/npc/obj/skin_gloves","use":"wear"},{"path":"/custom/armor/cloth/yellow_suit","use":"wear"},{"path":"/custom/weapon/sword/daoist_sword","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/qiaoyin/npc/chaxigol":{"id":"/d/qiaoyin/npc/chaxigol","file":"source/upstream/mudlib/d/qiaoyin/npc/chaxigol.c","name":"查思古禮","ids":["chaxigol"],"long":"查思古禮是個留著大鬍子的外國人，身材相當高大，加上體型又胖\n，站在街上任何人都會忍不住多瞧幾眼。不過你不要小看他，查思\n古禮在天朝旅行多年，其武藝在南方一代也小有名氣。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":25,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/side_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/west_street2",1]]},"/custom/legacy_npc/checker":{"id":"/custom/legacy_npc/checker","file":"source/upstream/mudlib/custom/legacy_npc/checker.c","name":"考核官","ids":["checker"],"long":"考核官坐在桌前，拿著硃砂筆評點著送來的奏摺。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/pen","use":"wield"},{"path":"/d/qiaoyin/npc/obj/cyan_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/ziyan/npc/cheng_huai":{"id":"/d/ziyan/npc/cheng_huai","file":"source/upstream/mudlib/d/ziyan/npc/cheng_huai.c","name":"程槐","ids":["cheng huai","cheng","huai"],"long":"程槐看起來非常強壯, 他雙手上長滿了因長期握斧而長的厚繭, 背上還背著一\n柄重斧, 據說他年輕時曾經以一把利斧「驂龍翔」挑了一個山寨的土匪, 讓道\n上盜匪都聞之喪膽, 不過看他現在臉色不太好, 好像是身上受了重傷。","weight":null,"value":null,"unit":null,"flags":["限武者","限武者"],"race":"human","class":"fighter","level":25,"gender":"male","title":null,"equip":[{"path":"/d/ziyan/npc/obj/wyvern_axe","use":"wield"}],"skills":[["玄冰烈焰斧",100,"ice-fire axe"]],"wander":false,"ghost":false,"rooms":[["/d/ziyan/hut",1]]},"/custom/legacy_npc/chin_chao_tian":{"id":"/custom/legacy_npc/chin_chao_tian","file":"source/upstream/mudlib/custom/legacy_npc/chin_chao_tian.c","name":"秦朝天","ids":["chin chao tian","chin","tian"],"long":"一身草繩繫綁厚皮裘衣的高瘦大漢﹐由他一臉瘡疤褐黃的麻子臉看來﹐\n此人約莫四十來歲。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/d/baihua/npc/obj/straw_boots","use":"wear"},{"path":"/obj/area/obj/robe","use":"wear"},{"path":"/obj/armor/fur_hat","use":"wear"},{"path":"/obj/area/obj/broadaxe","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/baobao/npc/chong_bai_hu":{"id":"/d/baobao/npc/chong_bai_hu","file":"source/upstream/mudlib/d/baobao/npc/chong_bai_hu.c","name":"崇白虎","ids":["chong bai-hu","chong","bai-hu"],"long":"一生都在追求完美的鑄刀技巧，為了能鑄出一把寶刀，不惜千里跋涉到奐族境\n內偷學手藝。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":50,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/iron_girth","use":"wear"},{"path":"/d/npc/obj/steel_boots","use":"wear"},{"path":"/d/baobao/npc/obj/tiger_plate","use":"wear"},{"path":"/d/baobao/npc/obj/blade_of_fire_spirit","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baobao/forge",1]]},"/d/snowkeep/npc/chu_xang_when":{"id":"/d/snowkeep/npc/chu_xang_when","file":"source/upstream/mudlib/d/snowkeep/npc/chu_xang_when.c","name":"褚商魂","ids":["chu xang-when","chu","xang-when"],"long":"褚商魂是雪吟莊莊主的大弟子﹐也是他的養子﹐不但武藝出眾﹐而且\n寫得一手好字。雪吟莊作為當今的武林盟主，也有出售一些供江湖中\n各個幫會使用的物品，你可以用 list 指令查看。\n——\n褚商魂是雪吟莊莊主的大弟子﹐也是他的養子﹐不但武藝出眾﹐而且\n寫得一手好字。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":25,"gender":"male","title":"雪吟莊大弟子","equip":[{"path":"/d/npc/obj/yellow_jade_ring","use":"wear"},{"path":"/d/npc/obj/flying_boots","use":"wear"},{"path":"/d/snowkeep/npc/obj/white_rainbow_armor","use":"wear"},{"path":"/d/npc/obj/silk_cloth","use":"wear"},{"path":"/d/snowkeep/npc/obj/white_blade","use":"wield"},{"path":"/d/npc/obj/ghosts_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/snowkeep/hall",1]]},"/d/fengcheng/npc/dong_fang_gu_ming":{"id":"/d/fengcheng/npc/dong_fang_gu_ming","file":"source/upstream/mudlib/d/fengcheng/npc/dong_fang_gu_ming.c","name":"東方孤冥","ids":["dong-fang gu ming","dong-fang","ming"],"long":"喜好習武﹐年輕時遊走江湖結識各派高手﹐雖然有家傳心法護身﹐卻苦於僅靠家\n傳劍法難以立足江湖。三十四歲那年﹐他巧得半頁陰心太妃﹐在幾位朋友的解說\n和指點下創出一套怪異的劍訣配合家傳的玄天劍法頗具威力。數年後﹐他聯絡當\n初幫他解說陰心太妃的朋友們創立玄天教。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":65,"gender":"male","title":"玄天教主","equip":[{"path":"/d/npc/obj/white_jade_girth","use":"wear"},{"path":"/d/npc/obj/white_scholar_dress","use":"wear"},{"path":"/d/npc/obj/han_jade_ring","use":"wear"},{"path":"/d/fengcheng/npc/obj/silver_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/inn2",1]]},"/d/lee/npc/du_feng_ling":{"id":"/d/lee/npc/du_feng_ling","file":"source/upstream/mudlib/d/lee/npc/du_feng_ling.c","name":"杜風凌","ids":["du feng ling","du","ling"],"long":"杜風凌本是西方大漠的巫首族人﹐自幼拜林遠為師﹐修習茅山道法。也許是\n因為天賦異常﹐入門十數年就熟練的掌握了茅山道法的精髓並將其融會貫通,\n漸漸將一些不受重視的小把戲發展起來﹐當時盛傳杜風凌將會是下任茅山的\n掌門人。怎料當時的茅山掌門人﹐林遠﹐為了追查茅山劍法竟然屍橫荒野﹐\n一時間茅山派一片大亂。不少人因鄙視杜風凌所擅長的『茅山奇術』竟然離\n開茅山自成流派﹐而杜風凌也因其家族牽扯到黃泉村一事﹐而不得不暫回西\n方大漠。當他返回天朝以後﹐無法說服他的師兄弟重歸茅山﹐便憤然再返大\n漠﹐借助他家族在大漠的勢力自創『幻霧觀』。此次不知是為何事﹐竟然又\n來到天朝境內。","weight":null,"value":null,"u
