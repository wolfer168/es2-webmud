_god_temple.c","short":"城隍廟","long":"五堂鎮的城隍廟，是地方上的信仰中心，香火終年不斷。正殿供奉著身穿紫紅官服的城隍爺神像，兩旁站著牛頭馬面，神情威嚴。香案上擺滿了鎮民供奉的鮮花素果，裊裊的香煙中透著一股肅穆的氣氛。","exits":{"west":"/d/wutang/east_street4"},"objects":{"/d/wutang/npc/town_god":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,2,0]},"/d/wutang/clearing":{"id":"/d/wutang/clearing","file":"source/upstream/mudlib/d/wutang/clearing.c","short":"空地","long":"菜田前的一片空地，地上留著許多雜亂的蹄印，看來常有野豬從菜田那頭跑過來。空地邊緣擺著幾個用來嚇唬野豬的稻草人，可惜看來沒什麼用處。往西就是一大片菜田，往南則是通往五堂鎮的碎石路。","exits":{"west":"/d/wutang/field5","south":"/d/wutang/gravel_road_n"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,1,0]},"/d/wutang/cloth_shop":{"id":"/d/wutang/cloth_shop","file":"source/upstream/mudlib/d/wutang/cloth_shop.c","short":"布莊","long":"一家不大的布莊，架子上堆滿了一疋疋的布料，從粗棉布到上好的綢緞應有盡有。櫃臺上攤開著幾疋顏色鮮豔的花布，是老闆娘李美麗最得意的貨色，常有姑娘家在這裡流連忘返。往南可以回到街道。","exits":{"south":"/d/wutang/east_street3"},"objects":{"/d/wutang/npc/tao":1,"/d/wutang/npc/young_gentleman":1,"/d/wutang/npc/bai_ou":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,1,0]},"/d/wutang/crossroad":{"id":"/d/wutang/crossroad","file":"source/upstream/mudlib/d/wutang/crossroad.c","short":"交叉路口","long":"這裡是五堂鎮廟口大街的一處交叉路口﹐廟口大街往東西延伸﹐路口中央立著一根高大的鐵旗桿﹐據說是鎮上雍家的先祖所立﹐幾百年來已成為五堂鎮的地標之一﹐街道往東西南北都相當熱鬧﹐人來人往﹐由於五堂鎮位當喬陰縣的水路要衝﹐因此這裡的繁華景象和縣城比起來是毫不遜色。","exits":{"west":"/d/wutang/west_street1","east":"/d/wutang/east_street1","north":"/d/wutang/north_street","south":"/d/wutang/south_street1"},"objects":{"/d/wutang/npc/seller":1,"/d/wutang/npc/guo_boo":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,2,0]},"/d/wutang/dark_alley_e":{"id":"/d/wutang/dark_alley_e","file":"source/upstream/mudlib/d/wutang/dark_alley_e.c","short":"暗巷","long":"這是一條非常陰冷的巷子，因為在兩旁的房子的中間，而巷子是非常的窄的，而陽光也是被房子所遮敝著，所以使的這非常的涼快，而巷子的盡頭傳來吵雜的聲音，也看得到那一頭人來人往的樣子。","exits":{"east":"/d/wutang/temple_road_s","west":"/d/wutang/dark_alley_w"},"objects":{"/d/wutang/npc/lee_shan":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,0,0]},"/d/wutang/dark_alley_w":{"id":"/d/wutang/dark_alley_w","file":"source/upstream/mudlib/d/wutang/dark_alley_w.c","short":"暗巷","long":"暗巷的另一頭，兩旁的牆壁高得幾乎遮住了天空，地上滿是積水與垃圾，散發出一股霉味。巷子到這裡就到了盡頭，往東可以走回巷口，隱約還聽得到市集那頭傳來的吵雜聲。","exits":{"east":"/d/wutang/dark_alley_e"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[2,0,0]},"/d/wutang/east_street1":{"id":"/d/wutang/east_street1","file":"source/upstream/mudlib/d/wutang/east_street1.c","short":"街道","long":"交叉路口東邊的廟口大街，街上人潮不斷，兩旁的店鋪招牌林立。往南是一間門面氣派的錢莊，門口站著幾個身材魁梧的護院，往東沿著大街可以走到醇雨樓客棧。","exits":{"west":"/d/wutang/crossroad","east":"/d/wutang/east_street2","south":"/d/wutang/bank"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[1,2,0]},"/d/wutang/east_street2":{"id":"/d/wutang/east_street2","file":"source/upstream/mudlib/d/wutang/east_street2.c","short":"街道","long":"廟口大街的中段，北邊就是三層樓高的醇雨樓客棧，飯菜的香味不時從客棧裡飄出來，引得路人頻頻回頭。街上的行人多半是往來的旅客與商販，十分熱鬧。","exits":{"west":"/d/wutang/east_street1","east":"/d/wutang/east_street3","north":"/d/wutang/inn"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[2,2,0]},"/d/wutang/east_street3":{"id":"/d/wutang/east_street3","file":"source/upstream/mudlib/d/wutang/east_street3.c","short":"街道","long":"廟口大街往東延伸的一段，北邊是一間布莊，門口掛著五顏六色的布疋，南邊則是官府設的五堂別館，門口立著兩隻石獅子，顯得十分莊重。往西是熱鬧的大街，往東則通往城隍廟的方向。","exits":{"west":"/d/wutang/east_street2","east":"/d/wutang/east_street4","north":"/d/wutang/cloth_shop","south":"/d/wutang/guesthouse"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,2,0]},"/d/wutang/east_street4":{"id":"/d/wutang/east_street4","file":"source/upstream/mudlib/d/wutang/east_street4.c","short":"街道","long":"廟口大街的東端，再往東走就是香火鼎盛的城隍廟，空氣中飄著淡淡的香煙味。往東北可以通往雲棧市集廣場，市集那頭的吵雜聲遠遠就能聽見。","exits":{"west":"/d/wutang/east_street3","east":"/d/wutang/city_god_temple","northeast":"/d/wutang/market_square"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,2,0]},"/d/wutang/entrance":{"id":"/d/wutang/entrance","file":"source/upstream/mudlib/d/wutang/entrance.c","short":"五堂鎮口","long":"這裡是五堂鎮的鎮口，幾輛人力車整齊地停在路邊，車伕們一邊擦汗一邊招攬客人，等著把旅客送往附近的城鎮。往北是振武軍營的方向，往南走就進入五堂鎮了。","exits":{"north":"/custom/zhenwu/room/gate","south":"/d/wutang/north_street"},"objects":{"/d/wutang/npc/young_man":1,"/d/wutang/npc/old_fire":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,0,0]},"/d/wutang/ferry":{"id":"/d/wutang/ferry","file":"source/upstream/mudlib/d/wutang/ferry.c","short":"鯉君渡","long":"這裡是前往水嵐縣的鯉君渡，河岸邊停泊著幾艘渡船，船夫們吆喝著招攬過河的旅客。往北走下河堤，便是緊鄰河面的渡口，往東則是一條通往三岔路口的木道。","exits":{"east":"/d/wutang/boardwalk_w","northdown":"/d/wutang/ferry_dock"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,5,0]},"/d/wutang/ferry_boat_huang":{"id":"/d/wutang/ferry_boat_huang","file":"source/upstream/mudlib/d/wutang/ferry_boat_huang.c","short":"渡船上","long":"一條新漆過的小舢舨，船頭貼著一張褪了色的紅紙，寫著「順風順水」四個字。小黃在船尾使勁搖著櫓，小船走得又快又急，濺起的水花不時打上船舷，水面的涼意一陣陣撲上臉來。","exits":{},"objects":{},"special":[],"area":"羿水","layer":"小黃的船","areaKey":"羿水","pos":[0,0,0]},"/d/wutang/ferry_boat_ro":{"id":"/d/wutang/ferry_boat_ro","file":"source/upstream/mudlib/d/wutang/ferry_boat_ro.c","short":"渡船上","long":"一條老舊的烏篷小船，船身被河水浸得發黑，篷頂的竹篾修補過好幾回。老駱站在船尾，竹篙一點一撐，小船便穩穩地在羿水上滑行，兩岸的景物緩緩向後退去，只聽得見篙尖入水的輕響。","exits":{},"objects":{},"special":[],"area":"羿水","layer":"老駱的船","areaKey":"羿水","pos":[2,0,0]},"/d/wutang/ferry_dock":{"id":"/d/wutang/ferry_dock","file":"source/upstream/mudlib/d/wutang/ferry_dock.c","short":"鯉君渡口","long":"這裡是來往喬陰縣和水嵐縣的主要交通要衝，在喬陰縣和水嵐縣發展的越來越具規模之後，鯉君渡也變得越來越繁榮，相傳鯉君渡這渡口的由來是在寒於氏死後靈魂化身的十三精靈之一的川鬼「濁魚」因羿水這裡山靈水秀而在這裡安定下來，由於本身所具有對於山川河水的神祕能力，使的原本急湍旋流很多的羿水成為一條穩定的河川，後人為了緬懷祂們，尊稱祂們為鯉君，更在這裡設立一個鯉君渡，讓過往的旅客能受祂們的庇佑安全渡過羿水。","exits":{"southup":"/d/wutang/ferry","southeast":"/d/wutang/river_bank"},"objects":{"/d/wutang/npc/fisher":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,6,0]},"/d/wutang/field1":{"id":"/d/wutang/field1","file":"source/upstream/mudlib/d/wutang/field1.c","short":"菜田","long":"一大片菜田，田裡種著白菜、蘿蔔與青蔥，只是不少菜苗被翻得東倒西歪，地上滿是野豬的蹄印與拱出來的土坑。田埂上插著幾根削尖的竹竿，似乎是主人用來防範野豬的。往西是菜田主人的草屋。","exits":{"west":"/d/wutang/hut","south":"/d/wutang/field2"},"objects":{"/d/wutang/npc/big_boar":1,"/d/wutang/npc/boar":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,-1,0]},"/d/wutang/field2":{"id":"/d/wutang/field2","file":"source/upstream/mudlib/d/wutang/field2.c","short":"菜田","long":"菜田的中央，一畦畦的菜圃整齊排列，卻被野豬啃得七零八落，田邊的竹籬笆也被撞出了好幾個破洞。四周不時傳來野豬哼哼的叫聲，田裡的泥土被翻得亂七八糟，一不小心就會踩進泥坑裡，往北、往東、往南都還是菜田。","exits":{"north":"/d/wutang/field1","east":"/d/wutang/field3","south":"/d/wutang/field4"},"objects":{"/d/wutang/npc/boar":3},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,0,0]},"/d/wutang/field3":{"id":"/d/wutang/field3","file":"source/upstream/mudlib/d/wutang/field3.c","short":"菜田","long":"菜田的東北角，這裡種的是一排排的豆藤，竹架子歪歪斜斜，有些已經被拱倒在地。泥地裡散落著被咬了一半的瓜果，引來了一群蒼蠅嗡嗡作響。往西、往南都還是菜田，幾隻野豬正埋頭在田裡大快朵頤。","exits":{"west":"/d/wutang/field2","south":"/d/wutang/field5"},"objects":{"/d/wutang/npc/boar":3},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,0,0]},"/d/wutang/field4":{"id":"/d/wutang/field4","file":"source/upstream/mudlib/d/wutang/field4.c","short":"菜田","long":"菜田的西南角，地上的蘿蔔幾乎都被野豬拱了出來，只剩下一個個坑洞。看來菜田主人對這群野豬實在是束手無策。田邊的水溝已經被泥土填平了一半，往北、往東還有更多被糟蹋的菜圃。","exits":{"north":"/d/wutang/field2","east":"/d/wutang/field5"},"objects":{"/d/wutang/npc/boar":3},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,1,0]},"/d/wutang/field5":{"id":"/d/wutang/field5","file":"source/upstream/mudlib/d/wutang/field5.c","short":"菜田","long":"菜田的東側，往東就是菜田前的空地。田裡的作物被踩得亂七八糟，泥地上的蹄印一路延伸到空地那頭。田邊幾棵果樹的樹皮被啃得斑斑駁駁，往西、往北都是一片狼藉的菜田。","exits":{"west":"/d/wutang/field4","north":"/d/wutang/field3","east":"/d/wutang/clearing"},"objects":{"/d/wutang/npc/boar":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,1,0]},"/d/wutang/grass_ne":{"id":"/d/wutang/grass_ne","file":"source/upstream/mudlib/d/wutang/grass_ne.c","short":"草原","long":"草原上微風徐徐，牧羊人倚著一根木杖看著羊群，偶爾吹起口哨把走遠的綿羊趕回來。往西、往南都還是一望無際的草地，草叢中不時竄出幾隻野兔，又飛快地鑽進草堆裡不見蹤影。","exits":{"west":"/d/wutang/grass_nw","south":"/d/wutang/grass_se"},"objects":{"/d/wutang/npc/sheep":2,"/d/wutang/npc/shepherd":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,3,0]},"/d/wutang/grass_nw":{"id":"/d/wutang/grass_nw","file":"source/upstream/mudlib/d/wutang/grass_nw.c","short":"草原","long":"一片青翠的草原，綠草長得又密又嫩，幾隻綿羊低著頭悠閒地吃著草，不時發出咩咩的叫聲。草原往東、往南延伸，遠處看得見五堂鎮的屋頂。草地上開著一些不知名的小黃花，偶爾有蝴蝶飛舞其間，十分恬靜。","exits":{"east":"/d/wutang/grass_ne","south":"/d/wutang/grass_sw"},"objects":{"/d/wutang/npc/sheep":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,3,0]},"/d/wutang/grass_se":{"id":"/d/wutang/grass_se","file":"source/upstream/mudlib/d/wutang/grass_se.c","short":"草原","long":"草原的東南角，這裡的草被羊群啃得短短的，露出一塊塊泥土。往南可以走上通往三岔路口的木道，往北、往西則是更大的草原。草地上散落著幾坨羊糞，牧羊人搭的一個小棚子歪歪斜斜地立在一旁。","exits":{"west":"/d/wutang/grass_sw","north":"/d/wutang/grass_ne","south":"/d/wutang/boardwalk_e"},"objects":{"/d/wutang/npc/sheep":2,"/d/wutang/npc/shepherd":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,4,0]},"/d/wutang/grass_sw":{"id":"/d/wutang/grass_sw","file":"source/upstream/mudlib/d/wutang/grass_sw.c","short":"草原","long":"草原的西南角，地勢稍低，草叢間有幾處小水窪，綿羊們聚在水邊喝水。往北、往東都是綠油油的草地。水窪邊的泥地上印滿了羊蹄印，空氣中帶著青草與泥土混合的氣味。","exits":{"north":"/d/wutang/grass_nw","east":"/d/wutang/grass_se"},"objects":{"/d/wutang/npc/sheep":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,4,0]},"/d/wutang/gravel_road_n":{"id":"/d/wutang/gravel_road_n","file":"source/upstream/mudlib/d/wutang/gravel_road_n.c","short":"碎石路","long":"一條鋪滿碎石的小路，走起來沙沙作響。西側不遠就是羿水河邊，路旁長著一大叢茂密的草叢，旁邊還有一片竹蘆，風一吹便沙沙作響，似乎可以從草叢穿過去。往東是五堂鎮的街道，往北是菜田前的空地。","exits":{"enter":"/d/wutang/pavilion","east":"/d/wutang/west_street2","north":"/d/wutang/clearing","southwest":"/d/wutang/gravel_road_s"},"objects":{},"special":[{"cmd":"pass 草叢","to":"/d/wutang/bamboo_grove"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,2,0]},"/d/wutang/gravel_road_s":{"id":"/d/wutang/gravel_road_s","file":"source/upstream/mudlib/d/wutang/gravel_road_s.c","short":"碎石路","long":"碎石路往西南延伸，路旁的雜草漸漸茂密起來，空氣中帶著河水的濕氣。遠處傳來潺潺的流水聲與船夫的吆喝聲，越往西走路面越是濕滑。往西走就是羿水河邊，往東北則可以走回五堂鎮的方向。","exits":{"west":"/d/wutang/riverside","northeast":"/d/wutang/gravel_road_n"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,3,0]},"/d/wutang/guesthouse":{"id":"/d/wutang/guesthouse","file":"source/upstream/mudlib/d/wutang/guesthouse.c","short":"五堂別館","long":"這裏是五堂鎮官府所設的別館，專供往來的大官休息之用，別館裏樸實雅緻的佈置，可看出鎮方樸實的一面。","exits":{"north":"/d/wutang/east_street3"},"objects":{"/d/wutang/npc/royalist":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,3,0]},"/d/wutang/hut":{"id":"/d/wutang/hut","file":"source/upstream/mudlib/d/wutang/hut.c","short":"草屋","long":"一間用茅草與土牆搭成的簡陋草屋，是菜田主人的住處。屋裡擺著幾件農具與一張竹床，牆角堆著剛收成的蔬菜，屋簷下掛著幾串風乾的辣椒與玉米。門板上釘著好幾塊新補上的木板，看來是被野豬撞壞過不只一次。往東就是一大片菜田。","exits":{"east":"/d/wutang/field1"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-6,-1,0]},"/d/wutang/inn":{"id":"/d/wutang/inn","file":"source/upstream/mudlib/d/wutang/inn.c","short":"醇雨樓客棧","long":"這是一家中等規模的客棧﹐樓面不甚寬闊﹐但是卻有三層樓﹐看牆面樑柱的樣子﹐大概有七、八十年的歷史了﹐大門兩側的柱子還題得有字﹐只不過龍飛鳳舞地不知道寫些什麼﹐東首有座樓梯往二樓雅座。","exits":{"south":"/d/wutang/east_street2","up":"/d/wutang/inn2"},"objects":{"/d/wutang/npc/waiter":1,"/d/wutang/npc/yung_tai":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[2,1,0]},"/d/wutang/inn2":{"id":"/d/wutang/inn2","file":"source/upstream/mudlib/d/wutang/inn2.c","short":"醇雨樓客棧二樓","long":"這裡是醇雨樓客棧的二樓，樓梯旁的蘭花增添了幾分清香，七八張木桌整齊排列，川流不息。倚著窗欄可以看到五堂鎮來往的路人，是休憩用膳喘口氣的好去處。","exits":{"down":"/d/wutang/inn","up":"/d/wutang/inn3"},"objects":{"/d/wutang/npc/white_taoist":3,"/d/wutang/npc/red_taoist":3},"special":[],"area":"五堂鎮","layer":"二樓","areaKey":"五堂鎮","pos":[2,1,1]},"/d/wutang/inn3":{"id":"/d/wutang/inn3","file":"source/upstream/mudlib/d/wutang/inn3.c","short":"醇雨樓客棧三樓","long":"這裡是醇雨樓客棧的三樓﹐佈置和二樓雅座大致差不多﹐不過樓中放了幾盆蘭花﹐更添幾分雅致﹐往下的樓梯在西邊。","exits":{"down":"/d/wutang/inn2"},"objects":{"/d/wutang/npc/jeweller":1,"/d/wutang/npc/young_scholar":1},"special":[],"area":"五堂鎮","layer":"三樓","areaKey":"五堂鎮","pos":[2,1,2]},"/d/wutang/market_square":{"id":"/d/wutang/market_square","file":"source/upstream/mudlib/d/wutang/market_square.c","short":"雲棧市集廣場","long":"這是雲棧市集廣場，在這不算廣闊的空地裡，卻是此市集最繁榮之處，不時傳來震耳欲聾的吵雜聲，真的不難想像這到底有多熱鬧，所到之處那一個地方不是人擠人，尤其是西方的雲棧客棧和北方的鎮天神廟，都是本地的名勝古蹟，而在廣場的中央有著官府所設製的公告欄是當地官府向人民宣布重要事情之用。","exits":{"north":"/d/wutang/temple_road_s","southwest":"/d/wutang/east_street4"},"objects":{"/d/wutang/npc/yaesae":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,1,0]},"/d/wutang/north_street":{"id":"/d/wutang/north_street","file":"source/upstream/mudlib/d/wutang/north_street.c","short":"五堂鎮","long":"從鎮口往南走，街道兩旁的店鋪漸漸多了起來，挑擔的小販與趕路的行人來來往往，越往鎮中心越顯得熱鬧。西邊是陸家的和豐當鋪，往北可以走回鎮口，往南就是鎮上最熱鬧的交叉路口。","exits":{"north":"/d/wutang/entrance","west":"/d/wutang/pawnshop","south":"/d/wutang/crossroad"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,1,0]},"/d/wutang/path_e":{"id":"/d/wutang/path_e","file":"source/upstream/mudlib/d/wutang/path_e.c","short":"小路","long":"一條夾在民房之間的泥土小路，兩旁的竹籬笆上晾著衣物，偶爾傳來幾聲雞鳴犬吠。往西可以回到熱鬧的廟口小路，往南則是民房的後院，隱約聽得見潺潺的溪水聲。","exits":{"west":"/d/wutang/temple_road_n","south":"/d/wutang/backyard"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[6,-1,0]},"/d/wutang/pavilion":{"id":"/d/wutang/pavilion","file":"source/upstream/mudlib/d/wutang/pavilion.c","short":"涼亭","long":"一座建在小丘上的木造涼亭，四周種著幾株垂柳，微風吹過時柳枝輕輕搖曳。站在亭中向西望去，可以眺望寬闊的羿水在遠方緩緩流過，河面上點點帆影，景色十分宜人。亭外便是一條碎石路。","exits":{"out":"/d/wutang/gravel_road_n"},"objects":{"/d/wutang/npc/yang_zlin":1,"/d/swaylan/lunmay/npc/apprentice":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,2,0]},"/d/wutang/pawnshop":{"id":"/d/wutang/pawnshop","file":"source/upstream/mudlib/d/wutang/pawnshop.c","short":"和豐當鋪","long":"這裡是一家中等規模的當鋪﹐老闆便是五堂鎮上陸姓一堂的當家﹐因為陸家的祖先是從經營當鋪發跡的﹐因此這家當鋪也被視為是陸家家長的主要基業﹐現在的大朝奉是由陸大當家的四弟擔任﹐大家都稱他陸四爺﹐當鋪的出口在東邊﹐北邊的牆上掛著一幅工筆花鳥﹐西邊是櫃臺﹐通往內間的門就在櫃臺邊﹐不過顯然是從裡面鎖著的。","exits":{"east":"/d/wutang/north_street"},"objects":{"/d/wutang/npc/lu_estimator":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,1,0]},"/d/wutang/river_bank":{"id":"/d/wutang/river_bank","file":"source/upstream/mudlib/d/wutang/river_bank.c","short":"羿水河邊","long":"羿水河邊的一片沙灘，河水在這裡轉了個彎，流速緩了下來，水面上不時有魚兒躍出。岸邊散落著幾塊大石頭，是釣客們最喜歡的位置。往西北可以回到鯉君渡口。","exits":{"northwest":"/d/wutang/ferry_dock"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,7,0]},"/d/wutang/riverside":{"id":"/d/wutang/riverside","file":"source/upstream/mudlib/d/wutang/riverside.c","short":"河邊","long":"這裏是羿水河邊, 河心隱約泊著一艘小草船, 西邊是一座大山, 陡峭的山壁隱隱現出不凡的氣勢, 東邊則是通往五堂鎮的石道, 商旅不時的來來往往。","exits":{"east":"/d/wutang/gravel_road_s"},"objects":{"/d/wutang/npc/ro":1},"special":[{"cmd":"swim","to":"/d/wutang/boat"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,3,0]},"/d/wutang/school":{"id":"/d/wutang/school","file":"source/upstream/mudlib/d/wutang/school.c","short":"鄉校","long":"五堂鎮的鄉校，比一般的私塾大上許多，屋裡排滿了一張張書桌，學生們搖頭晃腦地唸著書。牆上貼著一張紅紙，寫著前幾年鎮上出了一位舉人，從那之後鎮民讀書的風氣便越來越盛。往南可以回到街道。","exits":{"south":"/d/wutang/west_street2"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,1,0]},"/d/wutang/south_street1":{"id":"/d/wutang/south_street1","file":"source/upstream/mudlib/d/wutang/south_street1.c","short":"街道","long":"交叉路口往南的街道，路面漸漸寬了起來，常有挑著貨擔的商人與趕車的旅客經過。路旁有一家打鐵鋪傳來叮叮噹噹的聲音，也有幾間賣雜貨的小店。往北可以回到鎮中心，往南則通往鎮外的三岔路口。","exits":{"north":"/d/wutang/crossroad","south":"/d/wutang/south_street2"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,3,0]},"/d/wutang/south_street2":{"id":"/d/wutang/south_street2","file":"source/upstream/mudlib/d/wutang/south_street2.c","short":"街道","long":"五堂鎮南邊的街道，兩旁的房舍漸漸稀疏，遠處可以望見一片綠油油的草原。路邊的大樹下有幾個老人坐著乘涼閒聊，旁邊拴著幾頭準備上路的驢子。往北走回到鎮上，往南不遠就是通往四方的三岔路口。","exits":{"north":"/d/wutang/south_street1","south":"/d/wutang/three_way"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,4,0]},"/d/wutang/temple":{"id":"/d/wutang/temple","file":"source/upstream/mudlib/d/wutang/temple.c","short":"鎮天神廟","long":"這裡是這個地方最有名的鎮天神廟，也是這地方最古老的廟，從這間廟建築的老舊可是卻香火鼎盛，就可以知道人們一定認為這間廟很靈，而這間廟主要是供奉著雲棧鎮天神，在廟前的廣場通常也是村人舉行活動的好地方，而旁邊也有一條進入後院的路。","exits":{"south":"/d/wutang/temple_road_n"},"objects":{"/d/wutang/npc/keeper":1},"special":[{"cmd":"enter 後院","to":"/d/wutang/temple_yard"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,-2,0]},"/d/wutang/temple_road_n":{"id":"/d/wutang/temple_road_n","file":"source/upstream/mudlib/d/wutang/temple_road_n.c","short":"廟口小路","long":"通往鎮天神廟的石板小路，往來的香客絡繹不絕，人聲雖然鼎沸，越往北走卻越顯得莊嚴肅穆。路的西邊是最近出了事的顏家大宅，高牆下有一條陰暗的巷子，鎮民經過時都刻意繞開。東邊有條小路通往民房，往南則回到廟口。","exits":{"north":"/d/wutang/temple","south":"/d/wutang/temple_road_s","east":"/d/wutang/path_e"},"objects":{},"special":[{"cmd":"enter 暗巷","to":"/d/wutang/yan_gate"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,-1,0]},"/d/wutang/temple_road_s":{"id":"/d/wutang/temple_road_s","file":"source/upstream/mudlib/d/wutang/temple_road_s.c","short":"廟口小路","long":"往北通往鎮天神廟的石板路，路旁擺著幾個賣香燭紙錢的小攤，空氣裡瀰漫著檀香的氣味。路邊兩棟房子中間夾著一條狹窄的小巷子，看不清裡頭有些什麼。往南走就是熱鬧的雲棧市集廣場。","exits":{"north":"/d/wutang/temple_road_n","south":"/d/wutang/market_square"},"objects":{},"special":[{"cmd":"enter 小巷子","to":"/d/wutang/dark_alley_e"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,0,0]},"/d/wutang/temple_yard":{"id":"/d/wutang/temple_yard","file":"source/upstream/mudlib/d/wutang/temple_yard.c","short":"後院","long":"這是鎮天神廟的後院，通常開放給鎮民來此休息，在此有種著許多的樹和盆景，而在老黃桐樹下也有著四張石椅和一張光滑的石桌供人在此乘涼。","exits":{"out":"/d/wutang/temple"},"objects":{"/d/wutang/npc/oldman":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[6,-2,0]},"/d/wutang/three_way":{"id":"/d/wutang/three_way","file":"source/upstream/mudlib/d/wutang/three_way.c","short":"三岔路口","long":"一處三岔路口，路旁立著一塊斑駁的石碑，上頭刻著往各地的方向。往西是一片草原，再往西則是鯉君渡，往東南的官道可以前往喬陰縣，往北則回到五堂鎮。","exits":{"north":"/d/wutang/south_street2","west":"/d/wutang/boardwalk_e","southeast":"/d/qiaoyin/highway"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,5,0]},"/d/wutang/west_street1":{"id":"/d/wutang/west_street1","file":"source/upstream/mudlib/d/wutang/west_street1.c","short":"街道","long":"五堂鎮的街道，往東不遠就是鎮中心的交叉路口，人聲漸漸熱鬧起來。路旁有幾個小販擺著攤子叫賣，偶爾還能看見幾隻從城外菜田跑進來的野豬，惹得鎮民一陣驚呼。","exits":{"west":"/d/wutang/west_street2","east":"/d/wutang/crossroad"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,2,0]},"/d/wutang/west_street2":{"id":"/d/wutang/west_street2","file":"source/upstream/mudlib/d/wutang/west_street2.c","short":"街道","long":"五堂鎮西側的街道，路面由青石板鋪成，兩旁是幾間簡樸的民房。往北可以聽見鄉校傳來的讀書聲，往西走則漸漸離開市街，通往一條碎石路，往東是鎮上的街道。","exits":{"west":"/d/wutang/gravel_road_n","east":"/d/wutang/west_street1","north":"/d/wutang/school"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,2,0]},"/d/wutang/yan_gate":{"id":"/d/wutang/yan_gate","file":"source/upstream/mudlib/d/wutang/yan_gate.c","short":"前門","long":"顏家大宅的前門，四周一片死寂，杳無人煙。門板與石階上留著斑斑血跡，牆上還有好幾道深深的刀痕，看得出這裡不久前經過一場惡鬥。往北可以進入大宅，往東則能回到廟口小路。","exits":{"north":"/d/wutang/yan_mansion","east":"/d/wutang/temple_road_n"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,0,0]},"/d/wutang/yan_hall":{"id":"/d/wutang/yan_hall","file":"source/upstream/mudlib/d/wutang/yan_hall.c","short":"大廳","long":"顏家大宅的正廳，原本氣派的桌椅翻倒在地，名貴的瓷器碎了一地。幾具家僕與丫鬟的屍體橫陳在血泊之中，看來都是被一刀斃命。主人的座位空空蕩蕩，似乎在出事之前就已經逃走了。","exits":{"out":"/d/wutang/yan_mansion"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,-2,0]},"/d/wutang/yan_mansion":{"id":"/d/wutang/yan_mansion","file":"source/upstream/mudlib/d/wutang/yan_mansion.c","short":"顏家大宅","long":"大宅的門戶敞開著，雕樑畫棟、朱漆門柱都看得出顏家當年的輝煌，如今卻蒙上了一層灰，庭院裡的花草也已經枯萎。院中靜得出奇，只有幾隻烏鴉停在屋簷上。往裡走是正廳，往南則是大宅的前門。","exits":{"in":"/d/wutang/yan_hall","south":"/d/wutang/yan_gate"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,-1,0]},"/d/ziyan/corner":{"id":"/d/ziyan/corner","file":"source/upstream/mudlib/d/ziyan/corner.c","short":"街角","long":"街角這裡開著一間當鋪，門前常有人進進出出，進去時懷裡揣著包袱，出來時手裡多了幾串銅錢，臉上卻沒有半點喜色。牆上被人用炭寫了幾行字，罵的是縣太爺，字跡已經被擦得模糊不清。","exits":{"north":"/d/ziyan/pawnshop","south":"/d/ziyan/lane","west":"/d/ziyan/well"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,-4,0]},"/d/ziyan/dirt_road":{"id":"/d/ziyan/dirt_road","file":"source/upstream/mudlib/d/ziyan/dirt_road.c","short":"泥土路","long":"通往渡口的一條泥土路，被往來的車馬輾得坑坑窪窪。路邊的水溝裡積著發黑的污水，散發出一股腥臭，偶有挑著魚簍的漁夫經過，腳步匆匆，濺起一路泥點，誰也不想在這裡多待。","exits":{"north":"/d/ziyan/ferry","south":"/d/ziyan/yamen_street","west":"/d/ziyan/drugstore"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-7,-5,0]},"/d/ziyan/drugstore":{"id":"/d/ziyan/drugstore","file":"source/upstream/mudlib/d/ziyan/drugstore.c","short":"藥鋪","long":"一間不大的藥鋪，靠牆立著一排頂天的藥櫃，數不清的小抽屜上貼著泛黃的藥名籤。櫃檯上擺著戥子和碾槽，滿屋子都是草藥苦澀的氣味，後頭一扇小門半掩著，隱約可見院裡曬著藥材。","exits":{"east":"/d/ziyan/dirt_road","out":"/d/ziyan/herb_yard"},"objects":{"/d/ziyan/npc/herbalist":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-8,-5,0]},"/d/ziyan/entrance":{"id":"/d/ziyan/entrance","file":"source/upstream/mudlib/d/ziyan/entrance.c","short":"紫煙鎮口","long":"紫煙鎮的鎮口，一條黃土大路從這裡往東伸展，通往繁華的水嵐縣。路旁立著一座斑駁的石牌坊，上頭「紫煙鎮」三個字已經剝落了大半，牌坊下積著厚厚的塵土，一旁的茶棚早已沒了生意。","exits":{"north":"/d/ziyan/inn_street","east":"/d/swaylan/west_gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,0,0]},"/d/ziyan/ferry":{"id":"/d/ziyan/ferry","file":"source/upstream/mudlib/d/ziyan/ferry.c","short":"渡口","long":"紫煙鎮的渡口緊挨著羿水，幾根木樁歪歪斜斜地插在泥灘上，木樁邊繫著船夫的小船，隨著水波輕輕搖晃。河面寬闊，對岸的五堂鎮隱約可見，過河的多是挑擔的小販與行腳的旅人，船板踩上去吱呀作響。","exits":{"south":"/d/ziyan/dirt_road"},"objects":{"/d/ziyan/npc/huang":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-7,-6,0]},"/d/ziyan/herb_yard":{"id":"/d/ziyan/herb_yard","file":"source/upstream/mudlib/d/ziyan/herb_yard.c","short":"後院","long":"藥鋪後頭的一方小院，地上擺滿了竹篩，篩裡攤著切成薄片的藥材，曬得乾巴巴的。院角堆著幾口陶甕，濃烈的藥味混著泥土氣息撲鼻而來，一扇小門半掩著，門後便是前頭的藥鋪。","exits":{"in":"/d/ziyan/drugstore"},"objects":{"/d/ziyan/npc/herb_boy":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-8,-6,0]},"/d/ziyan/house":{"id":"/d/ziyan/house","file":"source/upstream/mudlib/d/ziyan/house.c","short":"民宅","long":"屋內一片狼藉，桌椅東倒西歪，地上的血跡雖已被清洗過，石板縫裡仍留著洗不淨的暗紅。這裡是近日發生兇案的現場，官府草草收拾後便貼上封條了事，倒是靠牆的書櫃還立得端端正正。","exits":{"east":"/d/ziyan/lane"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-4,-3,0]},"/d/ziyan/hut":{"id":"/d/ziyan/hut","file":"source/upstream/mudlib/d/ziyan/hut.c","short":"茅屋","long":"一間低矮的茅屋，屋頂的茅草塌了一角，屋裡昏暗潮濕，只擺著一張破木床和一張缺腿的桌子。地上的泥土有幾處顏色特別深，像是被什麼東西浸透過，牆角堆著一捆草蓆，透著一股說不出的腥味。","exits":{"out":"/d/ziyan/narrow_street"},"objects":{"/d/ziyan/npc/cheng_huai":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[18,0,0]},"/d/ziyan/inn":{"id":"/d/ziyan/inn","file":"source/upstream/mudlib/d/ziyan/inn.c","short":"紫煙小棧","long":"紫煙小棧是紫煙鎮上唯一的小客棧, 這店棧雖然在城外, 規模卻是不小, 一進門是一面櫃檯, 櫃檯前面, 卻放著十餘張椅子, 想必是借人歇腳用的, 你可以向店小二打聽一下店裡有賣哪些食物.","exits":{"east":"/d/ziyan/inn_gate"},"objects":{"/d/ziyan/npc/waiter":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-5,-1,0]},"/d/ziyan/inn_gate":{"id":"/d/ziyan/inn_gate","file":"source/upstream/mudlib/d/ziyan/inn_gate.c","short":"紫煙小棧門口","long":"紫煙小棧門口，兩根木柱撐著一塊簡陋的招牌，招牌上的字被煙燻得發黑。門檻邊放著一只破碗，裡頭剩著些殘羹，引得一條野狗在附近徘徊不去，不時抬頭嗅嗅從店裡飄出的肉香。","exits":{"east":"/d/ziyan/inn_street","west":"/d/ziyan/inn"},"objects":{"/d/npc/wild_dog":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-4,-1,0]},"/d/ziyan/inn_street":{"id":"/d/ziyan/inn_street","file":"source/upstream/mudlib/d/ziyan/inn_street.c","short":"客棧街","long":"街道到這裡轉了個彎，旁邊是一間頗具規模的客棧，門口的酒旗洗得發白，倒還算醒目。這一帶比鎮裡熱鬧些，過往的旅人多半在此歇腳，趕車的、挑擔的來來往往，揚起一路塵土。","exits":{"north":"/d/ziyan/market","south":"/d/ziyan/entrance","west":"/d/ziyan/inn_gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,-1,0]},"/d/ziyan/inner_hall":{"id":"/d/ziyan/inner_hall","file":"source/upstream/mudlib/d/ziyan/inner_hall.c","short":"內廳","long":"一間雅致的內廳，四壁的多寶格上擺滿了古玩珍寶，青銅鼎、白玉璧、鑲金的如意，件件價值不菲，與紫煙鎮街上的破落簡直是兩個天地。屋裡燃著上好的沉香，香氣濃得有些膩人。","exits":{"north":"/d/ziyan/yamen_hall"},"objects":{"/d/ziyan/npc/zhao_hong_chun":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[14,1,0]},"/d/ziyan/jail":{"id":"/d/ziyan/jail","file":"source/upstream/mudlib/d/ziyan/jail.c","short":"牢房","long":"陰暗潮濕的牢房，石牆上滲著水珠，地上鋪著發霉的稻草，空氣中瀰漫著腐臭與血腥的氣味。牢門用碗口粗的木柵圍成，守衛森嚴，被關進這裡的人，多半再也沒有走出去過。","exits":{"south":"/d/ziyan/yamen_hall"},"objects":{"/d/ziyan/npc/lin_yu_lun":1,"/d/ziyan/npc/constable":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[14,-1,0]},"/d/ziyan/lane":{"id":"/d/ziyan/lane","file":"source/upstream/mudlib/d/ziyan/lane.c","short":"小街","long":"一條南北向的小街，東倒西歪的木屋擠在兩旁。西邊一戶人家的門口拉著麻繩，門板上還貼著官府的封條，左鄰右舍經過時都繞得遠遠的，彷彿那屋裡還住著什麼不乾淨的東西。","exits":{"north":"/d/ziyan/corner","south":"/d/ziyan/market","west":"/d/ziyan/house"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,-3,0]},"/d/ziyan/market":{"id":"/d/ziyan/market","file":"source/upstream/mudlib/d/ziyan/market.c","short":"菜市","long":"小街往南漸漸寬了些，路邊多了幾個賣菜賣魚的攤子，攤販有氣無力地吆喝著，買的人卻沒幾個。地上爛菜葉和魚鱗混在一起，被來往的腳步踩得稀爛，透著一股酸腐的氣味。","exits":{"north":"/d/ziyan/lane","south":"/d/ziyan/inn_street"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,-2,0]},"/d/ziyan/narrow_street":{"id":"/d/ziyan/narrow_street","file":"source/upstream/mudlib/d/ziyan/narrow_street.c","short":"窄街","long":"一條狹窄的街道，兩旁的屋舍低矮破舊，北邊有一間孤零零的茅屋。地上撒了一層新土，像是有人匆忙掩蓋過什麼，泥土底下卻隱約透出幾點暗紅的血跡，斷斷續續地一路延伸到茅屋門口。","exits":{"east":"/d/ziyan/street","west":"/d/ziyan/yamen_street"},"objects":{},"special":[{"cmd":"enter 茅屋","to":"/d/ziyan/hut"}],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-6,-4,0]},"/d/ziyan/pawnshop":{"id":"/d/ziyan/pawnshop","file":"source/upstream/mudlib/d/ziyan/pawnshop.c","short":"當鋪","long":"紫煙鎮唯一的一間當鋪，門面窄小，高高的櫃檯後頭只開了一個小窗口，窗口上釘著粗鐵條。來這裡的多是走投無路的街坊，當的盡是些舊衣破鍋，櫃上的算盤卻打得一點也不含糊。","exits":{"south":"/d/ziyan/corner"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,-5,0]},"/d/ziyan/street":{"id":"/d/ziyan/street","file":"source/upstream/mudlib/d/ziyan/street.c","short":"紫煙鎮大街","long":"紫煙鎮大街，說是大街，其實也不過兩輛車寬。路邊的店鋪有一半關著門，門板上落滿了灰塵，開著的幾家也冷冷清清，掌櫃倚在門邊打盹，整條街靜得只聽得見遠處羿水的流聲。","exits":{"east":"/d/ziyan/well","west":"/d/ziyan/narrow_street"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-5,-4,0]},"/d/ziyan/well":{"id":"/d/ziyan/well","file":"source/upstream/mudlib/d/ziyan/well.c","short":"井邊","long":"這一帶住著不少靠渡口討生活的人家，屋簷下掛著曬乾的魚，空氣裡帶著淡淡的魚腥味。街心有一口老井，幾個婦人圍在井邊洗衣，壓低了聲音說著鎮上的兇案，見有生人走近，便都住了口。","exits":{"east":"/d/ziyan/corner","west":"/d/ziyan/street"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-4,-4,0]},"/d/ziyan/yamen_gate":{"id":"/d/ziyan/yamen_gate","file":"source/upstream/mudlib/d/ziyan/yamen_gate.c","short":"縣衙大門","long":"紫煙鎮縣衙大門，兩扇朱漆大門緊緊閉著，門前蹲著一對石獅，神情倨傲。門邊架著一面牛皮大鼓，鼓面上落了一層薄灰，鼓槌斜斜地掛在架上，看來已經許久沒有人敢來擊鼓鳴冤了。","exits":{"north":"/d/ziyan/yamen_street"},"objects":{"/d/ziyan/npc/yamen_guard":2},"special":[{"cmd":"knock 牛皮大鼓","to":"/d/ziyan/yamen_hall"}],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-7,-3,0]},"/d/ziyan/yamen_hall":{"id":"/d/ziyan/yamen_hall","file":"source/upstream/mudlib/d/ziyan/yamen_hall.c","short":"大堂","long":"這裡名為大堂，看起來卻更像是縣令的書房，案上堆著幾本帳冊，公文倒沒見幾件。案頭擺著一尊三足金蟾的木像，雕工精細，一雙眼睛尤其靈動，彷彿正盯著來人。堂後的木門上掛著一把銅鎖。","exits":{"east":"/d/ziyan/yamen_gate","north":"/d/ziyan/jail","south":"/d/ziyan/inner_hall"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[14,0,0]},"/d/ziyan/yamen_street":{"id":"/d/ziyan/yamen_street","file":"source/upstream/mudlib/d/ziyan/yamen_street.c","short":"縣衙前街","long":"縣衙門前一段街道，街面倒是掃得乾乾淨淨，與鎮上別處的破落大不相同。牆上貼著幾張褪色的告示，催繳稅銀的字樣寫得斗大，行人經過時都低著頭，腳步匆匆，不敢多看一眼。","exits":{"east":"/d/ziyan/narrow_street","north":"/d/ziyan/dirt_road","south":"/d/ziyan/yamen_gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-7,-4,0]},"/custom/zhenwu/room/big_tent":{"id":"/custom/zhenwu/room/big_tent","file":"source/upstream/mudlib/custom/zhenwu/room/big_tent.c","short":"大帳","long":"一座厚重軍帳立在校場北端，帳布經風吹日曬已略顯褪色，帳前卻收拾得一塵不亂。兩側兵器架與軍旗排列整齊，往來士卒經過此處都不自覺放輕聲音，顯示這裡是軍中主將處理軍務的地方。","exits":{"out":"/custom/zhenwu/room/yard04"},"objects":{"/custom/zhenwu/npc/mee_pei":1},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,-1,0]},"/custom/zhenwu/room/camp":{"id":"/custom/zhenwu/room/camp","file":"source/upstream/mudlib/custom/zhenwu/room/camp.c","short":"軍營","long":"這裡是振武軍營西側的營區入口，木柵與營帳沿路排列，來往軍士神色匆忙。東邊棚場後便是大片校場，遠處號令聲此起彼落；往東一路穿過營地，可回到雪亭鎮南方草棚附近。","exits":{"east":"/custom/zhenwu/room/shed"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-3,2,0]},"/custom/zhenwu/room/gate":{"id":"/custom/zhenwu/room/gate","file":"source/upstream/mudlib/custom/zhenwu/room/gate.c","short":"振武軍營大門","long":"兩扇厚重木門構成振武軍營的主要門戶，門板外包鐵條，兩側木柵高聳。守門士兵持槍立在門旁，目光不時掃過往來人群；門內便是操練校場，軍旗與號令聲從營中不斷傳來。往東就到雪亭鎮。","exits":{"west":"/custom/zhenwu/room/yard06","east":"/d/snow/sgate","south":"/d/wutang/entrance"},"objects":{"/custom/zhenwu/npc/soldier":2},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[2,0,0]},"/custom/zhenwu/room/shed":{"id":"/custom/zhenwu/room/shed","file":"source/upstream/mudlib/custom/zhenwu/room/shed.c","short":"棚場","long":"一排簡陋木棚沿著軍營西側搭建，棚下堆著草束、木料與日常操演所需的雜物。地面有車輪與軍靴留下的痕跡，向東便是校場，向西則可通往軍營外側。","exits":{"east":"/custom/zhenwu/room/yard10","west":"/custom/zhenwu/room/camp"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-2,2,0]},"/custom/zhenwu/room/yard02":{"id":"/custom/zhenwu/room/yard02","file":"source/upstream/mudlib/custom/zhenwu/room/yard02.c","short":"校場","long":"這片校場靠近大帳，黃土地被長年操演磨得平整堅實。幾根粗木立在場邊，木身遍布刀痕與撞擊留下的缺口，北風穿過營旗時發出獵獵聲響，使整座軍營顯得肅整而緊張。","exits":{"east":"/custom/zhenwu/room/yard03","south":"/custom/zhenwu/room/yard05"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,-1,0]},"/custom/zhenwu/room/yard03":{"id":"/custom/zhenwu/room/yard03","file":"source/upstream/mudlib/custom/zhenwu/room/yard03.c","short":"校場","long":"校場東北角視野開闊，往來軍士多從這裡穿過。地上用石灰與木樁分出操練的位置，遠處可見振武軍營大門，守門軍士的身影在門樓下來回巡視，營內一切井然有序。","exits":{"west":"/custom/zhenwu/room/yard02","south":"/custom/zhenwu/room/yard06"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[1,-1,0]},"/custom/zhenwu/room/yard04":{"id":"/custom/zhenwu/room/yard04","file":"source/upstream/mudlib/custom/zhenwu/room/yard04.c","short":"校場","long":"這裡是校場西側，土地上散著被踏碎的草梗與細石。附近常有士卒列隊練習步伐，沉重腳步把地面踩出一道道淺痕；向北可望見大帳，向東則是軍營較寬闊的操演區。","exits":{"in":"/custom/zhenwu/room/big_tent","south":"/custom/zhenwu/room/yard07","east":"/custom/zhenwu/room/yard05"},"objects":{"/custom/zhenwu/npc/zhenwu_soldier":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,0,0]},"/custom/zhenwu/room/yard05":{"id":"/custom/zhenwu/room/yard05","file":"source/upstream/mudlib/custom/zhenwu/room/yard05.c","short":"校場","long":"校場中央人聲與兵器碰撞聲最為集中，四周黃土被反覆踩踏得幾乎不生寸草。場邊插著幾面振武軍旗，風一吹便整齊展開，讓人一踏進來便感受到軍伍特有的森嚴氣息。","exits":{"north":"/custom/zhenwu/room/yard02","south":"/custom/zhenwu/room/yard08","west":"/custom/zhenwu/room/yard04","east":"/custom/zhenwu/room/yard06"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,0,0]},"/custom/zhenwu/room/yard06":{"id":"/custom/zhenwu/room/yard06","file":"source/upstream/mudlib/custom/zhenwu/room/yard06.c","short":"校場","long":"這片校場緊鄰軍營大門，來往軍士不時從東邊經過。木製拒馬與練兵器具靠著場邊擺放，地面仍留有整隊操練形成的平直足跡，遠近都能聽見教官短促有力的號令。","exits":{"north":"/custom/zhenwu/room/yard03","south":"/custom/zhenwu/room/yard09","west":"/custom/zhenwu/room/yard05","east":"/custom/zhenwu/room/gate"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[1,0,0]},"/custom/zhenwu/room/yard07":{"id":"/custom/zhenwu/room/yard07","file":"source/upstream/mudlib/custom/zhenwu/room/yard07.c","short":"校場","long":"校場西邊較為安靜，幾座兵器架在風中微微作響。地上散落著操練後留下的木屑，長槍與刀具劃過木樁的痕跡清晰可見，顯然每日都有不少新兵在此反覆磨練基本功。","exits":{"north":"/custom/zhenwu/room/yard04","south":"/custom/zhenwu/room/yard10","east":"/custom/zhenwu/room/yard08"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,1,0]},"/custom/zhenwu/room/yard08":{"id":"/custom/zhenwu/room/yard08","file":"source/upstream/mudlib/custom/zhenwu/room/yard08.c","short":"校場","long":"這裡位於軍營腹地，四周校場彼此相連，腳下黃土因長年操練而堅硬如石。軍士奔走時揚起薄薄塵霧，營旗、木樁與兵器架錯落在視野中，整片區域充滿規律而沉重的軍旅節奏。","exits":{"north":"/custom/zhenwu/room/yard05","south":"/custom/zhenwu/room/yard11","west":"/custom/zhenwu/room/yard07","east":"/custom/zhenwu/room/yard09"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,1,0]},"/custom/zhenwu/room/yard09":{"id":"/custom/zhenwu/room/yard09","file":"source/upstream/mudlib/custom/zhenwu/room/yard09.c","short":"校場","long":"東側校場靠近營牆，風從牆頭吹落，捲起細碎塵沙。幾處木樁上密布槍刺與刀劈的痕跡，場邊還留著拖動重物形成的深溝，是士卒鍛鍊體力與兵器技巧的地方。","exits":{"north":"/custom/zhenwu/room/yard06","south":"/custom/zhenwu/room/yard12","west":"/custom/zhenwu/room/yard08"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[1,1,0]},"/custom/zhenwu/room/yard10":{"id":"/custom/zhenwu/room/yard10","file":"source/upstream/mudlib/custom/zhenwu/room/yard10.c","short":"校場","long":"這片校場位在中軍一側，往西可通向棚場與軍營外圍。土地中央被無數雙軍靴踩得發亮，附近不時傳來整隊口令；在此停留片刻，便能看見軍士依照號令往各處操演。","exits":{"north":"/custom/zhenwu/room/yard07","south":"/custom/zhenwu/room/yard13","east":"/custom/zhenwu/room/yard11","west":"/custom/zhenwu/room/shed"},"objects":{"/custom/zhenwu/npc/lu_xinien":1,"/custom/zhenwu/obj/recruit_stone":1},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,2,0]},"/custom/zhenwu/room/yard11":{"id":"/custom/zhenwu/room/yard11","file":"source/upstream/mudlib/custom/zhenwu/room/yard11.c","short":"校場","long":"校場中段寬敞平坦，場邊豎著供士卒練習的木架，黃土地上交錯著腳印與兵器拖痕。南北兩側都還有操演場地，軍士往來頻繁，讓這裡始終保持著忙碌的氣氛。","exits":{"north":"/custom/zhenwu/room/yard08","south":"/custom/zhenwu/room/yard14","west":"/custom/zhenwu/room/yard10","east":"/custom/zhenwu/room/yard12"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,2,0]},"/custom/zhenwu/room/yard12":{"id":"/custom/zhenwu/room/yard12","file":"source/upstream/mudlib/custom/zhenwu/room/yard12.c","short":"校場","long":"軍營東南側的校場貼近營牆，幾面舊軍旗迎風拍響。操練留下的土坑已被反覆填平，木架旁散著斷裂的木片，顯示這裡長年承受高強度的軍事訓練。","exits":{"north":"/custom/zhenwu/room/yard09","west":"/custom/zhenwu/room/yard11"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[1,2,0]},"/custom/zhenwu/room/yard13":{"id":"/custom/zhenwu/room/yard13","file":"source/upstream/mudlib/custom/zhenwu/room/yard13.c","short":"校場","long":"這裡是校場南端，幾具粗重木樁立在黃土地上，樁身滿是刀砍槍刺留下的傷痕。新兵常在此練習出手與步法，久而久之連周圍泥土都被踩得緊實，幾乎看不見雜草。","exits":{"north":"/custom/zhenwu/room/yard10","east":"/custom/zhenwu/room/yard14"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,3,0]},"/custom/zhenwu/room/yard14":{"id":"/custom/zhenwu/room/yard14","file":"source/upstream/mudlib/custom/zhenwu/room/yard14.c","short":"校場","long":"南側另一片校場同樣擺著練兵木樁，地面散布細碎木屑與乾土。從這裡向北望去，層層校場一路延伸到大帳與軍營大門，整座振武軍營的規模一覽無遺。","exits":{"north":"/custom/zhenwu/room/yard11","west":"/custom/zhenwu/room/yard13"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,3,0]}},"areas":[{"key":"水嵐縣","name":"水嵐縣","rooms":["/d/swaylan/alley","/d/swaylan/bank","/d/swaylan/buxuan/cliff","/d/swaylan/buxuan/cliff_top","/d/swaylan/buxuan/field1","/d/swaylan/buxuan/field2","/d/swaylan/buxuan/gate","/d/swaylan/buxuan/hut","/d/swaylan/buxuan/mountain_path","/d/swaylan/buxuan/peak_foot","/d/swaylan/buxuan/pond","/d/swaylan/buxuan/residence","/d/swaylan/buxuan/slope","/d/swaylan/buxuan/steps1","/d/swaylan/buxuan/steps2","/d/swaylan/buxuan/terrace","/d/swaylan/chien_store","/d/swaylan/crossroad","/d/swaylan/dirt_road","/d/swaylan/east_gate","/d/swaylan/east_street1","/d/swaylan/east_street2","/d/swaylan/east_street3","/d/swaylan/escort_back","/d/swaylan/escort_gate","/d/swaylan/escort_hall","/d/swaylan/escort_side","/d/swaylan/escort_yard","/d/swaylan/ferry","/d/swaylan/forest_edge","/d/swaylan/gambling_house","/d/swaylan/hillside","/d/swaylan/inn","/d/swaylan/inn2","/ <script>
(function () {
  const D = JSON.parse(document.getElementById('catalog-data').textContent);
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plain = s => String(s || '').replace(/\x1b\[[0-9;]*m/g, '');

  // 把遊戲的 ANSI 色碼轉成 span
  function ansi(s) {
    s = String(s || '');
    let out = '', open = false;
    const re = /\x1b\[([0-9;]*)m/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      out += esc(s.slice(last, m.index));
      last = re.lastIndex;
      const codes = m[1].split(';').filter(Boolean).map(Number);
      if (open) { out += '</span>'; open = false; }
      const cls = codes.filter(c => c === 1 || (c >= 30 && c <= 37)).map(c => 'a' + c);
      if (cls.length && !(codes.length === 1 && codes[0] === 0)) { out += '<span class="' + cls.join(' ') + '">'; open = true; }
    }
    out += esc(s.slice(last));
    if (open) out += '</span>';
    return out;
  }

  // 索引：誰帶著這件裝備、放在哪些房間
  const holders = {};
  Object.values(D.npcs).forEach(n => (n.equip || []).forEach(e => { (holders[e.path] = holders[e.path] || []).push(n.id); }));
  const byId = {};
  D.weapons.forEach(w => byId[w.id] = { tab: 'weapons', it: w });
  D.armors.forEach(a => byId[a.id] = { tab: 'armors', it: a });
  D.items.forEach(i => byId[i.id] = { tab: 'items', it: i });
  const areaOfRoom = {};
  D.areas.forEach(a => a.rooms.forEach(r => areaOfRoom[r] = a.key));

  const TABS = [
    { key: 'skills', label: '技能', n: D.skills.length },
    { key: 'rules', label: '共同規則', n: D.rules.length },
    { key: 'weapons', label: '武器', n: D.weapons.length },
    { key: 'armors', label: '防具', n: D.armors.length },
    { key: 'items', label: '物品', n: D.items.length },
    { key: 'npcs', label: 'NPC', n: Object.keys(D.npcs).length },
    { key: 'areas', label: '區域', n: D.areas.length },
  ];
  const state = { tab: 'weapons', q: '', sub: {}, open: null, area: D.areas[0] && D.areas[0].key, room: null, hl: null };
  try { const t = localStorage.getItem('es2cat-tab'); if (t && TABS.some(x => x.key === t)) state.tab = t; } catch (e) {}
  const hash = location.hash.replace('#', '');
  if (TABS.some(x => x.key === hash)) state.tab = hash;

  const c = D.counts;
  $('#tally').textContent = `技能 ${c.skills}・武器 ${c.weapons}・防具 ${c.armors}・物品 ${c.items}・NPC ${c.npcs}・房間 ${c.rooms}`;

  function drawTabs() {
    $('#tabs').innerHTML = TABS.map(t => `<button role="tab" data-tab="${t.key}" aria-selected="${t.key === state.tab}">${t.label}</button>`).join('');
  }
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    go(b.dataset.tab);
  });
  function go(tab, opts) {
    state.tab = tab; state.open = null; state.q = '';
    Object.assign(state, opts || {});
    try { localStorage.setItem('es2cat-tab', tab); } catch (e) {}
    drawTabs(); render();
    if (state.open) {
      const el = document.querySelector(`[data-row="${CSS.escape(state.open)}"]`);
      if (el) el.scrollIntoView({ block: 'center' });
    } else window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- 共用
  function flagsHtml(flags) {
    return (flags || []).map(f => `<span class="tag ${f === '唯一' || f === '劇毒' || f === '特攻' ? 'seal' : f.startsWith('限') ? 'gold' : ''}">${esc(f)}</span>`).join('');
  }
  function traitText(list) { return (list || []).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join('、'); }
  function fileLine(file) {
    return file ? `<span class="file">${esc(file)}</span><button class="copy" data-copy="${esc(file)}">複製</button>` : '';
  }
  function whereHtml(id) {
    const hs = holders[id] || [];
    const rs = D.itemRooms[id] || [];
    const parts = [];
    if (hs.length) parts.push('持有者：' + hs.map(n => `<button class="linkish" data-npc="${esc(n)}">${ansi(D.npcs[n].name)}</button>`).join('、'));
    if (rs.length) parts.push('放置：' + rs.map(([r, n]) => roomLink(r) + (n > 1 ? ` ×${n}` : '')).join('、'));
    return parts.join('<br>') || '<span class="hint">目前沒有 NPC 攜帶或房間放置</span>';
  }
  function roomLink(r) {
    const room = D.rooms[r];
    return room ? `<button class="linkish" data-room="${esc(r)}">${esc(room.short)}</button><span class="hint">（${esc(areaOfRoom[r] || '')}）</span>` : esc(r);
  }
  function subChips(key, groups) {
    const cur = state.sub[key] || 'all';
    return `<div class="chips" role="group" aria-label="分類">` + groups.map(([k, label, n]) =>
      `<button class="chip" data-sub="${esc(k)}" aria-pressed="${cur === k}">${esc(label)}<span class="n">${n}</span></button>`).join('') + '</div>';
  }
  function matches(it, extra) {
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    return (plain(it.name) + ' ' + (it.ids || []).join(' ') + ' ' + (it.file || it.id || '') + ' ' + (extra || '')).toLowerCase().includes(q);
  }
  function listShell(tools, rows, hint) {
    return `<div class="tools"><input class="search" id="q" type="search" placeholder="搜尋名稱、英文代碼、特性或檔案" value="${esc(state.q)}" aria-label="搜尋">${tools || ''}</div>` +
      (hint ? `<p class="hint">${hint}</p>` : '') +
      `<div class="list">${rows.length ? rows.join('') : '<p class="empty">沒有符合的項目。換個關鍵字或分類試試。</p>'}</div>`;
  }
  function row(id, head, body) {
    const open = state.open === id;
    return `<div class="row${open ? ' open' : ''}" data-row="${esc(id)}"><button class="row-head" aria-expanded="${open}">${head}</button>${open ? `<div class="detail">${body()}</div>` : ''}</div>`;
  }

  // ---------------------------------------------------------------- 技能
  const SKILL_STATUS = {
    live: ['實裝', 'ok', '實裝在遊戲中：有 NPC、書籍或裝備用到，玩家拿得到。'],
    written: ['寫完未實裝', 'gold', '技能程式已寫完，但目前沒有 NPC、書籍或裝備把它交給玩家。'],
    name: ['僅有名字', '', '只登記了代碼與名稱，沒有技能程式。'],
  };
  function renderSkills() {
    const cnt = k => D.skills.filter(s => s.status === k).length;
    const groups = [['all', '全部', D.skills.length], ['live', '實裝', cnt('live')], ['written', '寫完未實裝', cnt('written')], ['name', '僅有名字', cnt('name')]];
    const cur = state.sub.skills || 'all';
    const rows = D.skills.filter(s => (cur === 'all' || cur === s.status) && matches({ name: s.name, ids: [s.code], file: s.file }, s.cat))
      .map(s => row(s.code,
        `<span class="nm">${esc(s.name)}<span class="en">${esc(s.code)}</span></span><span class="sum">${esc(s.cat || '')}${s.status !== 'name' ? '・精氣神：' + esc((s.gp || '無').slice(0, 24)) : ''}</span><span class="num"><span class="tag ${SKILL_STATUS[s.status][1]}">${SKILL_STATUS[s.status][0]}</span></span>`,
        () => `<dl class="kv"><dt>英文代碼</dt><dd><code>${esc(s.code)}</code></dd>` +
          `<dt>狀態</dt><dd>${esc(SKILL_STATUS[s.status][0])}：${esc(SKILL_STATUS[s.status][2])}</dd>` +
          (s.users && s.users.length ? `<dt>用到的檔案</dt><dd>${s.users.map(u => `<code>${esc(u)}</code>`).join('、')}${s.users.length >= 6 ? ' 等' : ''}</dd>` : '') +
          (s.cat ? `<dt>分類</dt><dd>${esc(s.cat)}</dd>` : '') +
          (s.desc ? `<dt>說明</dt><dd>${esc(s.desc)}</dd>` : '') +
          (s.status !== 'name' ? `<dt>精氣神</dt><dd>${esc(s.gp || '無')}</dd><dt>屬性</dt><dd>${esc(s.ga || '無')}</dd>` : '') +
          (s.file ? `<dt>檔案</dt><dd>${fileLine(s.file)}</dd>` : '') + `</dl>` +
          (s.detail ? `<div><h4 class="hint" style="margin:0 0 4px">技能細節</h4><pre class="code">${esc(s.detail)}</pre></div>` : '') +
          (s.formula ? `<div><h4 class="hint" style="margin:8px 0 4px">改了共同規則的地方與引擎參數</h4><pre class="code">${esc(s.formula)}</pre></div>` : '') +
          (!s.detail && !s.formula && s.status !== 'name' ? `<p class="hint" style="margin:0">沒有另外調整共同規則，升級見「共同規則」分頁；這項技能的細節尚未整理。</p>` : '') +
          (s.notes.length ? `<div><h4 class="hint" style="margin:8px 0 4px">程式註解（尚未整理）</h4><pre class="code">${esc(s.notes.join('\n\n'))}</pre></div>` : '')));
    return listShell(subChips('skills', groups), rows, '「實裝」是遊戲裡有 NPC、書籍或裝備用到的技能；「寫完未實裝」已有技能程式但還沒交給玩家；「僅有名字」只登記了代碼與名稱。每項技能只列自己的細節與改了共同規則的地方；每項技能都套用的升級、經驗值與戰鬥規則在「共同規則」分頁。');
  }

  // ---------------------------------------------------------------- 共同規則
  function renderRules() {
    const rows = D.rules.filter(r => matches({ name: r.title, ids: [], file: '' }, r.body))
      .map(r => row('rule:' + r.title, `<span class="nm">${esc(r.title)}</span>`, () => `<pre class="code">${esc(r.body)}</pre>`));
    return listShell('', rows, '每項技能都會套用的規則；各技能只在改了這些規則時才另外列出。內容來自 docs/catalog/巫師圖鑑_共同規則.md。');
  }

  // ---------------------------------------------------------------- 武器
  function renderWeapons() {
    const kinds = Object.keys(D.weaponKinds).filter(k => D.weapons.some(w => w.kind === k));
    const groups = [['all', '全部', D.weapons.length]].concat(kinds.map(k => [k, D.weaponKinds[k], D.weapons.filter(w => w.kind === k).length]));
    const cur = state.sub.weapons || 'all';
    const rows = D.weapons.filter(w => (cur === 'all' || w.kind === cur) && matches(w, Object.values(w.traits).flat().map(t => t[0]).join(' ') + ' ' + w.flags.join(' ')))
      .map(w => {
        const u = w.usages[0] || {};
        const sum = w.usages.map(x => `${x.skill} ${x.dmg || ''}`).join('・');
        return row(w.id,
          `<span class="nm">${ansi(w.name)}<span class="en">${esc(w.ids[0] || '')}</span>${flagsHtml(w.flags)}</span><span class="sum">${esc(sum)}${Object.keys(w.traits).length ? '・' + esc(traitText(Object.values(w.traits)[0])) : ''}</span><span class="num">${esc(w.value || '')}</span>`,
          () => weaponDetail(w));
      });
    return listShell(subChips('weapons', groups), rows);
  }
  function weaponDetail(w) {
    const tr = Object.entries(w.traits);
    return (w.long ? `<p class="long">${ansi(w.long)}</p>` : '') +
      `<div class="tbl-wrap"><table><thead><tr><th>可用技能</th><th>傷害</th><th>力量修正</th><th>乘數等級</th></tr></thead><tbody>` +
      w.usages.map(u => `<tr><td>${esc(u.skill)} <code>${esc(u.code)}</code></td><td class="v">${esc(u.dmg || '—')}</td><td class="v">${esc(u.bonus || '—')}</td><td class="v">${esc(u.mult || '—')}</td></tr>`).join('') +
      `</tbody></table></div>` +
      (tr.length ? `<div class="traits">${tr.map(([sk, l]) => `<div class="trait-group"><h4>武器特性・${esc(sk)}</h4><div class="tbl-wrap"><table><tbody>${l.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="v">${v > 0 ? '+' : ''}${v}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>` : '') +
      commonKv(w);
  }
  function commonKv(it) {
    return `<dl class="kv"><dt>英文名稱</dt><dd>${esc((it.ids || []).join('、') || '—')}</dd><dt>重量</dt><dd>${it.weight != null ? it.weight : '—'}</dd><dt>價值</dt><dd>${esc(it.value || '—')}</dd>` +
      (it.poison ? `<dt>劇毒</dt><dd><code>daemon/condition/${esc(it.poison)}.c</code></dd>` : '') +
      (it.verbs ? `<dt>指令</dt><dd>${it.verbs.map(v => `<code>${esc(v)}</code>`).join('、')}</dd>` : '') +
      (it.effects ? `<dt>效果</dt><dd>${esc(it.effects.join('、'))}</dd>` : '') +
      (it.study ? `<dt>研讀</dt><dd>${esc(it.study.map(([k, v]) => `${k} 最高 ${v}`).join('、'))}</dd>` : '') +
      `<dt>出處</dt><dd>${whereHtml(it.id)}</dd><dt>檔案</dt><dd>${fileLine(it.file)}</dd></dl>`;
  }

  // ---------------------------------------------------------------- 防具
  function renderArmors() {
    const slots = Object.keys(D.slots).filter(k => D.armors.some(a => a.slot === k));
    const groups = [['all', '全部', D.armors.length]].concat(slots.map(k => [k, D.slots[k], D.armors.filter(a => a.slot === k).length]));
    const cur = state.sub.armors || 'all';
    const rows = D.armors.filter(a => (cur === 'all' || a.slot === cur) && matches(a, Object.values(a.traits).flat().map(t => t[0]).join(' ') + ' ' + a.flags.join(' ')))
      .map(a => row(a.id,
        `<span class="nm">${ansi(a.name)}<span class="en">${esc(a.ids[0] || '')}</span>${flagsHtml(a.flags)}</span><span class="sum">${esc(D.slots[a.slot] || a.slot)}・${esc(traitText(Object.values(a.traits)[0]) || '沒有特性')}</span><span class="num">${esc(a.value || '')}</span>`,
        () => (a.long ? `<p class="long">${ansi(a.long)}</p>` : '') +
          `<div class="traits">${Object.entries(a.traits).map(([sl, l]) => `<div class="trait-group"><h4>護具特性・${esc(sl)}</h4><div class="tbl-wrap"><table><tbody>${l.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="v">${v > 0 ? '+' : ''}${v}</td></tr>`).join('')}</tbody></table></div></div>`).join('') || '<span class="hint">沒有護具特性</span>'}</div>` +
          commonKv(a)));
    return listShell(subChips('armors', groups), rows);
  }

  // ---------------------------------------------------------------- 物品
  function renderItems() {
    const cats = [...new Set(D.items.map(i => i.cat))];
    const groups = [['all', '全部', D.items.length]].concat(cats.map(k => [k, k, D.items.filter(i => i.cat === k).length]));
    const cur = state.sub.items || 'all';
    const rows = D.items.filter(i => (cur === 'all' || i.cat === cur) && matches(i, (i.effects || []).join(' ')))
      .map(i => row(i.id,
        `<span class="nm">${ansi(i.name)}<span class="en">${esc(i.ids[0] || '')}</span>${flagsHtml(i.flags)}</span><span class="sum">${esc(i.cat)}${i.effects ? '・' + esc(i.effects.join('、')) : ''}</span><span class="num">${esc(i.value || '')}</span>`,
        () => (i.long ? `<p class="long">${ansi(i.long)}</p>` : '') + commonKv(i)));
    return listShell(subChips('items', groups), rows);
  }

  // ---------------------------------------------------------------- NPC
  function npcAreas(n) { return [...new Set(n.rooms.map(([r]) => areaOfRoom[r]).filter(Boolean))]; }
  function renderNpcs() {
    const all = Object.values(D.npcs).sort((a, b) => (npcAreas(a)[0] || '\uffff').localeCompare(npcAreas(b)[0] || '\uffff') || (a.level || 0) - (b.level || 0));
    const keys = D.areas.map(a => a.key).filter(k => all.some(n => npcAreas(n).includes(k)));
    const none = all.filter(n => !npcAreas(n).length).length;
    const groups = [['all', '全部', all.length]].concat(keys.map(k => [k, k, all.filter(n => npcAreas(n).includes(k)).length]), none ? [['none', '未放置', none]] : []);
    const cur = state.sub.npcs || 'all';
    const rows = all.filter(n => (cur === 'all' || (cur === 'none' ? !npcAreas(n).length : npcAreas(n).includes(cur))) &&
        matches(n, [plain(n.title || ''), n.race, n.class, n.skills.map(s => s[0]).join(' ')].join(' ')))
      .map(n => row(n.id,
        `<span class="nm">${n.title ? `<span class="en" style="margin:0 6px 0 0">${ansi(n.title)}</span>` : ''}${ansi(n.name)}<span class="en">${esc((n.ids || [])[0] || '')}</span>${n.wander ? '<span class="tag">走動</span>' : ''}${n.ghost ? '<span class="tag">鬼魂</span>' : ''}</span>` +
        `<span class="sum">${esc(npcAreas(n).join('、') || '未放置')}${n.race || n.class ? '・' + esc([n.race, n.class].filter(Boolean).join('／')) : ''}${n.equip && n.equip.length ? '・裝備 ' + n.equip.length + ' 件' : ''}</span><span class="num">${n.level != null ? 'Lv ' + n.level : ''}</span>`,
        () => npcBody(n)));
    return listShell(subChips('npcs', groups), rows);
  }

  // ---------------------------------------------------------------- 區域
  const CW = 108, CH = 38, GX = 26, GY = 26;
  function renderAreas() {
    const area = D.areas.find(a => a.key === state.area) || D.areas[0];
    if (!area) return '<p class="empty">沒有區域資料。</p>';
    const chips = `<div class="chips" role="group" aria-label="區域">` + D.areas.map(a =>
      `<button class="chip" data-area="${esc(a.key)}" aria-pressed="${a.key === area.key}">${esc(a.name)}<span class="n">${a.rooms.length}</span></button>`).join('') + '</div>';
    const rooms = area.rooms.map(r => D.rooms[r]);
    // 依 z（上下樓層）分層繪製
    const layers = {};
    rooms.forEach(r => { const z = r.pos ? r.pos[2] : 0; (layers[z] = layers[z] || []).push(r); });
    const zs = Object.keys(layers).map(Number).sort((a, b) => b - a);
    const maps = zs.map(z => {
      const rs = layers[z];
      const names = [...new Set(rs.map(r => r.layer).filter(Boolean))];
      const xs = rs.map(r => r.pos[0]), ys = rs.map(r => r.pos[1]);
      const minx = Math.min(...xs), miny = Math.min(...ys);
      const W = (Math.max(...xs) - minx + 1) * (CW + GX) + GX, H = (Math.max(...ys) - miny + 1) * (CH + GY) + GY;
      const px = r => GX + (r.pos[0] - minx) * (CW + GX), py = r => GY + (r.pos[1] - miny) * (CH + GY);
      const inLayer = {};
      rs.forEach(r => inLayer[r.id] = r);
      let lines = '';
      const seen = new Set();
      // 用指令進出的路線畫虛線（例如 climb 圍牆）；只要一個方向要用指令就算
      rs.forEach(r => (r.special || []).forEach(m => {
        const o = inLayer[m.to];
        if (!o) return;
        const k = [r.id, m.to].sort().join('|');
        if (seen.has(k)) return;
        seen.add(k);
        const x1 = px(r) + CW / 2, y1 = py(r) + CH / 2, x2 = px(o) + CW / 2, y2 = py(o) + CH / 2;
        const tip = `<title>${esc(r.short)}：${esc(m.cmd)}</title>`;
        // 直線會穿過中間其他房間時改畫成弧線繞開，免得看起來像連到那一格
        const dxg = o.pos[0] - r.pos[0], dyg = o.pos[1] - r.pos[1], steps = Math.max(Math.abs(dxg), Math.abs(dyg));
        let blocked = false;
        if (steps > 1 && (dxg === 0 || dyg === 0 || Math.abs(dxg) === Math.abs(dyg)))
          for (let i = 1; i < steps; i++) {
            const gx = r.pos[0] + dxg / steps * i, gy = r.pos[1] + dyg / steps * i;
            if (rs.some(q => q.pos[0] === gx && q.pos[1] === gy)) blocked = true;
          }
        if (blocked) {
          const len = Math.hypot(x2 - x1, y2 - y1), off = CW * 1.3;
          const cx = (x1 + x2) / 2 + (-(y2 - y1) / len) * off, cy = (y1 + y2) / 2 + ((x2 - x1) / len) * off;
          lines += `<path class="cmd" d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}">${tip}</path>`;
        } else
          lines += `<line class="cmd" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${tip}</line>`;
      }));
      rs.forEach(r => Object.entries(r.exits).forEach(([d, t]) => {
        const o = inLayer[t];
        if (!o) return;
        const k = [r.id, t].sort().join('|');
        if (seen.has(k)) return;
        seen.add(k);
        lines += `<line x1="${px(r) + CW / 2}" y1="${py(r) + CH / 2}" x2="${px(o) + CW / 2}" y2="${py(o) + CH / 2}"/>`;
      }));
      const npcRoom = new Set();
      rs.forEach(r => Object.keys(r.objects).forEach(p => { if (D.npcs[p]) npcRoom.add(r.id); }));
      const cells = rs.map(r => {
        const ud = (r.exits.up ? '↑' : '') + (r.exits.down ? '↓' : '');
        const out = Object.values(r.exits).some(t => areaOfRoom[t] && areaOfRoom[t] !== area.key);
        const label = r.short.length > 7 ? r.short.slice(0, 7) + '…' : r.short;
        const cls = ['room', npcRoom.has(r.id) ? 'has-npc' : '', state.room === r.id ? 'sel' : '', state.hl && state.hl.includes(r.id) ? 'hl' : ''].join(' ');
        return `<g class="${cls}" data-room="${esc(r.id)}" tabindex="0" role="button" aria-label="${esc(r.short)}"><title>${esc(r.short)}</title><rect x="${px(r)}" y="${py(r)}" width="${CW}" height="${CH}"/>` +
          `<text x="${px(r) + CW / 2}" y="${py(r) + CH / 2 + 4}" text-anchor="middle">${esc(label)}</text>` +
          (npcRoom.has(r.id) ? `<circle class="dot" cx="${px(r) + 8}" cy="${py(r) + 8}" r="3"/>` : '') +
          (ud || out ? `<text class="ud" x="${px(r) + CW - 6}" y="${py(r) + 12}" text-anchor="end">${ud}${out ? '⇢' : ''}</text>` : '') + '</g>';
      }).join('');
      const title = zs.length > 1 || names.length ? `<div class="layer-title">${names.length ? esc(names.join('／')) : ''}${zs.length > 1 ? `（樓層 ${z >= 0 ? '+' : ''}${z}）` : ''}</div>` : '';
      return `${title}<div class="map-scroll"><svg class="map" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(area.name)} 地圖">${lines}${cells}</svg></div>`;
    }).join('');
    const legend = `<div class="map-legend"><span>● 有 NPC</span><span>↑↓ 上下樓</span><span>┅ 用指令進出（例如 climb 圍牆）</span><span>⇢ 通往其他區域</span><span>點房間看內容</span></div>`;
    const room = state.room && D.rooms[state.room] && areaOfRoom[state.room] === area.key ? D.rooms[state.room] : null;
    const roomPanel = room ? `<div class="panel"><h3>${esc(room.short)}</h3>` +
      (room.long ? `<p class="long" style="font-size:0.92rem">${ansi(room.long)}</p>` : '') +
      `<dl class="kv"><dt>出口</dt><dd>${Object.entries(room.exits).map(([d, t]) => `${esc(d)}：${roomLink(t)}`).join('<br>') || '—'}</dd>` +
      ((room.special || []).length ? `<dt>指令進出</dt><dd>${room.special.map(m => `<code>${esc(m.cmd)}</code>：${roomLink(m.to)}`).join('<br>')}</dd>` : '') +
      `<dt>NPC</dt><dd>${Object.entries(room.objects).filter(([p]) => D.npcs[p]).map(([p, n]) => `<button class="linkish" data-npc="${esc(p)}">${ansi(D.npcs[p].name)}</button>${n > 1 ? ' ×' + n : ''}`).join('、') || '—'}</dd>` +
      `<dt>物品</dt><dd>${Object.entries(room.objects).filter(([p]) => !D.npcs[p]).map(([p, n]) => (byId[p] ? `<button class="linkish" data-item="${esc(p)}">${ansi(byId[p].it.name)}</button>` : `<code>${esc(p)}</code>`) + (n > 1 ? ' ×' + n : '')).join('、') || '—'}</dd>` +
      `<dt>檔案</dt><dd>${fileLine(room.file)}</dd></dl></div>`
      : `<div class="panel"><h3>房間</h3><p class="hint" style="margin:0">點地圖上的房間，這裡會顯示敘述、出口、NPC 與物品。</p></div>`;
    const npcs = area.npcs.map(p => D.npcs[p]);
    const npcPanel = `<div class="panel"><h3>NPC</h3>${npcs.length ? `<div class="npc-list">${npcs.map(n => `<button class="chip" data-npc="${esc(n.id)}">${ansi(n.name)}</button>`).join('')}</div>` : '<p class="hint" style="margin:0">這個區域的房間沒有固定放置 NPC。</p>'}</div>`;
    const stats = `<div class="stats"><span>房間 ${area.rooms.length} 格</span><span>NPC ${area.npcs.length} 種</span><span>NPC 以出生房間標示；會走動的 NPC 標有「走動」</span></div>`;
    return `<div class="tools">${chips}</div>${stats}<div class="area-grid" style="margin-top:12px"><div class="map-box">${maps}${legend}</div><div class="side">${roomPanel}${npcPanel}</div></div>`;
  }

  // ---------------------------------------------------------------- NPC 視窗
  function openNpc(id) {
    const n = D.npcs[id];
    if (!n) return;
    const tags = [n.wander ? '走動' : '', n.ghost ? '鬼魂' : ''].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('');
    const o = $('#overlay');
    o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(plain(n.name))}">` +
      `<div class="dlg-head"><h2>${ansi(n.name)}${tags}</h2><button class="copy close" data-close>關閉</button></div><span class="hint">${esc((n.ids || []).join('、'))}</span>` +
      npcBody(n) + `</div>`;
    o.hidden = false;
    const b = o.querySelector('[data-close]');
    if (b) b.focus();
  }
  function npcBody(n) {
    const eq = (n.equip || []).map(e => {
      const x = byId[e.path];
      return `<tr><td>${x ? `<button class="linkish" data-item="${esc(e.path)}">${ansi(x.it.name)}</button>` : `<code>${esc(e.path)}</code>`}</td><td>${e.use === 'wield' ? '裝備武器' : e.use === 'wear' ? '穿戴' : '攜帶'}</td></tr>`;
    }).join('');
    const rooms = n.rooms.length ? n.rooms.map(([r, c]) => roomLink(r) + (c > 1 ? ` ×${c}` : '')).join('、') : '<span class="hint">沒有房間固定放置（由劇情或其他程式產生）</span>';
    return (n.long ? `<p class="long">${ansi(n.long)}</p>` : '') +
      `<dl class="kv">${n.title ? `<dt>稱號</dt><dd>${ansi(n.title)}</dd>` : ''}<dt>種族／職業</dt><dd>${esc([n.race, n.class].filter(Boolean).join('／') || '—')}</dd><dt>等級</dt><dd>${n.level != null ? n.level : '—'}</dd><dt>所在格子</dt><dd>${rooms}</dd><dt>檔案</dt><dd>${fileLine(n.file)}</dd></dl>` +
      `<div><h4 class="hint" style="margin:0 0 4px">裝備</h4>${eq ? `<div class="tbl-wrap"><table><tbody>${eq}</tbody></table></div>` : '<span class="hint">沒有裝備</span>'}</div>` +
      (n.skills.length ? `<div><h4 class="hint" style="margin:0 0 4px">技能</h4><div class="tbl-wrap"><table><tbody>${n.skills.map(([k, v, c]) => `<tr><td>${esc(k)} <code>${esc(c)}</code></td><td class="v">${v}</td></tr>`).join('')}</tbody></table></div></div>` : '');
  }
  function closeNpc() { $('#overlay').hidden = true; $('#overlay').innerHTML = ''; }
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay' || e.target.closest('[data-close]')) closeNpc(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeNpc(); });

  // ---------------------------------------------------------------- 事件
  function render() {
    const f = { skills: renderSkills, rules: renderRules, weapons: renderWeapons, armors: renderArmors, items: renderItems, npcs: renderNpcs, areas: renderAreas }[state.tab];
    const hadFocus = document.activeElement && document.activeElement.id === 'q';
    const pos = hadFocus ? document.activeElement.selectionStart : 0;
    $('#main').innerHTML = f();
    if (hadFocus && $('#q')) { $('#q').focus(); $('#q').setSelectionRange(pos, pos); }
  }
  // 注音等輸入法組字時不重繪，否則組字中的注音符號會被當成已輸入的字；組字完成再搜尋。
  function onSearch(e) { if (e.target.id !== 'q' || e.isComposing) return; state.q = e.target.value; state.open = null; render(); }
  document.addEventListener('input', onSearch);
  document.addEventListener('compositionend', onSearch);
  document.addEventListener('click', e => {
    const t = e.target;
    const copy = t.closest('[data-copy]');
    if (copy) {
      const txt = copy.dataset.copy;
      const done = () => { copy.textContent = '已複製'; setTimeout(() => copy.textContent = '複製', 1200); };
      try { navigator.clipboard.writeText(txt).then(done, () => {}); } catch (err) {}
      return;
    }
    const npc = t.closest('[data-npc]');
    if (npc) { openNpc(npc.dataset.npc); return; }
    const item = t.closest('[data-item]');
    if (item && byId[item.dataset.item]) {
      closeNpc();
      const x = byId[item.dataset.item];
      const sub = x.tab === 'weapons' ? { weapons: 'all' } : x.tab === 'armors' ? { armors: 'all' } : { items: 'all' };
      go(x.tab, { open: x.it.id, sub: Object.assign(state.sub, sub) });
      return;
    }
    const room = t.closest('[data-room]');
    if (room) {
      const rid = room.dataset.room;
      closeNpc();
      if (areaOfRoom[rid]) {
        state.area = areaOfRoom[rid]; state.room = rid; state.hl = null;
        if (state.tab !== 'areas') go('areas', { area: state.area, room: rid }); else render();
      }
      return;
    }
    const sub = t.closest('[data-sub]');
    if (sub) { state.sub[state.tab] = sub.dataset.sub; state.open = null; render(); return; }
    const area = t.closest('[data-area]');
    if (area) { state.area = area.dataset.area; state.room = null; state.hl = null; render(); return; }
    const head = t.closest('.row-head');
    if (head) {
      const id = head.parentElement.dataset.row;
      state.open = state.open === id ? null : id;
      render();
      const el = document.querySelector(`[data-row="${CSS.escape(id)}"] .row-head`);
      if (el) el.focus({ preventScroll: true });
    }
  });
  document.addEventListener('keydown', e => {
    const g = e.target.closest && e.target.closest('g[data-room]');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });

  // 搜尋列固定在頁首下方：依頁首實際高度設定位置
  const hdr = document.querySelector('header.top');
  const setHdr = () => document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px');
  setHdr();
  if (window.ResizeObserver) new ResizeObserver(setHdr).observe(hdr); else window.addEventListener('resize', setHdr);

  drawTabs();
  render();
})();
</script>
