nit":null,"flags":["限平民"],"race":"malik","class":"taoist","level":40,"gender":"male","title":"幻霧觀觀主","equip":[{"path":"/d/npc/obj/green_robe","use":"wear"},{"path":"/d/npc/obj/peachwood_sword","use":"wield"},{"path":"/d/npc/obj/han_jade_ring","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/inn","1     // 幻霧觀觀主（使用者指示，2026-10-25）"]]},"/custom/legacy_npc/evil_spirit_of_storm":{"id":"/custom/legacy_npc/evil_spirit_of_storm","file":"source/upstream/mudlib/custom/legacy_npc/evil_spirit_of_storm.c","name":"墮落的風神","ids":["evil spirit of storm","evil","storm"],"long":"墮落的風神看起來沒有什麼特別。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":70,"gender":"female","title":null,"equip":[{"path":"/custom/weapon/sword/storm_lords_feather","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ghost_lord":{"id":"/custom/legacy_npc/ghost_lord","file":"source/upstream/mudlib/custom/legacy_npc/ghost_lord.c","name":"噬魂","ids":["ghost lord","ghost","lord"],"long":"噬魂，嗜吃魂，原是鬼王「顝蛪」一員魔將，論能力比十二鬼將更為強\n悍。但當鬼王「顝蛪」被封，噬魂異心即起！自立為鬼王，四處吞噬靈\n魂已增其法力。在一次跟地府鬼將的戰鬥中，戰敗被擒，給困在地獄十\n八層盡受苦刑。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":35,"gender":"male","title":"鬼王","equip":[{"path":"/custom/weapon/axe/eight_ghost_axe","use":"wield"},{"path":"/d/npc/obj/blood_stained_cloth","use":"wear"},{"path":"/custom/armor/armor/soul_lapis_lazuli_plate","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ghost_yaksa":{"id":"/custom/legacy_npc/ghost_yaksa","file":"source/upstream/mudlib/custom/legacy_npc/ghost_yaksa.c","name":"鬼夜叉","ids":["ghost yaksa","ghost","yaksa"],"long":"最低級的惡魔戰士﹐主要的任務是保衛夜神殿的安全。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/blade/colosus_blade","use":"wield"},{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/d/snowkeep/npc/obj/bamboo_legs","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/baobao/npc/gong_sun_wei":{"id":"/d/baobao/npc/gong_sun_wei","file":"source/upstream/mudlib/d/baobao/npc/gong_sun_wei.c","name":"公孫微","ids":["gong-sun wei","gong-sun","wei"],"long":"此人長得又高又瘦，皮包著骨頭，好象僵屍一樣。一雙小眼睛炯炯有神，正貪\n婪的盯著你看。","weight":null,"value":null,"unit":null,"flags":[],"race":"jiaojao","class":"thief","level":45,"gender":"male","title":null,"equip":[{"path":"/d/baobao/npc/obj/dark_boots","use":"wear"},{"path":"/d/baobao/npc/obj/dark_bracers","use":"wear"},{"path":"/d/npc/obj/black_iron_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baobao/ghost_realm",1]]},"/d/baihua/npc/gong_sun_zhi":{"id":"/d/baihua/npc/gong_sun_zhi","file":"source/upstream/mudlib/d/baihua/npc/gong_sun_zhi.c","name":"公孫志","ids":["gong-sun zhi","gong-sun","zhi"],"long":"公孫志是一個在江湖上沒甚麼名氣的老道。這並不是因為他的法力\n不及他人，而是由於他太過醉心與詩詞歌賦，以至於無瑕顧及江湖\n中的是是非非。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":20,"gender":"male","title":"靈雲觀道士","equip":[{"path":"/d/baihua/npc/obj/straw_boots","use":"wear"},{"path":"/d/npc/obj/hemp_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/inn",1]]},"/custom/legacy_npc/guard":{"id":"/custom/legacy_npc/guard","file":"source/upstream/mudlib/custom/legacy_npc/guard.c","name":"衛兵","ids":["guard"],"long":"他是看守軍情庫的衛兵，從他身上的裝備以及眼睛裡不時流露出\n的精芒看來，你還是不要隨便惹他的好。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"soldier","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/feet/buskins","use":"wear"},{"path":"/d/npc/obj/iron_girth","use":"wear"},{"path":"/custom/weapon/pike/huge_halberd","use":"wield"},{"path":"/d/npc/obj/iron_helmet","use":"wear"},{"path":"/d/swaylan/npc/obj/ring_mail","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/guard_of_hell":{"id":"/custom/legacy_npc/guard_of_hell","file":"source/upstream/mudlib/custom/legacy_npc/guard_of_hell.c","name":"土伯","ids":["guard of hell","guard","hell"],"long":"身高三十丈的黑色巨人﹐頭生雙角﹐腹成牛腹狀。相傳﹐土伯是幽都的\n守門者﹐終日驅趕百鬼﹐性情殘暴。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/whip/war_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/han_jiang_hong":{"id":"/custom/legacy_npc/han_jiang_hong","file":"source/upstream/mudlib/custom/legacy_npc/han_jiang_hong.c","name":"韓江洪","ids":["han jiang hong","han","hong"],"long":"你面前的這位精神不振，一身是病的老者就是史部尚書韓江洪了，他不\n僅通曉天文地理，正史野傳，而且他的書法字畫也都是當今一絕，可謂\n是千金難求。近年來他的身體每況日下，若不是聖上屢次挽留，他可能\n早就告老還鄉，過著逗鵝戲竹的生活啦。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":20,"gender":"male","title":"史部尚書","equip":[{"path":"/d/wutang/npc/obj/jeweled_shortsword","use":"wield"},{"path":"/custom/weapon/sword/jade_sword","use":"wield"},{"path":"/d/lee/npc/obj/crystal_ring","use":"wear"},{"path":"/d/swaylan/buxuan/npc/obj/snakeskin_boots","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"},{"path":"/custom/armor/head/jade_hat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/han_long":{"id":"/custom/legacy_npc/han_long","file":"source/upstream/mudlib/custom/legacy_npc/han_long.c","name":"韓龍","ids":["han long","han","long"],"long":"韓龍四十二歲當上白虎堂知事，掌管各種情報的蒐集與分析。他\n也建立了一個龐大的情報網，把江湖中人每天所有大小事通通納\n入白虎堂的蒐集範圍。讓許多有意為惡的門派不敢輕舉妄動。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"虎刀門知事","equip":[{"path":"/custom/weapon/axe/axe_of_bloodmoon","use":"wield"},{"path":"/custom/armor/head/jade_hat","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/qiaoyin/npc/han_wen_suei":{"id":"/d/qiaoyin/npc/han_wen_suei","file":"source/upstream/mudlib/d/qiaoyin/npc/han_wen_suei.c","name":"韓文緒","ids":["han wen-suei","han","wen-suei"],"long":"韓文緒是喬陰縣城的都護衛，負責喬陰縣的軍務工作，他的武藝雖然還\n稱不上一流高手，但是家傳的韓家槍法倒也已有八九分火候，在江湖上\n頗有些名頭。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"soldier","level":30,"gender":"male","title":"喬陰縣督護衛","equip":[{"path":"/d/npc/obj/clothboot","use":"wear"},{"path":"/d/qiaoyin/npc/obj/cyan_cloth","use":"wear"},{"path":"/d/qiaoyin/npc/obj/thunder_pike","use":"wield"},{"path":"/d/qiaoyin/npc/obj/battle_helm","use":"wear"},{"path":"/d/qiaoyin/npc/obj/battle_armor","use":"wear"},{"path":"/obj/cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/wgate",1]]},"/custom/legacy_npc/han_xiao":{"id":"/custom/legacy_npc/han_xiao","file":"source/upstream/mudlib/custom/legacy_npc/han_xiao.c","name":"韓笑","ids":["han xiao","han","xiao"],"long":"韓笑自幼極具習武天賦而且練功也很勤，所以在二十多歲時就已是名震武\n林的好手。虎刀門前掌門去世時不顧眾人反對，毅然將掌門之位傳給了當\n時只有二十八歲的韓笑，此事在武林之上也引起不小的震動。如今韓笑的\n內功刀法比起六年前更為精純，成為武林之中公認的最年輕的武學大師。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":60,"gender":"female","title":"虎刀門掌門","equip":[{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/custom/armor/finger/bloodjade_ring","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/armor/cloth/tigerish_robe","use":"wear"},{"path":"/custom/armor/neck/tiger_necklace","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/hell_soldier":{"id":"/custom/legacy_npc/hell_soldier","file":"source/upstream/mudlib/custom/legacy_npc/hell_soldier.c","name":"地府鬼卒","ids":["hell soldier","hell","soldier"],"long":"一個青面獠牙的鬼卒﹐雙眼大如銅鈴﹐身上穿著有如陽間官兵的衣服。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":null,"equip":[{"path":"/custom/armor/armor/iron_torso","use":"wear"},{"path":"/custom/weapon/pike/iron_fork","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/qiaoyin/npc/hsiao_lang_sheng":{"id":"/d/qiaoyin/npc/hsiao_lang_sheng","file":"source/upstream/mudlib/d/qiaoyin/npc/hsiao_lang_sheng.c","name":"蕭朗生","ids":["hsiao lang-sheng","hsiao","lang-sheng"],"long":"蕭朗生是天邪國小有名氣的劍客﹐一手追魂劍法輕靈狠辣﹐算得是武林\n中一個人物﹐但是自從半年前在一次仇家的突襲中失去了妻子﹐就變得\n性情十分乖戾﹐和從前判若兩人﹐如果你不想惹禍上身的話﹐最好離他\n遠一點。\n——\n蕭朗生是天邪國小有名氣的劍客﹐一手平波劍法輕靈狠辣﹐算得是武林\n中一個人物﹐但是自從半年前在一次仇家的突襲中失去了妻子﹐就變得\n性情十分乖戾﹐和從前判若兩人﹐如果你不想惹禍上身的話﹐最好離他\n遠一點。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":50,"gender":"male","title":null,"equip":[{"path":"/d/qiaoyin/npc/obj/white_helmet","use":"wear"},{"path":"/d/qiaoyin/npc/obj/snake_bracers","use":"wear"},{"path":"/d/npc/obj/padded_armor","use":"wear"},{"path":"/d/qiaoyin/npc/obj/sword_of_black_justice","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/pawnshop",1]]},"/d/snowkeep/npc/hsu_yen_chih":{"id":"/d/snowkeep/npc/hsu_yen_chih","file":"source/upstream/mudlib/d/snowkeep/npc/hsu_yen_chih.c","name":"許彥之","ids":["hsu yen-chih","hsu","yen-chih"],"long":"許彥之是季縣虎刀門的弟子﹐虎刀門以善使刀聞名﹐這次來到雪\n吟山莊﹐倒不是為了參加英雄大會﹐而是想來打探一下消失了多\n年的軒轅龍骨刀是否真的被藏在了雪吟山莊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/leather_boot","use":"wear"},{"path":"/d/npc/obj/lion_belt","use":"wear"},{"path":"/d/snowkeep/npc/obj/heart_armor","use":"wear"},{"path":"/obj/area/obj/kris","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/snowkeep/yard_e",1]]},"/d/mengjia/npc/hua_xing":{"id":"/d/mengjia/npc/hua_xing","file":"source/upstream/mudlib/d/mengjia/npc/hua_xing.c","name":"花興","ids":["hua xing","hua","xing"],"long":"江湖中有名的採花大盜，凡是被他遇到的稍有姿色的女子，無一倖免，均是\n先奸後殺，武林中人全都對他恨之入骨，只是他輕功甚高，多次死裏逃生後\n便沒了消息，不知為何來孟家莊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":30,"gender":"male","title":null,"equip":[{"path":"/d/mengjia/npc/obj/butterfly_stiletto","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/mengjia/passage",1]]},"/custom/legacy_npc/huang":{"id":"/custom/legacy_npc/huang","file":"source/upstream/mudlib/custom/legacy_npc/huang.c","name":"黃十四娘","ids":["huang"],"long":"一個膚色黝黑的女子，年紀似乎不到三十，但是卻滿頭白髮。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":40,"gender":"female","title":"隱教殺手","equip":[{"path":"/custom/armor/feet/soft_leather_boots","use":"wear"},{"path":"/custom/armor/armor/shapeless_heartguard","use":"wear"},{"path":"/custom/armor/cloth/black_robe","use":"wear"},{"path":"/custom/weapon/dagger/dire_spike","use":"wield"},{"path":"/custom/armor/neck/dark_necklace","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/swaylan/npc/huang_tien_ba":{"id":"/d/swaylan/npc/huang_tien_ba","file":"source/upstream/mudlib/d/swaylan/npc/huang_tien_ba.c","name":"黃天霸","ids":["huang tien-ba","huang","tien-ba"],"long":"黃天霸是江南有名的鏢頭，保過很多趟大鏢，從來沒有出過什麼岔子。一手\n七七四十九路霸王刀招獨豎一格，人家都尊稱他為【霸王刀】，平時為人非\n常豪爽，有困難的話可以來他這，他會盡力去幫你解決。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"黃家鏢局總鏢頭","equip":[{"path":"/d/swaylan/npc/obj/golden_ring","use":"wear"},{"path":"/d/swaylan/npc/obj/studded_armor","use":"wear"},{"path":"/d/npc/obj/golden_feather_helm","use":"wear"},{"path":"/d/npc/obj/golden_robe","use":"wear"},{"path":"/d/swaylan/npc/obj/blade_of_nine_rings","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/swaylan/escort_hall",1]]},"/custom/legacy_npc/island_master":{"id":"/custom/legacy_npc/island_master","file":"source/upstream/mudlib/custom/legacy_npc/island_master.c","name":"邯逸山","ids":["island master","island","master"],"long":"你眼前這位正是當初名震江湖劍斬神猿的陷空島島主, 他正對你微笑著!","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":"陷空島島主","equip":[{"path":"/d/npc/obj/flying_boots","use":"wear"},{"path":"/d/wutang/npc/obj/blue_cloth","use":"wear"},{"path":"/custom/armor/armor/monkey_armor","use":"wear"},{"path":"/custom/weapon/sword/white_dragon_fang","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/jen_commando":{"id":"/custom/legacy_npc/jen_commando","file":"source/upstream/mudlib/custom/legacy_npc/jen_commando.c","name":"任常恩","ids":["jen commando","jen","commando"],"long":"任常恩是振武軍營的校尉，這次因為青邪宮聚集了許多江湖武人朝廷擔心發\n生事故，因此命他選派幾名好手前來，表面上是朝廷重視這次聚會，但是所\n有與會的人都知道他是朝廷暗中監視此間武人的密使。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":"振武軍營校尉","equip":[{"path":"/custom/weapon/blade/snow_blade","use":"wield"},{"path":"/d/npc/obj/ring_of_mighty_lord","use":"wear"},{"path":"/d/baobao/npc/obj/royal_helmet","use":"wear"},{"path":"/custom/armor/armor/iron_armor","use":"wear"},{"path":"/d/qiaoyin/npc/obj/cyan_cloth","use":"wear"},{"path":"/d/baobao/npc/obj/steel_bracers","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/jia_qiu_yu":{"id":"/custom/legacy_npc/jia_qiu_yu","file":"source/upstream/mudlib/custom/legacy_npc/jia_qiu_yu.c","name":"賈秋雨","ids":["jia qiu yu","jia","yu"],"long":"他是一位方臉大耳﹐濃眉高顴的俊挺少年﹐年紀大約十七八歲﹐一身白\n綃般的素淨長袍衣帶飛揚﹐背懸六尺長劍﹐腰繫翡翠白玉佩﹐風度翩翩\n﹐有如玉樹臨風。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":10,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/jing_yu_tao":{"id":"/custom/legacy_npc/jing_yu_tao","file":"source/upstream/mudlib/custom/legacy_npc/jing_yu_tao.c","name":"景愈濤","ids":["jing yu tao","jing","tao"],"long":"景愈濤，一個頻繁出現在武林傳奇中的人物。三十年前大破冷梅劍嵐\n若刀，二十年前與柳東蘆論劍靈狐頂，十余年前獨闖青邪尋殘蟻 ...\n你萬萬想不到的是，他竟然是五堂鎮望族景家的三公子，雖然已入中\n年但是其瀟灑的舉止，讓人迷戀的風度仍是不減當年。據說，冷梅莊\n莊主梅影風的夫人是他的義妹，而他當年也正是為了他妹妹才在梅影\n風和葉風兩人面前一顯身手。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":70,"gender":"male","title":"古劍門掌門","equip":[{"path":"/d/swaylan/lunmay/npc/obj/white_ring","use":"wear"},{"path":"/d/qiaoyin_east/npc/obj/boots_of_cleanse","use":"wear"},{"path":"/custom/armor/cloth/silver_cloth","use":"wear"},{"path":"/d/swaylan/lunmay/npc/obj/silver_girth","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/weapon/sword/flurry_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/swaylan/npc/kao_fon":{"id":"/d/swaylan/npc/kao_fon","file":"source/upstream/mudlib/d/swaylan/npc/kao_fon.c","name":"高風","ids":["kao fon","kao","fon"],"long":"高風乃是百花村的一位高手，因為其功夫高強，被黃天霸延攬為鏢頭，他一手\n槍法耍得虎虎生風，令綠林大盜聞風喪膽。他還可以負責幫忙打聽江湖人物的\n下落，只是可信度嘛 ... 嘿嘿嘿。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":20,"gender":"male","title":"黃家鏢局鏢頭","equip":[{"path":"/d/swaylan/npc/obj/tiger_pike","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/swaylan/escort_side",1]]},"/d/snowkeep/npc/ku_wu_wang":{"id":"/d/snowkeep/npc/ku_wu_wang","file":"source/upstream/mudlib/d/snowkeep/npc/ku_wu_wang.c","name":"哭無望","ids":["ku wu wang","ku","wang"],"long":"這位滿臉堆笑的肥胖男子就是哭笑門門主劉乙忘玄最得意的兩名弟子中的一\n位，江湖人稱「哭無望」。至於他的本名自從入哭笑門那日起，就不再曾用\n過。數年前，劉乙忘玄出關重掌哭笑門，青邪大會之後，江湖之中對其刀法\n頗多猜忌。也許是為了可以和更多武林名門建立關係，哭無望這次奉劉乙忘\n玄之命來到雪吟莊。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"fighter","level":40,"gender":"male","title":"哭笑門左使","equip":[{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/d/snowkeep/npc/obj/worn_robe","use":"wear"},{"path":"/d/snowkeep/npc/obj/change_cane","use":"wield"},{"path":"/d/snowkeep/npc/obj/silance_rosary","use":"wear"},{"path":"/d/npc/obj/black_doli","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/snowkeep/east_room",1]]},"/d/graveyard/npc/lady":{"id":"/d/graveyard/npc/lady","file":"source/upstream/mudlib/d/graveyard/npc/lady.c","name":"青衣女郎","ids":["lady"],"long":"一個二十多歲出頭的青衣女郎﹐容貌 ... 你覺得好像在哪裡看過她 ...","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":5,"gender":"female","title":null,"equip":[{"path":"/obj/area/obj/dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/graveyard/grave5",1]]},"/d/qiaoyin_east/npc/lay_ton":{"id":"/d/qiaoyin_east/npc/lay_ton","file":"source/upstream/mudlib/d/qiaoyin_east/npc/lay_ton.c","name":"雷同","ids":["lay ton","lay","ton"],"long":"雷同乃是斐縣人氏, 曾在武道通門下學了幾年的灸術, 從小好\n四處旅居增廣見識, 不耐習灸之枯燥乏味, 在灸術有些許火候\n之後便四處流浪, 近日才又回到故鄉。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/d/qiaoyin_east/npc/obj/shadow_dagger","use":"wield"},{"path":"/d/qiaoyin_east/npc/obj/iron_needle","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin_east/sutra_hall",1]]},"/custom/legacy_npc/lee_fong_chen":{"id":"/custom/legacy_npc/lee_fong_chen","file":"source/upstream/mudlib/custom/legacy_npc/lee_fong_chen.c","name":"李瘋塵","ids":["lee fong chen","lee","chen"],"long":"李瘋塵看起來相當強壯，一身黑色裝扮，腰上繫著一把長約三尺，形\n狀類似蟬翼的刀刃。也許他就是十年前江湖中那位殺人不眨眼的蟬翼\n刀客。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/blade/wing_blade","use":"wield"},{"path":"/custom/armor/armor/raw_iron_armor","use":"wear"},{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/custom/armor/hand/black_gauntlets","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lee_fong_hwa":{"id":"/custom/legacy_npc/lee_fong_hwa","file":"source/upstream/mudlib/custom/legacy_npc/lee_fong_hwa.c","name":"利丰華","ids":["lee fong-hwa","lee","fong-hwa"],"long":"一個容色十分美艷的女子，身形婀娜，臉上帶著淺淺的微笑。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"thief","level":50,"gender":"female","title":"隱教聖女","equip":[{"path":"/d/npc/obj/silk_cloth","use":"wear"},{"path":"/d/swaylan/lunmay/npc/obj/silver_girth","use":"wear"},{"path":"/custom/armor/hand/silk_gloves","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/d/swaylan/lunmay/npc/obj/white_ring","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lee_hon_yun":{"id":"/custom/legacy_npc/lee_hon_yun","file":"source/upstream/mudlib/custom/legacy_npc/lee_hon_yun.c","name":"李洪雲","ids":["lee hon_yun","lee","hon_yun"],"long":"李洪雲是山寨的總管, 許多大大小小的事都必須經過他的允許, 他長得\n眉清目秀, 讓人覺得毫無防備之心, 但是他性情卻相當兇殘, 每次掠奪\n時絕對不留活口 。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"黑風山總管","equip":[{"path":"/custom/weapon/sword/snake_sword","use":"wield"},{"path":"/custom/armor/hand/black_gauntlets","use":"wear"},{"path":"/custom/armor/armor/iron_armor","use":"wear"},{"path":"/d/npc/obj/iron_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/legacy_npc":{"id":"/custom/legacy_npc/legacy_npc","file":"source/upstream/mudlib/custom/legacy_npc/legacy_npc.c","name":"legacy_npc","ids":[],"long":"","weight":null,"value":null,"unit":null,"flags":[],"race":null,"class":null,"level":null,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/leng_yin_yue":{"id":"/custom/legacy_npc/leng_yin_yue","file":"source/upstream/mudlib/custom/legacy_npc/leng_yin_yue.c","name":"冷吟月","ids":["leng yin yue","leng","yue"],"long":"在你眼前的是一位窈窕的清秀佳人，她瓜子般的精緻臉龐略顯蒼白，黑\n白分明的雙眸難掩驚慌的神情。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"female","title":"冷府千金","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/fengcheng/npc/li_ru":{"id":"/d/fengcheng/npc/li_ru","file":"source/upstream/mudlib/d/fengcheng/npc/li_ru.c","name":"李儒","ids":["li ru","li","ru"],"long":"李儒乃是當地的名士，雖然曾是縣官，可是卻結識了不少江\n湖中人。相傳他的輕功獨步江湖，只可惜歲月不饒人，人到\n晚年身子是一天不如一天了。兩年前辭官回家養病。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":20,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/black_doli","use":"wear"},{"path":"/d/fengcheng/npc/obj/steel_longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/li_house",1]]},"/custom/legacy_npc/lieutenant":{"id":"/custom/legacy_npc/lieutenant","file":"source/upstream/mudlib/custom/legacy_npc/lieutenant.c","name":"武官","ids":["lieutenant"],"long":"這是一名指揮官兵的武官﹐他們通常是軍人中出類拔萃的佼佼者。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/bastardsword","use":"wield"},{"path":"/d/npc/obj/clothboot","use":"wear"},{"path":"/d/npc/obj/helmet","use":"wear"},{"path":"/d/qiaoyin/npc/obj/cyan_cloth","use":"wear"},{"path":"/d/npc/obj/iron_girth","use":"wear"},{"path":"/d/npc/obj/ring_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/ziyan/npc/lin_yu_lun":{"id":"/d/ziyan/npc/lin_yu_lun","file":"source/upstream/mudlib/d/ziyan/npc/lin_yu_lun.c","name":"林育崙","ids":["lin yu lun","lin","lun"],"long":"酉縣的總捕頭「林育崙」, 據說他曾經是某個著名山寨的大頭目, 後\n後來歸順了朝廷, 於是朝廷便封了他這總捕頭的職位, 不過由於他是\n綠林出身, 再加上辦案的態度十分強硬, 所以大家對他都是盡量迴避\n, 不與他有任何衝突, 以免惹禍上身.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"酉縣總捕頭","equip":[{"path":"/d/ziyan/npc/obj/steel_chain_armor","use":"wear"},{"path":"/d/ziyan/npc/obj/silkworm_tunic","use":"wear"},{"path":"/d/ziyan/npc/obj/iron_rosary","use":"wear"},{"path":"/d/ziyan/npc/obj/moon_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/ziyan/jail",1]]},"/custom/legacy_npc/ling_yue_heng":{"id":"/custom/legacy_npc/ling_yue_heng","file":"source/upstream/mudlib/custom/legacy_npc/ling_yue_heng.c","name":"凌月蘅","ids":["ling yue heng","ling","heng"],"long":"銅鏡前正在梳髮的女子，妝雖清雅，然而依舊能讓你有驚為天人\n的氣質。黑亮長髮垂至腰擺，細白的肌膚微透著紅暈。像極了古\n畫中讚歎不已的蘇州美人。別見她柔若無骨的姿態，她也是自幼\n跟從其父凌承軒習武的，一身武藝毫不遜色。從銅鏡看她，眼神\n若有所思的停佇在手中的那隻簪，大概是想念她的夫君蔚楓吧。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"female","title":"武學才女","equip":[{"path":"/custom/weapon/dagger/wolf_dagger","use":"wield"},{"path":"/custom/weapon/dagger/beauty_dagger","use":"wield"},{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/custom/armor/armor/light_plate","use":"wear"},{"path":"/d/npc/obj/white_dress","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ling_yun_yu":{"id":"/custom/legacy_npc/ling_yun_yu","file":"source/upstream/mudlib/custom/legacy_npc/ling_yun_yu.c","name":"淩筠語","ids":["ling yun-yu","ling","yun-yu"],"long":"她穿著一身藍，衣物上還有玫瑰的\n刺繡。她的臉透出淡淡的紅潤，\n那只有到到肩膀的短髮也有著淡淡的紅棕色。她曾經是位傑出的藥\n師，可是卻一直醫不好母親的怪病，說也奇怪，他母親當初從森林\n裡回來後的隔天身上就發出黑斑，在森林裡沒受傷也沒吃過不知名\n草藥，過了一週便去世了。此後便前往天朝學習各種藥品，曾跟著\n聶晟學習過。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":"female","title":null,"equip":[{"path":"/d/baihua/npc/obj/shennong_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_feng":{"id":"/custom/legacy_npc/liu_feng","file":"source/upstream/mudlib/custom/legacy_npc/liu_feng.c","name":"柳風","ids":["liu feng","liu","feng"],"long":"柳風是來自西部的幻霧觀道士，據說，他此番跟隨師父來到天朝是\n奉了巫首王的特命，也難怪他對天朝的書籍會感興趣。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":20,"gender":"male","title":"幻霧觀道士","equip":[{"path":"/d/npc/obj/peachwood_sword","use":"wield"},{"path":"/d/npc/obj/copper_hat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_kei":{"id":"/custom/legacy_npc/liu_kei","file":"source/upstream/mudlib/custom/legacy_npc/liu_kei.c","name":"劉開","ids":["liu kei","liu","kei"],"long":"劉開是檒城衛兵統領, 生性忌惡如仇, 他層經捉拿過無數的壞人,也立\n下過不少的戰功.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"檒城衛兵統領","equip":[{"path":"/custom/weapon/pike/solar_pike","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_ko":{"id":"/custom/legacy_npc/liu_ko","file":"source/upstream/mudlib/custom/legacy_npc/liu_ko.c","name":"劉可","ids":["liu ko","liu","ko"],"long":"你面前的這個中年男子只是哭笑門的一個管事，奉命將這裡改造成一間倉庫。\n他身後鼓鼓囊囊的袋子里也許有什麼好東西也不一定。你可以用 list 列出可\n以買哪些裝備﹐用 buy 跟他買。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_shang_min":{"id":"/custom/legacy_npc/liu_shang_min","file":"source/upstream/mudlib/custom/legacy_npc/liu_shang_min.c","name":"劉尚民","ids":["liu shang min","liu","min"],"long":"一位年約二十的魁武青年﹐高顴短髮蓄鬍﹐雙眼圓猙如銅鈴﹐身著黃麻\n短掛鹿皮靴。手上一根齊眉長棍撈在肩背正不時低聲嘆息著。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":10,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/d/baihua/npc/obj/straw_boots","use":"wear"},{"path":"/d/lee/npc/obj/brow_staff","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/kangping/npc/liuh_chuen_fon":{"id":"/d/kangping/npc/liuh_chuen_fon","file":"source/upstream/mudlib/d/kangping/npc/liuh_chuen_fon.c","name":"柳淳風","ids":["liuh chuen-fon","liuh","chuen-fon"],"long":"柳淳風是前武林盟主─封山劍派掌門柳東蘆的長子，同時也是封山劍派的\n大弟子，柳淳風近年來武功、聲望都漸漸在武林中嶄露頭角，和他的弟弟\n柳新雨合稱「風雨雙劍」，但是因為他們為人正派，行俠仗義，所以大家\n都尊稱這兩個人為「風雨雙俠」。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/obj/area/obj/broadsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/inn",1]]},"/d/qiaoyin/npc/liuh_don_lu":{"id":"/d/qiaoyin/npc/liuh_don_lu","file":"source/upstream/mudlib/d/qiaoyin/npc/liuh_don_lu.c","name":"柳東蘆","ids":["liuh don-lu","liuh","don-lu"],"long":"柳東蘆是赫赫有名的封山劍派掌門人，封山劍派原本只以劍法見長，但是柳東\n蘆近幾年以家傳拳法融合封山劍法劍意，彌補了封山劍法中的許多缺點，四年\n前的武林大會便技壓群雄奪得武林盟主的寶座，但是他當武林盟主不到半年便\n宣佈退隱，據說是因為身染絕症之故，不過在你面前的這位年約五、六十歲的\n白髮老者似乎仍然精神矍鑠，不像是身有重病的樣子。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"fighter","level":70,"gender":"male","title":"封山派掌門","equip":[{"path":"/d/qiaoyin/npc/obj/red_scale_leggings","use":"wear"},{"path":"/d/qiaoyin/npc/obj/red_scale_girth","use":"wear"},{"path":"/d/qiaoyin/npc/obj/red_scale_gloves","use":"wear"},{"path":"/d/qiaoyin/npc/obj/red_scale_helm","use":"wear"},{"path":"/d/qiaoyin/npc/obj/red_scale_boots","use":"wear"},{"path":"/d/qiaoyin/npc/obj/red_scale_plate","use":"wear"},{"path":"/d/qiaoyin/npc/obj/red_scale_cloth","use":"wear"},{"path":"/d/qiaoyin/npc/obj/blackthorn","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/fonxan_hall",1]]},"/custom/legacy_npc/liuh_hui_xin":{"id":"/custom/legacy_npc/liuh_hui_xin","file":"source/upstream/mudlib/custom/legacy_npc/liuh_hui_xin.c","name":"柳繪心","ids":["liuh hui xin","liuh","xin"],"long":"一個十二、三歲的小女孩，臉上稚氣未脫，卻在眉目之間顯露出一股頤氣指使\n的威嚴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"female","title":"封山派弟子","equip":[{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liuh_xin_yu":{"id":"/custom/legacy_npc/liuh_xin_yu","file":"source/upstream/mudlib/custom/legacy_npc/liuh_xin_yu.c","name":"柳新雨","ids":["liuh xin yu","liuh","yu"],"long":"柳新雨是前武林盟主─封山劍派掌門柳東蘆的次子，近年來武功、聲望都\n漸漸在武林中嶄露頭角，和他的哥哥柳淳風合稱「風雨雙劍」，但是因為\n他們為人正派，行俠仗義，所以大家都尊稱這兩個人為「風雨雙俠」。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":"封山派弟子","equip":[{"path":"/d/npc/obj/cloud_boots","use":"wear"},{"path":"/d/npc/obj/lion_belt","use":"wear"},{"path":"/d/wutang/npc/obj/blue_cloth","use":"wear"},{"path":"/d/shuiyue/npc/obj/colosus_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/graveyard/npc/liuye_the_master_of_grimace":{"id":"/d/graveyard/npc/liuye_the_master_of_grimace","file":"source/upstream/mudlib/d/graveyard/npc/liuye_the_master_of_grimace.c","name":"劉乙忘玄","ids":["liuye the master of grimace","liuye","grimace","master"],"long":"這位兩眼如鷹, 滿臉鬚髦的八尺大漢, 正是青邪宮四門中位於首座的哭笑門\n門主劉乙忘玄。劉乙忘玄是青邪宮殘蟻師太的大弟子, 武藝超群, 為人極為\n深沉內斂, 年輕時膂力驚人, 身形魁梧, 一手青邪杖法打遍難逢敵手, 在當\n時在江湖上便得了個「降天山」的外號。\n劉乙忘玄中年時青邪宮發生重大變故, 青邪宮四門中的擾心門門主梵雲飛,\n和吹雪門門主王雙兒雙雙失蹤, 當時參與青邪宮「封鬼」盛會的武林豪傑死\n傷更是慘重。劉乙忘玄在此事過後, 突然性情大變, 整天又哭又笑, 意態狂\n亂, 狀如瘋癲。五十三歲那年, 殘蟻逝世, 劉乙忘玄瘋病竟然好轉, 自號「\n哭笑野人」, 成為青邪宮繼殘蟻師太之後的霸主, 之後潛心閉關五年, 創出\n「大邪心法」和「大邪七損刀」, 儼然成為武林中人皆敬佩的武學大宗師。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"yenhold","class":"fighter","level":70,"gender":"male","title":"哭笑門門主","equip":[{"path":"/d/npc/obj/flying_boots","use":"wear"},{"path":"/d/graveyard/npc/obj/ghosts_girdle","use":"wear"},{"path":"/d/graveyard/npc/obj/god_cane","use":"wield"},{"path":"/d/graveyard/npc/obj/soft_cloth","use":"wear"},{"path":"/d/graveyard/npc/obj/copper_rosary","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/graveyard/grave7",1]]},"/custom/legacy_npc/lu_fei":{"id":"/custom/legacy_npc/lu_fei","file":"source/upstream/mudlib/custom/legacy_npc/lu_fei.c","name":"魯飛","ids":["lu fei","lu","fei"],"long":"魯飛曾經是征西大將軍神將帳下的第一猛將，後來由於臨時出征\n沒有跟隨神將去征討黑風山，至今仍為此事耿耿於懷，屢次上書\n請命再次發兵征討黑風山，為神將復仇。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"soldier","level":50,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/d/npc/obj/ring_of_mighty_lord","use":"wear"},{"path":"/d/baobao/npc/obj/royal_helmet","use":"wear"},{"path":"/d/baobao/npc/obj/royal_armor","use":"wear"},{"path":"/custom/weapon/blunt/whirlwind_blunt","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lu_jing":{"id":"/custom/legacy_npc/lu_jing","file":"source/upstream/mudlib/custom/legacy_npc/lu_jing.c","name":"魯驚","ids":["lu jing","lu","jing"],"long":"一股冷到骨子里的殺氣讓你忍不住打起哆嗦來，眼前的漢子，寬胸闊背，\n手臉都是紫銅一般的顏色，像是長在日頭下曝曬，粗糙如砂礫的臉上透\n著股剽悍之氣，殺氣的來源卻是漢子身後的哪把巨槌，古樸的外型，已\n染成一片血黑色的槌頭。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":null,"equip":[{"path":"/d/qiaoyin/npc/obj/battle_helm","use":"wear"},{"path":"/d/qiaoyin/npc/obj/battle_armor","use":"wear"},{"path":"/custom/weapon/blunt/crasher_maul","use":"wield"},{"path":"/d/npc/obj/clothboot","use":"wear"},{"path":"/d/qiaoyin/npc/obj/cyan_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/baobao/npc/ma_zhong_shen":{"id":"/d/baobao/npc/ma_zhong_shen","file":"source/upstream/mudlib/d/baobao/npc/ma_zhong_shen.c","name":"馬鍾聖","ids":["ma zhong shen","ma","shen"],"long":"馬鍾聖在大漠八魔中是老五，為人沈默寡言，很少說話，但是殺起人來卻也是\n異常殘忍。馬鍾聖在拳法上的造詣極深，由於和他動過手的人都被他殺了，所\n以他的武功套路幾乎沒人知道。","weight":null,"value":null,"unit":null,"flags":[],"race":"blackteeth","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/steel_boots","use":"wear"},{"path":"/d/npc/obj/iron_helmet","use":"wear"},{"path":"/d/baobao/npc/obj/steel_bracers","use":"wear"},{"path":"/d/npc/obj/ring_armor","use":"wear"}],"skills":[["風嘯拳法",200,"fonxiaoken"]],"wander":false,"ghost":false,"rooms":[["/d/baobao/fist_room",1]]},"/custom/legacy_npc/madam_han":{"id":"/custom/legacy_npc/madam_han","file":"source/upstream/mudlib/custom/legacy_npc/madam_han.c","name":"韓夫人","ids":["madam han","madam","han"],"long":"韓夫人是韓龍從小青梅竹馬的玩伴，他們結褵已經有二十年的光\n景。讓韓夫人一直很苦惱的，就是到現在他們還沒有生下一兒半\n女。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"commoner","level":1,"gender":"female","title":null,"equip":[{"path":"/d/npc/obj/white_dress","use":"wear"},{"path":"/custom/armor/neck/ruby_necklace","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/man_in_black":{"id":"/custom/legacy_npc/man_in_black","file":"source/upstream/mudlib/custom/legacy_npc/man_in_black.c","name":"黑衣人","ids":["man in black","man","black"],"long":"一個一身黑衣的神秘男子，那雙充滿殺氣的眼睛讓人不敢直視。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"thief","level":20,"gender":"male","title":null,"equip":[{"path":"/d/ziyan/npc/obj/iron_rosary","use":"wear"},{"path":"/d/npc/obj/black_doli","use":"wear"},{"path":"/d/qiaoyin/npc/obj/snake_bracers","use":"wear"},{"path":"/d/lee/npc/obj/tight_cloth","use":"wear"},{"path":"/custom/weapon/blade/blood_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/swaylan/lunmay/npc/may_lan_wu":{"id":"/d/swaylan/lunmay/npc/may_lan_wu","file":"source/upstream/mudlib/d/swaylan/lunmay/npc/may_lan_wu.c","name":"梅嵐武","ids":["may lan-wu","may","lan-wu"],"long":"梅嵐武是冷梅莊莊主梅影風的長子，雖然只有二十多歲，但一手冷梅劍法已經\n盡得乃父真傳，江湖上的朋友送他一個外號叫做「追風劍」。梅嵐武相貌十分\n俊美，平常也頗為倜儻自喜，縣城裡不少姑娘都為他著迷，一聽說梅大公子進\n城，都會忍不住躲在樓上偷偷瞧上幾眼。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/d/swaylan/lunmay/npc/obj/umber_robe","use":"wear"},{"path":"/d/swaylan/lunmay/npc/obj/chain_shirt","use":"wear"},{"path":"/obj/area/obj/shortsword","use":"wield"},{"path":"/obj/area/obj/longsword","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/swaylan/lunmay/front_yard",1]]},"/d/mengjia/npc/meng_jiang_hong":{"id":"/d/mengjia/npc/meng_jiang_hong","file":"source/upstream/mudlib/d/mengjia/npc/meng_jiang_hong.c","name":"孟驚鴻","ids":["meng jiang-hong","meng","jiang-hong"],"long":"孟家莊的二莊主，一手五虎斷門刀隨然不如其兄孟昭展，但在江湖上\n也是小有名氣。尤其是在他一刀擊敗塞北雙熊之後，更是獲得了出塵\n刀的美譽。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"male","title":"出塵刀","equip":[{"path":"/d/npc/obj/iron_cloth","use":"wear"},{"path":"/d/npc/obj/lion_belt","use":"wear"},{"path":"/d/mengjia/npc/obj/red_dust_legs","use":"wear"},{"path":"/d/npc/obj/ghosts_blade","use":"wield"}],"skills":[["刀法",160,"blade"],["五虎斷門刀",160,"five-tiger blade"],["縱躍閃躲之法",120,"dodge"],["拆招卸力之法",120,"parry"]],"wander":false,"ghost":false,"rooms":[["/d/mengjia/manor",1]]},"/custom/legacy_npc/mie_xin":{"id":"/custom/legacy_npc/mie_xin","file":"source/upstream/mudlib/custom/legacy_npc/mie_xin.c","name":"滅心","ids":["mie xin","mie","xin"],"long":"守護神之遺跡的護衛﹐經受了神明對其心智體力的考驗和鍛煉﹐永生\n守衛神之遺跡的密寶不受凡人的侵犯。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/d/baobao/npc/obj/steel_bracers","use":"wear"},{"path":"/d/npc/obj/blood_stained_cloth","use":"wear"},{"path":"/d/npc/obj/steel_armor","use":"wear"},{"path":"/custom/weapon/pike/huge_halberd","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/mie_yu":{"id":"/custom/legacy_npc/mie_yu","file":"source/upstream/mudlib/custom/legacy_npc/mie_yu.c","name":"滅慾","ids":["mie yu","mie","yu"],"long":"守護神之遺跡的護衛﹐經受了神明對其心智體力的考驗和鍛煉﹐永生\n守衛神之遺跡的密寶不受凡人的侵犯。你似乎覺得這個守護寶藏的衛\n士看起來有點眼熟﹐好像曾經是江湖中某位劍客﹐但是你一時間想不\n起他的名字來。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/custom/armor/hand/black_gauntlets","use":"wear"},{"path":"/d/npc/obj/blood_stained_cloth","use":"wear"},{"path":"/d/npc/obj/steel_armor","use":"wear"},{"path":"/custom/weapon/sword/dragon_heavy_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ming_ling_zi":{"id":"/custom/legacy_npc/ming_ling_zi","file":"source/upstream/mudlib/custom/legacy_npc/ming_ling_zi.c","name":"螟蛉子","ids":["ming ling zi","ming","zi"],"long":"螟蛉子是跟杜風凌從西方大漠來的一位道士，平生以探求神秘的地方為樂。\n據說，他有辦法到達三個不屬於人間的地方：古墓場、夜神殿和蟠龍殿。他\n這次來天朝多半是為了幫杜風凌的幻霧觀在江湖中贏得一席之地吧。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":20,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/tianshan/npc/mountain_god":{"id":"/d/tianshan/npc/mountain_god","file":"source/upstream/mudlib/d/tianshan/npc/mountain_god.c","name":"桃仙","ids":["mountain god","mountain","god"],"long":"桃仙看起來沒有什麼特別。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/zenstaff","use":"wield"},{"path":"/obj/books/book_of_anatomy","use":""},{"path":"/d/tianshan/npc/obj/senxu","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/tianshan/peach_grove",1]]},"/d/baobao/npc/o_yan_zhi":{"id":"/d/baobao/npc/o_yan_zhi","file":"source/upstream/mudlib/d/baobao/npc/o_yan_zhi.c","name":"歐陽芝","ids":["o-yan zhi","o-yan","zhi"],"long":"大漠八魔之一，武功似乎是步玄派的，但為人心浮氣躁，自視極高，自認為風\n流倜儻，文采天下無雙。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":30,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/leather_boot","use":"wear"},{"path":"/obj/area/obj/belt","use":"wear"},{"path":"/d/npc/obj/white_cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"},{"path":"/obj/books/strange_tales_of_the_celestial_court","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baobao/study",1]]},"/d/kangping/npc/old_taoist":{"id":"/d/kangping/npc/old_taoist","file":"source/upstream/mudlib/d/kangping/npc/old_taoist.c","name":"安懶道人","ids":["old taoist","old","taoist"],"long":"安懶道人是個鬍鬚花白的老道士，他曾經在天邪國擔任御史大夫達三十多\n年，後來辭官入山學道。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"taoist","level":60,"gender":"male","title":"玄衣派弟子","equip":[{"path":"/d/kangping/npc/obj/sapphire_ring","use":"wear"},{"path":"/d/kangping/npc/obj/tao_robe","use":"wear"},{"path":"/d/kangping/npc/obj/magic_armor","use":"wear"},{"path":"/d/kangping/npc/obj/sword_of_raven","use":"wield"},{"path":"/d/npc/obj/peachwood_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/hut",1]]},"/custom/legacy_npc/ou_yan_wu_ji":{"id":"/custom/legacy_npc/ou_yan_wu_ji","file":"source/upstream/mudlib/custom/legacy_npc/ou_yan_wu_ji.c","name":"歐陽無寂","ids":["ou-yan wu ji","ou-yan","ji"],"long":"歐陽無寂是隱風觀觀主歐陽無極的雙生弟弟，兩人同時拜在宇文太\n極門下。因為兩人面貌相似，名字發音又相同，觀中弟子都以「大\n師父」稱呼歐陽無極，而稱歐陽無寂為「二師父」。半個月前，他\n收到了歐陽無極的飛符傳書，連忙從宓縣北上，要趕在茅山三位觀\n主會面之前，先與歐陽無極會合。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":30,"gender":"male","title":"隱風觀道士","equip":[{"path":"/d/npc/obj/black_doli","use":"wear"},{"path":"/d/npc/obj/han_jade_ring","use":"wear"},{"path":"/d/npc/obj/green_robe","use":"wear"},{"path":"/d/npc/obj/peachwood_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/kangping/npc/ou_yan_wu_ji_2":{"id":"/d/kangping/npc/ou_yan_wu_ji_2","file":"source/upstream/mudlib/d/kangping/npc/ou_yan_wu_ji_2.c","name":"歐陽無極","ids":["ou-yan wu ji","ou-yan","ji"],"long":"隱風觀觀主本是四十多年前離開茅山﹐自創隱風觀的宇文太極。怎料數日前\n宇文太極竟忽然一命歸天﹐引得江湖中盛傳『茅山劍法』再顯與世。新任的\n隱風觀觀主﹐歐陽無極則是一口咬定宇文太極是忙於重建茅山﹐操勞過度而\n死。歐陽無極是宇文太極生前最鐘愛的弟子﹐而且在『茅山幻術』上的造詣\n頗深。他此時離開隱風觀據說是有事要和靈雲觀觀主和幻霧觀觀主商討。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"taoist","level":40,"gender":"male","title":"隱風觀觀主","equip":[{"path":"/d/npc/obj/green_robe","use":"wear"},{"path":"/d/npc/obj/peachwood_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/inn",1]]},"/d/snowkeep/npc/phoxin":{"id":"/d/snowkeep/npc/phoxin","file":"source/upstream/mudlib/d/snowkeep/npc/phoxin.c","name":"佛心","ids":["phoxin"],"long":"殺手佛心是個四十多歲的中年僧人，一身金線僧袍纖塵不染。佛心少年時\n就是個殺人無數的冷血殺手，後來因為發生了一件慘事而出家為僧，立誓\n從此不殺一人，但是他仍然是江湖上聞名喪膽的可怕殺手，他只替金主將\n敵人打倒廢去武功，並不殺死對方，據他的說法是盼望金主看到仇家的慘\n狀能夠忽發善心，就此了結一樁血海深仇。\n佛心的武功深不可測，尤其擅長短兵刃與擒拿格鬥之術，據說和江湖上武\n功最高的六賢只在伯仲之間，連當今武林盟主都曾有「一丈之外，我不如\n金籟，一丈之內，我不如佛心」之嘆，由此可見此人之驚人藝業。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":50,"gender":"male","title":"殺手","equip":[{"path":"/d/snowkeep/npc/obj/gold_robe","use":"wear"},{"path":"/d/snowkeep/npc/obj/bamboo_legs","use":"wear"},{"path":"/d/snowkeep/npc/obj/dark_armor","use":"wear"},{"path":"/d/npc/obj/psakaml","use":"wear"},{"path":"/d/snowkeep/npc/obj/cool_iron_dagger","use":"wield"},{"path":"/d/snowkeep/npc/obj/wicked_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/snowkeep/court",1]]},"/custom/legacy_npc/red_lady":{"id":"/custom/legacy_npc/red_lady","file":"source/upstream/mudlib/custom/legacy_npc/red_lady.c","name":"紅衣女子","ids":["red lady","red","lady"],"long":"一個身形婀娜的中年女子, 她豔美的臉龐和那如羊脂白玉般的肌膚, 不\n禁令你看傻了眼。她一臉茫然地看著你, 口中喃喃地唱著清淒的小調,\n你見到她的雙手染滿了血跡, 在她雪白的手臂上如一片片滿開的鮮紅牡\n丹 ...。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"female","title":null,"equip":[{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/weapon/sword/iron_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ren_xiao_xiao":{"id":"/custom/legacy_npc/ren_xiao_xiao","file":"source/upstream/mudlib/custom/legacy_npc/ren_xiao_xiao.c","name":"任蕭蕭","ids":["ren xiao-xiao","ren","xiao-xiao"],"long":"她長的雖無沉魚落雁之容，卻也是風情萬種，讓人心生愛意。只是\n她看起來滿面愁容，似乎正在為什麼事發愁。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":10,"gender":"female","title":null,"equip":[{"path":"/d/oldpine/npc/obj/violet_shoes","use":"wear"},{"path":"/custom/armor/cloth/rainbow_gown","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/swaylan/buxuan/npc/ro_yi":{"id":"/d/swaylan/buxuan/npc/ro_yi","file":"source/upstream/mudlib/d/swaylan/buxuan/npc/ro_yi.c","name":"駱易","ids":["ro yi","ro","yi"],"long":"駱易本人性格恬淡，雖然身為步玄派掌門人，卻極為謙退自抑，外人只知道駱易\n少年時曾孤身一人犯險闖入西方大漠的飛狼城，救回當今的皇帝及香雪王，成為\n轟動一時的人物。駱易辭卻了朝廷及香雪王的豐厚賞賜及高官厚祿，隱居在喬陰\n的祖宅，也成為江湖傳頌的美談。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":65,"gender":"male","title":"步玄派掌門","equip":[{"path":"/d/swaylan/buxuan/npc/obj/black_harness","use":"wear"},{"path":"/d/npc/obj/han_jade_ring","use":"wear"},{"path":"/d/swaylan/buxuan/npc/obj/snakeskin_boots","use":"wear"},{"path":"/d/npc/obj/white_jade_girth","use":"wear"},{"path":"/d/npc/obj/golden_robe","use":"wear"},{"path":"/d/swaylan/buxuan/npc/obj/headgear","use":"wear"},{"path":"/d/swaylan/buxuan/npc/obj/sword_of_wind_spring","use":"wield"},{"path":"/d/swaylan/buxuan/npc/obj/cloudslay_sword","use":"wield"},{"path":"/obj/books/water_dragon_canon","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/swaylan/buxuan/residence",1]]},"/custom/legacy_npc/rong_shi_guo":{"id":"/custom/legacy_npc/rong_shi_guo","file":"source/upstream/mudlib/custom/legacy_npc/rong_shi_guo.c","name":"榮世國","ids":["rong shi guo","rong","guo"],"long":"你面前的這位老者身材魁梧﹐雙目有神﹐三縷白鬚整齊的落在胸前。\n榮家世代在朝為官且身居要職﹐尤其是最近幾年﹐榮家的勢利迅速\n成長﹐對天朝的軍界政界都有不小的影響。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/han_jade_ring","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"},{"path":"/custom/armor/head/jade_hat","use":"wear"},{"path":"/custom/weapon/staff/serpent_cane","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/senkun_tez":{"id":"/custom/legacy_npc/senkun_tez","file":"source/upstream/mudlib/custom/legacy_npc/senkun_tez.c","name":"上官小翠","ids":["senkun tez","senkun","tez"],"long":"上官小翠是老劍山徑執法上官笑夢的獨生女兒, 別看她弱不禁風的樣子,\n她的劍法在巾幗輩中算是蠻突出的一位。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":10,"gender":"female","title":"老劍山徑第十三代弟子","equip":[{"path":"/custom/armor/feet/flower_boots","use":"wear"},{"path":"/custom/armor/head/jade_hairpin","use":"wear"},{"path":"/custom/armor/cloth/tender_cloth","use":"wear"},{"path":"/d/fengcheng/npc/obj/steel_longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/shao_chu_san":{"id":"/custom/legacy_npc/shao_chu_san","file":"source/upstream/mudlib/custom/legacy_npc/shao_chu_san.c","name":"蕭秋山","ids":["shao chu-san","shao","chu-san"],"long":"一個相貌相當俊秀的年青人, 山寨中習武的各個環節都必須經過他的\n同意, 若未經許可偷學習武功, 通常命運是相當悲慘的, 他同時也是\n黑風寨中高手之一, 所以整個山寨的人也都很怕他。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"武術教頭","equip":[{"path":"/custom/weapon/sword/hero_sword","use":"wield"},{"path":"/custom/armor/armor/iron_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/si_ma_cheng_du":{"id":"/custom/legacy_npc/si_ma_cheng_du","file":"source/upstream/mudlib/custom/legacy_npc/si_ma_cheng_du.c","name":"司馬成都","ids":["si-ma cheng du","si-ma","du"],"long":"你面前這位年已花甲的白髮老人就是天朝軍界的第一人，兵部尚書\n司馬成都。不僅是司馬成都本人，其實整個司馬家族幾乎都在天朝\n軍中效力。這雖然引來一些人的猜疑，但是司馬成都憑借其一身正\n氣和纍纍戰功依舊深得祐聖帝信賴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":70,"gender":"male","title":"兵部尚書","equip":[{"path":"/d/baobao/npc/obj/tiger_plate","use":"wear"},{"path":"/custom/zhenwu/obj/fire_gauntlets","use":"wear"},{"path":"/custom/weapon/blunt/black_iron_hammer","use":"wield"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"},{"path":"/d/baobao/npc/obj/royal_helmet","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/baobao/npc/si_ma_lei":{"id":"/d/baobao/npc/si_ma_lei","file":"source/upstream/mudlib/d/baobao/npc/si_ma_lei.c","name":"司馬雷","ids":["si-ma lei","si-ma","lei"],"long":"大漠八魔中的老七，據說原本是天朝的一名參將，不知為何放著好好的官不做，\n卻到北方大漠去幹打家劫舍的事。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"soldier","level":60,"gender":"male","title":null,"equip":[{"path":"/d/baobao/npc/obj/royal_pike","use":"wield"},{"path":"/d/baobao/npc/obj/royal_helmet","use":"wear"},{"path":"/d/baobao/npc/obj/royal_armor","use":"wear"},{"path":"/d/npc/obj/ring_of_mighty_lord","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baobao/armory",1]]},"/d/fengcheng/npc/si_ma_wei":{"id":"/d/fengcheng/npc/si_ma_wei","file":"source/upstream/mudlib/d/fengcheng/npc/si_ma_wei.c","name":"司馬蔚","ids":["si-ma wei","si-ma","wei"],"long":"風城的大將軍。聽人說他兩年前還只是個小卒，也沒有什麼戰功，不知\n為什麼會被提升為大將軍。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":55,"gender":"male","title":"風城大將軍","equip":[{"path":"/d/npc/obj/ring_of_mighty_lord","use":"wear"},{"path":"/d/npc/obj/steel_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/fengcheng/tower",1]]},"/custom/legacy_npc/soldier_leader":{"id":"/custom/legacy_npc/soldier_leader","file":"source/upstream/mudlib/custom/legacy_npc/soldier_leader.c","name":"兵部軍官","ids":["soldier leader","soldier","leader"],"long":"這是一位對兵部尚書司馬成都忠心不二的兵部軍官。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"soldier","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/feet/bull_boots","use":"wear"},{"path":"/d/npc/obj/iron_girth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/stone_ghost":{"id":"/custom/legacy_npc/stone_ghost","file":"source/upstream/mudlib/custom/legacy_npc/stone_ghost.c","name":"八臂石妖","ids":["stone ghost","stone","ghost"],"long":"這！這是一個甚麼東西？怎麼看都是一座巨大的八臂無頭石像！\n他胸口的一塊石牌上刻著「雷神禁地」四個字。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/forgod_boots","use":"wear"},{"path":"/custom/weapon/blunt/crasher_maul","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/su_xiao":{"id":"/custom/legacy_npc/su_xiao","file":"source/upstream/mudlib/custom/legacy_npc/su_xiao.c","name":"蘇瀟","ids":["su xiao","su","xiao"],"long":"你眼前是一名相貌堂堂的中年男子，全身散發著一股內斂的英氣，他\n正是蘇家莊主蘇瀟，蘇家三代經營賭場，到蘇瀟手上創了十一家分號\n，家業可謂如日中天，加上為人慷慨豪氣，平日就為地方百姓貢獻不\n少心力，在市井小民之間也頗具人望。但是他現在看起來卻愁眉不展\n，似乎有什麼心事....。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":15,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/d/mengjia/npc/obj/red_dust_legs","use":"wear"},{"path":"/d/npc/obj/silk_cloth","use":"wear"},{"path":"/d/shuiyue/npc/obj/colosus_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/sun_yi":{"id":"/custom/legacy_npc/sun_yi","file":"source/upstream/mudlib/custom/legacy_npc/sun_yi.c","name":"孫漪","ids":["sun yi","sun","yi"],"long":"孫漪是韓笑十年前在山下遇到的一個修羅族女孩，後來韓笑成為虎刀門掌\n門便收她為義女。別被她嬌滴滴的樣子迷惑了，她在十三歲時就力克群雄\n成為虎刀門比武大會的武狀元。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"fighter","level":40,"gender":"female","title":"虎刀門護衛","equip":[{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/custom/armor/armor/shapeless_heartguard","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/d/npc/obj/white_dress","use":"wear"},{"path":"/custom/weapon/blade/snow_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/taiyi/npc/taoist_leader":{"id":"/d/taiyi/npc/taoist_leader","file":"source/upstream/mudlib/d/taiyi/npc/taoist_leader.c","name":"白齊","ids":["taoist leader","taoist","leader"],"long":"在你眼前的是一位仙風道骨的道士，身著一件淡青色道袍，渾身\n散發出一股悠然的風範與氣度，他就是太乙觀的觀主--白齊。太\n乙觀內的上清道長，玉清道長跟玄清道長都是他的得意門徒，他\n對待觀內的小道童，道士們也都很親切，可以說是太乙觀中最具\n有影響力的人物。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"taoist","level":50,"gender":"male","title":"太乙觀觀主","equip":[{"path":"/d/taiyi/npc/obj/shome_sword","use":"wield"},{"path":"/d/taiyi/npc/obj/black_cloth_boots","use":"wear"},{"path":"/d/npc/obj/green_robe","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/taiyi/main_hall",1]]},"/custom/legacy_npc/taoist_master":{"id":"/custom/legacy_npc/taoist_master","file":"source/upstream/mudlib/custom/legacy_npc/taoist_master.c","name":"正閒道長","ids":["taoist master","taoist","master"],"long":"他正是上清觀觀主, 人稱渡盡劫者的正閒道長。據說此人在\n十九歲時因觀粉蝶撲戲而有所開悟, 首創上清觀劍法, 更在\n四十中旬突領鬼眾道經, 開始修行引神道篇。他的外表看起\n來有點肥短, 但聲如洪鐘, 臉似初嬰, 一點也不像個快要七\n十的老頭。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":50,"gender":"male","title":"上清觀觀主","equip":[{"path":"/custom/armor/cloth/taoist_robe","use":"wear"},{"path":"/custom/armor/finger/clear_ring","use":"wear"},{"path":"/custom/weapon/sword/yiyoung_sword","use":"wield"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/tian_long":{"id":"/custom/legacy_npc/tian_long","file":"source/upstream/mudlib/custom/legacy_npc/tian_long.c","name":"田龍","ids":["tian long","tian","long"],"long":"田龍是虎刀門新一代弟子中的佼佼者，據說他不僅內功刀法出神入化，就\n連虎刀門不很出名的輕功也練到了爐火純青的境界。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":"虎刀門護衛","equip":[{"path":"/d/npc/obj/lion_belt","use":"wear"},{"path":"/custom/armor/armor/iron_armor","use":"wear"},{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/d/mengjia/npc/obj/red_dust_legs","use":"wear"},{"path":"/custom/weapon/blade/ceremonial_moon","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/mengjia/npc/tian_yu":{"id":"/d/mengjia/npc/tian_yu","file":"source/upstream/mudlib/d/mengjia/npc/tian_yu.c","name":"田由","ids":["tian yu","tian","yu"],"long":"田由是塞北雙熊中的老二，長得又高又大，打人全靠一身蠻力。偏偏卻\n又自認為武功高強，自從見過孟憶柔一面之後，就死皮賴臉的呆在孟家\n莊不走，要不是孟家現在正有事，早就把他殺了。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":30,"gender":"male","title":"塞北雙熊","equip":[{"path":"/d/npc/obj/cloud_boots","use":"wear"},{"path":"/d/mengjia/npc/obj/star_studded_legs","use":"wear"},{"path":"/d/mengjia/npc/obj/copper_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/mengjia/gate",1]]},"/custom/legacy_npc/tiger_trainer":{"id":"/custom/legacy_npc/tiger_trainer","file":"source/upstream/mudlib/custom/legacy_npc/tiger_trainer.c","name":"虎刀門教頭","ids":["tiger trainer","tiger","trainer"],"long":"他是虎刀門的一位老教頭，負責傳授新弟子武功。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/d/baihua/npc/obj/ringmail","use":"wear"},{"path":"/custom/armor/feet/bull_boots","use":"wear"},{"path":"/custom/armor/cloth/tiger_coat","use":"wear"},{"path":"/custom/weapon/blade/colosus_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/wang_yean":{"id":"/custom/legacy_npc/wang_yean","file":"source/upstream/mudlib/custom/legacy_npc/wang_yean.c","name":"王燕","ids":["wang yean","wang","yean"],"long":"一個滿身藥味, 神情專注的女子正在清理一些木材, 似乎沒有注意到你正在看\n她. 有她的裝束來看, 不像學武之人, 反到像是到處尋藥之神醫. 她師兄陳度\n好管閒事, 反倒在藥材的研究上, 比不上默默鑽研的王燕. 由其專注的神貌,\n似乎正在調理重要的配方.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":20,"gender":"female","title":null,"equip":[{"path":"/d/baihua/npc/obj/shennong_dagger","use":"wield"},{"path":"/d/baihua/npc/obj/goat_hat","use":"wear"},{"path":"/obj/cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/white_hell_agent":{"id":"/custom/legacy_npc/white_hell_agent","file":"source/upstream/mudlib/custom/legacy_npc/white_hell_agent.c","name":"白無常","ids":["white hell agent","white","agent"],"long":"勾魂使者白無常是負責將因戰亂和意外而喪生的人的靈魂引去接受\n閻王的審判。一般來說，活人是見不到他的。而現在他就在你的面\n前，而且滿臉愁容，似乎遇到了甚麼麻煩。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":50,"gender":"male","title":"勾魂使者","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/graveyard/npc/wu_changuei":{"id":"/d/graveyard/npc/wu_changuei","file":"source/upstream/mudlib/d/graveyard/npc/wu_changuei.c","name":"吳長貴","ids":["wu changuei","wu","changuei"],"long":"一個面皮白淨的高瘦漢子﹐左頰上一道長長的刀疤﹐你突然想起這個\n漢子就是這一帶著名的飛賊「無常鬼」吳長貴。","weight":null,"value":null,"unit":null,"flags":["限盜賊"],"race":"human","class":"thief","level":15,"gender":"male","title":"瑯夷派弟子","equip":[{"path":"/obj/area/obj/dagger","use":"wield"},{"path":"/d/graveyard/npc/obj/ghost_mask","use":"wear"},{"path":"/d/graveyard/npc/obj/black_suit","use":"wear"}],"skills":[["妙手空空之技",45,"stealing"]],"wander":false,"ghost":false,"rooms":[["/d/graveyard/forest_w",1]]},"/d/qiaoyin_east/npc/wu_dauton":{"id":"/d/qiaoyin_east/npc/wu_dauton","file":"source/upstream/mudlib/d/qiaoyin_east/npc/wu_dauton.c","name":"武道通","ids":["wu dauton","wu","dauton"],"long":"武道通年輕時本為龍圖丹派的方士, 因為一次因緣際會結識了一位江湖異人, 習得\n了幾手針灸之術, 從此便不再苦煉丹道, 開始如著魔般浸淫於施針下灸之學。之後\n竟因久疏龍圖丹派本門功夫, 而遭致開革之禍。武道通離開龍圖丹派之後, 便隱居\n於斐縣縣郊, 為當地居民針灸治病, 沒有想到卻聲名大噪起來, 由於醫術高明, 行\n事瘋癲乖張, 得了個「鬼華陀」的稱號。到了晚年, 乃自行開宗立派, 創設「武陀\n灸堂」, 傳授附近居民武藝與防身灸術, 門下弟子不下百人, 多雲遊四海, 行醫救\n世。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"alchemist","level":60,"gender":"male","title":"武陀灸堂堂主","equip":[{"path":"/d/qiaoyin_east/npc/obj/boots_of_cleanse","use":"wear"},{"path":"/d/qiaoyin_east/npc/obj/bee_needle","use":"wield"},{"path":"/d/qiaoyin_east/npc/obj/tiger_ring","use":"wear"},{"path":"/d/qiaoyin_east/npc/obj/needle_of_bone_maggot","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin_east/clinic",1]]},"/d/qiaoyin/npc/wu_yu_nun":{"id":"/d/qiaoyin/npc/wu_yu_nun","file":"source/upstream/mudlib/d/qiaoyin/npc/wu_yu_nun.c","name":"無慾師太","ids":["wu-yu nun","wu-yu","nun"],"long":"無慾師太是太陰門慘招滅門之災時的唯一的幸存者，然而，太陰門的大部份武\n功都失傳了，她也在被哭笑門追殺，幸而得到柳東蘆的保護才得以在喬陰縣安\n身。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"monk","level":30,"gender":"female","title":"太陰門弟子","equip":[{"path":"/d/npc/obj/psakaml","use":"wear"},{"path":"/d/qiaoyin/npc/obj/golden_buddha_duster","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/fonxan_yard",1]]},"/custom/legacy_npc/xiao_li_ying":{"id":"/custom/legacy_npc/xiao_li_ying","file":"source/upstream/mudlib/custom/legacy_npc/xiao_li_ying.c","name":"肖麗穎","ids":["xiao li ying","xiao","ying"],"long":"你面前的這位女子真可謂是國色天香﹐讓人望其貌而不知色﹐聞其聲而\n不知音。這般美貌的女子天朝境內可是難得一見﹐你既然看過了﹐就該\n知足了。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":25,"gender":"female","title":null,"equip":[{"path":"/custom/armor/cloth/cloudy_silk_cloth","use":"wear"},{"path":"/custom/weapon/whip/whip_of_evil_beauties","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xiao_yin":{"id":"/custom/legacy_npc/xiao_yin","file":"source/upstream/mudlib/custom/legacy_npc/xiao_yin.c","name":"蕭尹","ids":["xiao yin","xiao","yin"],"long":"一個和藹可親的老年人，半白的髮絲睿智的面容，看來是個飽經風霜的人物，但\n看其精壯的身軀及微透紅光的臉龐，就可知道他一定是個武學根基深厚的高手，\n穿著長袍的他看來一派溫文，但接觸到他如鷹的眼神，不由得令你對他多了幾分\n敬畏，眼前這位長者，正是掌握了天朝水路交通的水路第一大幫漕幫傳說中的總\n舵主蕭尹。蕭尹與哭笑門門主劉乙忘玄為莫逆之交，相傳年輕時雙雄一見如故，\n於青邪山上暢談抱負及武學相談甚歡，蕭尹創漕幫之初劉乙忘玄相助甚多，而哭\n笑門在武林中的許多仇家莫名暴斃，據說也與漕幫脫不了關係，兩人之間或明或\n暗的存在著一種互利的合作關係。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":45,"gender":"male","title":"漕幫總舵主","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xie_qing_xiang":{"id":"/custom/legacy_npc/xie_qing_xiang","file":"source/upstream/mudlib/custom/legacy_npc/xie_qing_xiang.c","name":"謝青翔","ids":["xie qing-xiang","xie","qing-xiang"],"long":"謝青翔是虎刀門掌門的師弟，也是虎刀門最年輕的教席。平常負責新\n入門弟子的刀法指導。這次來到斐縣，除了視察虎刀門在這裡的哨站\n情況之外，也是為了籌備幾個月後的本門大會。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":25,"gender":"male","title":"虎刀門教席","equip":[{"path":"/custom/weapon/blade/wind_slasher_blade","use":"wield"},{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/custom/armor/feet/bull_boots","use":"wear"},{"path":"/custom/armor/cloth/tiger_coat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xing_long":{"id":"/custom/legacy_npc/xing_long","file":"source/upstream/mudlib/custom/legacy_npc/xing_long.c","name":"刑龍","ids":["xing long","xing","long"],"long":"一道熾熱的目光掃的你全身不自在了起來，如果不是剛摸了摸身上的衣袍，\n你真的以為自己忘了穿上衣服了....，轉身順著目光望了過去，一個身材\n瘦弱的男子，他的臉色蒼白，好像是身染重病一樣。男子揹在身後哪把與\n其身材不成比例的長杖，詭譎的流線、古怪的造型，正散發著一陣又一陣\n的淫靡之氣，刺激的你下身火熱.....","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":35,"gender":"male","title":"催情杖","equip":[{"path":"/d/npc/obj/cloud_boots","use":"wear"},{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/custom/weapon/staff/staff_of_eroticism","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xu_xiao_e":{"id":"/custom/legacy_npc/xu_xiao_e","file":"source/upstream/mudlib/custom/legacy_npc/xu_xiao_e.c","name":"徐小惡","ids":["xu xiao e","xu"],"long":"她正是江湖上最令人髮指的惡盜「太湖雙惡」中的「風騷徐娘」徐小惡。\n據江湖傳聞, 三十年前她與丈夫白常惡在太湖邊打劫犯案, 殺人越貨, 著\n實闖下不小的名號! 後來與當時黃家鏢局的總鏢頭黃彥發生衝突, 搶走黃\n彥保下的一支大鏢, 黃彥一怒之下於是下戰書約定太湖生死相鬥! 白徐夫\n婦與黃彥相鬥一天一夜, 雙方疲狽不堪, 勝負難分, 但最後黃彥竟出人意\n料的太皇弓起, 鳳頭箭搭, 一箭帶走白常惡一命,","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":25,"gender":"female","title":null,"equip":[{"path":"/custom/weapon/blade/black_kris","use":"wield"},{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/d/lee/npc/obj/tight_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/baobao/npc/xun_yuan_jian_yue":{"id":"/d/baobao/npc/xun_yuan_jian_yue","file":"source/upstream/mudlib/d/baobao/npc/xun_yuan_jian_yue.c","name":"軒轅劍月","ids":["xun-yuan jian yue","xun-yuan","yue"],"long":"此人長的英俊瀟灑，氣度雍容華貴，渾身上下透著一種讓人無法抗拒的魅\n力。與他的七位結義兄弟不同的是，軒轅劍月很少殺人。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":65,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/longsword","use":"wield"},{"path":"/obj/area/obj/shortsword","use":"wield"},{"path":"/d/baobao/npc/obj/dragon_ring","use":"wear"},{"path":"/d/npc/obj/flying_boots","use":"wear"},{"path":"/d/npc/obj/blood_stained_cloth","use":"wear"}],"skills":[["六陰絕識劍",195,"six-dao-sword"]],"wander":false,"ghost":false,"rooms":[["/d/baobao/top_floor",1]]},"/custom/legacy_npc/yaksa":{"id":"/custom/legacy_npc/yaksa","file":"source/upstream/mudlib/custom/legacy_npc/yaksa.c","name":"夜羅剎","ids":["yaksa"],"long":"妖艷的女性惡魔戰士﹐雖然看起來十分溫柔﹐可是她們驚人的戰鬥力\n以及獨特的戰鬥技巧是十分恐怖的。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"female","title":null,"equip":[{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/d/npc/obj/green_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yaksa_king":{"id":"/custom/legacy_npc/yaksa_king","file":"source/upstream/mudlib/custom/legacy_npc/yaksa_king.c","name":"羅剎王","ids":["yaksa king","yaksa","king"],"long":"羅剎王雙目如烈火般散發著讓人窒息的紅光﹐週身上下結實的肌肉更\n釋放出無窮的殺氣。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":35,"gender":"male","title":null,"equip":[{"path":"/d/wutang/npc/obj/blue_cloth","use":"wear"},{"path":"/d/npc/obj/forgod_boots","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yan_kuang_phon":{"id":"/custom/legacy_npc/yan_kuang_phon","file":"source/upstream/mudlib/custom/legacy_npc/yan_kuang_phon.c","name":"閰狂風","ids":["yan kuang phon","yan","phon"],"long":"閰狂風乃是黑風寨的四頭目, 早年拜於封山門下, 但不滿其於\n封山派之內不受到重視與重用, 故而積怨心中, 也因此他的封山\n劍招夾帶著一股邪惡之氣, 在幾十年前的一場封山派所舉行的武\n功比試大會中, 由於出手毫不留情, 殺死其同門師兄, 而因此被\n逐出師門, 但因為其天資聰穎早已習得封山武功精髓, 加上長年\n自行修練, 已經到了爐火純青的地步。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":40,"gender":"male","title":"黑風寨四頭目","equip":[{"path":"/custom/weapon/sword/smashing_sword","use":"wield"},{"path":"/custom/armor/armor/armor_of_violet_rohan","use":"wear"},{"path":"/custom/armor/cloth/sky_earth_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yan_she":{"id":"/custom/legacy_npc/yan_she","file":"source/upstream/mudlib/custom/legacy_npc/yan_she.c","name":"言歙","ids":["yan she","yan","she"],"long":"言歙乃是當今朝中紅人，不到不惑之年已官拜御史大夫，這次似乎是為\n了漕幫之事而來，漕幫行事向來低調，朝廷忽然對之展開調查想來必有\n原因。其為人貪杯好酒，但是辦起事來卻又十分穩當，武功平平不過逃\n命功夫一流。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"commoner","level":20,"gender":"male","title":"御史大夫","equip":[{"path":"/custom/armor/head/jade_hat","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yen_hong":{"id":"/custom/legacy_npc/yen_hong","file":"source/upstream/mudlib/custom/legacy_npc/yen_hong.c","name":"晏訌","ids":["yen hong","yen","hong"],"long":"晏訌是老劍山徑莊主晏勢苔的獨生子, 和山徑執法上官笑夢之女\n上官小翠從小就是青梅竹馬..晏訌生性耿直, 木訥寡言, 但一身\n橫練鐵打功夫, 和單手能劈巨石的狂大膂力, 再加上晏勢苔親傳\n老劍山徑的漫雨刀法, 使得他在武林的名號已是響亮異常!。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":"老劍山徑第十二代弟子","equip":[{"path":"/custom/armor/armor/shoulder_armor","use":"wear"},{"path":"/custom/armor/feet/flycloud_boots","use":"wear"},{"path":"/custom/armor/cloth/broken_iron_cloth","use":"wear"},{"path":"/d/npc/obj/ghosts_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/qiaoyin/npc/yin_euyen":{"id":"/d/qiaoyin/npc/yin_euyen","file":"source/upstream/mudlib/d/qiaoyin/npc/yin_euyen.c","name":"陰雨巖","ids":["yin euyen","yin","euyen"],"long":"陰雨巖是個相貌溫和的中年儒生，曾經中過舉人，但是做官不到半年就因為\n得罪長官而辭官回鄉，他後來棄文從武，在喬陰縣一帶的武林算得上是個人\n物。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/obj/area/obj/leather_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/inn2",1]]},"/custom/legacy_npc/ying_xiao_tian":{"id":"/custom/legacy_npc/ying_xiao_tian","file":"source/upstream/mudlib/custom/legacy_npc/ying_xiao_tian.c","name":"應曉天","ids":["ying xiao tian","ying","tian"],"long":"一名長相俊逸的青年，這人一襲白衣，手上拿把描金折扇，瞧來甚是瀟灑\n不凡。但仔細一看，臉色蒼白、腳步浮虛，一副被酒色淘空了身子的模樣，\n兩顆眼睛逕盯著來往的女人，還掛滿了一臉的淫笑，腰上繫著一把雪白的\n長劍。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":"落花劍","equip":[{"path":"/custom/weapon/sword/sword_of_holy_frost","use":"wield"},{"path":"/d/npc/obj/white_scholar_dress","use":"wear"},{"path":"/d/mengjia/npc/obj/red_dust_legs","use":"wear"},{"path":"/custom/armor/armor/shoulder_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/snowkeep/npc/yu_lan_jian_yi":{"id":"/d/snowkeep/npc/yu_lan_jian_yi","file":"source/upstream/mudlib/d/snowkeep/npc/yu_lan_jian_yi.c","name":"於蘭兼毅","ids":["yu lan jian yi","yu","yi"],"long":"於蘭兼毅是當今的武林盟主﹐也是天邪國公獨生子﹐如果你以為他是\n靠著貴族的身分而獲得武林盟主的地位﹐你可是會大吃一驚的﹐天邪\n國一向是於蘭宗室掌管武術之秘的一支﹐宗室中的人物在武林之中向\n來依照武林規矩﹐於蘭兼毅在武林中成名已超過三十年﹐除了執掌天\n邪派門戶之外﹐也和武林中另外五位奇人合稱「六賢」。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":70,"gender":"male","title":"天邪派掌門","equip":[{"path":"/d/snowkeep/npc/obj/brass_hat","use":"wear"},{"path":"/d/npc/obj/spider_boots","use":"wear"},{"path":"/d/snowkeep/npc/obj/dragon_armor","use":"wear"},{"path":"/d/snowkeep/npc/obj/skin_gloves","use":"wear"}],"skills":[["內功",200,"force"],["天邪神功",200,"celestial force"],["徒手搏鬥",200,"unarmed"],["天邪神掌",200,"celestial palm"]],"wander":false,"ghost":false,"rooms":[["/d/snowkeep/dungeon_e",1]]},"/d/snowkeep/npc/yu_pingyin":{"id":"/d/snowkeep/npc/yu_pingyin","file":"source/upstream/mudlib/d/snowkeep/npc/yu_pingyin.c","name":"魚平胤","ids":["yu pingyin","yu","pingyin"],"long":"魚平胤是雪吟山莊的少莊主﹐雖然生在雪吟山莊這樣的武林世家﹐但\n是他卻對學武不感興趣﹐因此在武學上的造詣遠不如魚鐵山的大弟子\n褚商魂﹐但是魚平胤天資極高﹐讀書時過目不忘﹐練武也是一點就通\n﹐許多武林中的高人都十分羨慕魚鐵山有這樣一個兒子。\n魚平胤對學武不感興趣﹐對道家長生之術卻十分著迷﹐若不是因為身\n為魚家唯一的獨子﹐可能早就入山尋仙去了。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/d/snowkeep/npc/obj/purple_cloud_mail","use":"wear"},{"path":"/d/snowkeep/npc/obj/ironsword","use":"wield"},{"path":"/obj/area/obj/leather_boot","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/snowkeep/garden_n",1]]},"/custom/legacy_npc/yu_shao_me":{"id":"/custom/legacy_npc/yu_shao_me","file":"source/upstream/mudlib/custom/legacy_npc/yu_shao_me.c","name":"語小梅","ids":["yu shao me","yu","me"],"long":"她擦了擦從額頭上流下的汗水, 一臉焦急地望著草原的彼端... 一張鵝蛋瓜子\n臉, 透著些許的緋紅, 兩顆可愛的小虎牙咬著下唇, 你見到她苦惱的模樣, 不\n禁有些心疼...。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":25,"gender":"female","title":null,"equip":[{"path":"/d/npc/obj/white_dress","use":"wear"},{"path":"/d/npc/obj/black_iron_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/snowkeep/npc/yu_tieshan":{"id":"/d/snowkeep/npc/yu_tieshan","file":"source/upstream/mudlib/d/snowkeep/npc/yu_tieshan.c","name":"魚鐵山","ids":["yu tieshan","yu","tieshan"],"long":"魚鐵山是雪吟莊的莊主，也是當今武林號稱「六賢」之一的武林高手，魚鐵山\n成名已近四十年，和當今武林盟主於蘭兼毅是總角之交，曾一起在天邪派前掌\n門於蘭焱門下學藝，不過由於於蘭兼毅是天邪國公世子，因此於蘭焱收於蘭兼\n毅為師弟，而魚鐵山反而要稱這位小他三歲的老友師叔了。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"fighter","level":65,"gender":"male","title":"雪吟莊莊主","equip":[{"path":"/d/snowkeep/npc/obj/brass_hat","use":"wear"},{"path":"/d/npc/obj/water_dragon_girdle","use":"wear"},{"path":"/d/npc/obj/spider_boots","use":"wear"},{"path":"/d/npc/obj/golden_robe","use":"wear"},{"path":"/d/snowkeep/npc/obj/ring_of_mighty_dragon","use":"wear"},{"path":"/d/snowkeep/npc/obj/golden_blade","use":"wield"},{"path":"/d/snowkeep/npc/obj/brass_key","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/snowkeep/inner_hall",1]]},"/custom/legacy_npc/yu_wen":{"id":"/custom/legacy_npc/yu_wen","file":"source/upstream/mudlib/custom/legacy_npc/yu_wen.c","name":"宇文嵐胥","ids":["yu wen","yu","wen"],"long":"一個身材高瘦的中年畫師, 他的臉孔清瞿, 眉間隱隱有憂色, 不時發出\n幾聲低沉的嘆氣聲 ...。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":20,"gender":"male","title":null,"equip":[{"path":"/d/wutang/npc/obj/black_mandarin_jacket","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhang_jun_ren":{"id":"/custom/legacy_npc/zhang_jun_ren","file":"source/upstream/mudlib/custom/legacy_npc/zhang_jun_ren.c","name":"張俊仁","ids":["zhang jun ren","zhang","ren"],"long":"張俊仁是封山劍派掌門人柳東蘆的得意門生，雖然有些大器晚成，但是\n近年來行走江湖之中嚴守封山劍派門規，也算得上是一位大俠了。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":"封山派弟子","equip":[{"path":"/d/mengjia/npc/obj/red_dust_legs","use":"wear"},{"path":"/d/wutang/npc/obj/blue_cloth","use":"wear"},{"path":"/d/ziyan/npc/obj/steel_chain_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhang_xiao_qian":{"id":"/custom/legacy_npc/zhang_xiao_qian","file":"source/upstream/mudlib/custom/legacy_npc/zhang_xiao_qian.c","name":"張小簽","ids":["zhang xiao qian","zhang","qian"],"long":"你面前這個雲遊四海的江湖藝人叫張小簽，他最擅長的就是變戲法，有時能把\n東西變沒，有時又能再變一個出來。你要是不相信的話，不妨給他點甚麼讓他\n變變看。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":"江湖藝人","equip":[{"path":"/d/lee/npc/obj/leather_boots","use":"wear"},{"path":"/d/npc/obj/white_scholar_dress","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhang_yun":{"id":"/custom/legacy_npc/zhang_yun","file":"source/upstream/mudlib/custom/legacy_npc/zhang_yun.c","name":"張雲","ids":["zhang yun","zhang","yun"],"long":"張雲十幾年前便拜在虎刀門耆宿「高慎」門下習武，後來到總壇參加比武\n大會，苦鬥近百合險勝「屠龍虎」駱雲飛，不料卻在十合之內敗給虎刀掌\n門僅十三歲的義女「孫漪」。此後他便留在總壇勤奮練功，五年不曾下山。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"male","title":"虎刀門護衛","equip":[{"path":"/custom/armor/armor/hell_dragon_armor","use":"wear"},{"path":"/custom/armor/cloth/tiger_coat","use":"wear"},{"path":"/custom/armor/head/war_hat","use":"wear"},{"path":"/custom/weapon/blade/colosus_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/ziyan/npc/zhao_hong_chun":{"id":"/d/ziyan/npc/zhao_hong_chun","file":"source/upstream/mudlib/d/ziyan/npc/zhao_hong_chun.c","name":"趙弘春","ids":["zhao hong chun","zhao","chun"],"long":"趙弘春是酉縣的縣令, 不過謠傳說他的官位是花銀子買來的, 再加上\n他平時總是常常結交一些達官貴人, 因此在仕途上也是一帆風順, 不\n過紫煙鎮的居民卻普遍對這位縣令沒有好感, 據說雲鶴山的盜匪就是\n因為和他作對, 而被官府通緝, 被迫躲進雲鶴山據地為王, 也因此趙\n弘春處心積慮的想要消滅那群盜匪, 以除其心腹大患.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":"male","title":"縣令","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/ziyan/inner_hall",1]]},"/custom/legacy_npc/zhao_xiao_jiu":{"id":"/custom/legacy_npc/zhao_xiao_jiu","file":"source/upstream/mudlib/custom/legacy_npc/zhao_xiao_jiu.c","name":"趙曉九","ids":["zhao xiao jiu","zhao","jiu"],"long":"趙曉九自由喜愛神秘的東西，所以才會當了道士，一天到晚玩弄著\n別人看不懂的把戲，畫著讓人莫名奇妙的道符。他最大的嗜好就是\n收集古籍，從中找尋失傳的法術。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":20,"gender":"male","title":"隱風觀道士","equip":[{"path":"/d/npc/obj/peachwood_sword","use":"wield"},{"path":"/d/taiyi/npc/obj/black_cloth_boots","use":"wear"},{"path":"/d/npc/obj/copper_hat","use":"wear"},{"path":"/custom/armor/cloth/gray_taoist_robe","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhong_chu":{"id":"/custom/legacy_npc/zhong_chu","file":"source/upstream/mudlib/custom/legacy_npc/zhong_chu.c","name":"鍾貙","ids":["zhong chu","zhong","chu"],"long":"鍾貙是目前神武軍營最高指揮官，神武軍營鎮守志縣，牽制泰武定國，是天\n朝東南隅最重要防線，泰武定國雖然已歸順天朝十餘年，但其內部還是時有\n反天朝人士活動，所以神武軍營的重要性就更顯重要了，鍾貙是軒轅軍中的\n重要將領，天生神力，善使大槌，與其交鋒敗在其手下的對手常常總是慘死\n的血肉模糊難以辯別的，所以有的人會稱呼他為 \"活閻羅\" ，而這個名號也\n確確實實令許多對手聞風喪膽。","weight":null,"value":null,"unit":null,"flags":[],"race":"blackteeth","class":"soldier","level":40,"gender":"male","title":"神武軍營提督","equip":[{"path":"/d/npc/obj/steel_boots","use":"wear"},{"path":"/custom/armor/armor/dragon_plate_of_knights","use":"wear"},{"path":"/d/baobao/npc/obj/steel_bracers","use":"wear"},{"path":"/custom/weapon/blunt/crasher_maul","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhong_hao":{"id":"/custom/legacy_npc/zhong_hao","file":"source/upstream/mudlib/custom/legacy_npc/zhong_hao.c","name":"鍾豪","ids":["zhong hao","zhong","hao"],"long":"碧幽部落的族長，他不久前到森林裡去一趟回來就得了一場大病，不但到現在\n都還沒好，還越來越嚴重，他已經派人去找醫生來看病，也吃過多種草藥，都\n還是沒有好轉的跡象。","weight":null,"value":null,"unit":null,"flags":[],"race":"dingling","class":"fighter","level":10,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zombie_warrior":{"id":"/custom/legacy_npc/zombie_warrior","file":"source/upstream/mudlib/custom/legacy_npc/zombie_warrior.c","name":"戰屍","ids":["zombie warrior","zombie","warrior"],"long":"曾經擁有榮譽的戰士﹐死後的屍體仍留有活著時的戰意。正是這股戰鬥\n意念維持著他腐爛的身軀。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zuo_guo_yi":{"id":"/custom/legacy_npc/zuo_guo_yi","file":"source/upstream/mudlib/custom/legacy_npc/zuo_guo_yi.c","name":"左國益","ids":["zuo guo yi","zuo","yi"],"long":"左國益是地氣塔塔頂的守衛主將﹐他身長九尺﹐站在你面前有如鐵塔\n一般﹐讓人望而生畏﹐即使是已經死了的人也不敢輕易惹他。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"地氣塔守衛","equip":[{"path":"/d/npc/obj/blood_stained_cloth","use":"wear"},{"path":"/custom/armor/armor/iron_torso","use":"wear"},{"path":"/custom/weapon/axe/grandaxe","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/snow/npc/fire_taoist":{"id":"/d/snow/npc/fire_taoist","file":"source/upstream/mudlib/d/snow/npc/fire_taoist.c","name":"朱衣派弟子","ids":["red-taoist","red taoist","red","taoist","朱衣派弟子"],"long":"這名朱衣派弟子精通天師道法【火術】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【火術】",160,"taoism-fire"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/d/snow/npc/freeze_taoist":{"id":"/d/snow/npc/freeze_taoist","file":"source/upstream/mudlib/d/snow/npc/freeze_taoist.c","name":"素衣派弟子","ids":["white-taoist","white taoist","white","taoist","素衣派弟子"],"long":"這名素衣派弟子精通天師道法【冰咒】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"woochan","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【冰咒】",160,"taoism-freeze"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/taoism/npc/maoshan_dog":{"id":"/custom/taoism/npc/maoshan_dog","file":"source/upstream/mudlib/custom/taoism/npc/maoshan_dog.c","name":"黃狗","ids":["summoned dog","dog"],"long":"一條由符紙化成的犬隻﹐一雙眼睛緊盯著主人的敵人。","weight":null,"value":null,"unit":"條","flags":[],"race":"beast","class":"commoner","level":1,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/snow/npc/storm_taoist":{"id":"/d/snow/npc/storm_taoist","file":"source/upstream/mudlib/d/snow/npc/storm_taoist.c","name":"玄衣派弟子","ids":["black-taoist","black taoist","black","taoist","玄衣派弟子"],"long":"這名玄衣派弟子精通天師道法【風符】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【風符】",160,"taoism-storm"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/d/snow/npc/thunder_taoist":{"id":"/d/snow/npc/thunder_taoist","file":"source/upstream/mudlib/d/snow/npc/thunder_taoist.c","name":"紫衣派弟子","ids":["purple-taoist","purple taoist","purple","taoist","紫衣派弟子"],"long":"這名紫衣派弟子精通天師道法【雷法】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【雷法】",160,"taoism-thunder"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/zhenwu/npc/lu_xinien":{"id":"/custom/zhenwu/npc/lu_xinien","file":"source/upstream/mudlib/custom/zhenwu/npc/lu_xinien.c","name":"魯熙年","ids":["lu xinien","lu","xinien","魯熙年"],"long":"魯熙年是一個身材微胖的中年武官﹐兩眼瞇成一條線﹐臉上總是露出似笑非笑的古怪表情。魯熙年同時也是振武營負責招募新兵的募兵官，如果你想從軍，請向他，辦理入伍(enlist)手續。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":50,"gender":"male","title":"徵兵官","equip":[{"path":"/d/npc/obj/steelblade","use":"wield"},{"path":"/d/npc/obj/iron_helmet","use":"wear"},{"path":"/d/npc/obj/iron_girth","use":"wear"},{"path":"/d/npc/obj/ring_armor","use":"wear"}],"skills":[["狂擊亂鬥之法",200,"berserk"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard10",1]]},"/custom/zhenwu/npc/mee_pei":{"id":"/custom/zhenwu/npc/mee_pei","file":"source/upstream/mudlib/custom/zhenwu/npc/mee_pei.c","name":"米沛","ids":["mee-pei","mee pei","mee","pei","米沛"],"long":"米沛是振武軍最高指揮官，身披戰甲，神情沉穩威嚴。他在軍中多年，以實戰與軍功一步步升任主將，看來約五十多歲。軍中傳聞具備相當實力的軍人可向他申請更進一步的職務，但相關條件目前仍待可靠資料補齊。","weight":null,"value":null,"unit":null,"flags":["限軍人"],"race":"human","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/d/npc/obj/steel_boots","use":"wear"},{"path":"/custom/zhenwu/obj/fire_gauntlets","use":"wear"},{"path":"/d/npc/obj/steel_armor","use":"wear"},{"path":"/custom/zhenwu/obj/great_axe_of_mighty","use":"wield"},{"path":"/obj/books/book_of_assault","use":""}],"skills":[["重擊術",180,"powerblow"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/big_tent",1]]},"/custom/zhenwu/npc/soldier":{"id":"/custom/zhenwu/npc/soldier","file":"source/upstream/mudlib/custom/zhenwu/npc/soldier.c","name":"小兵","ids":["soldier","小兵"],"long":"軍營裡的新兵，通常負責簡單的體力工作。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":5,"gender":null,"title":null,"equip":[{"path":"/d/npc/obj/clothboot","use":"wear"},{"path":"/d/npc/obj/helmet","use":"wear"},{"path":"/d/npc/obj/leather_armor","use":"wear"},{"path":"/custom/zhenwu/obj/short_pike","use":"wield"}],"skills":[["雙手槍法",20,"twohanded pike"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/gate",2]]},"/custom/zhenwu/npc/target_stake":{"id":"/custom/zhenwu/npc/target_stake","file":"source/upstream/mudlib/custom/zhenwu/npc/target_stake.c","name":"假人","ids":["target stake","stake","假人"],"long":"這是一具軍營內供新兵練武的粗麻木樁，樁身佈滿刀痕與箭孔。它被牢牢固定在地面，不會還手，也不會因操練而損壞，正適合反覆磨練基本招式。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard02",5],["/custom/zhenwu/room/yard03",5],["/custom/zhenwu/room/yard13",5],["/custom/zhenwu/room/yard14",5]]},"/custom/zhenwu/npc/zhenwu_soldier":{"id":"/custom/zhenwu/npc/zhenwu_soldier","file":"source/upstream/mudlib/custom/zhenwu/npc/zhenwu_soldier.c","name":"振武軍營士兵","ids":["soldier","振武軍營士兵"],"long":"振武軍營士兵是天朝帝國邊防最基層的步兵。他身穿粗糙皮甲，手執沉重長槍，雖沒有江湖大俠般的絕頂輕功，卻有一身扎實的軍旅外家拳腳，每日都在營邊巡邏警戒。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":35,"gender":null,"title":null,"equip":[{"path":"/d/npc/obj/clothboot","use":"wear"},{"path":"/d/npc/obj/helmet","use":"wear"},{"path":"/d/npc/obj/leather_armor","use":"wear"},{"path":"/obj/area/obj/pike","use":"wield"}],"skills":[["狂擊亂鬥之法",200,"berserk"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard04",5]]}},"rooms":{"/d/baihua/alley":{"id":"/d/baihua/alley","file":"source/upstream/mudlib/d/baihua/alley.c","short":"小巷","long":"你順著小路走, 這兒尋常人雖不多, 路旁的商家倒還挺會作生意的, 不斷向你招呼著. 一陣香肉味, 隱隱傳進你鼻子裡, 你不禁想起有好一陣子沒有吃香喝辣的了, 這就犒賞犒賞自己南北奔波, 終日殺戮的身子吧 !","exits":{"west":"/d/baihua/road1"},"objects":{"/d/baihua/npc/san":1,"/d/baihua/npc/girl":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,2,0]},"/d/baihua/cliff":{"id":"/d/baihua/cliff","file":"source/upstream/mudlib/d/baihua/cliff.c","short":"百花崖","long":"走到這裏時你嚇了一跳, 原來瓦屋之後竟有這般寬闊的景色, 在你腳邊的是深不見底的懸崖. 你心中暗叫僥倖! 差一點就摔下去了. 原來這裏是百花村的風景名勝之一『百花崖』, 你往下看去, 各式各樣的花沿著峭壁生長, 或者這就是百花村的由來吧!","exits":{"east":"/d/baihua/tile_house"},"objects":{"/d/baihua/npc/dou_foo":1},"special":[
