ource/upstream/mudlib/d/qiaoyin_east/fork.c","short":"岔路口","long":"路口立著一塊被磨得發白的界石，上頭的字跡早已難辨。路邊長著一大片半人高的草叢，草葉糾結成團，看不清底下藏著什麼；另一頭的小徑被踩得平整，隱約有藥草的苦香飄來，與荒草的氣味混在一處。","exits":{"westup":"/d/qiaoyin_east/mountain_road","south":"/d/qiaoyin_east/hut"},"objects":{},"special":[{"cmd":"pass 草叢","to":"/d/qiaoyin_east/thicket"}],"area":"喬陰東郊","layer":null,"areaKey":"喬陰東郊","pos":[2,1,0]},"/d/qiaoyin_east/ground_e":{"id":"/d/qiaoyin_east/ground_e","file":"source/upstream/mudlib/d/qiaoyin_east/ground_e.c","short":"練武場","long":"場中三具石假人排成一列，石面早被磨去了稜角，只剩模糊的人形輪廓。牆邊的兵器架上插著幾把木劍，劍柄纏著的粗布被汗水浸成了深色，角落裏的石鎖大小不一，想是讓人循序漸進地練氣力。","exits":{"west":"/d/qiaoyin_east/yard","south":"/d/qiaoyin_east/corridor_e"},"objects":{"/d/qiaoyin_east/npc/stone_stake":3},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[2,-1,0]},"/d/qiaoyin_east/ground_w":{"id":"/d/qiaoyin_east/ground_w","file":"source/upstream/mudlib/d/qiaoyin_east/ground_w.c","short":"練武場","long":"青石鋪成的方場被踏得光滑發亮，場邊立著三具石雕的假人，肩頭與胸口佈滿深淺不一的拳痕與劍痕。牆角擱著幾把木劍與練功用的沙袋，磨得發白的石面上留著前人踏出的凹窩，一看便知常有人在此流汗。","exits":{"east":"/d/qiaoyin_east/yard","south":"/d/qiaoyin_east/corridor_w"},"objects":{"/d/qiaoyin_east/npc/stone_stake":3},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[0,-1,0]},"/d/qiaoyin_east/guest_room":{"id":"/d/qiaoyin_east/guest_room","file":"source/upstream/mudlib/d/qiaoyin_east/guest_room.c","short":"客房","long":"客房不大，一張木榻、一張方桌，被褥疊得整整齊齊，帶著曬過的乾草味。桌上的粗瓷茶壺與兩個茶杯擦得乾淨，想是為借宿的香客與過路人預備的。窗外有一枝松枝探進來，在窗欞上擦出細細的聲響。","exits":{"east":"/d/qiaoyin_east/sutra_hall"},"objects":{},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[-1,1,0]},"/d/qiaoyin_east/hall":{"id":"/d/qiaoyin_east/hall","file":"source/upstream/mudlib/d/qiaoyin_east/hall.c","short":"三清殿","long":"殿中供著三清塑像，神像面容祥和，衣紋上的金漆雖已剝落，卻仍看得出當年的華貴。供桌上的長明燈靜靜燃著，銅磬與木魚擺得齊整。殿門朝外敞開，香客與過路人進出，也不見有人阻攔。","exits":{"north":"/d/qiaoyin_east/court","west":"/d/qiaoyin_east/sutra_hall","east":"/d/qiaoyin_east/refectory","out":"/d/qiaoyin_east/outside"},"objects":{"/d/qiaoyin_east/npc/tianfong":1},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[1,1,0]},"/d/qiaoyin_east/hut":{"id":"/d/qiaoyin_east/hut","file":"source/upstream/mudlib/d/qiaoyin_east/hut.c","short":"草廬","long":"草廬以竹為梁，茅草覆頂，屋裏擱著一張矮几與兩把竹椅，收拾得整齊。窗外種著大量的樹木，枝葉層層疊疊地貼著窗紗，把外頭的光篩得斑斑點點，屋內因此帶著幾分林間的幽靜。","exits":{"north":"/d/qiaoyin_east/fork","south":"/d/qiaoyin_east/clinic"},"objects":{},"special":[],"area":"喬陰東郊","layer":null,"areaKey":"喬陰東郊","pos":[2,2,0]},"/d/qiaoyin_east/mountain_road":{"id":"/d/qiaoyin_east/mountain_road","file":"source/upstream/mudlib/d/qiaoyin_east/mountain_road.c","short":"山路","long":"山路隨著坡勢蜿蜒而上，路面夾碎石，被牛車與腳步碾出兩道深深的轍痕。路旁的雜草長得及膝，偶爾能見到折斷的箭桿與褪了色的布條，不知是哪一年留下的。松濤在山坳間來回盪著，讓這條路顯得格外空曠。","exits":{"northwest":"/d/qiaoyin_east/outside","eastdown":"/d/qiaoyin_east/fork"},"objects":{},"special":[],"area":"喬陰東郊","layer":null,"areaKey":"喬陰東郊","pos":[1,1,0]},"/d/qiaoyin_east/outside":{"id":"/d/qiaoyin_east/outside","file":"source/upstream/mudlib/d/qiaoyin_east/outside.c","short":"喬陰城外","long":"出了城牆，土路兩旁是農戶開墾出來的田埂，幾株老柳歪歪斜斜地立在溝渠邊。北面的坡上露出白雲觀的黃牆灰瓦，山門半掩，門前被往來的香客踩出一圈光禿禿的泥地。空氣裏帶著草木的清氣，遠處不時傳來幾聲犬吠。","exits":{"enter":"/d/qiaoyin_east/hall","southeast":"/d/qiaoyin_east/mountain_road","southwest":"/d/qiaoyin/egate"},"objects":{},"special":[],"area":"喬陰東郊","layer":null,"areaKey":"喬陰東郊","pos":[0,0,0]},"/d/qiaoyin_east/refectory":{"id":"/d/qiaoyin_east/refectory","file":"source/upstream/mudlib/d/qiaoyin_east/refectory.c","short":"齋堂","long":"齋堂裏擺著幾張長條木桌，桌面被油水浸得發亮，牆角大灶上擱著一口燻黑的鐵鍋，米香淡淡地飄著。觀裏的道士們進進出出，碗筷碰撞的聲音此起彼落，在這避世的山觀裏顯出一份踏實的人間煙火。","exits":{"north":"/d/qiaoyin_east/corridor_e","west":"/d/qiaoyin_east/hall"},"objects":{},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[2,1,0]},"/d/qiaoyin_east/sutra_hall":{"id":"/d/qiaoyin_east/sutra_hall","file":"source/upstream/mudlib/d/qiaoyin_east/sutra_hall.c","short":"經堂","long":"堂中三面牆都是書架，擺滿了泛黃的經卷與道書，不少書脊被翻得起毛邊。靠窗的長案上放著筆墨與一本攤開的抄本，墨跡猶新，看來時常有人在此研讀。紙墨混著檀香的氣味，教人不自覺放輕了腳步。","exits":{"north":"/d/qiaoyin_east/corridor_w","west":"/d/qiaoyin_east/guest_room","east":"/d/qiaoyin_east/hall"},"objects":{"/d/qiaoyin_east/npc/lay_ton":1},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[0,1,0]},"/d/qiaoyin_east/thicket":{"id":"/d/qiaoyin_east/thicket","file":"source/upstream/mudlib/d/qiaoyin_east/thicket.c","short":"雜草叢","long":"草叢裏比外頭看起來寬敞，雜草被壓出一小塊空地，地上留著幾處燒黑的灰燼與啃剩的獸骨，看來曾有人在此歇過腳。四周的草葉擠得密不透風，只剩來時那條被撥開的縫隙，還透進一絲亮來。","exits":{"east":"/d/qiaoyin_east/fork"},"objects":{},"special":[],"area":"喬陰東郊","layer":null,"areaKey":"喬陰東郊","pos":[4,0,0]},"/d/qiaoyin_east/yard":{"id":"/d/qiaoyin_east/yard","file":"source/upstream/mudlib/d/qiaoyin_east/yard.c","short":"後院","long":"後院方方正正，院心一口古井，井欄以青石砌成，繩子在欄緣勒出一道深深的溝。牆根下種著幾叢翠竹與一畦藥草，泥土的濕氣混著竹葉的清香，水桶輕碰井壁的聲音在院裏格外分明。","exits":{"west":"/d/qiaoyin_east/ground_w","east":"/d/qiaoyin_east/ground_e","south":"/d/qiaoyin_east/court"},"objects":{"/d/obj/well":1},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[1,-1,0]},"/d/shuiyue/cave":{"id":"/d/shuiyue/cave","file":"source/upstream/mudlib/d/shuiyue/cave.c","short":"神秘山洞","long":"想不到瀑布的後面竟然有這樣一個山洞，山洞內只有微弱的陽光而且異常的潮濕。山洞四週的石壁上長滿了厚厚的青苔，看起來，這個山洞已經很久沒有人來過了。","exits":{"out":"/d/shuiyue/waterfall"},"objects":{},"special":[{"cmd":"enter 縫隙","to":"/d/shuiyue/stone_house"}],"area":"水月村","layer":"洞穴","areaKey":"水月村","pos":[4,0,0]},"/d/shuiyue/chief_house":{"id":"/d/shuiyue/chief_house","file":"source/upstream/mudlib/d/shuiyue/chief_house.c","short":"村長家","long":"屋子是村裡少見的磚瓦房，樑柱雖舊，卻擦得光亮。堂上掛著一幅泛黃的山水，下面一張八仙桌，桌上擺著賬冊與算盤，村裡大小事務想必都在此商議。門檻被來來往往的鄉親踩得凹下去一塊。","exits":{"east":"/d/shuiyue/crossroad"},"objects":{"/d/shuiyue/npc/old_tu":1},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[-1,0,0]},"/d/shuiyue/crossroad":{"id":"/d/shuiyue/crossroad","file":"source/upstream/mudlib/d/shuiyue/crossroad.c","short":"十字路口","long":"村子的中心，四條大路在此交會，路口擺著一只大茶水桶，桶旁懸著一支竹勺，桶裡裝滿了清水，來往行人無論相識與否，都會停下來舀上一勺解渴。西邊那戶人家門前掃得乾乾淨淨，東邊客棧則不時傳出人聲與碗盤相碰的脆響。","exits":{"north":"/d/shuiyue/village1","south":"/d/shuiyue/village2","west":"/d/shuiyue/chief_house","east":"/d/shuiyue/inn"},"objects":{"/d/shuiyue/obj/tea_pot":1},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[0,0,0]},"/d/shuiyue/hunter_hut":{"id":"/d/shuiyue/hunter_hut","file":"source/upstream/mudlib/d/shuiyue/hunter_hut.c","short":"木屋內","long":"你走進了木屋, 桌旁坐了一個面帶愁容的老人, 牆上掛了許多的獵具, 也掛了許多猛獸的毛皮, 看來都是這個獵戶的戰利品.","exits":{"west":"/d/shuiyue/woods"},"objects":{"/d/shuiyue/npc/yu_tian_shan":1},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[2,-3,0]},"/d/shuiyue/inn":{"id":"/d/shuiyue/inn","file":"source/upstream/mudlib/d/shuiyue/inn.c","short":"福安客棧","long":"你走進一家規模頗大的客棧; 偌大的樓面坐滿了客人, 幾乎找不到空位入座. 酒菜的香氣從廚房中飄出, 令人聞之食指大動, 饞涎欲滴. 這家客棧專供外來遊客歇腳之用, 樓上還備有乾淨的客房讓外地人住宿, 在掌櫃的熱誠招待下, 許多遊人一再到此光顧, 因而建立起良好的聲譽、口碑.","exits":{"west":"/d/shuiyue/crossroad"},"objects":{"/d/shuiyue/npc/innkeeper":1},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[1,0,0]},"/d/shuiyue/mountain_path1":{"id":"/d/shuiyue/mountain_path1","file":"source/upstream/mudlib/d/shuiyue/mountain_path1.c","short":"上山小路","long":"小路沿著山坡蜿蜒而上，鋪路的石塊被磨得圓潤，縫隙間長滿了青苔。兩旁樹木漸漸濃密，林濤如潮，遠遠夾著溪水奔流的聲音，走一步便覺得空氣又涼了一分，像是正要走進雲霧裡。","exits":{"northup":"/d/shuiyue/village2","southdown":"/d/shuiyue/mountain_path2"},"objects":{},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[1,1,0]},"/d/shuiyue/mountain_path2":{"id":"/d/shuiyue/mountain_path2","file":"source/upstream/mudlib/d/shuiyue/mountain_path2.c","short":"上山小路","long":"山路至此變得平緩，路旁的樹叢中隱約看得見被踩出的小岔道，空氣裡帶著松脂與泥土混合的氣味。往來雪亭鎮的行人常在這裡歇腳，路邊的石塊被坐得光滑，像一張張天然的矮凳。","exits":{"northup":"/d/shuiyue/mountain_path1","south":"/d/snow/npath2"},"objects":{},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[2,1,0]},"/d/shuiyue/mud_road":{"id":"/d/shuiyue/mud_road","file":"source/upstream/mudlib/d/shuiyue/mud_road.c","short":"泥石路","long":"路面由碎石與黃泥夯成，車轍深深淺淺，踩上去微微發軟。路旁幾株老樹的枝椏高高伸向天空，其中最粗壯的一株就在東邊不遠，樹影遮住了半條路，讓人不自覺放慢了腳步。","exits":{"north":"/d/shuiyue/stone_road","south":"/d/shuiyue/village1","east":"/d/shuiyue/sky_tree"},"objects":{},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[0,-2,0]},"/d/shuiyue/sky_tree":{"id":"/d/shuiyue/sky_tree","file":"source/upstream/mudlib/d/shuiyue/sky_tree.c","short":"『丱天樹』","long":"丱天樹, 相傳是在泰武定國, 與香雪國, 兩國戰爭時, 天變異象, 巨雷轟至土地上, 方圓百里之內無一物倖存, 唯獨這棵當時還是棵小樹的丱天樹仍然屹立不搖不受影響, 後來陸陸續續有戰後人民遷移至此處, 傳聞才慢慢傳開, 而這棵樹木形狀像人的一雙手向上伸展的樹木, 居民於是取名為丱天樹。","exits":{"west":"/d/shuiyue/mud_road","north":"/d/shuiyue/woods"},"objects":{},"special":[{"cmd":"climb 丱天樹","to":"/d/shuiyue/tree_top"}],"area":"水月村","layer":null,"areaKey":"水月村","pos":[1,-2,0]},"/d/shuiyue/stone_house":{"id":"/d/shuiyue/stone_house","file":"source/upstream/mudlib/d/shuiyue/stone_house.c","short":"石屋","long":"石屋不大，卻收拾得井井有條，粗木桌椅與一口灶火一應俱全，頭頂開著一道天井，天光與山風一同灌進來，使屋裡既不陰濕也不悶熱。牆邊的劍架上擱著幾柄舊劍，劍身擦得雪亮，映出屋主人素日的性情。","exits":{"out":"/d/shuiyue/cave"},"objects":{"/d/shuiyue/npc/wei_feng":1},"special":[],"area":"水月村","layer":"洞穴","areaKey":"水月村","pos":[6,0,0]},"/d/shuiyue/stone_road":{"id":"/d/shuiyue/stone_road","file":"source/upstream/mudlib/d/shuiyue/stone_road.c","short":"石板路","long":"石板路被往來的腳步磨得溫潤發亮，縫隙裡冒出幾叢倔強的野草，路旁一條山溪淙淙流過，水聲清脆。遠遠有流水沖擊岩壁的悶響，從東邊的林子裡隱約傳來，挑擔的村民與背著包袱的遊客錯身而過，彼此點頭招呼，神情悠閒。","exits":{"north":"/d/fengcheng/gate","south":"/d/shuiyue/mud_road"},"objects":{},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[0,-3,0]},"/d/shuiyue/tree_hollow":{"id":"/d/shuiyue/tree_hollow","file":"source/upstream/mudlib/d/shuiyue/tree_hollow.c","short":"樹洞","long":"樹洞是被歲月蛀空的樹心，大小足夠容身，壁上留著一道道深深的抓痕，混著濃濃的獸腥味與乾草的氣息。洞底散落著零星的碎骨，暗處一雙雙冷光閃動，彷彿隨時會撲將上來。","exits":{"out":"/d/shuiyue/tree_top"},"objects":{"/d/shuiyue/npc/leopard":4},"special":[],"area":"水月村","layer":"樹上","areaKey":"水月村","pos":[8,0,0]},"/d/shuiyue/tree_top":{"id":"/d/shuiyue/tree_top","file":"source/upstream/mudlib/d/shuiyue/tree_top.c","short":"樹上","long":"這裡是樹上, 你隱隱約約有聽到有人在喊叫, 附近亦無人在場, 令你不禁有點發寒, 四周圍陰冷潮溼, 沒有什麼特別的, 只有你眼前的樹洞, 和一條條枯藤, 以及一些青苔。","exits":{"down":"/d/shuiyue/sky_tree"},"objects":{"/d/npc/squirrel":4},"special":[{"cmd":"enter 樹洞","to":"/d/shuiyue/tree_hollow"}],"area":"水月村","layer":"樹上","areaKey":"水月村","pos":[9,0,0]},"/d/shuiyue/village1":{"id":"/d/shuiyue/village1","file":"source/upstream/mudlib/d/shuiyue/village1.c","short":"水月村","long":"村口的老槐樹下擺著幾張竹凳，村民三三兩兩聚在一塊閒話家常，孩童追逐嬉笑，雞犬相聞，一派恬靜。只是不時有人抬頭望向天空，似乎對近年出沒的巨鳥仍有些放不下心。","exits":{"north":"/d/shuiyue/mud_road","south":"/d/shuiyue/crossroad"},"objects":{},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[0,-1,0]},"/d/shuiyue/village2":{"id":"/d/shuiyue/village2","file":"source/upstream/mudlib/d/shuiyue/village2.c","short":"水月村","long":"村子的南頭，幾戶人家的矮牆圍著小菜畦，竹籬笆上爬滿了牽牛花。遠處山腳下有一條蜿蜒向上的小路，緩緩隱入林間，偶爾有背著行囊的旅人從那邊走下來，在村裡討碗茶水再趕路。","exits":{"north":"/d/shuiyue/crossroad","southdown":"/d/shuiyue/mountain_path1"},"objects":{},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[0,1,0]},"/d/shuiyue/waterfall":{"id":"/d/shuiyue/waterfall","file":"source/upstream/mudlib/d/shuiyue/waterfall.c","short":"水月瀑布","long":"展現在你眼前的就是著名的水月瀑布了, 澄澈透明的泉水, 從五六十尺高的山壁奔流而下, 墜入沁綠的深潭中, 氣勢浩蕩, 吸引了不少遊客在此佇足觀賞, 有時午後下過雨後會出現七色彩虹, 更是一大美景。瀑布四面皆有高聳的山壁圍繞, 蔓綠的藤草, 任意攀附生長, 到處都是水霧迷漫, 氣嵐煙騰。","exits":{"south":"/d/shuiyue/woods"},"objects":{},"special":[{"cmd":"enter 水月瀑布","to":"/d/shuiyue/cave"}],"area":"水月村","layer":null,"areaKey":"水月村","pos":[1,-4,0]},"/d/shuiyue/woods":{"id":"/d/shuiyue/woods","file":"source/upstream/mudlib/d/shuiyue/woods.c","short":"樹林","long":"密密的樹林裡光影斑駁，一條被踩實的小徑通向東邊，盡頭隱約露出一間木屋的屋角，屋簷下晾著幾張獸皮。林中除了遠處瀑布的轟鳴，便只有枝頭鳥雀偶爾的啼叫，與瀑布一帶的喧譁相比，這裡格外清幽。","exits":{"north":"/d/shuiyue/waterfall","south":"/d/shuiyue/sky_tree","east":"/d/shuiyue/hunter_hut"},"objects":{},"special":[],"area":"水月村","layer":null,"areaKey":"水月村","pos":[1,-3,0]},"/d/snow/bazar":{"id":"/d/snow/bazar","file":"source/upstream/mudlib/d/snow/bazar.c","short":"魚記小鋪","long":"這裡是一間小店鋪, 右側擺了個長架, 不甚起眼的幾件日常用品零\n零疏疏地擺在架上, 你看到了有瓶罐, 棉被, 碗盤竹筷等雜物, 不過上\n面隱隱有些灰塵黃土, 似乎這兒老闆不常清掃. 正廳有個大圓桌, 上面\n擺了些布匹服飾. 左側有個高大的櫃臺, 上面橫掛了個匾額  (look 匾\n額 ), 看來像是個小錢莊.","exits":{"west":"/d/snow/sstreet1"},"objects":{"/d/snow/npc/yu":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,4,0]},"/d/snow/bug_room":{"id":"/d/snow/bug_room","file":"source/upstream/mudlib/d/snow/bug_room.c","short":"小廣場","long":"這裏是個小廣場，幾棵樹稀稀落落的長在附近，中央有個小型的\n留言版，可供民眾回報所遭遇的怪異現象，往南可回到人聲鼎沸的雪\n亭鎮廣場。","exits":{"south":"/d/snow/square_w"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,1,0]},"/d/snow/court":{"id":"/d/snow/court","file":"source/upstream/mudlib/d/snow/court.c","short":"鄉校","long":"這裡是雪亭鎮的鄉校﹐平常鎮民對官府的施政有什麼不滿的可以到\n這裡來向校老申訴﹐所謂的校老就是地方上有德行與聲望的老人﹐今年\n擔任校老的是開磨坊的楊老爹﹐但是他最近身體不是很好﹐並不常到鄉\n校裡來﹐往南是街道﹐北邊是一間衙堂﹐當縣裡派師爺來這裡斷事就會\n在那裡開堂。","exits":{"south":"/d/snow/wstreet3"},"objects":{"/d/snow/npc/oldman":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-7,2,0]},"/d/snow/ebridge":{"id":"/d/snow/ebridge","file":"source/upstream/mudlib/d/snow/ebridge.c","short":"木橋","long":"你現在來到一條橫過山澗的木橋上。\n山澗雖不甚寬﹐但是深度卻有三、四丈﹐是雪亭鎮上居民主要的飲用水源。\n木橋連通溪邊小路和東邊的山路，橋面已經有些年頭了﹐不過看起來還算堅固。\n橋下的溪水正發出轟隆轟隆的巨響流過溪谷﹐往西是雪亭鎮﹐往東則通往著名的雪吟山莊。","exits":{"west":"/d/snow/npath3","east":"/d/snowkeep/entrance"},"objects":{"/d/snowkeep/npc/guard":2,"/d/npc/ghost/wronged_ghost":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,0,0]},"/d/snow/egate":{"id":"/d/snow/egate","file":"source/upstream/mudlib/d/snow/egate.c","short":"河邊","long":"破舊大宅外，你眼前是兩條河流的匯流處，來自西北、東北的兩條\n小河匯流後，緩緩的向西南流去。西北邊的河流上有一座小橋，過了橋\n，沿著東北邊河流的小石子路可以通往李家村。　","exits":{"west":"/d/snow/ruin1","northeast":"/d/lee/entrance_s"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,2,0]},"/d/snow/epath":{"id":"/d/snow/epath","file":"source/upstream/mudlib/d/snow/epath.c","short":"僻靜小巷","long":"這裡是條僻靜的小巷子﹐往西不遠處通往雪亭鎮的廣場﹐小巷的北\n面是一些瓦屋﹐圍繞著高高的圍牆﹐看來是有錢人的屋子﹐南邊有家小\n藥鋪﹐門口掛了好些曬乾的藥草﹐小巷往東是個轉角。","exits":{"east":"/d/snow/lane1","west":"/d/snow/square_e","south":"/d/snow/herb_shop"},"objects":{},"special":[{"cmd":"climb 圍牆","to":"/d/snow/kitchen"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,2,0]},"/d/snow/fireplace":{"id":"/d/snow/fireplace","file":"source/upstream/mudlib/d/snow/fireplace.c","short":"大灶內","long":"你現在正蜷縮著擠在一個大灶之中, 頭頂上方隱隱可看到煙囪的出\n口, 不過顯然沒有辦法爬出去, 這裡的牆壁因為長年燒火而變得烏黑, \n地面上積了一層厚厚的柴灰.","exits":{"out":"/d/snow/inn_kitchen"},"objects":{"/d/snow/obj/woodsword":1,"/d/snow/obj/woodblade":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,1,0]},"/d/snow/herb_shop":{"id":"/d/snow/herb_shop","file":"source/upstream/mudlib/d/snow/herb_shop.c","short":"小藥鋪","long":"這裡是一間小藥鋪﹐連像樣一點的招牌都沒有﹐只在門邊掛著一塊\n不甚起眼的木牌﹐上面寫著「順生堂」三個字﹐老舊的櫃臺後面陳列著\n一列藥櫃﹐藥櫃的每個抽屜按藥鋪的規矩都沒有任何標籤﹐西面的牆上\n吊著幾束曬乾的甘草﹐像這種小藥鋪沒有錢燒檀香祛除藥味﹐只好用甘\n草替代。","exits":{"north":"/d/snow/epath"},"objects":{"/d/snow/npc/herbalist":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,3,0]},"/d/snow/inn_hall":{"id":"/d/snow/inn_hall","file":"source/upstream/mudlib/d/snow/inn_hall.c","short":"客棧大堂","long":"這裡是一家客棧的大堂﹐老舊的桌椅因為經年的使用而變得烏黑黝亮。\n西邊隔著一層竹簾隱隱傳來一陣陣鍋鏟的聲音﹐大概是客棧的廚房。\n靠北邊的牆壁邊上有一道通往二樓雅座的樓梯﹐樓梯下就是櫃臺。\n東邊是客棧的出口﹐門口一串紙糊燈籠隨風搖擺﹐上面寫著「飲風客棧」：\n意思是即使你沒有錢﹐也歡迎來這裡聊天聽書﹐喝西北風。\n西南邊有一扇木門通往客棧後面的馬房。","exits":{"west":"/d/snow/inn_kitchen","east":"/d/snow/square_w"},"objects":{"/d/snow/npc/waiter":1,"/d/snow/npc/innkeeper":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,2,0]},"/d/snow/inn_kitchen":{"id":"/d/snow/inn_kitchen","file":"source/upstream/mudlib/d/snow/inn_kitchen.c","short":"廚房","long":"這裡是一間寬敞的廚房﹐一座大灶佔據了東邊半個牆壁﹐南邊的櫃\n子整整齊齊地放著許多鍋碗瓢盆﹐這裡平常是相當忙碌的﹐如果你要在\n這裡東張西望的話﹐最好小心別被店小二端著的熱湯給燙到了﹐往東可\n以回到客棧裡。","exits":{"east":"/d/snow/inn_hall"},"objects":{},"special":[{"cmd":"enter 大灶","to":"/d/snow/fireplace"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,2,0]},"/d/snow/inn_staff_room":{"id":"/d/snow/inn_staff_room","file":"source/upstream/mudlib/d/snow/inn_staff_room.c","short":"客棧人員休息室","long":"這裡是飲風客棧後院的員工休息室，供 NPC 員工休息和放鬆。\n普通玩家無法進入這裡，巫師可以在這裡休息，或者和 NPC 員工聊天，了解客棧的內部運作。","exits":{},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮"},"/d/snow/kitchen":{"id":"/d/snow/kitchen","file":"source/upstream/mudlib/d/snow/kitchen.c","short":"廚房","long":"你現在正在一戶有錢人家的廚房裡﹐不過和你想像中的有錢人家廚\n房好像不太一樣﹐並沒有堆滿了雞鴨魚肉跟山珍海味﹐想來有錢人也是\n省吃儉用才能有錢的﹐廚房的門在你的南邊﹐不過鎖住了﹐東邊則是你\n進來的圍牆。","exits":{},"objects":{"/obj/food/dumpling":2},"special":[{"cmd":"climb 圍牆","to":"/d/snow/epath"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,1,0]},"/d/snow/lane1":{"id":"/d/snow/lane1","file":"source/upstream/mudlib/d/snow/lane1.c","short":"僻靜小巷","long":"這裡是條僻靜小巷的轉角處﹐小巷往北可以通往溪邊﹐從這裡就可\n以聽到溪流轟轟的聲音﹐東邊是一棟破舊的大宅院﹐門口的一的破匾寫\n著「長樂侯府」﹐不過裡面已經是斷垣殘璧了﹐小巷南邊有一座小土地\n公廟。","exits":{"north":"/d/snow/lane2","west":"/d/snow/epath","east":"/d/snow/ruin1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,2,0]},"/d/snow/lane2":{"id":"/d/snow/lane2","file":"source/upstream/mudlib/d/snow/lane2.c","short":"溪邊小路","long":"你現在來到一處巷子的入口﹐往北通往一條溪邊的小路﹐西邊是一\n棟大瓦屋﹐大門深鎖著﹐東邊有一家磨坊﹐磨坊屋旁一個水車正轆轆地\n轉著﹐往南通往巷子裡的一個轉角。","exits":{"south":"/d/snow/lane1","north":"/d/snow/npath3"},"objects":{},"special":[{"cmd":"enter 磨坊","to":"/d/snow/mill"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,1,0]},"/d/snow/mill":{"id":"/d/snow/mill","file":"source/upstream/mudlib/d/snow/mill.c","short":"磨坊","long":"這裡是一間以磨麵粉為業的磨坊﹐屋子裡一大半的空間被一架水車\n佔據﹐水車轉動橫過屋樑上的木軸﹐木軸推動幾個絞盤轉動屋子中央的\n石磨﹐房子的另一角堆放著一些空的麻袋。","exits":{"out":"/d/snow/lane2"},"objects":{"/d/snow/npc/miller":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,1,0]},"/d/snow/ngate":{"id":"/d/snow/ngate","file":"source/upstream/mudlib/d/snow/ngate.c","short":"山路","long":"你現在正走在一條蜿蜒的山路上﹐往南不遠處可以看見許多人家和\n房舍﹐往北則通往山上﹐山路兩旁長滿雜草﹐靠西的一面是山壁﹐東邊\n是平緩的山坡﹐山坡盡頭是一片草地。","exits":{"south":"/d/snow/nstreet2"},"objects":{"/d/snow/npc/garrison":4,"/d/snow/npc/lieutenant":1,"/d/npc/ghost/tiger_thrall":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,-2,0]},"/d/snow/npath1":{"id":"/d/snow/npath1","file":"source/upstream/mudlib/d/snow/npath1.c","short":"小路","long":"這裡是一條黃土小路﹐往西可以回到雪亭鎮的主要街道﹐北邊是一\n片草地﹐草地盡頭則是一片樹林﹐往東你可以聽到淙淙的水聲﹐不遠處\n可以望見一條山溪。","exits":{"east":"/d/snow/npath2","west":"/d/snow/nstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,-1,0]},"/d/snow/npath2":{"id":"/d/snow/npath2","file":"source/upstream/mudlib/d/snow/npath2.c","short":"溪邊小路","long":"這裡是一條溪邊的小路﹐從這裡可以望見北邊的山間一道瀑布從崖\n上垂下﹐穿過山坡上的一片樹林﹐以及不遠處的草地﹐往你的東南邊流\n過﹐溪水衝激著溪床的岩石﹐發出轟轟的響聲﹐往西沿著小路可以回到\n雪亭鎮的大街﹐小路向東南可以通往溪邊。","exits":{"southeast":"/d/snow/npath3","west":"/d/snow/npath1","north":"/d/shuiyue/mountain_path2"},"objects":{"/d/snow/npc/woman":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,-1,0]},"/d/snow/npath3":{"id":"/d/snow/npath3","file":"source/upstream/mudlib/d/snow/npath3.c","short":"溪邊小路","long":"你現在來到一條溪流邊上的小路﹐溪水流過佈滿石塊的河床發出轟\n轟的聲音﹐一條木橋跨過溪流往東通往鎮外的小路﹐沿著溪邊往南不遠\n處則可以望見一間磨坊。北邊一條小路可以下到溪谷中。","exits":{"north":"/d/snow/river1","south":"/d/snow/lane2","northwest":"/d/snow/npath2","east":"/d/snow/ebridge"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,0,0]},"/d/snow/nstreet1":{"id":"/d/snow/nstreet1","file":"source/upstream/mudlib/d/snow/nstreet1.c","short":"街道","long":"這裡是雪亭鎮北邊的主要街道﹐往南通往鎮上最熱鬧的廣場﹐往北\n則通往鎮北的山路﹐你的西邊都是一些賣雜貨的店鋪﹐這一帶除了市集\n的日子﹐並不常有太多人走動。你注意到東邊有一間不太顯眼的土地公\n廟。","exits":{"south":"/d/snow/square_n","north":"/d/snow/nstreet2","east":"/d/snow/small_temple"},"objects":{"/d/npc/ghost/wandering_soul":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,0,0]},"/d/snow/nstreet2":{"id":"/d/snow/nstreet2","file":"source/upstream/mudlib/d/snow/nstreet2.c","short":"街道","long":"這裡是雪亭鎮北邊的主要街道﹐往南稍遠處便是一處廣場﹐往北可\n見一條蜿蜒的山路穿過長滿芒草的山坡通往野羊山上﹐東邊是一條小路\n通往溪邊﹐西邊則是一間驛站。","exits":{"west":"/d/snow/post_office","east":"/d/snow/npath1","south":"/d/snow/nstreet1","north":"/d/snow/ngate"},"objects":{"/d/npc/man":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,-1,0]},"/d/snow/post_office":{"id":"/d/snow/post_office","file":"source/upstream/mudlib/d/snow/post_office.c","short":"雪亭驛","long":"這裡是雪亭鎮的驛站﹐雖然驛站主要是替官府遞送文書﹐不過由於近年來\n土匪強盜出沒頻繁﹐也不少百姓會花一些錢請驛站的官員幫忙送信收信，喬陰\n縣的縣令認為土匪擾民是官府的施政缺失，驛站若是還收百姓的錢，實在是受\n之有愧，索性下令縣內驛站對百姓的郵遞委託一律不得收費。\n\n如果你想要收發信，可以用 request 向驛站官員領取收發信的信札。","exits":{"east":"/d/snow/nstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,-1,0]},"/d/snow/river1":{"id":"/d/snow/river1","file":"source/upstream/mudlib/d/snow/river1.c","short":"溪邊","long":"這裡是溪流旁的亂石灘，溪流兩岸都有一丈多高，只有此處因為溪\n流彎道沖積，形成一處小石灘，水流衝激的聲音經過溪谷的回音震耳欲\n聾，往南一條小路可以回到岸邊。","exits":{"south":"/d/snow/npath3"},"objects":{"/d/snow/npc/fire_taoist":1,"/d/snow/npc/freeze_taoist":1,"/d/snow/npc/storm_taoist":1,"/d/snow/npc/thunder_taoist":1,"/d/npc/ghost/water_goblin":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,-1,0]},"/d/snow/riverbank":{"id":"/d/snow/riverbank","file":"source/upstream/mudlib/d/snow/riverbank.c","short":"河邊空地","long":"這裡是河邊的一處空地﹐湍急的河流從你的北邊往東南邊流去﹐離\n這裡的河岸往北一丈多遠的地方可以看見一個水車﹐南邊則是一間破舊\n的大宅院﹐牆壁上一個大缺口足足可以讓人通過。","exits":{"south":"/d/snow/ruin2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,0,0]},"/d/snow/ruin1":{"id":"/d/snow/ruin1","file":"source/upstream/mudlib/d/snow/ruin1.c","short":"破舊大宅","long":"這裡是一間破舊大宅的前院﹐大廳已經崩塌了一半﹐焦黑的樑柱擋\n住了你的去路﹐庭院裡雜草叢生﹐看來已經很久沒有人住了﹐據說這裡\n晚上有鬼魂出現﹐但是倒也從沒聽說過有人被害﹐因此附近的居民仍然\n照常生活﹐往西可以經由大宅的正門回到街上。","exits":{"west":"/d/snow/lane1","east":"/d/snow/egate"},"objects":{"/d/npc/ghost/wandering_soul":1},"special":[{"cmd":"climb 樑柱","to":"/d/snow/ruin2"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,2,0]},"/d/snow/ruin2":{"id":"/d/snow/ruin2","file":"source/upstream/mudlib/d/snow/ruin2.c","short":"破舊大宅正廳","long":"這裡是一棟破舊大宅的正廳﹐北面的牆壁跟屋頂已經整個坍塌了﹐\n涼颼颼的冷風從北邊的缺口直灌進來﹐另你覺得意外的是﹐這裡清掃得\n相當整潔﹐地上用乾草整整齊齊地鋪著一個床舖﹐說是流浪漢在這裡棲\n宿卻也不像﹐哪裡會有這麼愛整潔的流浪漢﹖大廳倒塌的樑柱擋住了往\n西的出口。","exits":{"north":"/d/snow/riverbank"},"objects":{"/d/snow/npc/girl":1},"special":[{"cmd":"climb 樑柱","to":"/d/snow/ruin1"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,1,0]},"/d/snow/school":{"id":"/d/snow/school","file":"source/upstream/mudlib/d/snow/school.c","short":"私塾","long":"這裡是一間私塾﹐簡單的陳設與幾張排得整整齊齊的桌椅﹐就是這\n間屋子的所有傢具﹐屋角一個大書櫃﹐裡面放著許多手抄本的古書﹐不\n過書櫃的門是鎖著的﹐最前面的桌上放著文房四寶﹐與一盆小巧的盆栽\n柏樹﹐私塾的出口在北邊。","exits":{"north":"/d/snow/wstreet1"},"objects":{"/d/snow/npc/teacher":1,"/d/snow/npc/alchemist":1,"/d/snow/npc/child3":2},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,4,0]},"/d/snow/sgate":{"id":"/d/snow/sgate","file":"source/upstream/mudlib/d/snow/sgate.c","short":"草棚","long":"這裡是雪亭鎮南邊的入口﹐往北穿過草棚通往雪亭鎮的街道﹐出草\n棚往鎮外有兩條路﹐往東南的路穿過雪亭南方的老松林﹐通往縣城喬陰\n﹐這條路雖然比較近﹐但是近來一群自稱老松寨的土匪常常在這一帶出\n沒﹐往西的一條沿著老松林外的大路通往鄰近的五堂鎮﹐從喬陰縣城往\n天邪國的商旅現在大多繞道走這一條路﹐因為往五堂鎮的路上有一處北\n軍府訓練新兵的軍營﹐常有軍士巡邏﹐攔路強人多半不敢滋事。","exits":{"north":"/d/snow/sstreet1","west":"/custom/zhenwu/room/gate","southeast":"/d/oldpine/entrance"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,5,0]},"/d/snow/small_temple":{"id":"/d/snow/small_temple","file":"source/upstream/mudlib/d/snow/small_temple.c","short":"土地公廟","long":"這裡是一處小而整潔的土地公廟，中央一座紅磚砌成的神龕裡供奉著一尊黑色臉龐的土地公神像。\n神龕前有一個黃銅香爐，幾注線香伴隨著輕煙散發出一種安詳的氛圍。","exits":{"west":"/d/snow/nstreet1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,0,0]},"/d/snow/smithy":{"id":"/d/snow/smithy","file":"source/upstream/mudlib/d/snow/smithy.c","short":"打鐵鋪子","long":"這裡是一間打鐵鋪子﹐牆上掛了許多鐵器的半成品跟工具﹐鋪子中\n間一個燒著熊熊火燄的火爐映得你在牆上的影子一晃一晃的﹐旁邊還有\n一個沈重的大鐵砧﹐鋪子的出口就在東邊。","exits":{"west":"/d/snow/square_s"},"objects":{"/d/snow/npc/smith":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,3,0]},"/d/snow/square":{"id":"/d/snow/square","file":"source/upstream/mudlib/d/snow/square.c","short":"廣場中央","long":"這裡是雪亭鎮廣場的中央﹐一株巨大的老榕樹盤根錯結地站在中央\n﹐一些孩童常常爬上這株老榕嬉戲﹐榕樹下七橫八豎地放著幾張長凳供\n人歇息聊天﹐樹旁還有一個水缸供路人取水解渴。","exits":{"east":"/d/snow/square_e","north":"/d/snow/square_n","west":"/d/snow/square_w","south":"/d/snow/square_s"},"objects":{"/d/snow/obj/pot":1,"/d/snow/npc/gammer":1,"/d/snow/npc/junkman":1,"/d/npc/ghost/hungry_ghost":2},"special":[{"cmd":"climb 榕樹","to":"/d/snow/tree"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,2,0]},"/d/snow/square_e":{"id":"/d/snow/square_e","file":"source/upstream/mudlib/d/snow/square_e.c","short":"廣場","long":"這裡是雪亭鎮廣場東邊﹐往東是一條僻靜的巷子﹐西邊有一株高大\n的榕樹﹐南邊是一家打鐵鋪子﹐不過店門不在這一邊。","exits":{"east":"/d/snow/epath","west":"/d/snow/square"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,2,0]},"/d/snow/square_n":{"id":"/d/snow/square_n","file":"source/upstream/mudlib/d/snow/square_n.c","short":"廣場","long":"這裡是雪亭鎮廣場北邊﹐平常是附近孩童嬉戲遊玩的地方﹐初一十\n五則是市集的所在﹐往南可以看見一株大榕樹﹐往北則是一條筆直的街\n道。","exits":{"north":"/d/snow/nstreet1","south":"/d/snow/square"},"objects":{"/d/snow/npc/child1":1,"/d/snow/npc/child2":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,1,0]},"/d/snow/square_s":{"id":"/d/snow/square_s","file":"source/upstream/mudlib/d/snow/square_s.c","short":"廣場","long":"這裡是雪亭鎮廣場的南邊﹐往北可以望見一株高大的榕樹﹐廣場以\n榕樹為中心形成一個十多丈見方的大空地﹐街道往南通往鎮外﹐東邊不\n遠處有間打鐵鋪子。","exits":{"west":"/d/snow/square_sw","east":"/d/snow/smithy","north":"/d/snow/square","south":"/d/snow/sstreet1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,3,0]},"/d/snow/square_sw":{"id":"/d/snow/square_sw","file":"source/upstream/mudlib/d/snow/square_sw.c","short":"廣場","long":"這裡是雪亭鎮廣場的西南邊﹐廣場中央的大榕樹就在你的東北方不\n遠處﹐這裡的北邊可以看見一家客棧﹐往西是一條街道﹐東邊穿過一個\n路口可看見一家打鐵鋪子。","exits":{"west":"/d/snow/wstreet1","east":"/d/snow/square_s","north":"/d/snow/square_w"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,3,0]},"/d/snow/square_w":{"id":"/d/snow/square_w","file":"source/upstream/mudlib/d/snow/square_w.c","short":"廣場","long":"這裡是雪亭鎮廣場的西邊﹐往東可以看見廣場中央的大榕樹。 \n一家小客棧座落在西邊不遠處﹐客棧前的一串燈籠上寫著「飲風客棧」四個大字。\n廣場上鋪著整齊的石板，在這樣的小鎮通常是因為驛站的緣故才會費事鋪設。","exits":{"south":"/d/snow/square_sw","west":"/d/snow/inn_hall","east":"/d/snow/square","north":"/d/snow/bug_room"},"objects":{"/d/snow/obj/stone":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,2,0]},"/d/snow/sstreet1":{"id":"/d/snow/sstreet1","file":"source/upstream/mudlib/d/snow/sstreet1.c","short":"街道","long":"這裡是雪亭鎮南邊連接鎮外的街道﹐西邊有一間貨棧﹐東邊則是一\n家雜貨鋪﹐街道往北通往廣場南邊﹐往南穿過一個草棚出鎮外。","exits":{"south":"/d/snow/sgate","north":"/d/snow/square_s","west":"/d/snow/store","east":"/d/snow/bazar"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,4,0]},"/d/snow/store":{"id":"/d/snow/store","file":"source/upstream/mudlib/d/snow/store.c","short":"貨棧","long":"這裡是一間貨棧﹐也是旅行客商們儲放貨物﹐運送、轉交的地方﹐\n雪亭鎮因為位於通往天邪國的重要道路﹐所以貨棧往來的貨物相當的多\n﹐因此成為少數幾個設有貨棧的村鎮﹐天朝各地的貨棧大多數都互相連\n繫﹐因此商業十分發達﹐忙碌的貨棧也常常是缺錢的人打零工的地方﹐\n因為貨棧的工作量不固定﹐有大批貨物進來的時候往往需要平常十幾倍\n的人手﹐但是貨棧的利潤又雇不起長期的工人。","exits":{"east":"/d/snow/sstreet1"},"objects":{"/d/snow/npc/foreman":1,"/d/snow/obj/wagon":1,"/d/snow/obj/crate":3},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,4,0]},"/d/snow/tree":{"id":"/d/snow/tree","file":"source/upstream/mudlib/d/snow/tree.c","short":"榕樹上","long":"你現在正在一株巨大的榕樹上﹐茂密的枝葉搔得你有些發癢﹐前面\n一根粗大的樹枝上有人放著一塊墊子。","exits":{"down":"/d/snow/square"},"objects":{"/d/snow/npc/child":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,1,0]},"/d/snow/wgate":{"id":"/d/snow/wgate","file":"source/upstream/mudlib/d/snow/wgate.c","short":"雪亭鎮","long":"這裡是雪亭鎮西邊的官道﹐雖然雪亭驛設在鎮上的北邊﹐但是官道\n卻是從西邊入雪亭﹐因為原來修官道時利用了一段從前中陽侯征奐族亂\n軍的棧道﹐因此上這條官道便從西邊穿過山谷接古中陽棧道﹐出黃石隘\n﹐往東通往雪亭鎮的街道﹐往西則出鎮。","exits":{"east":"/d/snow/wstreet3","northwest":"/d/graveyard/grave1"},"objects":{"/d/npc/ghost/mountain_sprite":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-8,3,0]},"/d/snow/wstreet1":{"id":"/d/snow/wstreet1","file":"source/upstream/mudlib/d/snow/wstreet1.c","short":"街道","long":"這裡是雪亭鎮廣場西邊的街道﹐往北是一間客棧﹐不過這個方向沒\n有入口﹐南邊一間青瓦屋﹐門口灑掃得乾乾淨淨﹐似是家私塾模樣﹐往\n西的街道十分寬敞﹐路上還有車馬經過壓出來的溝痕。","exits":{"south":"/d/snow/school","east":"/d/snow/square_sw","west":"/d/snow/wstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,3,0]},"/d/snow/wstreet2":{"id":"/d/snow/wstreet2","file":"source/upstream/mudlib/d/snow/wstreet2.c","short":"街道","long":"這裡是雪亭鎮西邊的街道﹐北邊是一間看起來像是客棧的大屋，圍\n牆上曬著一些陳舊卻潔白的衣服。南邊有間青瓦屋，幾株大樹從圍牆內\n探出頭來。","exits":{"east":"/d/snow/wstreet1","west":"/d/snow/wstreet3"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,3,0]},"/d/snow/wstreet3":{"id":"/d/snow/wstreet3","file":"source/upstream/mudlib/d/snow/wstreet3.c","short":"街道","long":"這裡是雪亭鎮西邊的街道﹐北邊是雪亭鎮的鄉校﹐平常會有一些鎮\n上的長者在這裡談論鎮上的閒事﹐縣裡若有公爺來這裡斷事﹐也是在這\n裡設的公堂﹐往西不遠處就是出鎮的官道﹐街道南邊是一家糕餅鋪。","exits":{"north":"/d/snow/court","east":"/d/snow/wstreet2","west":"/d/snow/wgate"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-7,3,0]},"/d/snowkeep/court":{"id":"/d/snowkeep/court","file":"source/upstream/mudlib/d/snowkeep/court.c","short":"天井","long":"這裡是雪吟莊側廳的一處天井﹐北邊是通往正廳的走廊﹐東邊與南邊都是廂房﹐西邊則是側廳﹐天井中放著幾盆發著淡淡幽香的蘭花﹐地上整齊地鋪著灰石磚。","exits":{"west":"/d/snowkeep/side_s"},"objects":{"/d/snowkeep/npc/phoxin":1},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[1,1,0]},"/d/snowkeep/dungeon":{"id":"/d/snowkeep/dungeon","file":"source/upstream/mudlib/d/snowkeep/dungeon.c","short":"地牢","long":"甬道兩旁是一間間鐵柵隔成的牢房，大多空著，地上鋪著發黴的稻草，散發出一股刺鼻的霉味。甬道中央擺著一張木桌和一把木椅，桌上一盞油燈、半碗冷飯，東邊一道包著鐵皮的厚重牢門上，掛著一把沉甸甸的大鎖。","exits":{"west":"/d/snowkeep/dungeon_w","east":"/d/snowkeep/dungeon_e"},"objects":{"/d/snowkeep/npc/jailer":1},"special":[],"area":"雪吟莊","layer":"地下","areaKey":"雪吟莊","pos":[-1,-3,-1]},"/d/snowkeep/dungeon_e":{"id":"/d/snowkeep/dungeon_e","file":"source/upstream/mudlib/d/snowkeep/dungeon_e.c","short":"地牢深處","long":"這是地牢最深處的一間石牢，三面都是堅硬的山岩，一面是手臂粗的鐵條。石牢裏收拾得意外乾淨，角落擺著一張石床，牆上卻刻滿了密密麻麻的劃痕，看來被關在這裡的人，已在暗無天日之中熬過了不少日子。","exits":{"west":"/d/snowkeep/dungeon"},"objects":{"/d/snowkeep/npc/yu_lan_jian_yi":1},"special":[],"area":"雪吟莊","layer":"地下","areaKey":"雪吟莊","pos":[0,-3,-1]},"/d/snowkeep/dungeon_w":{"id":"/d/snowkeep/dungeon_w","file":"source/upstream/mudlib/d/snowkeep/dungeon_w.c","short":"地牢","long":"石階盡頭竟是一間開鑿在山腹裏的石室，四壁濕冷，水珠沿著石縫一滴一滴落下，在寂靜中格外清晰。牆上插著一支將熄未熄的火把，照出一排生了鏽的鐵柵，誰也想不到名滿江湖的雪吟莊底下，竟藏著這樣一座地牢。","exits":{"up":"/d/snowkeep/pavilion","east":"/d/snowkeep/dungeon"},"objects":{},"special":[],"area":"雪吟莊","layer":"地下","areaKey":"雪吟莊","pos":[-2,-3,-1]},"/d/snowkeep/east_room":{"id":"/d/snowkeep/east_room","file":"source/upstream/mudlib/d/snowkeep/east_room.c","short":"東廂房","long":"這裡是雪吟莊內的一間廂房，裝璜古朴典雅且有一絲尊貴，仿彿是為某位貴賓準備的，所以自然是打掃得一塵不染。","exits":{"west":"/d/snowkeep/side_n"},"objects":{"/d/snowkeep/npc/ku_wu_wang":1},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[1,-1,0]},"/d/snowkeep/entrance":{"id":"/d/snowkeep/entrance","file":"source/upstream/mudlib/d/snowkeep/entrance.c","short":"雪吟莊大門","long":"山路到此豁然開朗，一座氣派的莊院倚山而建，朱漆大門上釘著兩排碗口大的銅釘，門楣高懸一塊黑底金字的匾額，寫著「雪吟山莊」四個大字。門前石階掃得一塵不染，往來的多是佩刀帶劍的江湖人物，個個神色倨傲。","exits":{"west":"/d/snow/ebridge","east":"/d/snowkeep/yard_w"},"objects":{"/d/snowkeep/npc/guard":2},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[-3,0,0]},"/d/snowkeep/garden_n":{"id":"/d/snowkeep/garden_n","file":"source/upstream/mudlib/d/snowkeep/garden_n.c","short":"後花園","long":"這裡是雪吟山莊庭園中的一角，四週種滿了芍藥和牡丹，在風中爭芳鬥艷。一條鵝卵石鋪成的小路通像南邊的亭子，四週的青草也讓整個院子顯出一種和諧的高雅氣息。","exits":{"south":"/d/snowkeep/garden_s"},"objects":{"/d/snowkeep/npc/yu_pingyin":1,"/d/snowkeep/npc/guard":1},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[-1,-2,0]},"/d/snowkeep/garden_s":{"id":"/d/snowkeep/garden_s","file":"source/upstream/mudlib/d/snowkeep/garden_s.c","short":"後花園","long":"花園裏假山錯落，一道清淺的溪水從石縫間流出，繞著假山蜿蜒而過，水聲淙淙。溪邊種著幾叢翠竹與芭蕉，水氣氤氳，幾隻蜻蜓在水面上輕輕點過，比起前院的人聲，這裡清幽得像是另一個天地。","exits":{"north":"/d/snowkeep/garden_n","south":"/d/snowkeep/yard_e"},"objects":{},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[-1,-1,0]},"/d/snowkeep/hall":{"id":"/d/snowkeep/hall","file":"source/upstream/mudlib/d/snowkeep/hall.c","short":"雪吟莊大廳","long":"這裡是雪吟莊的大廳﹐大廳前方原來有一條莊主引以為傲的大虎毛皮﹐但是為了表示對武林盟主於蘭兼毅的尊敬﹐所以換成了一幅京城才子張于辰的字畫﹐大廳的南北兩頭各有迴廊通往莊子內院﹐往西則是通往庭園的大門。","exits":{"west":"/d/snowkeep/yard_e","east":"/d/snowkeep/inner_hall","north":"/d/snowkeep/side_n","south":"/d/snowkeep/side_s"},"objects":{"/d/snowkeep/npc/chu_xang_when":1},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[0,0,0]},"/d/snowkeep/inner_hall":{"id":"/d/snowkeep/inner_hall","file":"source/upstream/mudlib/d/snowkeep/inner_hall.c","short":"雪吟莊大廳","long":"這裡是雪吟莊大廳，面向廳口的首位列著六張太師椅，顯然是預備給武林中威望最高的前輩「六賢」的座位，不過目前這些位置都是空著的。左右各八張較小的座位，座位旁都放著一個矮凳。","exits":{"west":"/d/snowkeep/hall"},"objects":{"/d/snowkeep/npc/yu_tieshan":1},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[1,0,0]},"/d/snowkeep/path":{"id":"/d/snowkeep/path","file":"source/upstream/mudlib/d/snowkeep/path.c","short":"小徑","long":"一條碎石小徑在花木間曲曲折折地穿過，兩旁的冬青修剪得整整齊齊，有如兩道矮牆。腳下石子被踩得圓滑，走起來沙沙作響，四下裏只聞得到泥土與青草的氣息，與前院的熱鬧判若兩地。","exits":{"south":"/d/snowkeep/yard_w","north":"/d/snowkeep/pavilion"},"objects":{},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[-2,-1,0]},"/d/snowkeep/pavilion":{"id":"/d/snowkeep/pavilion","file":"source/upstream/mudlib/d/snowkeep/pavilion.c","short":"涼亭","long":"這是一座八角涼亭，亭頂覆著青瓦，八根朱紅亭柱上各刻著一個卦象。亭中擺著一張石造的八卦桌，桌面依卦位刻出八道紋路，每道紋路的盡頭都嵌著一枚微微凸起的銅鈕，摸上去冰涼光滑，不像是尋常的擺設。","exits":{"south":"/d/snowkeep/path"},"objects":{},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[-2,-2,0]},"/d/snowkeep/side_n":{"id":"/d/snowkeep/side_n","file":"source/upstream/mudlib/d/snowkeep/side_n.c","short":"側廳","long":"側廳比正廳小了許多，陳設卻一樣講究，牆上掛著幾幅山水，案上一隻銅爐燃著檀香，煙縷細細地升上樑間。幾張花梨木椅沿牆排開，想是給赴會的賓客暫歇之用，廳東一道門簾半掩，後頭似乎是招待貴客的廂房。","exits":{"east":"/d/snowkeep/east_room","south":"/d/snowkeep/hall"},"objects":{},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[0,-1,0]},"/d/snowkeep/side_s":{"id":"/d/snowkeep/side_s","file":"source/upstream/mudlib/d/snowkeep/side_s.c","short":"側廳","long":"這間側廳挨著內院，窗櫺雕著雲紋，透進來的光被切成一格一格。廳中一張長案上整整齊齊地疊著拜帖與名冊，硯臺裏的墨還沒乾透，看來莊上近來賓客極多，連帳房都忙不過來。","exits":{"north":"/d/snowkeep/hall","east":"/d/snowkeep/court"},"objects":{},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[0,1,0]},"/d/snowkeep/yard_e":{"id":"/d/snowkeep/yard_e","file":"source/upstream/mudlib/d/snowkeep/yard_e.c","short":"前院","long":"前院到了這一頭漸漸寬闊，正面一座廳堂飛簷斗拱，簷下懸著一排紅燈籠，氣派非凡。院角一口大缸盛滿清水，缸邊擱著幾隻木瓢，前來赴會的賓客三三兩兩在此駐足，低聲談論著這次的英雄大會。","exits":{"west":"/d/snowkeep/yard_w","east":"/d/snowkeep/hall","north":"/d/snowkeep/garden_s"},"objects":{"/d/snowkeep/npc/hsu_yen_chih":1,"/d/snowkeep/npc/wang_hsian":1},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[-1,0,0]},"/d/snowkeep/yard_w":{"id":"/d/snowkeep/yard_w","file":"source/upstream/mudlib/d/snowkeep/yard_w.c","short":"前院","long":"穿過大門便是前院，青石板鋪得平平整整，兩旁各植一排蒼勁的老松。院中立著幾座兵器架，刀槍劍戟擦得雪亮，地上留著不少深淺不一的腳印，想必莊中弟子平日便在這裡操練，空氣裏隱約還有一股汗水與鐵鏽的氣味。","exits":{"west":"/d/snowkeep/entrance","east":"/d/snowkeep/yard_e","north":"/d/snowkeep/path"},"objects":{},"special":[],"area":"雪吟莊","layer":null,"areaKey":"雪吟莊","pos":[-2,0,0]},"/d/swaylan/alley":{"id":"/d/swaylan/alley","file":"source/upstream/mudlib/d/swaylan/alley.c","short":"小巷子","long":"一條狹窄的小巷，兩旁高牆夾峙，只容得下兩人錯身而過。牆角長著濕滑的青苔，地上積著一灘灘汙水，透著一股霉味，與大街上的熱鬧比起來，這裡冷清得像是另一座城。","exits":{"west":"/d/swaylan/street2","northeast":"/d/swaylan/street_se"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[3,2,0]},"/d/swaylan/bank":{"id":"/d/swaylan/bank","file":"source/upstream/mudlib/d/swaylan/bank.c","short":"景隆錢莊","long":"景隆錢莊在水嵐縣開的分號，門面雖不及總號氣派，櫃檯卻擦得一塵不染，後頭一排烏木錢櫃都上了銅鎖。櫃檯後的算盤聲劈啪不停，來存錢兌銀的客人進進出出，說起話來都壓低了聲音。","exits":{"south":"/d/swaylan/west_street"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-1,-1,0]},"/d/swaylan/buxuan/cliff":{"id":"/d/swaylan/buxuan/cliff","file":"source/upstream/mudlib/d/swaylan/buxuan/cliff.c","short":"山壁","long":"一面陡峭山壁直插入雲，岩石灰黑，表面被風霜蝕得坑坑窪窪。仔細看去，石壁上有幾處明顯的落腳點，邊緣被磨得光滑，還留著鞋底的泥印，看來時常有人從這裡攀上攀下。","exits":{"east":"/d/swaylan/buxuan/peak_foot","south":"/d/swaylan/buxuan/terrace"},"objects":{},"special":[{"cmd":"climb 山壁","to":"/d/swaylan/buxuan/cliff_top"}],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[10,-2,0]},"/d/swaylan/buxuan/cliff_top":{"id":"/d/swaylan/buxuan/cliff_top","file":"source/upstream/mudlib/d/swaylan/buxuan/cliff_top.c","short":"山壁","long":"爬上峭壁，眼前是一片不大的平地，一面山壁上滿是深深淺淺的刻痕，縱橫交錯，像是被什麼利器反覆劃過。身後便是方才攀上來的峭壁，一旁蓋著一間小茅屋，看來有高人在此潛修。","exits":{"north":"/d/swaylan/buxuan/hut"},"objects":{},"special":[{"cmd":"climb 峭壁","to":"/d/swaylan/buxuan/cliff"}],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[16,0,0]},"/d/swaylan/buxuan/field1":{"id":"/d/swaylan/buxuan/field1","file":"source/upstream/mudlib/d/swaylan/buxuan/field1.c","short":"農田","long":"步玄派的田地沿著山坡開墾成一層層的梯田，田埂修得筆直，稻禾青青，長得十分茁壯。田邊立著一座簡陋的草棚，棚下放著鋤頭、竹簍等農具，派中弟子耕讀並重，連種田也毫不馬虎。","exits":{"north":"/d/swaylan/buxuan/terrace","east":"/d/swaylan/buxuan/field2"},"objects":{"/d/swaylan/buxuan/npc/farmer":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[10,0,0]},"/d/swaylan/buxuan/field2":{"id":"/d/swaylan/buxuan/field2","file":"source/upstream/mudlib/d/swaylan/buxuan/field2.c","short":"農田","long":"這一片田地種的多是菜蔬，畦壟分明，蘿蔔、青菜一行行排得整整齊齊。田頭挖了一道引水的溝渠，山泉從高處汩汩流下，水聲清脆，田邊一架水車吱呀吱呀地慢慢轉著。","exits":{"west":"/d/swaylan/buxuan/field1","north":"/d/swaylan/buxuan/steps2"},"objects":{"/d/swaylan/buxuan/npc/farmer":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[11,0,0]},"/d/swaylan/buxuan/gate":{"id":"/d/swaylan/buxuan/gate","file":"source/upstream/mudlib/d/swaylan/buxuan/gate.c","short":"步玄派","long":"步玄派的山門建在半山腰上，兩根石柱撐起一座樸素的牌坊，橫匾上刻著「步玄」二字，筆意灑脫。門內傳來朗朗的讀書聲，間或夾著劍刃破風之聲，耕讀習武，自給自足，倒也別有一番氣象。","exits":{"southwest":"/d/swaylan/buxuan/mountain_path","east":"/d/swaylan/buxuan/steps1"},"objects":{"/d/swaylan/buxuan/npc/apprentice":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[8,-1,0]},"/d/swaylan/buxuan/hut":{"id":"/d/swaylan/buxuan/hut","file":"source/upstream/mudlib/d/swaylan/buxuan/hut.c","short":"小茅屋","long":"你現在站在一間小茅屋中，裡面只有一張竹桌跟兩張椅子，在你面前有一個年輕人，身穿白色長袍，手中拿著一把判官筆，正對著竹桌上面的白布作畫著，看神情似乎是很專注，在你後面的門望出去可以看到一些飛鳥在盤旋著，山風從窗戶灌進來讓你覺得有些寒冷的感覺。","exits":{"south":"/d/swaylan/buxuan/cliff_top"},"objects":{"/d/swaylan/buxuan/npc/luo_yun_feng":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[16,-1,0]},"/d/swaylan/buxuan/mountain_path":{"id":"/d/swaylan/buxuan/mountain_path","file":"source/upstream/mudlib/d/swaylan/buxuan/mountain_path.c","short":"山間小路","long":"山路漸漸陡起來，兩旁的松林愈發茂密，林間飄著淡淡的雲氣，終年不散。路面鋪著碎石，被往來的腳步踩得平實，偶爾能看見挑著擔子的人影，在雲霧裡時隱時現，轉眼又不見了。","exits":{"southwest":"/d/swaylan/buxuan/slope","northeast":"/d/swaylan/buxuan/gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[7,0,0]},"/d/swaylan/buxuan/peak_foot":{"id":"/d/swaylan/buxuan/peak_foot","file":"source/upstream/mudlib/d/swaylan/buxuan/peak_foot.c","short":"落雲峰底","long":"落雲峰的山腳下，峰頂終年隱沒在雲霧之中，只看得見半截青黑的山身。山風從峰上吹下來，帶著幾分涼意，四下一片寂靜，偶爾傳來幾聲鷹唳，在山谷間久久迴盪不去。","exits":{"west":"/d/swaylan/buxuan/cliff","south":"/d/swaylan/buxuan/steps2"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[11,-2,0]},"/d/swaylan/buxuan/pond":{"id":"/d/swaylan/buxuan/pond","file":"source/upstream/mudlib/d/swaylan/buxuan/pond.c","short":"聚雲池","long":"半山腰上的一方池塘，池水清澈見底，終年雲氣氤氳，水面像是籠著一層薄紗。池中游魚成群，時而浮上水面啄食落葉，激起一圈圈漣漪，池邊的大石被坐得光滑，想必常有人在此靜坐。","exits":{"north":"/d/swaylan/buxuan/steps1"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[9,0,0]},"/d/swaylan/buxuan/residence":{"id":"/d/swaylan/buxuan/residence","file":"source/upstream/mudlib/d/swaylan/buxuan/residence.c","short":"沐華居","long":"這裡是步玄派掌門人的居所沐華居，室內的擺設多半是年代相當久遠的紅木家具，一方茶几上燃著一爐檀香。廳堂上懸著一幅步玄派始祖駱步玄的字畫，畫著一頭顧盼生威的大鷹。","exits":{"out":"/d/swaylan/buxuan/steps2"},"objects":{"/d/swaylan/buxuan/npc/ro_yi":1,"/d/swaylan/buxuan/npc/apprentice":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[12,-1,0]},"/d/swaylan/buxuan/slope":{"id":"/d/swaylan/buxuan/slope","file":"source/upstream/mudlib/d/swaylan/buxuan/slope.c","short":"山坡","long":"出城的小徑沿著山坡蜿蜒而上，坡上野草叢生，夾雜著幾株矮小的松樹，風過處沙沙作響。越往上走，水嵐縣城便越縮越小，回頭望去，城牆屋瓦都成了一片灰濛濛的影子。","exits":{"northwest":"/d/swaylan/hillside","northeast":"/d/swaylan/buxuan/mountain_path"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[6,1,0]},"/d/swaylan/buxuan/steps1":{"id":"/d/swaylan/buxuan/steps1","file":"source/upstream/mudlib/d/swaylan/buxuan/steps1.c","short":"石階","long":"一道青石台階依著山勢層層而上，石縫中長滿了青苔，階旁種著幾叢修竹，竹葉上凝著細細的水珠。山間雲氣低低地貼著台階流過，走在其中，衣襬都沾上了幾分濕潤。","exits":{"west":"/d/swaylan/buxuan/gate","east":"/d/swaylan/buxuan/terrace","south":"/d/swaylan/buxuan/pond"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[9,-1,0]},"/d/swaylan/buxuan/steps2":{"id":"/d/swaylan/buxuan/steps2","file":"source/upstream/mudlib/d/swaylan/buxuan/steps2.c","short":"石階","long":"石階到了這裡已是盡頭，前方一座清幽的大廳依山而建，廳門半掩，門楣上的匾額字跡清雅，隱約透出一縷檀香。階邊立著兩盞石燈，燈身爬滿了青苔，看來已有不少年歲。","exits":{"west":"/d/swaylan/buxuan/terrace","south":"/d/swaylan/buxuan/field2","north":"/d/swaylan/buxuan/peak_foot","enter":"/d/swaylan/buxuan/residence"},"objects":{"/d/swaylan/buxuan/npc/apprentice":2},"special":[{"cmd":"enter 大廳","to":"/d/swaylan/buxuan/residence"}],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[11,-1,0]},"/d/swaylan/buxuan/terrace":{"id":"/d/swaylan/buxuan/terrace","file":"source/upstream/mudlib/d/swaylan/buxuan/terrace.c","short":"平台","long":"石階半途的一片平台，地面用石板鋪得平整，四周圍著一道低矮的石欄。倚欄望去，山下的田畝與池塘盡收眼底，再遠便是一片茫茫雲海，雲氣翻湧，教人胸襟為之一闊。","exits":{"west":"/d/swaylan/buxuan/steps1","east":"/d/swaylan/buxuan/steps2","north":"/d/swaylan/buxuan/cliff","south":"/d/swaylan/buxuan/field1"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[10,-1,0]},"/d/swaylan/chien_store":{"id":"/d/swaylan/chien_store","file":"source/upstream/mudlib/d/swaylan/chien_store.c","short":"錢記商號","long":"錢記商號的門面寬敞，貨架上擺滿了青銅丹爐、丹鼎和成捆的松柴，櫃上幾只瓷罐裡盛著山豬果與各色丹藥，連野山蔘都有。老闆生意做得精明，對鄉里卻向來大方，在水嵐縣頗有人望。","exits":{"north":"/d/swaylan/east_street1"},"objects":{"/d/swaylan/npc/richman":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[1,1,0]},"/d/swaylan/crossroad":{"id":"/d/swaylan/crossroad","file":"source/upstream/mudlib/d/swaylan/crossroad.c","short":"路口","long":"城北的一處路口，一條碎石小路從這裡岔出，兩旁種滿了梅樹，枝幹虯曲，一路蜿蜒而上，盡頭想必便是水嵐縣第一大戶冷梅莊。路旁的雜木林裡不時傳來砍柴的聲響，篤篤地傳得很遠。","exits":{"west":"/d/swaylan/woods1","southeast":"/d/swaylan/north_street2","north":"/d/swaylan/lunmay/gate"},"objects":{"/d/swaylan/lunmay/npc/apprentice":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-1,-2,0]},"/d/swaylan/dirt_road":{"id":"/d/swaylan/dirt_road","file":"source/upstream/mudlib/d/swaylan/dirt_road.c","short":"泥土路","long":"一條坑坑窪窪的泥土路，路面還留著當年車轍壓出的深溝，看得出這裡曾經車馬不絕。如今渡口移了位置，路邊的茶棚只剩幾根歪斜的竹竿，野草從車轍裡冒了出來，一片冷清。","exits":{"north":"/d/swaylan/old_ferry","west":"/d/swaylan/north_street1"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[1,-2,0]},"/d/swaylan/east_gate":{"id":"/d/swaylan/east_gate","file":"source/upstream/mudlib/d/swaylan/east_gate.c","short":"東城門","long":"東城門外便是起伏的丘陵，城樓上插著幾面旗幟，守衛把守得頗為嚴密，出入的行人都要被盤問幾句。城牆東北角外隱約可見一片黑壓壓的密林，城裡人說起那片林子，總要壓低聲音。","exits":{"west":"/d/swaylan/east_street3","east":"/d/swaylan/hillside","south":"/d/swaylan/street_se","northeast":"/d/swaylan/forest_edge"},"objects":{"/d/swaylan/npc/gate_guard":4},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[4,0,0]},"/d/swaylan/east_street1":{"id":"/d/swaylan/east_street1","file":"source/upstream/mudlib/d/swaylan/east_street1.c","short":"東大街","long":"東大街是水嵐縣最熱鬧的一段，青石板路寬得容得下兩輛馬車並行，兩旁酒樓茶肆林立，簷下掛著一串串燈籠。街角飄來剛出籠的包子香，混著酒館裡划拳的吆喝聲，熱熱鬧鬧地連成一片。","exits":{"west":"/d/swaylan/inn","east":"/d/swaylan/east_street2","south":"/d/swaylan/chien_store"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[1,0,0]},"/d/swaylan/east_street2":{"id":"/d/swaylan/east_street2","file":"source/upstream/mudlib/d/swaylan/east_street2.c","short":"東大街","long":"這一段街面多是體面的鋪子，綢緞莊、香燭店一家挨著一家，招牌漆得金光閃閃。往來行人的衣著也講究了些，偶有轎子從街心抬過，轎夫腳步齊整，路人紛紛讓到兩旁。","exits":{"west":"/d/swaylan/east_street1","east":"/d/swaylan/east_street3"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[2,0,0]},"/d/swaylan/east_street3":{"id":"/d/swaylan/east_street3","file":"source/upstream/mudlib/d/swaylan/east_street3.c","short":"東大街","long":"街道到這裡漸漸靠近東城門，往來的多是進出城的旅人，腳步都有些匆忙。北邊岔出一條石板小路，盡頭是一座寺院的山門，檀香的氣味遠遠飄來，路口擺著賣香燭的攤子，上香的婦人絡繹不絕。","exits":{"west":"/d/swaylan/east_street2","east":"/d/swaylan/east_gate","north":"/d/swaylan/temple/gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[3,0,0]},"/d/swaylan/escort_back":{"id":"/d/swaylan/escort_back","file":"source/upstream/mudlib/d/swaylan/escort_back.c","short":"後廳","long":"後廳是總鏢頭招待貴客、商談要事的地方，陳設比前廳講究得多。紫檀木的桌椅上雕著雲紋，多寶格裡擺著青花瓷瓶與玉雕擺件，牆上掛著一幅山水古畫，案頭一爐沉香煙氣裊裊，雅致而不張揚。","exits":{"north":"/d/swaylan/escort_yard","east":"/d/swaylan/escort_hall"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,2,0]},"/d/swaylan/escort_gate":{"id":"/d/swaylan/escort_gate","file":"source/upstream/mudlib/d/swaylan/escort_gate.c","short":"黃家鏢局","long":"黃家鏢局的大門前是一片寬敞的空地，地上鋪著平整的石板，足夠好幾輛鏢車同時停放。門楣上的金字匾額擦得發亮，兩旁旗桿上高懸著鏢旗，鏢師們進進出出，腳步沉穩，看得出鏢局生意興隆。","exits":{"east":"/d/swaylan/south_street2","west":"/d/swaylan/escort_hall"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-1,2,0]},"/d/swaylan/escort_hall":{"id":"/d/swaylan/escort_hall","file":"source/upstream/mudlib/d/swaylan/escort_hall.c","short":"正廳","long":"鏢局的正廳寬敞明亮，正中懸著一塊「義氣千秋」的匾額，下方一張虎皮交椅，兩側各排著幾張太師椅。廳柱粗大，漆得朱紅，牆上掛著幾柄擦得雪亮的長刀，一股剛正之氣迎面而來。","exits":{"east":"/d/swaylan/escort_gate","north":"/d/swaylan/escort_side","west":"/d/swaylan/escort_back"},"objects":{"/d/swaylan/npc/huang_tien_ba":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-2,2,0]},"/d/swaylan/escort_side":{"id":"/d/swaylan/escort_side","file":"source/upstream/mudlib/d/swaylan/escort_side.c","short":"側廳","long":"一間不大的側廳，靠牆擺著幾張長桌，桌上堆滿了帳冊與鏢單，一旁的木架上掛著各路鏢旗。這裡是鏢頭們分派鏢務的地方，空氣中有墨汁與舊紙的氣味，看來平日裡往來調度甚是繁忙。","exits":{"south":"/d/swaylan/escort_hall","west":"/d/swaylan/escort_yard"},"objects":{"/d/swaylan/npc/kao_fon":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-2,1,0]},"/d/swaylan/escort_yard":{"id":"/d/swaylan/escort_yard","file":"source/upstream/mudlib/d/swaylan/escort_yard.c","short":"後院","long":"鏢局的後院種著幾株老槐樹，樹下擺著石鎖與木樁，是鏢師們平日練功的地方，地面被踩得結結實實。院子另一頭有一道月洞門，門後便是黃家人起居的內宅，鏢師守在門前，閒人不得擅入。","exits":{"east":"/d/swaylan/escort_side","south":"/d/swaylan/escort_back"},"objects":{"/d/swaylan/npc/escort_guard":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-3,1,0]},"/d/swaylan/ferry":{"id":"/d/swaylan/ferry","file":"source/upstream/mudlib/d/swaylan/ferry.c","short":"渡口","long":"羿水流到這裡轉了一個大彎，河面寬闊，對岸五堂鎮的鯉君渡隱約可見。岸邊用粗木樁搭起一座棧橋，橋板被往來的腳步踩得發亮，繫船的麻繩一圈圈纏在樁上，河水拍著樁腳，嘩嘩作響。","exits":{"south":"/d/swaylan/north_gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,-4,0]},"/d/swaylan/forest/chamber":{"id":"/d/swaylan/forest/chamber","file":"source/upstream/mudlib/d/swaylan/forest/chamber.c","short":"密室","long":"這裡就是綠林大盜總部﹐安排的相當隱密﹐一箱一箱的寶物和耀眼的兵器﹐掛在右上角的是名震江湖一時的鋼劍【流走】﹐左上角的是靜寂【破日】﹐正前方正是綠林大盜的總領賊帥﹐右眼罩裡又彷彿藏著暗器﹐一心慌想這真不是我該來的地方。","exits":{"out":"/d/swaylan/forest/hideout"},"objects":{"/d/swaylan/forest/npc/bandit_general":1},"special":[],"area":"密林","layer":"地下","areaKey":"密林","pos":[3,0,0]},"/d/swaylan/forest/clearing":{"id":"/d/swaylan/forest/clearing","file":"source/upstream/mudlib/d/swaylan/forest/clearing.c","short":"空地","long":"地底下竟挖出了一片開闊的空地，頭頂用粗大的木樑撐著，泥土間垂下幾縷樹根。四周搭著幾座簡陋木棚，棚下堆著搶來的箱籠、布匹，中央豎著木樁，樁上綁過人的繩索還沒解下，地上一灘發黑的血跡。","exits":{"up":"/d/swaylan/forest/stele","south":"/d/swaylan/forest/tunnel","east":"/d/swaylan/forest/kitchen"},"objects":{"/d/swaylan/forest/npc/bandit":2,"/d/swaylan/forest/npc/bandit_leader":1},"special":[],"area":"密林","layer":"地下","areaKey":"密林","pos":[0,0,0]},"/d/swaylan/forest/entrance":{"id":"/d/swaylan/forest/entrance","file":"source/upstream/mudlib/d/swaylan/forest/entrance.c","short":"密林入口","long":"茂密的樹林從水嵐縣城外一路延伸上山，林木高大，枝葉遮天蔽日，林中幽暗得看不清路。樹幹上留著幾道陳舊的刀痕，地上散落著折斷的箭桿，據說官兵曾經多次進林掃蕩，卻都鎩羽而歸。","exits":{"east":"/d/swaylan/forest/forest1","out":"/d/swaylan/forest_edge"},"objects":{"/d/swaylan/forest/npc/bandit":2},"special":[],"area":"密林","layer":null,"areaKey":"密林","pos":[-3,0,1]},"/d/swaylan/forest/forest1":{"id":"/d/swaylan/forest/forest1","file":"source/upstream/mudlib/d/swaylan/forest/forest1.c","short":"密林","long":"林子越走越深，腳下的落葉積了厚厚一層，踩上去軟綿綿的，散發著一股腐爛的氣味。四下靜得出奇，連鳥叫聲都聽不見，只有偶爾一陣窸窸窣窣的聲響，從看不見的暗處傳來，教人背脊發涼。","exits":{"west":"/d/swaylan/forest/entrance","east":"/d/swaylan/forest/forest2"},"objects":{"/d/swaylan/forest/npc/bandit":3},"special":[],"area":"密林","layer":null,"areaKey":"密林","pos":[-2,0,1]},"/d/swaylan/forest/forest2":{"id":"/d/swaylan/forest/forest2","file":"source/upstream/mudlib/d/swaylan/forest/forest2.c","short":"密林","long":"幾棵大樹之間拉著麻繩，繩上掛著幾串風乾的獸肉，地上留著熄滅不久的火堆，灰燼裡還插著幾根啃剩的骨頭。這一帶常有人聚集，林間小徑被踩得結結實實，顯然不是尋常獵戶走出來的路。","exits":{"west":"/d/swaylan/forest/forest1","east":"/d/swaylan/forest/stele"},"objects":{"/d/swaylan/forest/npc/bandit":3},"special":[],"area":"密林","layer":null,"areaKey":"密林","pos":[-1,0,1]},"/d/swaylan/forest/hideout":{"id":"/d/swaylan/forest/hideout","file":"source/upstream/mudlib/d/swaylan/forest/hideout.c","short":"地下密道","long":"密道到這裡變得寬敞，像是一間地下大廳，幾張長桌上散落著酒罈和骰子，牆上掛著幾面破舊的官兵旗幟，被人用刀劃得稀爛。角落裡有一塊石頭，形狀方正得出奇，看起來不太像是天然的。","exits":{"northeast":"/d/swaylan/forest/tunnel"},"objects":{"/d/swaylan/forest/npc/bandit_chief":1,"/d/swaylan/forest/npc/bandit_captain":1},"special":[{"cmd":"kick 石頭","to":"/d/swaylan/forest/chamber"}],"area":"密林","layer":"地下","areaKey":"密林","pos":[-1,2,0]},"/d/swaylan/forest/kitchen":{"id":"/d/swaylan/forest/kitchen","file":"source/upstream/mudlib/d/swaylan/forest/kitchen.c","short":"廚房","long":"空地旁挖出的一間灶房，四壁是夯實的泥土，灶上架著一口大鍋，鍋裡咕嘟咕嘟地燉著肉。灶頂開了一道斜斜的煙道通往地面，柴煙仍嗆得人直咳，牆上掛著一排菜刀和砍骨的斧頭，看來這裡要餵飽的人可不少。","exits":{"west":"/d/swaylan/forest/clearing"},"objects":{"/d/swaylan/forest/npc/cooker":1},"special":[],"area":"密林","layer":"地下","areaKey":"密林","pos":[1,0,0]},"/d/swaylan/forest/stele":{"id":"/d/swaylan/forest/stele","file":"source/upstream/mudlib/d/swaylan/forest/stele.c","short":"密林","long":"密林深處空出一塊林地，正中立著一塊半人高的石碑，碑上的字跡早已模糊難辨，碑身卻被摸得光滑發亮，與四周長滿青苔的石頭大不相同。碑前的泥地上留著雜亂的腳印，到了碑前便突然斷了。","exits":{"west":"/d/swaylan/forest/forest2"},"objects":{"/d/swaylan/forest/npc/bandit":2,"/d/swaylan/forest/npc/bandit_leader":1},"special":[{"cmd":"push 石碑","to":"/d/swaylan/forest/clearing"}],"area":"密林","layer":null,"areaKey":"密林","pos":[0,0,1]},"/d/swaylan/forest/tunnel":{"id":"/d/swaylan/forest/tunnel","file":"source/upstream/mudlib/d/swaylan/forest/tunnel.c","short":"地下密道","long":"一條挖在地底的密道，四壁用木樁撐著，頭頂不時落下細碎的泥土。壁上每隔幾步插著一支火把，火光搖曳，把人影拉得忽長忽短，空氣又悶又潮，混著一股汗臭與煤油的氣味。","exits":{"north":"/d/swaylan/forest/clearing","southwest":"/d/swaylan/forest/hideout"},"objects":{"/d/swaylan/forest/npc/bandit":2,"/d/swaylan/forest/npc/bandit_leader":1},"special":[],"area":"密林","layer":"地下","areaKey":"密林","pos":[0,1,0]},"/d/swaylan/forest_edge":{"id":"/d/swaylan/forest_edge","file":"source/upstream/mudlib/d/swaylan/forest_edge.c","short":"密林邊緣","long":"一片繁茂的密林在此展開，古木參天，枝葉交纏得密不透風，林中聽不見半聲鳥叫，靜得教人心裡發毛。林緣的灌木叢有一處被撥開了縫隙，斷枝上掛著幾縷破布，像是常有人從這裡鑽進鑽出。","exits":{"southwest":"/d/swaylan/east_gate"},"objects":{},"special":[{"cmd":"enter 密林","to":"/d/swaylan/forest/entrance"}],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[5,-1,0]},"/d/swaylan/gambling_house":{"id":"/d/swaylan/gambling_house","file":"source/upstream/mudlib/d/swaylan/gambling_house.c","short":"賭場","long":"一間剛被官府查封的賭場，門板上還交叉貼著蓋了大印的封條，被人撕開了一角。屋裡的賭桌翻倒在地，骰子和竹籌撒了一地也沒人收拾，空氣中殘留著汗臭與劣酒的氣味，一片狼藉。","exits":{"south":"/d/swaylan/west_gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-2,-1,0]},"/d/swaylan/hillside":{"id":"/d/swaylan/hillside","file":"source/upstream/mudlib/d/swaylan/hillside.c","short":"山坡地","long":"出了東城門，地勢漸漸隆起，一片長滿芒草的山坡在眼前鋪開，幾條踩出來的小徑在草間交錯。遠處山巒層層疊疊，最高的一座峰頂終年雲霧繚繞，想必便是有名的落雲峰。","exits":{"west":"/d/swaylan/east_gate","southeast":"/d/swaylan/buxuan/slope"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[5,0,0]},"/d/swaylan/inn":{"id":"/d/swaylan/inn","file":"source/upstream/mudlib/d/swaylan/inn.c","short":"五陵客棧","long":"你現在位於水嵐縣中最出名的五陵客棧前面，在各地往來的商旅，通常都會在這一家客棧休憩，在客棧的廂房中，無時無刻都有許多的旅人住在裡面，很多的人都會在這裡交換旅遊的心得，也有許多有關武林的傳聞也可以在這裡問到。在門的上頭掛著一幅匾額，上面提著【五陵客棧】四個大字。","exits":{"west":"/d/swaylan/west_street","east":"/d/swaylan/east_street1","north":"/d/swaylan/north_street2","south":"/d/swaylan/south_street1","up":"/d/swaylan/inn2"},"objects":{"/d/swaylan/npc/waiter":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,0,0]},"/d/swaylan/inn2":{"id":"/d/swaylan/inn2","file":"source/upstream/mudlib/d/swaylan/inn2.c","short":"五陵客棧二樓","long":"你現在在五陵客棧的二樓，這裡專供一些來往的客人休息用，不過通常只有有關係的人才能夠進來。在你的面前有幾張椅子，還有桌子，上面放一些茶水供人飲用。要是餓了，可以招呼店小二幫你送東西來。","exits":{"down":"/d/swaylan/inn"},"objects":{"/d/swaylan/npc/zhang_ling":1,"/d/swaylan/npc/li_zai_yan":1},"special":[],"area":"水嵐縣","layer":"二樓","areaKey":"水嵐縣","pos":[0,0,1]},"/d/swaylan/lunmay/bedroom":{"id":"/d/swaylan/lunmay/bedroom","file":"source/upstream/mudlib/d/swaylan/lunmay/bedroom.c","short":"寢房","long":"房內陳設簡單，床榻旁擺著小几，上頭放著藥碗與幾帖尚未服用的藥方。屋裡瀰漫著一股苦澀的藥味，窗紙糊得嚴嚴實實，床帳低低垂著，帳後不時傳出幾聲壓抑的輕咳。","exits":{"south":"/d/swaylan/lunmay/corridor_e"},"objects":{"/d/swaylan/lunmay/npc/may_wife":1},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[1,-2,0]},"/d/swaylan/lunmay/corridor_e":{"id":"/d/swaylan/lunmay/corridor_e","file":"source/upstream/mudlib/d/swaylan/lunmay/corridor_e.c","short":"穿廊","long":"東邊的穿廊比別處安靜得多，往來的僕役走到這裡都放輕了腳步，彷彿怕驚擾了什麼。廊邊擺著幾只熬藥用的陶爐，爐底的炭灰還有餘溫，空氣中隱隱飄著一股苦澀的藥氣。","exits":{"north":"/d/swaylan/lunmay/bedroom","west":"/d/swaylan/lunmay/hall"},"objects":{},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[1,-1,0]},"/d/swaylan/lunmay/corridor_w":{"id":"/d/swaylan/lunmay/corridor_w","file":"source/upstream/mudlib/d/swaylan/lunmay/corridor_w.c","short":"穿廊","long":"一道木造的穿廊連著正廳與西側的廳房，廊柱漆成深褐色，欄杆外種著一排老梅，枝幹斜斜探進廊裡。廊下鋪著青磚，被往來的腳步磨得光滑，走在上面，腳步聲在廊間輕輕迴盪。","exits":{"north":"/d/swaylan/lunmay/side_hall","east":"/d/swaylan/lunmay/hall"},"objects":{},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[-1,-1,0]},"/d/swaylan/lunmay/courtyard":{"id":"/d/swaylan/lunmay/courtyard","file":"source/upstream/mudlib/d/swaylan/lunmay/courtyard.c","short":"冷梅莊","long":"一片老梅環繞的庭院，碎石小徑在梅林間蜿蜒，連接著前後院落。梅樹都有些年歲了，枝幹虯曲如鐵，樹下落著厚厚一層枯葉，劍刃交擊的清響不時從一旁的練武場傳來，鏗鏘悅耳。","exits":{"north":"/d/swaylan/lunmay/hall","south":"/d/swaylan/lunmay/front_yard","west":"/d/swaylan/lunmay/pavilion","east":"/d/swaylan/lunmay/drill_n"},"objects":{},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[0,0,0]},"/d/swaylan/lunmay/drill_n":{"id":"/d/swaylan/lunmay/drill_n","file":"source/upstream/mudlib/d/swaylan/lunmay/drill_n.c","short":"練武場","long":"一片寬闊的練武場，地上鋪著平整的青石板，被經年累月的步法踩出一圈圈淺痕。場邊的兵器架上插滿了長短不一的劍，寒光閃閃，弟子們正在對拆劍招，喝叱聲與劍刃交擊聲此起彼落。","exits":{"south":"/d/swaylan/lunmay/drill_s","west":"/d/swaylan/lunmay/courtyard"},"objects":{"/d/swaylan/lunmay/npc/apprentice":2},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[1,0,0]},"/d/swaylan/lunmay/drill_s":{"id":"/d/swaylan/lunmay/drill_s","file":"source/upstream/mudlib/d/swaylan/lunmay/drill_s.c","short":"練武場","long":"練武場的南半邊立著幾具木頭假人，身上佈滿了劍痕，有些地方已被刺穿了好幾個窟窿。這裡是入門弟子打根基之處，石板上滴滿了汗水留下的深色斑點，一旁的水缸裡浮著一隻葫蘆瓢。","exits":{"north":"/d/swaylan/lunmay/drill_n","west":"/d/swaylan/lunmay/front_yard"},"objects":{"/d/swaylan/lunmay/npc/stake":2,"/d/swaylan/lunmay/npc/apprentice3":1},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[1,1,0]},"/d/swaylan/lunmay/front_yard":{"id":"/d/swaylan/lunmay/front_yard","file":"source/upstream/mudlib/d/swaylan/lunmay/front_yard.c","short":"冷梅莊前院","long":"這裡是冷梅莊練劍的地方, 在院子裡有一些木製的橫樑, 在上面掛了很多空心的環, 高低不一, 聽說冷梅劍練到一定的火侯, 能夠一劍穿過所有環的中心而不碰觸到環, 院子裡還有一些椅子, 供練劍的人累了休息用.","exits":{"north":"/d/swaylan/lunmay/courtyard","south":"/d/swaylan/lunmay/path","east":"/d/swaylan/lunmay/drill_s"},"objects":{"/d/swaylan/lunmay/npc/may_lan_wu":1},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[0,1,0]},"/d/swaylan/lunmay/gate":{"id":"/d/swaylan/lunmay/gate","file":"source/upstream/mudlib/d/swaylan/lunmay/gate.c","short":"冷梅莊大門","long":"冷梅莊的大門是兩扇黑漆木門，門上銅環擦得發亮，門楣懸著一塊匾額，上書「冷梅莊」三個大字，筆力蒼勁。門前的石階掃得一塵不染，牆頭探出幾枝老梅，和莊外的塵土喧囂恍如兩個天地。","exits":{"north":"/d/swaylan/lunmay/path","south":"/d/swaylan/crossroad"},"objects":{"/d/swaylan/lunmay/npc/apprentice3":2},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[0,3,0]},"/d/swaylan/lunmay/hall":{"id":"/d/swaylan/lunmay/hall","file":"source/upstream/mudlib/d/swaylan/lunmay/hall.c","short":"冷梅莊正廳","long":"你來到了冷梅莊大廳裡，在大廳裡掛著一幅畫，畫中繪著許多梅樹。在畫的下方有一張太師椅，是莊主梅影風在處理事情時的座位，中央鋪著一塊地毯，上面繪著雪景。兩邊各有兩張座椅，是訪客來拜訪時坐的。向南穿過庭院可以通往前院，東西兩邊各有穿廊通往廳房。","exits":{"west":"/d/swaylan/lunmay/corridor_w","east":"/d/swaylan/lunmay/corridor_e","south":"/d/swaylan/lunmay/courtyard"},"objects":{"/d/swaylan/lunmay/npc/may_yin_fong":1,"/d/swaylan/lunmay/npc/goo":1},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[0,-1,0]},"/d/swaylan/lunmay/path":{"id":"/d/swaylan/lunmay/path","file":"source/upstream/mudlib/d/swaylan/lunmay/path.c","short":"冷梅莊","long":"進了大門，一條青石甬道筆直通往前院，兩旁種滿了梅樹，一株挨著一株，枝椏在頭頂交錯成一道天然的拱廊。腳步踏在甬道上，四下清幽寂靜，教人不知不覺放慢了步子。","exits":{"north":"/d/swaylan/lunmay/front_yard","south":"/d/swaylan/lunmay/gate"},"objects":{},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[0,2,0]},"/d/swaylan/lunmay/pavilion":{"id":"/d/swaylan/lunmay/pavilion","file":"source/upstream/mudlib/d/swaylan/lunmay/pavilion.c","short":"演武亭","long":"一座六角飛簷小亭，亭中擺著石桌石凳，是莊中長輩觀看弟子練劍的地方。亭柱上刻著一副對聯，字跡清瘦如梅枝，亭外幾株老梅環繞，坐在這裡，練武場上的劍光身影一覽無遺。","exits":{"east":"/d/swaylan/lunmay/courtyard"},"objects":{},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[-1,0,0]},"/d/swaylan/lunmay/side_hall":{"id":"/d/swaylan/lunmay/side_hall","file":"source/upstream/mudlib/d/swaylan/lunmay/side_hall.c","short":"側廳","long":"正廳西側的一間小廳，平日用來招待熟絡的客人，陳設比正廳隨意得多。窗下一張棋桌上還擺著半局殘棋，黑白子落得疏疏朗朗，一旁的茶盞早已涼透，看來下棋的人許久沒有回來了。","exits":{"south":"/d/swaylan/lunmay/corridor_w"},"objects":{},"special":[],"area":"冷梅莊","layer":null,"areaKey":"冷梅莊","pos":[-1,-2,0]},"/d/swaylan/north_gate":{"id":"/d/swaylan/north_gate","file":"source/upstream/mudlib/d/swaylan/north_gate.c","short":"北城門","long":"水嵐縣的北城門正對著羿水，城樓不高，門洞卻砌得厚實，幾名守衛持著兵器分立兩旁，盤查進出的行人。城門東首緊挨著一段年久失修的舊牆，牆根坍出一個半人高的破洞，洞後隱約是一片荒廢的院落。","exits":{"north":"/d/swaylan/ferry","south":"/d/swaylan/north_street1"},"objects":{"/d/swaylan/npc/gate_guard":4},"special":[{"cmd":"enter 破洞","to":"/d/swaylan/old_ferry"}],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,-3,0]},"/d/swaylan/north_street1":{"id":"/d/swaylan/north_street1","file":"source/upstream/mudlib/d/swaylan/north_street1.c","short":"街道","long":"這條街緊挨著北城門，進出城的行旅多半在此歇腳打尖，路邊擺著幾個茶水攤子，壺嘴冒著熱氣。往來的人群中不乏佩刀帶劍的江湖客，三三兩兩地站著說話，南腔北調，倒也熱鬧。","exits":{"north":"/d/swaylan/north_gate","south":"/d/swaylan/north_street2","east":"/d/swaylan/dirt_road"},"objects":{"/d/swaylan/npc/swordman":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,-2,0]},"/d/swaylan/north_street2":{"id":"/d/swaylan/north_street2","file":"source/upstream/mudlib/d/swaylan/north_street2.c","short":"北大街","long":"走在街道上，你可以發現水嵐縣蠻熱鬧的，在街道上有很多行人走來走去，有小販在吆喝著，有些太太們出來買菜，向西北走去可以通往水嵐縣的第一大戶【冷梅莊】，向南望去可以看到有一家客棧，有很多的人聚集在那，你可以去看看有沒有什麼好吃的。","exits":{"north":"/d/swaylan/north_street1","south":"/d/swaylan/inn","east":"/d/swaylan/smithy","northwest":"/d/swaylan/crossroad"},"objects":{"/d/swaylan/npc/man":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,-1,0]},"/d/swaylan/old_ferry":{"id":"/d/swaylan/old_ferry","file":"source/upstream/mudlib/d/swaylan/old_ferry.c","short":"舊渡口","long":"這裡原是水嵐縣的渡口，自從河道淤積，船家都搬去了新渡口，碼頭便荒廢下來。半截石階斜斜伸進淤泥裡，長滿了蘆葦，四周的圍牆坍出好幾處破洞，只剩幾隻水鳥在泥灘上踱來踱去。","exits":{"south":"/d/swaylan/dirt_road"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[1,-3,0]},"/d/swaylan/pawnshop":{"id":"/d/swaylan/pawnshop","file":"source/upstream/mudlib/d/swaylan/pawnshop.c","short":"高陽當鋪","long":"在你面前的是一間當舖，你可以在這裡將你不想要的東西賣掉，當然你也可以在這裡買到一些好的裝備或武器，不過通常要付出的價錢會比平常多。在這裡買賣，絕對是童叟無欺，不會因為你是惡霸或是土匪比較便宜，也不會因為你是小孩子而賣你特別貴。所以高陽當舖在水嵐縣就漸漸的出名了。","exits":{"south":"/d/swaylan/street2"},"objects":{"/d/swaylan/npc/pawn_guard":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[2,1,0]},"/d/swaylan/smithy":{"id":"/d/swaylan/smithy","file":"source/upstream/mudlib/d/swaylan/smithy.c","short":"鐵匠鋪","long":"一進門便是一股熱浪撲面而來，爐火燒得通紅，鐵砧上叮叮噹噹的敲打聲震得人耳朵發麻。牆上掛滿了打好的短劍、匕首和鋤頭，角落的木桶裡浸著剛淬過火的鐵器，嘶嘶地冒著白煙。","exits":{"west":"/d/swaylan/north_street2"},"objects":{"/d/swaylan/npc/smith":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[1,-1,0]},"/d/swaylan/south_gate":{"id":"/d/swaylan/south_gate","file":"source/upstream/mudlib/d/swaylan/south_gate.c","short":"南城門","long":"水嵐縣的南城門，城門高大，門洞裡涼颼颼的，幾名守衛手按兵器，冷眼打量著進出的行人。出城的官道筆直地伸向西南，是往京畿去的大路，商旅車馬絡繹不絕，揚起一路黃塵。","exits":{"north":"/d/swaylan/south_street3"},"objects":{"/d/swaylan/npc/gate_guard":4},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,4,0]},"/d/swaylan/south_street1":{"id":"/d/swaylan/south_street1","file":"source/upstream/mudlib/d/swaylan/south_street1.c","short":"南大街","long":"南大街上多是住家，屋舍低矮整齊，門前曬著衣物和菜乾，巷口傳來孩童追逐嬉鬧的聲音。挑水的漢子從身邊走過，木桶一晃一晃，灑了一路的水跡，空氣中飄著誰家灶上燉肉的香味。","exits":{"north":"/d/swaylan/inn","south":"/d/swaylan/south_street2"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,1,0]},"/d/swaylan/south_street2":{"id":"/d/swaylan/south_street2","file":"source/upstream/mudlib/d/swaylan/south_street2.c","short":"南大街","long":"南大街到這裡變得寬敞，街西立著一座氣派的門樓，黑漆大門前蹲著兩頭石獅，門楣上懸著黃家鏢局的金字匾額。門前常有鏢車進出，車轍在青石板上碾出兩道深痕，一路通到大門口。","exits":{"north":"/d/swaylan/south_street1","south":"/d/swaylan/south_street3","west":"/d/swaylan/escort_gate","east":"/d/swaylan/street1"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,2,0]},"/d/swaylan/south_street3":{"id":"/d/swaylan/south_street3","file":"source/upstream/mudlib/d/swaylan/south_street3.c","short":"南大街","long":"南大街盡頭一帶，店鋪漸漸稀疏，路旁多了幾家車馬店，院子裡停著大車，拴著騾馬，草料與牲口的氣味撲鼻而來。趕車的腳夫圍在一起蹲著吃飯，說的盡是京畿一路上的見聞。","exits":{"north":"/d/swaylan/south_street2","south":"/d/swaylan/south_gate"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[0,3,0]},"/d/swaylan/street1":{"id":"/d/swaylan/street1","file":"source/upstream/mudlib/d/swaylan/street1.c","short":"街道","long":"一條尋常的街道，兩旁是賣豆腐、醬菜的小鋪子，鋪面不大，卻收拾得乾乾淨淨。醬缸的酸香混著豆漿的甜味在街上飄散，來往的多是附近的街坊，彼此熟識，見面總要寒暄兩句。","exits":{"west":"/d/swaylan/south_street2","east":"/d/swaylan/street2"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[1,2,0]},"/d/swaylan/street2":{"id":"/d/swaylan/street2","file":"source/upstream/mudlib/d/swaylan/street2.c","short":"街道","long":"街邊一座磚砌高牆圍住了當鋪的後院，牆頭插著碎瓷片，門口有護衛把守，看來防範甚嚴。街上行人到了這裡腳步都快了幾分，偶有幾個衣衫寒酸的人在當鋪門前躊躇，終究還是走了進去。","exits":{"west":"/d/swaylan/street1","east":"/d/swaylan/alley","north":"/d/swaylan/pawnshop"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[2,2,0]},"/d/swaylan/street_se":{"id":"/d/swaylan/street_se","file":"source/upstream/mudlib/d/swaylan/street_se.c","short":"街道","long":"城東南角一條街道，兩旁是幾戶殷實人家，粉牆黛瓦，牆頭探出幾枝石榴。不時有婦人提著菜籃經過，在井邊停下來閒話家常，說笑聲隔著老遠便能聽見，透著一股安穩的氣息。","exits":{"north":"/d/swaylan/east_gate","southwest":"/d/swaylan/alley"},"objects":{"/d/swaylan/npc/woman":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[4,1,0]},"/d/swaylan/temple/dining":{"id":"/d/swaylan/temple/dining","file":"source/upstream/mudlib/d/swaylan/temple/dining.c","short":"齋堂","long":"寺裡供香客用齋的地方，幾張長條木桌排得整整齊齊，桌上擺著粗瓷碗筷。灶間飄來米飯與青菜的清香，寶蓮寺向來為上香的信眾備一頓素齋，桌邊的香客低聲說話，吃得十分安靜。","exits":{"east":"/d/swaylan/temple/main_hall"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[3,-3,0]},"/d/swaylan/temple/dorm":{"id":"/d/swaylan/temple/dorm","file":"source/upstream/mudlib/d/swaylan/temple/dorm.c","short":"寮房","long":"一排簡樸的寮房，專供雲遊參學的行腳僧、道士借宿暫住，屋裡只有一張木板床和一盞油燈。寮房後頭隔著一道竹籬，是寺中女尼起居的地方，籬門緊閉，門上掛著一塊「閒人止步」的木牌。","exits":{"west":"/d/swaylan/temple/main_hall"},"objects":{"/d/swaylan/temple/npc/young_nun":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[5,-3,0]},"/d/swaylan/temple/gate":{"id":"/d/swaylan/temple/gate","file":"source/upstream/mudlib/d/swaylan/temple/gate.c","short":"寶蓮寺","long":"來到這裡，映入你眼簾的是一座廟宇，裡面有很多的進香客，這裡恭奉的是觀世音菩薩，在前方有一座觀世音菩薩的塑身，前面擺了很多的供桌，上面有許多的香，水果，食物，在空中飄著裊裊香煙，旁邊有廟祝在那裡為進香客祈福。","exits":{"south":"/d/swaylan/east_street3","northeast":"/d/swaylan/temple/side_hall"},"objects":{"/d/swaylan/temple/npc/abbot":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[3,-1,0]},"/d/swaylan/temple/main_hall":{"id":"/d/swaylan/temple/main_hall","file":"source/upstream/mudlib/d/swaylan/temple/main_hall.c","short":"正殿","long":"寶蓮寺正殿高大軒敞，正中供著一尊白衣觀世音菩薩，手持淨瓶楊柳，低眉垂目，神情慈悲。殿內香煙繚繞，木魚聲篤篤不絕，幾個蒲團被跪得凹陷下去，看得出這裡的香火向來鼎盛。","exits":{"south":"/d/swaylan/temple/side_hall","west":"/d/swaylan/temple/dining","east":"/d/swaylan/temple/dorm"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[4,-3,0]},"/d/swaylan/temple/side_hall":{"id":"/d/swaylan/temple/side_hall","file":"source/upstream/mudlib/d/swaylan/temple/side_hall.c","short":"側殿","long":"正殿旁的一間偏殿，殿中供著幾尊小小的菩薩像，案前的功德箱漆色斑駁，投錢的縫口被摸得發亮。信眾在這裡點燈添油，佛前一排長明燈火光搖曳，燈油的氣味混著檀香，在殿裡靜靜瀰漫。","exits":{"southwest":"/d/swaylan/temple/gate","north":"/d/swaylan/temple/main_hall"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[4,-2,0]},"/d/swaylan/west_gate":{"id":"/d/swaylan/west_gate","file":"source/upstream/mudlib/d/swaylan/west_gate.c","short":"西城門","long":"水嵐縣的西城門，兩扇城門包著鐵皮，門釘已經生了鏽。出城的大路通往紫煙鎮，來往的多半是挑擔的小販與趕車的腳夫，城門口的石板被車輪碾得坑坑窪窪，積著一層薄薄的黃土。","exits":{"north":"/d/swaylan/gambling_house","east":"/d/swaylan/west_street","west":"/d/ziyan/entrance"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-2,0,0]},"/d/swaylan/west_street":{"id":"/d/swaylan/west_street","file":"source/upstream/mudlib/d/swaylan/west_street.c","short":"西大街","long":"西大街兩旁多是賣雜貨、布疋的小店，門前掛著褪了色的幌子，夥計倚在門口招呼客人。街上行人來來往往，挑擔的、推車的擠成一團，叫賣聲與討價還價聲此起彼落，滿是市井氣息。","exits":{"west":"/d/swaylan/west_gate","east":"/d/swaylan/inn","north":"/d/swaylan/bank"},"objects":{},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-1,0,0]},"/d/swaylan/woods1":{"id":"/d/swaylan/woods1","file":"source/upstream/mudlib/d/swaylan/woods1.c","short":"樹林","long":"城牆外的一片雜木林，林邊被踩出一條小徑，兩旁堆著捆好的柴薪，等著挑進城裡去賣。樹蔭底下透著一股潮濕的泥土味，偶爾有鳥雀從枝頭撲稜稜飛起，又落進更深的林子裡。","exits":{"north":"/d/swaylan/woods2","east":"/d/swaylan/crossroad"},"objects":{"/d/swaylan/npc/cutter":1},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-2,-2,0]},"/d/swaylan/woods2":{"id":"/d/swaylan/woods2","file":"source/upstream/mudlib/d/swaylan/woods2.c","short":"樹林","long":"林子越往裡走越密，粗大的樹幹上留著一道道斧痕，地上散落著劈下的枝椏和木屑，空氣裡滿是松脂的氣味。篤篤伐木聲在林間來回迴盪，一聲接著一聲，聽來格外清晰。","exits":{"south":"/d/swaylan/woods1"},"objects":{"/d/swaylan/npc/cutter":2},"special":[],"area":"水嵐縣","layer":null,"areaKey":"水嵐縣","pos":[-2,-3,0]},"/d/taiyi/cell":{"id":"/d/taiyi/cell","file":"source/upstream/mudlib/d/taiyi/cell.c","short":"廂房","long":"這是一間清靜的小廂房，窗下一張舊木榻，榻上放著蒲團，牆角的銅爐冒著細細的青煙。桌上攤著幾卷泛黃的道經，書頁邊緣被翻得起了毛，想來主人時常展讀，一室之內只聞淡淡的墨香。","exits":{"west":"/d/taiyi/main_hall"},"objects":{"/d/taiyi/npc/shang_ching":1},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[3,0,0]},"/d/taiyi/cliff":{"id":"/d/taiyi/cliff","file":"source/upstream/mudlib/d/taiyi/cliff.c","short":"山崖邊","long":"通道盡頭是一處突出山壁的崖台，腳下山勢陡落，雪亭鎮的屋舍縮成了小小一片，溪流如銀線蜿蜒而過，遠處青邪大山層層疊疊，直入天際。獨立崖邊，衣袂獵獵，頗有獨上高樓，望盡天涯路之感。","exits":{"west":"/d/taiyi/passage3"},"objects":{"/d/taiyi/npc/hsuan_ching":1},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[7,-1,0]},"/d/taiyi/corridor1":{"id":"/d/taiyi/corridor1","file":"source/upstream/mudlib/d/taiyi/corridor1.c","short":"觀內走道","long":"走道兩側是粉牆黛瓦，地面鋪著被鞋底磨得發亮的青石板。一扇扇木門都關著，門縫裏漏出低低的談笑與翻身聲，想來是遠道而來投宿的香客，連廊下的腳步也不由得放輕了。","exits":{"east":"/d/taiyi/hall","north":"/d/taiyi/corridor2","west":"/d/taiyi/guest3"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[0,0,0]},"/d/taiyi/corridor2":{"id":"/d/taiyi/corridor2","file":"source/upstream/mudlib/d/taiyi/corridor2.c","short":"觀內走道","long":"走道細長而安靜，簷下掛著一排竹編的燈籠，燈穗隨著氣流輕輕擺動。兩旁的房門都漆成了暗紅色，門上的銅環擦得發亮，想必每日都有人細心打理，連一絲灰塵也不見。","exits":{"south":"/d/taiyi/corridor1","north":"/d/taiyi/corridor3","west":"/d/taiyi/guest2"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[0,-1,0]},"/d/taiyi/corridor3":{"id":"/d/taiyi/corridor3","file":"source/upstream/mudlib/d/taiyi/corridor3.c","short":"觀內走道","long":"走道到了盡頭，一堵粉牆擋在眼前，牆根下的青苔爬了半人高，牆上砌著一方小小的花窗，窗外隱約是山上的樹影。此處遠離前殿的人聲，只剩風過竹葉的沙沙聲，一片清幽。","exits":{"south":"/d/taiyi/corridor2","west":"/d/taiyi/guest1","northeast":"/d/taiyi/trail1"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[0,-2,0]},"/d/taiyi/gate":{"id":"/d/taiyi/gate","file":"source/upstream/mudlib/d/taiyi/gate.c","short":"太乙觀門口","long":"山路到了這裡豁然開朗，一座青瓦道觀倚著山勢而建，朱漆大門兩側各蹲著一尊石獅，鬃毛被往來的香客摸得發亮。門內香煙裊裊，鐘磬聲隱隱傳出，進出的人流絡繹不絕，可見此間香火之盛。","exits":{"northwest":"/d/taiyi/hall","east":"/d/graveyard/grave8"},"objects":{"/d/npc/stone_lion":2},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[2,1,0]},"/d/taiyi/guest1":{"id":"/d/taiyi/guest1","file":"source/upstream/mudlib/d/taiyi/guest1.c","short":"香客廂房","long":"這是一間淡雅的素房, 整個房間有一種說不出來的寧靜和無慾。中央\n的小桌上一面小旗寫著: 太乙觀宿房。","exits":{"east":"/d/taiyi/corridor3"},"objects":{"/d/taiyi/npc/pilgrim":1},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[-1,-2,0]},"/d/taiyi/guest2":{"id":"/d/taiyi/guest2","file":"source/upstream/mudlib/d/taiyi/guest2.c","short":"香客廂房","long":"這是一間淡雅的素房, 整個房間有一種說不出來的寧靜和無慾。中央\n的小桌上一面小旗寫著: 太乙觀宿房。","exits":{"east":"/d/taiyi/corridor2"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[-1,-1,0]},"/d/taiyi/guest3":{"id":"/d/taiyi/guest3","file":"source/upstream/mudlib/d/taiyi/guest3.c","short":"香客廂房","long":"這是一間淡雅的素房, 整個房間有一種說不出來的寧靜和無慾。中央\n的小桌上一面小旗寫著: 太乙觀宿房。","exits":{"east":"/d/taiyi/corridor1"},"objects":{"/d/taiyi/npc/pilgrim":1},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[-1,0,0]},"/d/taiyi/hall":{"id":"/d/taiyi/hall","file":"source/upstream/mudlib/d/taiyi/hall.c","short":"太乙觀前廳","long":"跨過高高的門檻便是前廳，青石鋪地，四壁掛著幾幅褪了色的雲水圖。廳中擺著功德箱與簽筒，進香的人三三兩兩，低聲交談，腳步放得極輕。檀香的氣味沉沉地浮在樑下，怎麼也散不去。","exits":{"southeast":"/d/taiyi/gate","west":"/d/taiyi/corridor1","east":"/d/taiyi/main_hall"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[1,0,0]},"/d/taiyi/main_hall":{"id":"/d/taiyi/main_hall","file":"source/upstream/mudlib/d/taiyi/main_hall.c","short":"太乙觀正殿","long":"大殿高闊，梁柱漆得朱紅，殿心三尊神像並肩端坐，正是道門最尊的三清天尊，個個寶相莊嚴，垂眉俯視。供桌上香煙繚繞，蒲團前跪滿了祈福的信眾，木魚與誦經聲交織成一片，久久不散。","exits":{"west":"/d/taiyi/hall","east":"/d/taiyi/cell","north":"/d/taiyi/yard"},"objects":{"/d/taiyi/npc/taoist_leader":1},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[2,0,0]},"/d/taiyi/passage1":{"id":"/d/taiyi/passage1","file":"source/upstream/mudlib/d/taiyi/passage1.c","short":"通道","long":"暗門之後是一條狹窄的石砌通道，僅容一人側身而過，壁上插著半截殘燭，燭淚積了厚厚一層。空氣裏有股久未流通的潮味，腳步聲在石壁間來回碰撞，顯得格外清晰，不知已有多久沒人來過。","exits":{"south":"/d/taiyi/well","north":"/d/taiyi/passage2"},"objects":{},"special":[],"area":"太乙觀","layer":"地下","areaKey":"太乙觀","pos":[5,0,0]},"/d/taiyi/passage2":{"id":"/d/taiyi/passage2","file":"source/upstream/mudlib/d/taiyi/passage2.c","short":"通道","long":"通道在此轉了個彎，石壁漸漸由人工砌築轉為天然岩層，縫隙間滲進絲絲涼意，隱約還帶著草木的氣息。地上的青磚磨損得厲害，凹凹凸凸的，顯然曾有人經常往返於此。","exits":{"south":"/d/taiyi/passage1","east":"/d/taiyi/passage3"},"objects":{},"special":[],"area":"太乙觀","layer":"地下","areaKey":"太乙觀","pos":[5,-1,0]},"/d/taiyi/passage3":{"id":"/d/taiyi/passage3","file":"source/upstream/mudlib/d/taiyi/passage3.c","short":"通道","long":"通道愈走愈寬，岩壁上留著斧鑿的痕跡，一盞早已熄滅的油燈掛在石釘上，燈罩積滿了灰。前方透進亮光，風聲也一陣緊似一陣，隱約夾著山下遠處傳來的人聲與犬吠。","exits":{"west":"/d/taiyi/passage2","east":"/d/taiyi/cliff"},"objects":{},"special":[],"area":"太乙觀","layer":"地下","areaKey":"太乙觀","pos":[6,-1,0]},"/d/taiyi/trail1":{"id":"/d/taiyi/trail1","file":"source/upstream/mudlib/d/taiyi/trail1.c","short":"後山小路","long":"小路自觀後的石階蜿蜒而上，兩旁古松夾道，松針鋪了一地，踩上去軟軟的不出聲。回頭望去，太乙觀的飛簷隱在松枝之間，鐘磬聲也漸漸淡了，只餘山風一陣一陣拂過林梢。","exits":{"southwest":"/d/taiyi/corridor3","north":"/d/taiyi/trail2"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[1,-3,0]},"/d/taiyi/trail2":{"id":"/d/taiyi/trail2","file":"source/upstream/mudlib/d/taiyi/trail2.c","short":"後山小路","long":"山路愈走愈陡，石階被經年的山水沖刷得坑坑窪窪，路旁的岩縫裏生著幾株倔強的野菊。林中寂靜，偶爾有鳥雀掠過枝頭，抬頭可見層層疊疊的山影，那便是青邪大山的外緣了。","exits":{"south":"/d/taiyi/trail1","northwest":"/d/taiyi/trail3"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[1,-4,0]},"/d/taiyi/trail3":{"id":"/d/taiyi/trail3","file":"source/upstream/mudlib/d/taiyi/trail3.c","short":"後山小路","long":"路到這裡已不成路，只剩一道被樵夫與獵戶踩出來的小徑，隱沒在茂密的灌木與藤蔓之間。山勢在前方陡然拔高，林影深處霧氣瀰漫，向來是這一帶終年不散的景象，青邪大山就在眼前。","exits":{"southeast":"/d/taiyi/trail2"},"objects":{},"special":[],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[0,-5,0]},"/d/taiyi/well":{"id":"/d/taiyi/well","file":"source/upstream/mudlib/d/taiyi/well.c","short":"井底","long":"井底陰濕狹窄，抬頭只見一小圈天光，一條繩索從上方垂落。井壁砌得整整齊齊，磚縫間滲著水氣，青苔滑膩膩地爬了滿牆，四下靜得只聽見水珠一滴一滴落下，回音在井中久久不散。","exits":{},"objects":{},"special":[{"cmd":"climb 繩索","to":"/d/taiyi/yard"},{"cmd":"push 暗門","to":"/d/taiyi/passage1"}],"area":"太乙觀","layer":"地下","areaKey":"太乙觀","pos":[5,1,0]},"/d/taiyi/yard":{"id":"/d/taiyi/yard","file":"source/upstream/mudlib/d/taiyi/yard.c","short":"後院","long":"後院不大，青磚縫裏長著幾叢野草，牆角堆著劈好的柴火，與前頭的熙攘比起來冷清了許多。院子一角有座不起眼的古井，井欄被磨得光滑，井口垂下一條繩索，也不知通向多深的地方。","exits":{"south":"/d/taiyi/main_hall"},"objects":{},"special":[{"cmd":"climb 繩索","to":"/d/taiyi/well"}],"area":"太乙觀","layer":null,"areaKey":"太乙觀","pos":[2,-1,0]},"/d/tianshan/cabin":{"id":"/d/tianshan/cabin","file":"source/upstream/mudlib/d/tianshan/cabin.c","short":"小木屋","long":"小木屋內擺設十分簡單，但是打掃的很乾淨。牆上掛著兩把鐵劍，中央供著神像。從房內的擺設來看，這一家應該是武術世家。","exits":{"south":"/d/tianshan/dirt_road3"},"objects":{"/d/tianshan/npc/liuh_qingqing":1},"special":[],"area":"天山","layer":null,"areaKey":"天山","pos":[0,-3,0]},"/d/tianshan/cave1":{"id":"/d/tianshan/cave1","file":"source/upstream/mudlib/d/tianshan/cave1.c","short":"山洞內","long":"山洞裡一片漆黑你什麼也看不見。","exits":{"out":"/d/tianshan/spring","east":"/d/tianshan/cave2"},"objects":{},"special":[],"area":"天山","layer":"洞穴","areaKey":"天山","pos":[-4,0,0]},"/d/tianshan/cave2":{"id":"/d/tianshan/cave2","file":"source/upstream/mudlib/d/tianshan/cave2.c","short":"山洞內","long":"山洞裡黑黑的，只有幾絲光亮從西邊的一個小洞口照射進來。","exits":{"west":"/d/tianshan/cave1"},"objects":{},"special":[{"cmd":"enter 洞口","to":"/d/tianshan/cave_mouth"}],"area":"天山","layer":"洞穴","areaKey":"天山","pos":[-3,0,0]},"/d/tianshan/cave_mouth":{"id":"/d/tianshan/cave_mouth","file":"source/upstream/mudlib/d/tianshan/cave_mouth.c","short":"洞口","long":"洞外是一片茂盛的桃林，林中不停的飄來陣陣醉人的花香。你注意到這片桃林是經過精心照顧，好像是有什麼人故意做的迷陣。桃花叢中好像有一條小徑。","exits":{"west":"/d/tianshan/cave2"},"objects":{},"special":[{"cmd":"search 小徑","to":"/d/tianshan/dirt_road1"}],"area":"天山","layer":null,"areaKey":"天山","pos":[-2,0,0]},"/d/tianshan/dirt_road1":{"id":"/d/tianshan/dirt_road1","file":"source/upstream/mudlib/d/tianshan/dirt_road1.c","short":"土路","long":"一條崎嶇小土路向西邊延伸，微風中醉人的桃花香讓你浮想翩翩。你不禁懷疑到底是何方仙人隱居於此。","exits":{"west":"/d/tianshan/cave_mouth","east":"/d/tianshan/fork"},"objects":{},"special":[],"area":"天山","layer":null,"areaKey":"天山","pos":[-1,0,0]},"/d/tianshan/dirt_road2":{"id":"/d/tianshan/dirt_road2","file":"source/upstream/mudlib/d/tianshan/dirt_road2.c","short":"土路","long":"土路沿著山腰向北蜿蜒，兩旁的桃樹漸漸稀疏，換成一叢叢半人高的野草，腳底踩過去沙沙作響。路面上落著幾瓣不知從哪兒飄來的桃花瓣，被腳步帶得輕輕翻滾，四下裡靜得出奇。","exits":{"north":"/d/tianshan/dirt_road3","south":"/d/tianshan/fork"},"objects":{},"special":[],"area":"天山","layer":null,"areaKey":"天山","pos":[0,-1,0]},"/d/tianshan/dirt_road3":{"id":"/d/tianshan/dirt_road3","file":"source/upstream/mudlib/d/tianshan/dirt_road3.c","short":"土路","long":"土路到這裡更窄了，兩旁立著幾根斑駁的木樁，上頭拴過的麻繩早已腐爛。遠遠看得見一間小木屋的屋頂探出樹梢，屋簷下垂著一串風乾的草藥，屋前的泥地掃得乾乾淨淨。","exits":{"north":"/d/tianshan/cabin","south":"/d/tianshan/dirt_road2"},"objects":{},"special":[],"area":"天山","layer":null,"areaKey":"天山","pos":[0,-2,0]},"/d/tianshan/fog":{"id":"/d/tianshan/fog","file":"source/upstream/mudlib/d/tianshan/fog.c","short":"霧海","long":"這裡的霧氣十分沉重，你差點連回去的路都找不到，更別提上山的山路了。","exits":{"westdown":"/d/fengcheng/east_gate"},"objects":{},"special":[{"cmd":"search 山路","to":"/d/tianshan/spring"},{"cmd":"msearch 山路","to":"/d/tianshan/spring"}],"area":"天山","layer":null,"areaKey":"天山","pos":[-5,-1,0]},"/d/tianshan/fork":{"id":"/d/tianshan/fork","file":"source/upstream/mudlib/d/tianshan/fork.c","short":"岔路口","long":"北邊有一個小木屋，不知道木屋的主人是誰。南面是一個小菜園，東面是一片桃林。","exits":{"north":"/d/tianshan/dirt_road2","west":"/d/tianshan/dirt_road1","south":"/d/tianshan/garden","east":"/d/tianshan/peach_grove"},"objects":{},"special":[],"area":"天山","layer":null,"areaKey":"天山","pos":[0,0,0]},"/d/tianshan/garden":{"id":"/d/tianshan/garden","file":"source/upstream/mudlib/d/tianshan/garden.c","short":"小菜園","long":"一塊整整齊齊的小菜園，畦上種著青菜與蘿蔔，行距分明，顯然有人精心照料。園邊用竹竿搭起幾架豆棚，藤蔓爬得老高，泥土裡混著淡淡的桃花香，與山下的菜地全然不同。","exits":{"north":"/d/tianshan/fork"},"objects":{},"special":[],"area":"天山","layer":null,"areaKey":"天山","pos":[0,1,0]},"/d/tianshan/hall":{"id":"/d/tianshan/hall","file":"source/upstream/mudlib/d/tianshan/hall.c","short":"靈堂","long":"一張長桌上擺著一些供品，桌子的中央是一個靈位，上面刻著顯考柳公諱臻之靈位。屋子的另一端有幾把香，你可以跪拜靈位。","exits":{"out":"/d/tianshan/cabin"},"objects":{},"special":[{"cmd":"kneel 靈位","to":"/d/tianshan/secret_room"}],"area":"天山","layer":"內堂","areaKey":"天山","pos":[3,0,0]},"/d/tianshan/peach_grove":{"id":"/d/tianshan/peach_grove","file":"source/upstream/mudlib/d/tianshan/peach_grove.c","short":"桃花林","long":"四周都是開滿桃花的桃樹，整個院子裡洋溢著桃花的香氣。地上長著一些五顏六色的不知名的植物。","exits":{"west":"/d/tianshan/fork"},"objects":{"/d/tianshan/npc/mountain_god":1},"special":[],"area":"天山","layer":null,"areaKey":"天山","pos":[1,0,0]},"/d/tianshan/secret_room":{"id":"/d/tianshan/secret_room","file":"source/upstream/mudlib/d/tianshan/secret_room.c","short":"密室","long":"陰沉沉的屋子，光線從上面照下來，照在一面牆上。牆上似乎有些模糊的字跡。","exits":{"up":"/d/tianshan/hall"},"objects":{},"special":[],"area":"天山","layer":"密室","areaKey":"天山","pos":[5,0,0]},"/d/tianshan/spring":{"id":"/d/tianshan/spring","file":"source/upstream/mudlib/d/tianshan/spring.c","short":"清泉","long":"一股清泉從對面的石壁中湧了出來，飛快的奔向山下。幾根藤條從石壁上垂了下來，落在泉口, 泉口的旁邊有一條縫隙。","exits":{"south":"/d/tianshan/fog"},"objects":{},"special":[{"cmd":"enter 縫隙","to":"/d/tianshan/cave1"}],"area":"天山","layer":null,"areaKey":"天山","pos":[-4,-1,0]},"/d/wutang/backyard":{"id":"/d/wutang/backyard","file":"source/upstream/mudlib/d/wutang/backyard.c","short":"後院","long":"這裡是民房的後院，在後院裡有養著各式各樣的家畜，而在不遠的前方也有著一條很清澈的小溪，通常這也是這地方人家洗衣服和用水的小溪，而在小溪中也有幾隻小魚，溪中也有鴨子在上面玩水。","exits":{"north":"/d/wutang/path_e"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[6,0,0]},"/d/wutang/bamboo_grove":{"id":"/d/wutang/bamboo_grove","file":"source/upstream/mudlib/d/wutang/bamboo_grove.c","short":"綠竹林","long":"一片茂密的綠竹林，修長的竹子直入雲霄，竹葉沙沙作響，陽光從縫隙間灑落下來，顯得格外清幽。往北隱約可以看見一間綠竹搭成的小屋，往回走則要穿過那一大叢草叢。","exits":{"north":"/d/wutang/bamboo_hall"},"objects":{},"special":[{"cmd":"pass 草叢","to":"/d/wutang/gravel_road_n"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,4,0]},"/d/wutang/bamboo_hall":{"id":"/d/wutang/bamboo_hall","file":"source/upstream/mudlib/d/wutang/bamboo_hall.c","short":"主廳","long":"這是一間綠竹所造的小屋, 簡單的擺設中流露出異於凡俗的清幽雅緻, 東西兩側兩扇小窗引進樹林的淡淡清香繚繞室內, 幾張竹桌竹椅整齊的排在屋內, 竹桌上還泡著一壺清茶, 和一籃水果。","exits":{"south":"/d/wutang/bamboo_grove"},"objects":{"/d/wutang/npc/huyen_guan":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,3,0]},"/d/wutang/bank":{"id":"/d/wutang/bank","file":"source/upstream/mudlib/d/wutang/bank.c","short":"景隆錢莊","long":"五堂鎮最大的景隆錢莊，櫃臺後的夥計正劈哩啪啦地打著算盤，牆上掛著一塊「信義通商」的金字匾額。幾名身材魁梧的護院武師守在門口與內堂，讓人不敢有非分之想。在這裡可以存款、提款，也可以兌換銀兩。","exits":{"north":"/d/wutang/east_street1"},"objects":{"/d/npc/guard":4},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[1,3,0]},"/d/wutang/boardwalk_e":{"id":"/d/wutang/boardwalk_e","file":"source/upstream/mudlib/d/wutang/boardwalk_e.c","short":"木道","long":"木板步道的東段，木板已經有些老舊，縫隙間長出了青苔。往北是一片放牧著綿羊的草原，常能聽見羊群咩咩的叫聲，往東接到三岔路口，往西則通往鯉君渡，渡口那頭不時傳來船夫的吆喝聲。","exits":{"west":"/d/wutang/boardwalk_w","east":"/d/wutang/three_way","north":"/d/wutang/grass_se"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,5,0]},"/d/wutang/boardwalk_w":{"id":"/d/wutang/boardwalk_w","file":"source/upstream/mudlib/d/wutang/boardwalk_w.c","short":"木道","long":"一條用木板鋪成的步道，架在濕軟的河灘上，踩上去會發出吱吱嘎嘎的聲響。兩旁長著高過人頭的蘆葦，風一吹便沙沙作響，偶爾還會驚起幾隻水鳥。往西是鯉君渡，往東可以走往三岔路口。","exits":{"west":"/d/wutang/ferry","east":"/d/wutang/boardwalk_e"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,5,0]},"/d/wutang/boat":{"id":"/d/wutang/boat","file":"source/upstream/mudlib/d/wutang/boat.c","short":"小船上","long":"一艘用稻草搭著篷子的小草船，靜靜地停在羿水河心，隨著水波緩緩搖晃。船頭擱著一根釣竿，船上的人似乎已經在這裡垂釣了很久。四周都是河水，想回岸邊只能游回去。","exits":{},"objects":{"/d/wutang/npc/smoke_fisher":1},"special":[{"cmd":"swim","to":"/d/wutang/riverside"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,4,0]},"/d/wutang/city_god_temple":{"id":"/d/wutang/city_god_temple","file":"source/upstream/mudlib/d/wutang/city
