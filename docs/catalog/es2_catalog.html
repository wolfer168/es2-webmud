{"cmd":"climb 峭壁","to":"/d/baihua/platform"}],"area":"百花村","layer":null,"areaKey":"百花村","pos":[1,0,0]},"/d/baihua/cliff_edge":{"id":"/d/baihua/cliff_edge","file":"source/upstream/mudlib/d/baihua/cliff_edge.c","short":"峭壁邊","long":"峭壁的邊緣，一陣山風迎面吹來，吹得人衣袂翻飛。往下望去，雲霧在山腰間緩緩流動，底下的林木小得像一片青苔，遠方的山巒層層疊疊，直到天邊才與雲色融成一片。","exits":{"west":"/d/baihua/stone_road1"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,0,0]},"/d/baihua/hillside":{"id":"/d/baihua/hillside","file":"source/upstream/mudlib/d/baihua/hillside.c","short":"山腰上","long":"這裡的坡度漸漸變得平緩，可是兩旁的雜草生得極其茂密，高度比人還高，不知不覺你發現自己已經找不到路徑了！遠處傳來陣陣的狼嚎聲，你不禁開始緊張了起來。在這種地方迷了路，那可不是件好玩的事，趕緊找出路吧。","exits":{"northwest":"/d/oldpine/grass2"},"objects":{"/d/npc/goat":3},"special":[{"cmd":"search 草叢","to":"/d/baihua/trail"}],"area":"百花村","layer":null,"areaKey":"百花村","pos":[0,0,0]},"/d/baihua/inn":{"id":"/d/baihua/inn","file":"source/upstream/mudlib/d/baihua/inn.c","short":"紅燈客棧","long":"『簷前燈紅滿街照, 門後心酸何足道』. 一個深黑見方的木匾, 兩行金色狂草龍飛鳳舞的題於匾上, 氣勢狂野, 令人眼眩. 偌大一個大廳空空曠曠, 只有幾張板凳孤零零的四散著, 往二樓的樓梯被屏風擋著, 似乎已不宿客了.","exits":{"west":"/d/baihua/road2"},"objects":{"/d/baihua/npc/gong_sun_zhi":1,"/d/baihua/npc/innkeeper":1,"/d/baihua/npc/traveller":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,3,0]},"/d/baihua/platform":{"id":"/d/baihua/platform","file":"source/upstream/mudlib/d/baihua/platform.c","short":"懸崖平台","long":"呼..呼....陣陣的山風颳在你身上，你遠望著三邊無際的景色，幾片雲絲飄浮在眼前，似乎伸手可及。這個平台相當隱密，有如仙界一般幽雅，令人心曠神怡，峭壁上的花朵，似乎有人在細心照料，開得十分繁盛。","exits":{"eastup":"/d/baihua/cliff"},"objects":{"/d/baihua/npc/kao_yeu":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[1,-1,0]},"/d/baihua/road1":{"id":"/d/baihua/road1","file":"source/upstream/mudlib/d/baihua/road1.c","short":"常春道","long":"百花村的主要通道，路面鋪著平整的石板，兩旁的屋舍排列得整整齊齊。路上往來的人並不多，卻處處打掃得一塵不染，門前的花盆也照料得十分細心，看得出村民都很愛惜這個地方。","exits":{"north":"/d/baihua/stone_road2","west":"/d/baihua/trail","east":"/d/baihua/alley","south":"/d/baihua/road2"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,2,0]},"/d/baihua/road2":{"id":"/d/baihua/road2","file":"source/upstream/mudlib/d/baihua/road2.c","short":"常春道","long":"你走在一條小石子滿地的路上, 兩旁的花草樹木十分整齊的排列著, 右邊紅色燈籠整齊的掛在屋簷下, 看起來應該是個客棧. 遠眺南方草木叢生, 似乎人煙罕至, 隱隱的有幾聲狼嗥傳來, 坡度向東南而下.","exits":{"north":"/d/baihua/road1","east":"/d/baihua/inn","southwest":"/d/baihua/temple"},"objects":{"/d/baihua/npc/nan_kong_hen":1,"/d/npc/man":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,3,0]},"/d/baihua/school":{"id":"/d/baihua/school","file":"source/upstream/mudlib/d/baihua/school.c","short":"學堂","long":"一間簡樸的學堂，屋裡擺著幾張矮桌，牆上掛著一幅寫著「勤學」的字。幾個小學童坐在桌前搖頭晃腦地念著書，眼睛卻不時偷偷瞄向窗外，似乎一心只想著出去玩耍。","exits":{"east":"/d/baihua/stone_road2"},"objects":{"/d/baihua/npc/student":3},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,1,0]},"/d/baihua/stone_road1":{"id":"/d/baihua/stone_road1","file":"source/upstream/mudlib/d/baihua/stone_road1.c","short":"石子路","long":"一條鋪滿碎石子的小路，石子被往來的腳步磨得圓潤光滑，走起來沙沙作響。路旁種著一排排花草，紅的、黃的、紫的開成一片，花香隨風飄散，難怪這裡被稱作百花村。","exits":{"west":"/d/baihua/tile_house","east":"/d/baihua/cliff_edge","south":"/d/baihua/stone_road2"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,0,0]},"/d/baihua/stone_road2":{"id":"/d/baihua/stone_road2","file":"source/upstream/mudlib/d/baihua/stone_road2.c","short":"石子路","long":"百花村裡的石子路，路面打掃得乾乾淨淨，看不到一片落葉。路邊的竹籬笆上攀滿了牽牛花，幾隻蝴蝶在花叢間翩翩飛舞，偶爾有村民挑著花籃經過，朝你和善地笑一笑。","exits":{"north":"/d/baihua/stone_road1","west":"/d/baihua/school","east":"/d/baihua/wang_home","south":"/d/baihua/road1"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,1,0]},"/d/baihua/temple":{"id":"/d/baihua/temple","file":"source/upstream/mudlib/d/baihua/temple.c","short":"破舊小廟","long":"一座破舊的小廟，屋瓦殘缺不全，梁柱上的紅漆早已斑駁剝落。神案上的香爐積滿了灰，看來已經許久沒有人來上香了。廟門口蹲著一尊石獅子，雖然飽經風霜，神態依然威武。","exits":{"northeast":"/d/baihua/road2"},"objects":{"/d/npc/stone_lion":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,4,0]},"/d/baihua/tile_house":{"id":"/d/baihua/tile_house","file":"source/upstream/mudlib/d/baihua/tile_house.c","short":"瓦屋","long":"外觀破舊的瓦屋, 裡面卻相當清淨. 有股濃郁的藥材味撲鼻而來, 地上有多種材木, 味道顯然是由那些花花草草而來.","exits":{"west":"/d/baihua/cliff","east":"/d/baihua/stone_road1"},"objects":{"/d/baihua/npc/wang_yean":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,0,0]},"/d/baihua/trail":{"id":"/d/baihua/trail","file":"source/upstream/mudlib/d/baihua/trail.c","short":"荒野小徑","long":"終於隱隱約約發現有條小徑呈現著東南, 西北的走向, 遠望過去似乎有個村落在東邊, 還好沒迷了路。","exits":{"northwest":"/d/baihua/hillside","east":"/d/baihua/road1"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,2,0]},"/d/baihua/wang_home":{"id":"/d/baihua/wang_home","file":"source/upstream/mudlib/d/baihua/wang_home.c","short":"老王的家","long":"老王是這個小村裡最德高望重的人了, 從有這個村開始, 老王就在這住下了. 他正坐在家門口向你搖著手, 示意你過去聊聊天, 和藹的笑容令你不自覺的想走了過去.","exits":{"west":"/d/baihua/stone_road2"},"objects":{"/d/baihua/npc/old_wang":1,"/d/baihua/npc/shepherd":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,1,0]},"/d/baobao/armory":{"id":"/d/baobao/armory","file":"source/upstream/mudlib/d/baobao/armory.c","short":"兵器庫","long":"石室窄而深長，四壁釘滿鐵鉤與木架，長槍大戟一排排斜倚著，槍纓早已褪成暗褐。空氣裡滿是桐油與鐵鏽的氣味，石板地上留著拖曳兵刃磨出的淺痕，一角有道陡窄的木梯通往樓上。","exits":{"up":"/d/baobao/forge"},"objects":{"/d/baobao/npc/si_ma_lei":1},"special":[],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[-1,0,0]},"/d/baobao/fist_room":{"id":"/d/baobao/fist_room","file":"source/upstream/mudlib/d/baobao/fist_room.c","short":"拳屋","long":"這裡的擺設與普通的民房沒什麼兩樣。只是牆上挂著的一張人體穴位圖和一張骨骼結構圖使人內心深處隱約感到一絲不安。","exits":{"up":"/d/baobao/ghost_realm"},"objects":{"/d/baobao/npc/ma_zhong_shen":1},"special":[],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[0,0,1]},"/d/baobao/forge":{"id":"/d/baobao/forge","file":"source/upstream/mudlib/d/baobao/forge.c","short":"鑄刀房","long":"整個房間就好像是一個大熔爐，熱得讓人無法忍受。屋子中央支著一個大爐子，爐子裏不知在煉些什麼，爐子下面是旺盛的火焰，使人不敢靠近燒得發紅的火爐。","exits":{"east":"/d/baobao/fist_room"},"objects":{"/d/baobao/npc/chong_bai_hu":1},"special":[],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[-1,0,1]},"/d/baobao/ghost_realm":{"id":"/d/baobao/ghost_realm","file":"source/upstream/mudlib/d/baobao/ghost_realm.c","short":"鬼境","long":"這裡異常陰暗潮濕，就好像地牢一樣。一種讓人反胃的血腥味充溢著整個幻境。幾具屍骨橫七豎八的躺在地上。你忽然覺得似乎有什麼人正在暗處盯你瞧。","exits":{"north":"/d/baobao/magic_realm"},"objects":{"/d/baobao/obj/skeleton":1,"/d/baobao/obj/corpse":1,"/d/baobao/npc/gong_sun_wei":1},"special":[],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[0,0,2]},"/d/baobao/illusion_realm":{"id":"/d/baobao/illusion_realm","file":"source/upstream/mudlib/d/baobao/illusion_realm.c","short":"幻境","long":"房間的正中央堆著整整三十個骷髏頭，每個骷髏頭上塗著一種白色的粉末。骷髏塔的四周點著一圈蠟燭，看起來這間屋子的主人似乎是用毒的高手。","exits":{"up":"/d/baobao/top_floor"},"objects":{"/d/baobao/npc/shi_yu":1},"special":[],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[-1,-1,2]},"/d/baobao/magic_realm":{"id":"/d/baobao/magic_realm","file":"source/upstream/mudlib/d/baobao/magic_realm.c","short":"魔境","long":"這間屋子裏的書架上堆滿了有關法術咒術以及奇門五行的古書。讓人費解的是，書桌上所擺的施法用具似乎於天朝境內常見的用具不同。","exits":{"west":"/d/baobao/illusion_realm"},"objects":{"/d/baobao/npc/bai_yu":1},"special":[],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[0,-1,2]},"/d/baobao/study":{"id":"/d/baobao/study","file":"source/upstream/mudlib/d/baobao/study.c","short":"歐陽書房","long":"屋內洋溢著一股醉人的墨香味，書房四周的牆上挂著幾張狂草。書桌上擺著一幅剛剛寫好的對聯。看起來這裡的主人文學功底頗深。","exits":{"south":"/d/fengcheng/inner_yard","west":"/d/baobao/armory"},"objects":{"/d/baobao/npc/o_yan_zhi":1},"special":[],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[0,0,0]},"/d/baobao/top_floor":{"id":"/d/baobao/top_floor","file":"source/upstream/mudlib/d/baobao/top_floor.c","short":"頂樓","long":"頂樓佈置的宛如皇宮一般，金碧輝煌的屋頂有著工匠精心做的龍形雕刻。環繞四周的牆壁上面有著七幅畫像，據說各代表著這裡主人的七個兄弟，只見七人的臉部表情都栩栩如生，彷彿真的有七個風度翩翩的君子站在這裡一樣。此外，周圍的擺設更是盡奢侈之能事，你不禁懷疑究竟什麼人有資格住在這間屋子裏。頂樓的南面有一扇敞開的窗戶，也許可以跳出去。","exits":{},"objects":{"/d/baobao/npc/xun_yuan_jian_yue":1},"special":[{"cmd":"jump 窗戶","to":"/d/fengcheng/general_gate"}],"area":"八寶樓","layer":null,"areaKey":"八寶樓","pos":[-1,-1,3]},"/d/fengcheng/alley":{"id":"/d/fengcheng/alley","file":"source/upstream/mudlib/d/fengcheng/alley.c","short":"小巷","long":"一條窄窄的小巷，兩旁高牆夾道，牆面斑駁，爬著零星的青苔。牆腳下被人用石灰畫滿了歪歪扭扭的字謎與記號，一看便是孩童的塗鴉，只有最裡頭的一面牆，擦得乾乾淨淨。","exits":{"north":"/d/fengcheng/east_street2"},"objects":{"/d/fengcheng/npc/child":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[0,3,0]},"/d/fengcheng/cliff":{"id":"/d/fengcheng/cliff","file":"source/upstream/mudlib/d/fengcheng/cliff.c","short":"天山孤崖","long":"高處不勝寒，剛一來到天山的頂峰，你立刻打了個哆嗦。向西邊望去，透過層層迷霧，那風城竟然也顯得神秘莫測。","exits":{"southdown":"/d/fengcheng/east_gate"},"objects":{"/d/npc/man":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[1,0,0]},"/d/fengcheng/crossroad":{"id":"/d/fengcheng/crossroad","file":"source/upstream/mudlib/d/fengcheng/crossroad.c","short":"交叉路口","long":"這裡是風城的正中央，南面是春風客棧，北面是當地名士李儒的家，東邊是將軍府，將軍府再往東，出了東城門，就是天山了。","exits":{"north":"/d/fengcheng/stone_road1","south":"/d/fengcheng/south_street","east":"/d/fengcheng/street1"},"objects":{"/d/fengcheng/npc/chen_xue_liang":1,"/d/fengcheng/npc/fortune_teller":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-4,2,0]},"/d/fengcheng/east_gate":{"id":"/d/fengcheng/east_gate","file":"source/upstream/mudlib/d/fengcheng/east_gate.c","short":"東城門","long":"城門洞高闊深邃，磚石被往來的車馬磨得發亮，守衛持戟分立兩側，盤查著進出的行旅。城外的山道在此分成兩股，一股往東隱入濃濃的霧氣，一股折向北邊的崖頂，走出城門，空氣陡然清冷起來。","exits":{"west":"/d/fengcheng/mountain_road","south":"/d/fengcheng/stone_road2","northup":"/d/fengcheng/cliff","eastup":"/d/tianshan/fog"},"objects":{"/d/npc/garrison":4},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[0,0,0]},"/d/fengcheng/east_street1":{"id":"/d/fengcheng/east_street1","file":"source/upstream/mudlib/d/fengcheng/east_street1.c","short":"東街","long":"越往東走，街面越見冷清，店舖漸漸稀疏，換成一戶戶帶院子的民宅，院牆上爬滿了藤蔓。偶有孩童的笑鬧聲從牆內傳出，與遠處山間的雲霧相映，透著幾分悠閒自在。","exits":{"west":"/d/fengcheng/street2","east":"/d/fengcheng/east_street2"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-1,2,0]},"/d/fengcheng/east_street2":{"id":"/d/fengcheng/east_street2","file":"source/upstream/mudlib/d/fengcheng/east_street2.c","short":"東街","long":"東街的盡頭靠近城牆，牆根下長著幾叢野草，風從城外灌進來，帶著松針與泥土的氣味。一條窄巷從牆根下蜿蜒向南，巷口的門板斑駁掉漆，看得出已有些年頭，似乎許久沒人修補過了。","exits":{"west":"/d/fengcheng/east_street1","north":"/d/fengcheng/stone_road2","south":"/d/fengcheng/alley"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[0,2,0]},"/d/fengcheng/gate":{"id":"/d/fengcheng/gate","file":"source/upstream/mudlib/d/fengcheng/gate.c","short":"城門口","long":"高大的城門洞開，城牆上「風城」兩個大字被風沙磨得有些模糊，守衛來回踱步，目光不時掃過進出的行商。城門旁一道石階貼著牆壁盤旋而上，沒入高處的城樓，階面上一層薄薄的塵土。","exits":{"north":"/d/fengcheng/south_street","south":"/d/shuiyue/stone_road","up":"/d/fengcheng/tower"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-4,4,0]},"/d/fengcheng/general_gate":{"id":"/d/fengcheng/general_gate","file":"source/upstream/mudlib/d/fengcheng/general_gate.c","short":"將軍府","long":"將軍府大門高大威嚴，兩尊石獅蹲踞階前，門上銅釘排得整整齊齊，朱漆在歲月裡褪去了幾分光澤。府內庭院深深，隱約有練兵的呼喝與兵器相擊聲傳出，門前守衛目光銳利，不容閒人亂闖。","exits":{"south":"/d/fengcheng/street2","north":"/d/fengcheng/inner_yard"},"objects":{"/d/fengcheng/npc/gate_guard":2},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-2,1,0]},"/d/fengcheng/inn":{"id":"/d/fengcheng/inn","file":"source/upstream/mudlib/d/fengcheng/inn.c","short":"春風客棧","long":"店面不大但是整理得乾乾淨淨。由於天山附近只有這一家客棧，所以生意興隆，春風得意。正好應了店名中的春風二字。","exits":{"west":"/d/fengcheng/south_street","up":"/d/fengcheng/inn2"},"objects":{"/d/fengcheng/npc/waiter":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-3,3,0]},"/d/fengcheng/inn2":{"id":"/d/fengcheng/inn2","file":"source/upstream/mudlib/d/fengcheng/inn2.c","short":"春風客棧二樓","long":"二樓是一排整齊的客房，木地板被來往的腳步磨得發亮，走廊盡頭一扇小窗透著光。每扇房門上都掛著小木牌，房裡偶爾傳出旅人的鼾聲，或是低低的談話聲，整層樓安靜而溫暖。","exits":{"down":"/d/fengcheng/inn"},"objects":{"/d/fengcheng/npc/dong_fang_gu_ming":1},"special":[],"area":"風城","layer":"二樓","areaKey":"風城","pos":[-3,3,1]},"/d/fengcheng/inner_yard":{"id":"/d/fengcheng/inner_yard","file":"source/upstream/mudlib/d/fengcheng/inner_yard.c","short":"內院廣場","long":"將軍府的內院廣場鋪著平整的青石，四周樓閣環立，飛簷相接，其中最為高大的一座便是傳聞中的八寶樓。聽說府裡養著不少能人異士，此刻院中卻安靜得很，只有石縫間的風聲來回打轉。","exits":{"south":"/d/fengcheng/general_gate","north":"/d/baobao/study"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-2,0,0]},"/d/fengcheng/li_house":{"id":"/d/fengcheng/li_house","file":"source/upstream/mudlib/d/fengcheng/li_house.c","short":"民宅","long":"這裡就是風城名士李儒家了，屋內充滿了草藥的味道。想來李老先生的身體是一天不如一天了。房間的擺設十分簡樸，都是些普通農家的擺設。","exits":{"west":"/d/fengcheng/stone_road1"},"objects":{"/d/fengcheng/npc/li_ru":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-3,1,0]},"/d/fengcheng/mountain_road":{"id":"/d/fengcheng/mountain_road","file":"source/upstream/mudlib/d/fengcheng/mountain_road.c","short":"山路","long":"一條平坦整齊的山路﹐鋪路所用的石料當然是出自天山山脈。從石階的光滑程度來看﹐這條石路至少已經用了幾百年了。山路的北面似乎有一座道觀在雲霧中若隱若現。","exits":{"north":"/d/fengcheng/qingyun_temple","east":"/d/fengcheng/east_gate"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-1,0,0]},"/d/fengcheng/qingyun_temple":{"id":"/d/fengcheng/qingyun_temple","file":"source/upstream/mudlib/d/fengcheng/qingyun_temple.c","short":"青雲觀","long":"觀門不大，青瓦覆頂，門楣上「青雲觀」三字蒼勁古樸，被山霧浸得微微發暗。院裡幾株老柏撐開濃蔭，爐中殘香裊裊，混著遠處隱約的誦經聲。天師四破雷法的傳承便在此處，江湖中人雖少往來，山下卻無人不知。","exits":{"south":"/d/fengcheng/mountain_road"},"objects":{"/d/fengcheng/npc/hua_zi_yi":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-1,-1,0]},"/d/fengcheng/south_street":{"id":"/d/fengcheng/south_street","file":"source/upstream/mudlib/d/fengcheng/south_street.c","short":"南街","long":"這裡是風城比較繁榮的一條街。街的東邊有一個兩層的小客棧，客棧門口高掛著的燈籠上繡著春風兩個字。不少來遊天山的旅客都會在春風客棧住一兩天。","exits":{"north":"/d/fengcheng/crossroad","south":"/d/fengcheng/gate","east":"/d/fengcheng/inn"},"objects":{"/d/fengcheng/npc/seller":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-4,3,0]},"/d/fengcheng/stone_road1":{"id":"/d/fengcheng/stone_road1","file":"source/upstream/mudlib/d/fengcheng/stone_road1.c","short":"石板路","long":"石板路自北面鋪來，兩旁店舖的幌子低垂，行人往來不絕。路面被磨出一道道淺淺的車轍，偶爾有挑著擔子的小販高聲吆喝，叫賣聲與馬蹄聲混作一片，透著小城特有的煙火氣。","exits":{"north":"/d/mengjia/crossroad","south":"/d/fengcheng/crossroad","east":"/d/fengcheng/li_house"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-4,1,0]},"/d/fengcheng/stone_road2":{"id":"/d/fengcheng/stone_road2","file":"source/upstream/mudlib/d/fengcheng/stone_road2.c","short":"石板路","long":"石板路微微向上傾斜，路旁立著一排老槐，枝葉把路面遮得斑駁。越往城門走，人聲越稀，只剩車輪碾過石板的悶響，與山風吹過牆縫的嗚咽，教人不自覺把腳步放慢。","exits":{"north":"/d/fengcheng/east_gate","south":"/d/fengcheng/east_street2"},"objects":{"/d/npc/man":1},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[0,1,0]},"/d/fengcheng/street1":{"id":"/d/fengcheng/street1","file":"source/upstream/mudlib/d/fengcheng/street1.c","short":"街道","long":"街旁店舖一家挨著一家，賣的多是山貨與乾糧，簷下掛滿了風乾的臘肉與草藥，氣味雜陳。遊山的旅客三三兩兩逛著，挑選要帶上山的物件，掌櫃們個個笑臉相迎，吆喝聲此起彼落。","exits":{"west":"/d/fengcheng/crossroad","east":"/d/fengcheng/street2"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-3,2,0]},"/d/fengcheng/street2":{"id":"/d/fengcheng/street2","file":"source/upstream/mudlib/d/fengcheng/street2.c","short":"街道","long":"街心的青石板被往來車輪碾出兩道淺溝，一邊是將軍府高聳的圍牆，一邊是低矮的店舖，對比分明。圍牆內隱約傳來操練的號令，街上的行人走到這裡，不自覺都放輕了腳步。","exits":{"west":"/d/fengcheng/street1","east":"/d/fengcheng/east_street1","north":"/d/fengcheng/general_gate"},"objects":{},"special":[],"area":"風城","layer":null,"areaKey":"風城","pos":[-2,2,0]},"/d/fengcheng/tower":{"id":"/d/fengcheng/tower","file":"source/upstream/mudlib/d/fengcheng/tower.c","short":"城樓","long":"城樓巍然而立，女牆後的垛口一個挨著一個，瞭望兵的長槍在雲霧中反著冷光。從這裡望出去，山下的村落與蜿蜒的官道盡收眼底，風聲呼呼灌進樓中，教人胸懷為之一闊。","exits":{"down":"/d/fengcheng/gate"},"objects":{"/d/fengcheng/npc/si_ma_wei":1,"/d/npc/garrison":4},"special":[],"area":"風城","layer":"城樓","areaKey":"風城","pos":[-4,4,1]},"/d/graveyard/forest":{"id":"/d/graveyard/forest","file":"source/upstream/mudlib/d/graveyard/forest.c","short":"密林","long":"林中古木參天，枝葉交纏成一片濃密的頂蓋，連天光也透不下來，四下裏一片昏暗。腳下的腐葉積得極厚，一踩便陷下去半寸，冒出一股霉爛的氣味。樹幹上爬滿了濕滑的青苔，林子深處偶爾傳來枯枝折斷的聲響。","exits":{"north":"/d/graveyard/weeds","west":"/d/graveyard/forest_w","east":"/d/graveyard/forest_e"},"objects":{},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-5,3,0]},"/d/graveyard/forest_e":{"id":"/d/graveyard/forest_e","file":"source/upstream/mudlib/d/graveyard/forest_e.c","short":"密林","long":"林間一片被踩得光禿禿的空地，中央用石塊圍了個火坑，坑裏積著黑黑的炭灰，四周散落著獸骨與斷折的木矛。幾株大樹之間用藤蔓架起了簡陋的棚子，棚下堆著些獸皮，一股濃重的羶腥味撲鼻而來，令人作嘔。","exits":{"west":"/d/graveyard/forest"},"objects":{"/d/graveyard/npc/barbarian_chief":1,"/d/graveyard/npc/barbarian":2},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-4,3,0]},"/d/graveyard/forest_w":{"id":"/d/graveyard/forest_w","file":"source/upstream/mudlib/d/graveyard/forest_w.c","short":"密林","long":"這一處林子更顯幽深，一株老樹的樹根下鋪著一層乾草，壓得平平整整，旁邊散著幾個空酒罈和啃剩的雞骨，像是有人在此落腳了好些時日。泥地上的腳印步幅極大，落地卻極輕，絕不是尋常的獵戶樵夫留下的。","exits":{"east":"/d/graveyard/forest"},"objects":{"/d/graveyard/npc/wu_changuei":1},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-6,3,0]},"/d/graveyard/grave1":{"id":"/d/graveyard/grave1","file":"source/upstream/mudlib/d/graveyard/grave1.c","short":"亂葬崗","long":"從雪亭鎮西邊的官道岔進來，人聲便漸漸遠了，眼前是一片荒涼的坡地，雜草間錯落著大大小小的土墳。一條被人踩出來的小徑彎彎曲曲地往坡上爬去，路口一塊歪斜的石碑上，刻著的字早已模糊難辨。","exits":{"west":"/d/graveyard/grave2","southeast":"/d/snow/wgate"},"objects":{},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[0,0,0]},"/d/graveyard/grave2":{"id":"/d/graveyard/grave2","file":"source/upstream/mudlib/d/graveyard/grave2.c","short":"亂葬崗","long":"路旁的墳塚一座挨著一座，多半只是一抔黃土，連塊石碑也沒有，有些墳前還插著燒剩的半截香枝，想是仍有人記得來此祭拜。泥地上散著些被野狗刨出來的碎骨，白慘慘的，在亂草間格外刺眼。","exits":{"east":"/d/graveyard/grave1","northwest":"/d/graveyard/grave4"},"objects":{},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-1,0,0]},"/d/graveyard/grave4":{"id":"/d/graveyard/grave4","file":"source/upstream/mudlib/d/graveyard/grave4.c","short":"亂葬崗","long":"小路在這一段被兩側的墳堆擠得越發窄了，有幾處墳頭塌了半邊，露出朽爛的棺木一角，教人不敢多看。路旁斜插著幾塊無字的木牌，早已被蟲蛀得千瘡百孔，空氣中隱隱飄著一股潮濕的土腥氣。","exits":{"west":"/d/graveyard/grave5","southeast":"/d/graveyard/grave2"},"objects":{},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-2,-1,0]},"/d/graveyard/grave5":{"id":"/d/graveyard/grave5","file":"source/upstream/mudlib/d/graveyard/grave5.c","short":"亂葬崗","long":"這裡是亂葬崗中的一條小路﹐小路上雜草叢生﹐北邊是一片亂石土\n坡﹐土坡間突起一墳墳的無主孤墳﹐西邊一個土丘﹐土丘旁有一座小祠\n﹐祭祀土丘中所葬的陣亡戰士﹐小路往西南與東邊延伸。","exits":{"southwest":"/d/graveyard/grave6","east":"/d/graveyard/grave4"},"objects":{"/d/graveyard/npc/lady":1},"special":[{"cmd":"enter 小祠","to":"/d/graveyard/shrine"}],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-3,-1,0]},"/d/graveyard/grave6":{"id":"/d/graveyard/grave6","file":"source/upstream/mudlib/d/graveyard/grave6.c","short":"亂葬崗","long":"這裡的墳頭比別處齊整些，幾座石碑上依稀還認得出「征奐」「陣亡」等字樣，想必與那座小祠所祭的將士同出一役。碑前積著厚厚的落葉，沒有半點香火的痕跡，荒草從碑縫裏鑽出來，幾乎要把碑文整個掩去。","exits":{"northeast":"/d/graveyard/grave5","south":"/d/graveyard/grave7"},"objects":{},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-4,0,0]},"/d/graveyard/grave7":{"id":"/d/graveyard/grave7","file":"source/upstream/mudlib/d/graveyard/grave7.c","short":"亂葬崗","long":"坡腳下有一座破敗的石亭，亭頂缺了好幾片瓦，石柱上的漆早已剝落殆盡。亭旁幾座新墳的黃土還未長出青草，低低的誦經聲在墳間迴盪，木魚篤篤，一聲接著一聲，像是要替這些無主的亡魂求個安穩。","exits":{"north":"/d/graveyard/grave6","west":"/d/graveyard/grave8"},"objects":{"/d/graveyard/npc/old_bonze":1,"/d/graveyard/npc/young_bonze":1,"/d/graveyard/npc/liuye_the_master_of_grimace":1},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-4,1,0]},"/d/graveyard/grave8":{"id":"/d/graveyard/grave8","file":"source/upstream/mudlib/d/graveyard/grave8.c","short":"亂葬崗","long":"這裡是亂葬崗中的一條小路﹐你的東邊是一個破敗的石亭﹐小路往\n東北與西邊延伸﹐南邊是一片茂密的草叢﹐草叢中突起一堆堆的土墳﹐\n草叢南邊是一片密林。","exits":{"east":"/d/graveyard/grave7","west":"/d/taiyi/gate"},"objects":{},"special":[{"cmd":"pass 草叢","to":"/d/graveyard/weeds"}],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-5,1,0]},"/d/graveyard/shrine":{"id":"/d/graveyard/shrine","file":"source/upstream/mudlib/d/graveyard/shrine.c","short":"祠堂","long":"這裡是一間破舊的小祠堂﹐屋頂已經被風掀走了一大塊﹐牆壁上的\n灰泥也剝落了許多﹐不過安放牌位的桌子跟祭祀用的物品倒是不缺﹐你\n可以看到前面供的牌位上寫的是「乙未冬定國府征奐夷軍陣亡將士靈位\n」﹐地上掃得乾乾淨淨的﹐似乎有人定時來此打掃。","exits":{"out":"/d/graveyard/grave5"},"objects":{"/d/graveyard/npc/dirty_taoist":1},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-4,-1,0]},"/d/graveyard/weeds":{"id":"/d/graveyard/weeds","file":"source/upstream/mudlib/d/graveyard/weeds.c","short":"雜草叢","long":"這裡是亂葬崗上的一處雜草叢中﹐許多蚊蟲在你的身邊飛來飛去﹐\n使你覺得很不自在﹐你的南邊是一處密林﹐看起來陰森森的﹐如果你想\n離開這裡﹐往北穿過草叢可以回到小路上。","exits":{"north":"/d/graveyard/grave8","south":"/d/graveyard/forest"},"objects":{},"special":[],"area":"亂葬崗","layer":null,"areaKey":"亂葬崗","pos":[-5,2,0]},"/d/kangping/forest_exit":{"id":"/d/kangping/forest_exit","file":"source/upstream/mudlib/d/kangping/forest_exit.c","short":"樹林口","long":"林木在這裡漸漸稀疏，陽光穿過枝葉灑落一地，腳下的落葉也少了許多。遠處山坳間升起幾縷炊煙，隱約可見一座小村落依偎在三煙谷口，看來總算要走出這片樹林了。","exits":{"west":"/d/oldpine/grass1","east":"/d/kangping/village_gate"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[-2,1,0]},"/d/kangping/hut":{"id":"/d/kangping/hut","file":"source/upstream/mudlib/d/kangping/hut.c","short":"草廬","long":"你現在來到一間草廬之中，廬中的桌椅傢俱都相當粗陋，有些還是帶著樹皮的木頭做的，一邊的牆上掛著幾件簑衣，門邊放著一個小火爐，從窗戶望出去可以看到草廬後有個小池塘。","exits":{"west":"/d/kangping/square"},"objects":{"/d/kangping/npc/old_taoist":1},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[1,1,0]},"/d/kangping/inn":{"id":"/d/kangping/inn","file":"source/upstream/mudlib/d/kangping/inn.c","short":"小客店","long":"你現在來到一家小客店，這家客店很小，連招牌也沒有，牆壁都是木板，風吹過就一陣吱吱嘎嘎響，客店門口一條小路往西。","exits":{"west":"/d/kangping/valley_mouth"},"objects":{"/d/kangping/npc/ou_yan_wu_ji_2":1,"/d/kangping/npc/liuh_chuen_fon":1,"/d/kangping/npc/innkeeper":1},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[1,0,0]},"/d/kangping/square":{"id":"/d/kangping/square","file":"source/upstream/mudlib/d/kangping/square.c","short":"廣場","long":"村子中央的一片空地，正中有一口古井，井邊的青石被打水的人磨得發亮。村民們常在這裡洗衣、打水、閒話家常，孩子們繞著井邊追逐嬉鬧，是全村上下最熱鬧的地方。","exits":{"north":"/d/kangping/valley_mouth","east":"/d/kangping/hut"},"objects":{"/d/kangping/npc/kid":1},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[0,1,0]},"/d/kangping/valley_mouth":{"id":"/d/kangping/valley_mouth","file":"source/upstream/mudlib/d/kangping/valley_mouth.c","short":"谷口","long":"康平村的北口，再往北走便是三煙谷，谷中終年飄著三道淡淡的煙霧，因而得名。近來谷裡常有野狼出沒，夜裡狼嚎聲此起彼落，村民在路口立了一道木柵，天黑之後便不讓人進谷了。","exits":{"west":"/d/kangping/village","east":"/d/kangping/inn","south":"/d/kangping/square"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[0,0,0]},"/d/kangping/village":{"id":"/d/kangping/village","file":"source/upstream/mudlib/d/kangping/village.c","short":"康平村","long":"康平村裡的一條土路，兩旁是幾戶低矮的農家，屋前曬著穀子與草藥，籬笆上爬滿了瓜藤。村民大多靠著上山採藥、打獵維生，見到生人也只是點點頭，又低頭忙著自己的活兒。","exits":{"south":"/d/kangping/village_gate","east":"/d/kangping/valley_mouth"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[-1,0,0]},"/d/kangping/village_gate":{"id":"/d/kangping/village_gate","file":"source/upstream/mudlib/d/kangping/village_gate.c","short":"康平村","long":"康平村的村口，一塊飽經風吹日曬的木牌插在路旁，上頭刻著「康平」兩個大字。這個小村落夾在樹林與三煙谷之間，平日少有外人往來，幾隻土雞在路邊悠閒地啄食，四下顯得格外安靜。","exits":{"west":"/d/kangping/forest_exit","north":"/d/kangping/village"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[-1,1,0]},"/d/lee/creek":{"id":"/d/lee/creek","file":"source/upstream/mudlib/d/lee/creek.c","short":"小溪","long":"清淺溪水貼著李家村東側緩緩流過，岸邊散著大小不一的石塊。西面靠近瓜田，北面則可沿溪邊小路返回村東門。溪水清澈見底，偶爾能看見幾尾小魚悠游其中，石塊上還留著村婦浣衣時留下的濕痕。","exits":{"north":"/d/lee/riverside_s","west":"/d/lee/watermelon_n3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,1,0]},"/d/lee/entrance_s":{"id":"/d/lee/entrance_s","file":"source/upstream/mudlib/d/lee/entrance_s.c","short":"村口","long":"這裡是李家村南面的村口，北方木製大門後便是村內街道。往西南沿著小路離村，便可回到雪亭一帶兩條河流交會的河邊。路邊立著一塊半人高的青石界碑年久失修，「李家村」三個字已被歲月磨得淺淡，碑角還纏著幾圈舊布條，像是往來旅客隨手繫上的平安結。幾名風塵僕僕的旅客或坐或倚在碑石邊，一邊揉著痠痛的腿腳，一邊互相打聽前方村鎮的近況。","exits":{"north":"/d/lee/gate_s","southwest":"/d/snow/egate"},"objects":{"/d/lee/npc/traveller":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,5,0]},"/d/lee/eroad1":{"id":"/d/lee/eroad1","file":"source/upstream/mudlib/d/lee/eroad1.c","short":"石子路","long":"廣場東面的石子路筆直延伸，兩側逐漸由房舍轉為田地。往東仍可看見另一段道路與村口方向。路旁的屋舍漸漸稀疏，取而代之的是連片的田埂，偶有農人挑著擔子由此經過，留下一串深淺不一的腳印。","exits":{"west":"/d/lee/square_e","east":"/d/lee/eroad2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,0,0]},"/d/lee/eroad2":{"id":"/d/lee/eroad2","file":"source/upstream/mudlib/d/lee/eroad2.c","short":"石子路","long":"這段石子路鄰近村東，風中已帶著田野與溪水的氣味。向西可回廣場，向東則通往村口大門。路面兩側種著幾株矮樹，枝葉隨風輕輕搖晃，遠遠便能聽見溪水流動的聲響，替這段路添了幾分清涼。","exits":{"west":"/d/lee/eroad1","east":"/d/lee/gate_e"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,0,0]},"/d/lee/farm_w1":{"id":"/d/lee/farm_w1","file":"source/upstream/mudlib/d/lee/farm_w1.c","short":"農家","long":"低矮農舍圍著小院，院裡擺著竹籃、農具與曬乾的作物。屋主人多半白日下田，只留下家人照看家務。院牆邊晾著幾件洗過的衣物，隨風輕輕擺動，屋簷下掛著一串串曬乾的辣椒與玉米，透出濃濃的農家氣息。院裡的婦人手裡忙著縫補衣物，見有人經過，總會抬頭善意地點個頭。","exits":{"north":"/d/lee/wroad2","east":"/d/lee/farm_w2"},"objects":{"/d/lee/npc/woman":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,1,0]},"/d/lee/farm_w2":{"id":"/d/lee/farm_w2","file":"source/upstream/mudlib/d/lee/farm_w2.c","short":"農家","long":"另一戶農家的院牆由土磚砌成，門口靠著犁與鋤頭。雞鳴與人聲不時從院內傳出，顯得十分尋常。牆角堆著幾捆乾草，牆頭上還曬著幾張剛洗過的粗布，看得出這戶人家過得雖不寬裕，倒也打理得井井有條。","exits":{"north":"/d/lee/wroad3","west":"/d/lee/farm_w1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,1,0]},"/d/lee/gate_e":{"id":"/d/lee/gate_e","file":"source/upstream/mudlib/d/lee/gate_e.c","short":"村口大門","long":"李家村東面的村口大門立在道路盡頭，門外很快便接近溪畔。木門兩旁有簡單的守望位置，方便村民巡看。厚重的木門終年開著，門板下緣已經磨出一道淺淺的弧痕，是無數車輪與腳步經年累月踩踏出來的。守衛倚在門邊的木樁上，一邊留意著往來行人，一邊靜靜聽著不遠處溪水潺潺的聲音，偶爾有村民挑著擔子經過，總會停下來寒暄兩句。","exits":{"west":"/d/lee/eroad2","east":"/d/lee/riverside_s"},"objects":{"/d/lee/npc/guard":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,0,0]},"/d/lee/gate_n":{"id":"/d/lee/gate_n","file":"source/upstream/mudlib/d/lee/gate_n.c","short":"村口大門","long":"李家村北面的村口大門由厚實木料搭成，門柱上留著長年風吹雨打的痕跡。門內石子路向南伸入村中，兩旁低矮屋舍與田地相間，來往村民大多在此放慢腳步。兩名守衛並肩站在門洞下，腰間各佩著趁手的兵器，見到生面孔進村，總會多看上兩眼。門楣上掛著一塊褪色的木匾，隱約可辨「李家村」三個字，是村里請人重新描過漆的。","exits":{"south":"/d/lee/nroad1"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-4,0]},"/d/lee/gate_s":{"id":"/d/lee/gate_s","file":"source/upstream/mudlib/d/lee/gate_s.c","short":"村口大門","long":"李家村南面的村口大門守著主要進村道路。從這裡往北就是村內街道，往南則通向村口與外面的道路。這是村里人來人往最頻繁的一道門，門洞兩側的石牆被經年的手掌磨得光滑，牆角還堆著幾捆備用的柴薪。兩名守衛神情警覺，不時交換幾句低語，遇上面生的旅人便會多打量幾眼，確認沒有可疑之處才放行。","exits":{"north":"/d/lee/street2","south":"/d/lee/entrance_s"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,4,0]},"/d/lee/gate_w":{"id":"/d/lee/gate_w","file":"source/upstream/mudlib/d/lee/gate_w.c","short":"村口大門","long":"李家村西面的木製大門橫跨道路，門外道路通向村外，門內則接上筆直石子路。守衛偶爾在門旁巡看來往行人。門邊立著一根老舊的拴馬樁，樁身被繩索磨出深深的溝痕，看得出往來的行商經常在此歇腳餵馬。兩名守衛肩靠著門柱閒聊村里近日的瑣事，見有人靠近才收起話頭，恢復巡看的神色。","exits":{"east":"/d/lee/wroad1"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-10,0,0]},"/d/lee/grocery":{"id":"/d/lee/grocery","file":"source/upstream/mudlib/d/lee/grocery.c","short":"雜貨鋪","long":"小小的雜貨鋪裡擺著油鹽、繩索、陶器與各式家常用品，貨架高低不一。這裡主要做附近村民的生意，東門通往石子路。櫃臺上擺著一把用得十分發亮的舊算盤，旁邊還堆疊著幾本記帳的簿冊，牆角還立著幾捆備用的麻繩與陶罐，看得出這裡的貨色雖不起眼，卻樣樣齊全。","exits":{"east":"/d/lee/nroad2"},"objects":{"/d/lee/npc/lee_zhong":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-2,0]},"/d/lee/herb_shop":{"id":"/d/lee/herb_shop","file":"source/upstream/mudlib/d/lee/herb_shop.c","short":"藥鋪","long":"這是一間不大的藥鋪，木櫃裡分門別類收著藥材與丹藥，空氣中混著草根與藥香。掌櫃李岩守著櫃臺，店門朝東開向石子路。牆上掛著幾串曬乾的藥草，屋樑上懸著一副舊招牌，字跡已經有些斑駁老舊。鋪子裡賣的丹藥多是聶晟閒暇時煉的，價格公道，村民生病時多半先來這裡瞧瞧。","exits":{"east":"/d/lee/nroad1"},"objects":{"/d/lee/npc/lee_yen":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-3,0]},"/d/lee/hunter":{"id":"/d/lee/hunter","file":"source/upstream/mudlib/d/lee/hunter.c","short":"木屋","long":"屋內陳設雖然簡單，卻處處留著長年狩獵生活的痕跡。幾件簡單的家具散落其中。牆邊掛著幾件獵具，地上還堆著幾張尚未處理的獸皮。屋子中央擺著一張木桌。桌上除了幾件零散的獵具外，還放著一塊沾滿污漬的破布，似乎已經使用了很長一段時間。","exits":{"south":"/d/lee/wroad2"},"objects":{"/d/lee/npc/lee_yong":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,-1,0]},"/d/lee/inn":{"id":"/d/lee/inn","file":"source/upstream/mudlib/d/lee/inn.c","short":"小旅店","long":"這是一間規模很小的旅店，屋裡只有幾張老舊桌椅。店小二忙著招呼客人，說書先生李半仙偶爾在此停留，東門通往街道。牆角一張矮桌上擺著粗陶茶壺與幾個缺了口的碗，看得出這裡的客人多是圖個實在，不講究排場。牆上掛著一塊掉漆的木牌，歪歪斜斜地寫著幾樣簡單的吃食。","exits":{"east":"/d/lee/street2"},"objects":{"/d/lee/npc/waiter":1,"/d/lee/npc/li_ban_xian":1,"/d/lee/npc/du_feng_ling":"1     // 幻霧觀觀主（使用者指示，2026-10-25）"},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,3,0]},"/d/lee/nie_backroom":{"id":"/d/lee/nie_backroom","file":"source/upstream/mudlib/d/lee/nie_backroom.c","short":"丹房","long":"這裡是醫館後方的一間小室，靠牆放著一座青銅丹爐與丹鼎，爐火尚有些許餘溫，看起來不久前才煉過藥。\n牆角一張矮榻鋪著薄被，榻邊小几上擺著一壺涼透的茶與幾卷翻開的醫書，這裡是聶晟煉丹與歇息的\n地方，平時鮮少有外人進來走動探訪打擾。","exits":{"out":"/d/lee/shrine"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,-2,0]},"/d/lee/nroad1":{"id":"/d/lee/nroad1","file":"source/upstream/mudlib/d/lee/nroad1.c","short":"石子路","long":"平整石子鋪成的小路穿過村北，雨後石縫仍留著些水氣。西側是一間藥鋪，門前藥香隨風散出；南北兩端都是通往村中與村口的道路。路邊立著一根老石燈籠，每逢夜色降臨，便會有人點上燈火，替晚歸的村民照亮腳下的路。","exits":{"north":"/d/lee/gate_n","south":"/d/lee/nroad2","west":"/d/lee/herb_shop"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-3,0]},"/d/lee/nroad2":{"id":"/d/lee/nroad2","file":"source/upstream/mudlib/d/lee/nroad2.c","short":"石子路","long":"這段石子路兩旁房舍漸密，西側雜貨鋪門口堆著日用雜物。路面被車輪與腳步磨得發亮，向南可以繼續前往村中的廣場。路旁幾隻雞悠閒地啄著地上散落的穀粒，對來往的行人視若無睹，替這段熱鬧的路添了幾分生活氣息。","exits":{"north":"/d/lee/nroad1","south":"/d/lee/nroad3","west":"/d/lee/grocery"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-2,0]},"/d/lee/nroad3":{"id":"/d/lee/nroad3","file":"source/upstream/mudlib/d/lee/nroad3.c","short":"石子路","long":"石子路到了村中心附近變得熱鬧，西側可見私塾的木門與窗紙。孩童讀書聲偶爾越牆而出，南面就是村內往來最頻繁的廣場。路邊有棵老槐樹，樹蔭下擺著一張石凳，常有村民坐著乘涼，順道聽一聽牆內傳來的讀書聲。","exits":{"north":"/d/lee/nroad2","south":"/d/lee/square_w","west":"/d/lee/school"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-1,0]},"/d/lee/pawnshop":{"id":"/d/lee/pawnshop","file":"source/upstream/mudlib/d/lee/pawnshop.c","short":"李記當鋪","long":"李員外在村裡的主要生意之一，掌櫃李嘯天替李家打理此處產業。附近的旅客、店鋪都會到這典當周轉，\n櫃臺後堆著各式不同標記的木箱，看來頗為貴重。牆上掛著一幅字畫，寫著「童叟無欺」四個大字，算是給\n上門的客人先吃顆定心丸。櫃臺邊還擺著一把算盤與幾疊當票，透著幾分精打細算的生意氣息。","exits":{"east":"/d/lee/street1"},"objects":{"/d/lee/npc/lee_xiao_tian":1,"/obj/food/mooncake":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,2,0]},"/d/lee/riverside_n1":{"id":"/d/lee/riverside_n1","file":"source/upstream/mudlib/d/lee/riverside_n1.c","short":"溪邊小路","long":"沿溪小路夾在村舍與水岸之間，北面還能隱約望見拱橋方向。南北兩端都順著溪流延伸。一名村婦蹲在溪邊，手裡捧著木盆，正仔細地搓洗衣物，木盆碰撞石塊發出輕微的聲響，與潺潺水聲交織在一起。","exits":{"north":"/d/lee/riverside_n2","south":"/d/lee/riverside_s"},"objects":{"/d/lee/npc/woman":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,-1,0]},"/d/lee/riverside_n2":{"id":"/d/lee/riverside_n2","file":"source/upstream/mudlib/d/lee/riverside_n2.c","short":"溪邊小路","long":"小路沿著溪岸南北延伸，腳下散布著細碎石子。溪水貼著村東流過，附近草木因水氣而顯得格外茂盛。幾株垂柳沿岸而生，枝條輕拂水面，蕩起一圈圈細小的漣漪，替這段路添了幾分靜謐的氣氛。","exits":{"south":"/d/lee/riverside_n1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,-2,0]},"/d/lee/riverside_s":{"id":"/d/lee/riverside_s","file":"source/upstream/mudlib/d/lee/riverside_s.c","short":"溪邊小路","long":"溪邊小路到了村東門附近，西面可回村口大門，南北則沿著溪岸延伸。水聲在這一帶十分清楚。幾名村婦聚在溪邊，一邊浣洗衣物一邊閒話家常，笑聲不時隨著水聲飄散開來，是這一帶少見的熱鬧光景。","exits":{"west":"/d/lee/gate_e","north":"/d/lee/riverside_n1","south":"/d/lee/creek","southwest":"/d/lee/watermelon_n3"},"objects":{"/d/lee/npc/woman":4},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,0,0]},"/d/lee/school":{"id":"/d/lee/school","file":"source/upstream/mudlib/d/lee/school.c","short":"私塾","long":"私塾裡整齊排著舊木桌椅，牆邊堆著幾冊翻得起毛的書本。白日常有孩童朗讀文章，窗外便是通往廣場的石子路。牆上掛著一幅「有教無類」的字幅，墨跡雖已略顯陳舊，仍看得出當年書寫時的用心。案頭擺著一方硯台與幾支毛筆，牆邊立著一根戒尺，看來平日規矩管教不算鬆散。","exits":{"east":"/d/lee/nroad3"},"objects":{"/d/lee/npc/lee_hsu_hsien":1,"/d/lee/npc/child":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-1,0]},"/d/lee/shrine":{"id":"/d/lee/shrine","file":"source/upstream/mudlib/d/lee/shrine.c","short":"醫館","long":"這裡是聶晟看診行醫的醫館，四壁的木架上整齊排著大大小小的藥罐，靠窗的長案上攤著幾本醫書與銀針，\n一旁垂著布簾，隔出裡間看診的地方。空氣中瀰著淡淡的藥草香。十多年前村裡爆發一場怪病，便是聶晟\n在此治好了村民，李員外因此請他留下，成為村中的大夫。","exits":{"south":"/d/lee/wroad3","in":"/d/lee/nie_backroom"},"objects":{"/d/lee/npc/nee_cheng":1,"/d/lee/npc/herb_boy":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,-1,0]},"/d/lee/square_c":{"id":"/d/lee/square_c","file":"source/upstream/mudlib/d/lee/square_c.c","short":"廣場中央","long":"這裡是李家村最容易聚集人群的中央廣場，四周道路交錯。孩童常在空地追逐，村民也會停下交換消息或談論村中近事。廣場中央立著一口老水井，井欄被繩索磨出一道道深痕，是全村人取水的地方。井邊常有婦人打水閒聊，孩童們則繞著井欄追逐嬉戲，笑鬧聲響徹整個廣場。","exits":{"west":"/d/lee/square_s","north":"/d/lee/square_e","south":"/d/lee/street1"},"objects":{"/d/lee/npc/child":3,"/d/obj/well":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,1,0]},"/d/lee/square_e":{"id":"/d/lee/square_e","file":"source/upstream/mudlib/d/lee/square_e.c","short":"廣場","long":"廣場向東西兩側伸展，附近商販和村民常在此碰面交換消息。往南可到廣場中央，往北可回村北道路。地面鋪著大小不一的石板，縫隙間長著幾叢野草，倒也不影響往來行走。","exits":{"west":"/d/lee/square_w","east":"/d/lee/eroad1","south":"/d/lee/square_c"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,0,0]},"/d/lee/square_s":{"id":"/d/lee/square_s","file":"source/upstream/mudlib/d/lee/square_s.c","short":"廣場","long":"這片廣場位在村中心偏南的位置，北面接著村中主路，東邊就是廣場中央。空地邊緣堆著幾捆備用的木料，像是村里修繕房舍時剩下的，平時倒也沒人特地搬動整理清掃。","exits":{"north":"/d/lee/square_w","east":"/d/lee/square_c"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,1,0]},"/d/lee/square_w":{"id":"/d/lee/square_w","file":"source/upstream/mudlib/d/lee/square_w.c","short":"廣場","long":"這片空地是村民日常往來與歇腳的地方，地面被踩得十分結實。北面連著私塾附近的道路，南面還有另一片廣場。空地一角擺著幾張長凳，木質已經有些發黑，看得出是村里人常年歇腳留下的痕跡。","exits":{"north":"/d/lee/nroad3","west":"/d/lee/wroad4","east":"/d/lee/square_e","south":"/d/lee/square_s"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,0,0]},"/d/lee/street1":{"id":"/d/lee/street1","file":"source/upstream/mudlib/d/lee/street1.c","short":"街道","long":"村中央往南的街道比石子路平整些，兩側屋舍緊靠。西側就是李記當鋪，南北來往的人多半從這裡穿過。屋簷下掛著幾盞燈籠，入夜後會點起微弱的燈火，照亮這段人來人往的街道。","exits":{"west":"/d/lee/pawnshop","north":"/d/lee/square_c","south":"/d/lee/street2","east":"/d/lee/watermelon_s1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,2,0]},"/d/lee/street2":{"id":"/d/lee/street2","file":"source/upstream/mudlib/d/lee/street2.c","short":"街道","long":"街道繼續向南延伸，北面通往村中央，南面就是村口大門。西側的小旅店常傳出店小二招呼客人的聲音。街邊擺著一個小攤子，賣冰糖葫蘆的小販正吆喝著招攬生意，紅通通的糖葫蘆插在草把上，看著就讓人食指大動，不少路過的孩童都忍不住多看兩眼。","exits":{"north":"/d/lee/street1","west":"/d/lee/inn","south":"/d/lee/gate_s"},"objects":{"/d/lee/npc/hawthorn_seller":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,3,0]},"/d/lee/watermelon_n1":{"id":"/d/lee/watermelon_n1","file":"source/upstream/mudlib/d/lee/watermelon_n1.c","short":"西瓜田","long":"田畦裡種著一排排西瓜藤，寬大的葉片鋪滿泥地。農人沿著田埂巡看瓜苗，防著路人隨手摘走尚未成熟的西瓜。幾顆碩大的西瓜半埋在泥土裡，表皮泛著油亮的青綠色，看著十分誘人。田埂邊插著一根根竹竿，上頭綁著幾條破布條隨風擺動，是農人用來嚇唬偷嘴的鳥雀。","exits":{"east":"/d/lee/watermelon_n2","south":"/d/lee/watermelon_s1"},"objects":{"/d/lee/npc/farmer":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,1,0]},"/d/lee/watermelon_n2":{"id":"/d/lee/watermelon_n2","file":"source/upstream/mudlib/d/lee/watermelon_n2.c","short":"西瓜田","long":"大片瓜藤沿田埂向東展開，葉下偶爾露出圓滾滾的西瓜。日照充足時，田間熱氣與泥土氣味格外明顯。幾名農人戴著斗笠，彎腰仔細查看瓜藤的長勢，時不時直起身子擦一把汗，對這片瓜田的收成顯然十分上心。","exits":{"west":"/d/lee/watermelon_n1","east":"/d/lee/watermelon_n3","south":"/d/lee/watermelon_s2"},"objects":{"/d/lee/npc/farmer":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,1,0]},"/d/lee/watermelon_n3":{"id":"/d/lee/watermelon_n3","file":"source/upstream/mudlib/d/lee/watermelon_n3.c","short":"西瓜田","long":"這片西瓜田已靠近村東溪流，田邊泥土較濕，偶爾能聽見溪水聲。田埂向西與其他瓜田相連。因為靠近水源，這裡的瓜藤長得格外茂盛，葉片肥厚，藤蔓幾乎要蔓過窄窄的田埂。","exits":{"west":"/d/lee/watermelon_n2","south":"/d/lee/watermelon_s3","northeast":"/d/lee/riverside_s","east":"/d/lee/creek"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,1,0]},"/d/lee/watermelon_s1":{"id":"/d/lee/watermelon_s1","file":"source/upstream/mudlib/d/lee/watermelon_s1.c","short":"西瓜田","long":"田裡瓜藤交錯，農人留下的腳印沿著窄窄田埂延伸。北面與另一片瓜田緊緊相連，西面就靠近村中央街道。田埂邊散落著幾片乾枯的瓜葉，踩上去發出細碎的聲響，倒也給這片安靜的田地添了幾分生氣。","exits":{"west":"/d/lee/street1","east":"/d/lee/watermelon_s2","north":"/d/lee/watermelon_n1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,2,0]},"/d/lee/watermelon_s2":{"id":"/d/lee/watermelon_s2","file":"source/upstream/mudlib/d/lee/watermelon_s2.c","short":"西瓜田","long":"一畦畦西瓜向東西排列，部分瓜實已長得相當飽滿。田間沒有遮蔭，午後常能感到土地散出的熱氣。幾隻蝴蝶在瓜藤間翩翩飛舞，偶爾停在花朵上歇息，替這片單調的田地增添了幾分生趣。","exits":{"west":"/d/lee/watermelon_s1","east":"/d/lee/watermelon_s3","north":"/d/lee/watermelon_n2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,2,0]},"/d/lee/watermelon_s3":{"id":"/d/lee/watermelon_s3","file":"source/upstream/mudlib/d/lee/watermelon_s3.c","short":"西瓜田","long":"李家村東南側的瓜田延伸到溪邊附近，水氣讓此處土壤較為鬆軟。沿田埂可回到西面的其他瓜田。田邊立著一座簡陋的稻草人，衣衫破舊，隨風輕輕晃動，多少能唬住幾隻膽小的鳥雀。","exits":{"west":"/d/lee/watermelon_s2","north":"/d/lee/watermelon_n3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,2,0]},"/d/lee/wroad1":{"id":"/d/lee/wroad1","file":"source/upstream/mudlib/d/lee/wroad1.c","short":"石子路","long":"這段石子路緊靠西村口，路旁泥地上留著車輪與牲口腳印。向東繼續走可以深入李家村，向西便是村口大門。路邊立著一塊簡陋的木牌，寫著「小心牲口」四個字，字跡歪斜，倒也透著幾分鄉野的樸拙。","exits":{"west":"/d/lee/gate_w","east":"/d/lee/wroad2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-9,0,0]},"/d/lee/wroad2":{"id":"/d/lee/wroad2","file":"source/upstream/mudlib/d/lee/wroad2.c","short":"石子路","long":"石子路穿過幾戶人家之間，北邊有獵戶住處，南邊則是農家院落。村民推著小車往來，路面十分平實。路旁堆著幾張晾曬的獸皮，散發著淡淡的皮革氣味，看得出這一帶住的多是靠山吃飯的人家。","exits":{"west":"/d/lee/wroad1","east":"/d/lee/wroad3","north":"/d/lee/hunter","south":"/d/lee/farm_w1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,0,0]},"/d/lee/wroad3":{"id":"/d/lee/wroad3","file":"source/upstream/mudlib/d/lee/wroad3.c","short":"石子路","long":"村西的石子路在這裡較寬，北側靠近醫館，南側仍是農家。向東再走便能抵達村中廣場。路面因為往來就診的村民較多，被踩得格外平整，偶爾能聞到醫館飄來的淡淡藥香，混著農家的泥土氣息。","exits":{"west":"/d/lee/wroad2","east":"/d/lee/wroad4","north":"/d/lee/shrine","south":"/d/lee/farm_w2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,0,0]},"/d/lee/wroad4":{"id":"/d/lee/wroad4","file":"source/upstream/mudlib/d/lee/wroad4.c","short":"石子路","long":"這段石子路夾在廣場與醫館一帶之間，路面同樣鋪著碎石，偶有村民往來。兩側種著幾株低矮的灌木，替過路人擋去了些許日頭，走起來倒也不算難受。","exits":{"east":"/d/lee/square_w","west":"/d/lee/wroad3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,0,0]},"/d/mengjia/backyard":{"id":"/d/mengjia/backyard","file":"source/upstream/mudlib/d/mengjia/backyard.c","short":"後院","long":"後院不大，牆邊種著幾株石榴與一架藤蘿，石桌石凳擦得乾乾淨淨，像是常有人在此靜坐。牆角的兵器架上刀鞘排得整整齊齊，一眼望去便知這戶人家雖不問江湖事，卻從不曾荒廢家傳的武功。","exits":{"south":"/d/mengjia/manor"},"objects":{"/d/mengjia/npc/meng_yi_rou":1},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[-1,-2,0]},"/d/mengjia/crossroad":{"id":"/d/mengjia/crossroad","file":"source/upstream/mudlib/d/mengjia/crossroad.c","short":"十字路口","long":"村子的十字路口，路心鋪著青石，被往來的車輪碾出淺淺的轍印。西邊的朱門高牆便是孟家，北邊是一間不大的小客棧，東邊的大街上人聲嘈雜，南來北往的行旅在此歇腳問路，又匆匆各奔前程。","exits":{"north":"/d/mengjia/inn","south":"/d/fengcheng/stone_road1","west":"/d/mengjia/gate","east":"/d/mengjia/street"},"objects":{},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[0,0,0]},"/d/mengjia/forest":{"id":"/d/mengjia/forest","file":"source/upstream/mudlib/d/mengjia/forest.c","short":"密林","long":"沙土地上滿是未乾的血跡，四周的古松上也被濺上了鮮血。在往北走，就是孟家的祖墳了，據說裏面葬的是天朝的一位開國將軍，五虎斷門刀的創使人，孟翔溪。","exits":{"south":"/d/mengjia/street","north":"/d/mengjia/graveyard"},"objects":{"/d/mengjia/npc/white_tiger":1},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[1,-1,0]},"/d/mengjia/gate":{"id":"/d/mengjia/gate","file":"source/upstream/mudlib/d/mengjia/gate.c","short":"孟家大門","long":"孟家大門高大厚實，門前兩尊石獅被人摸得溫潤發亮，朱漆銅環上落著一層細細的塵。門額上一個蒼勁的「孟」字，來往的鄉人與江湖客走到這裡，總要多看兩眼，又不自覺把聲音壓低了幾分。","exits":{"north":"/d/mengjia/manor","south":"/d/mengjia/herb_shop","east":"/d/mengjia/crossroad"},"objects":{"/d/mengjia/npc/tian_yu":1},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[-1,0,0]},"/d/mengjia/graveyard":{"id":"/d/mengjia/graveyard","file":"source/upstream/mudlib/d/mengjia/graveyard.c","short":"孟家祖墳","long":"這裡就是孟家的墳地，一塊塊墓碑上記載著孟家先人的功績。在墳地的最北面，有一個比較大的墳墓，由於幾百年的風吹雨打，已經看不清墓碑上所刻的文字了。墳墓的前面立著一個半人半鬼的石像，令人有種不祥的預感。","exits":{"south":"/d/mengjia/forest"},"objects":{},"special":[{"cmd":"roll 石像","to":"/d/mengjia/tomb"}],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[1,-2,0]},"/d/mengjia/herb_shop":{"id":"/d/mengjia/herb_shop","file":"source/upstream/mudlib/d/mengjia/herb_shop.c","short":"同仁藥鋪","long":"這裡是一間藥鋪，如果你有什麼需要，可以向藥鋪的掌櫃訊問一下。這種山村裡的小藥鋪，雖然治不了什麼大病，但是治療一般的跌打損傷還是綽綽有餘。在你的正上方有一塊匾額，上面寫著濟世救人。","exits":{"north":"/d/mengjia/gate"},"objects":{"/d/snow/npc/herbalist":1},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[-1,1,0]},"/d/mengjia/inn":{"id":"/d/mengjia/inn","file":"source/upstream/mudlib/d/mengjia/inn.c","short":"小客棧","long":"小客棧只有兩層，大堂收拾得乾乾淨淨，幾張方桌擺得整整齊齊，過路的商旅與江湖客三三兩兩坐著，低聲談著北邊的見聞。梯口堆著幾個酒罈，木梯被腳步磨得發亮，樓上隱約傳來走動的聲響。","exits":{"south":"/d/mengjia/crossroad","up":"/d/mengjia/inn2"},"objects":{},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[0,-1,0]},"/d/mengjia/inn2":{"id":"/d/mengjia/inn2","file":"source/upstream/mudlib/d/mengjia/inn2.c","short":"客棧二樓","long":"二樓是一排簡陋的客房，木地板踩上去吱呀作響。最裡頭的一間房裡靠牆擺著一張舊木床，床板邊緣被磨得發白，像是常有人掀動，床底下隱約有一絲陰涼的風透上來。","exits":{"down":"/d/mengjia/inn"},"objects":{"/d/mengjia/npc/tian_shen":1},"special":[{"cmd":"push 床板","to":"/d/mengjia/passage"}],"area":"孟家莊","layer":"二樓","areaKey":"孟家莊","pos":[0,-1,1]},"/d/mengjia/manor":{"id":"/d/mengjia/manor","file":"source/upstream/mudlib/d/mengjia/manor.c","short":"孟家莊","long":"宅院門庭開闊，青磚鋪地，正堂前懸著「五虎傳家」的匾額，筆力雄渾，邊角已被歲月磨得發暗。兩旁廊柱上掛著幾口舊刀，刀身擦得雪亮，孟家雖更像武林世家而非軍門，家傳的武功卻從未放下。","exits":{"north":"/d/mengjia/backyard","south":"/d/mengjia/gate"},"objects":{"/d/mengjia/npc/meng_jiang_hong":1},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[-1,-1,0]},"/d/mengjia/passage":{"id":"/d/mengjia/passage","file":"source/upstream/mudlib/d/mengjia/passage.c","short":"暗道","long":"一條狹窄的通道，一般人低著頭剛好走得過去。只是，這條密道究竟通往何出處呢？","exits":{"up":"/d/mengjia/inn2","north":"/d/mengjia/forest"},"objects":{"/d/mengjia/npc/hua_xing":1},"special":[],"area":"孟家莊","layer":"暗道","areaKey":"孟家莊","pos":[3,0,0]},"/d/mengjia/street":{"id":"/d/mengjia/street","file":"source/upstream/mudlib/d/mengjia/street.c","short":"大街","long":"大街不長，兩旁的店舖多半只做本鄉人的生意，街口幾株老槐撐開一大片濃蔭，樹下總有幾位老人家搖著蒲扇閒話家常。街的盡頭古松漸密，濃濃的松脂味裡，隱約夾雜著一絲說不上來的陰冷。","exits":{"west":"/d/mengjia/crossroad","north":"/d/mengjia/forest"},"objects":{"/d/mengjia/npc/meng_zhao_zhan":1},"special":[],"area":"孟家莊","layer":null,"areaKey":"孟家莊","pos":[1,0,0]},"/d/mengjia/tomb":{"id":"/d/mengjia/tomb","file":"source/upstream/mudlib/d/mengjia/tomb.c","short":"墓室","long":"墓室裡冷得要命，而且黑糊糊的什麼也看不清楚。憑藉著上面透過來的微弱的光芒，勉強看得見一個箱子和一個棺材。","exits":{"up":"/d/mengjia/graveyard"},"objects":{"/d/mengjia/npc/tomb_guard":1,"/d/mengjia/obj/chest":1},"special":[],"area":"孟家莊","layer":"地下","areaKey":"孟家莊","pos":[5,0,0]},"/d/oldpine/bandit_clearing":{"id":"/d/oldpine/bandit_clearing","file":"source/upstream/mudlib/d/oldpine/bandit_clearing.c","short":"空地","long":"迷霧森林西南角的一塊空地，地上的草被踩得東倒西歪，幾根削尖的木樁斜插在地上，木樁上還掛著破碎的衣物。空地邊緣堆著幾個空酒罈，一面破舊的布旗插在樹上，旗上歪歪斜斜地寫著一個「寨」字。看來老松林的土匪也把手伸進了這片森林。往東北可以回到矮樹叢。","exits":{"northeast":"/d/oldpine/shrubs"},"objects":{"/d/oldpine/npc/bandit":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,4,0]},"/d/oldpine/bear_cave":{"id":"/d/oldpine/bear_cave","file":"source/upstream/mudlib/d/oldpine/bear_cave.c","short":"山洞","long":"一個陰暗潮濕的山洞，洞頂不時滴下冰涼的水珠，空氣中瀰漫著一股濃重的腥臊味。地上散落著被啃得乾乾淨淨的獸骨，其中似乎還混著幾根人骨，角落裡鋪著一堆被壓扁的乾草，看起來是某種大型野獸的窩。洞口透進一點微光，外頭就是那片比人還高的草叢。","exits":{"out":"/d/oldpine/grass2"},"objects":{"/d/oldpine/npc/wild_bear":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[9,2,0]},"/d/oldpine/beast_trail":{"id":"/d/oldpine/beast_trail","file":"source/upstream/mudlib/d/oldpine/beast_trail.c","short":"獸徑","long":"一條野獸踩出來的狹窄小徑，兩旁的灌木被撞得東倒西歪，枝條上勾著幾撮粗硬的黑毛。泥地上的腳印又大又深，越往東走越密集，空氣中還飄著一股野獸的騷味。附近的樹幹上有幾道深深的抓痕，高度竟比人還高。往西南可以回到樹林，往東則是一面山壁。","exits":{"southwest":"/d/oldpine/wood1","east":"/d/oldpine/cave_mouth"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[5,1,0]},"/d/oldpine/cave1":{"id":"/d/oldpine/cave1","file":"source/upstream/mudlib/d/oldpine/cave1.c","short":"山洞","long":"洞內比想像中寬敞，岩壁上長著一層濕滑的青苔，從洞口透進來的光線只能照亮幾步遠。地上鋪著一層乾草和落葉，踩上去軟綿綿的，還混著一股淡淡的奶腥味。洞穴往東和往南延伸，深處不時傳來窸窣的聲響和小獸的哼叫聲。身後的洞口透進一點天光，那是唯一的出路。","exits":{"east":"/d/oldpine/cave2","south":"/d/oldpine/cave3","out":"/d/oldpine/cave_mouth"},"objects":{"/d/oldpine/npc/little_bear":2},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[7,1,0]},"/d/oldpine/cave2":{"id":"/d/oldpine/cave2","file":"source/upstream/mudlib/d/oldpine/cave2.c","short":"山洞","long":"山洞的東側，岩壁上布滿了一道道爪痕，像是有野獸經常在此磨爪。角落裡堆著一些被掏空的蜂巢，蜂蠟和蜂蜜沾了一地，引來一群小蟲嗡嗡飛舞。洞頂有一道細細的裂縫，透進一縷微光，正好照在地上一灘渾濁的積水上。往西可以回到洞口附近，往南通往更深的地方。","exits":{"west":"/d/oldpine/cave1","south":"/d/oldpine/cave_deep"},"objects":{"/d/oldpine/npc/little_bear":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[8,1,0]},"/d/oldpine/cave3":{"id":"/d/oldpine/cave3","file":"source/upstream/mudlib/d/oldpine/cave3.c","short":"山洞","long":"洞穴在這裡低了下來，得彎著腰才能前進。地上散落著被咬碎的骨頭和魚鱗，空氣又悶又臭，讓人幾乎喘不過氣。岩壁的凹陷處被扒成了一個淺淺的窩，裡面鋪著柔軟的獸毛，摸上去還帶著餘溫。往北可以回到洞口附近，往東則傳來更粗重的喘息聲。","exits":{"north":"/d/oldpine/cave1","east":"/d/oldpine/cave_deep"},"objects":{"/d/oldpine/npc/little_bear":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[7,2,0]},"/d/oldpine/cave_deep":{"id":"/d/oldpine/cave_deep","file":"source/upstream/mudlib/d/oldpine/cave_deep.c","short":"山洞深處","long":"山洞的最深處，空間突然開闊起來，洞頂高得看不見，四周的岩壁上掛著水珠，在黑暗中閃著微光。地上散落著大量獸骨，還有幾件破爛的衣物和一只生鏽的鐵鍋，不知是哪個倒楣的獵人留下的。洞的一角有一塊巨大的石頭，石面上有幾處被踩出來的凹痕，看起來可以攀爬上去。","exits":{"north":"/d/oldpine/cave2","west":"/d/oldpine/cave3"},"objects":{"/d/oldpine/npc/little_bear":2,"/d/oldpine/npc/big_bear":1},"special":[{"cmd":"climb 石頭","to":"/d/oldpine/ledge"}],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[8,2,0]},"/d/oldpine/cave_mouth":{"id":"/d/oldpine/cave_mouth","file":"source/upstream/mudlib/d/oldpine/cave_mouth.c","short":"山洞口","long":"獸徑的盡頭是一面陡峭的山壁，山壁下有一個黑漆漆的洞口，洞口的岩石被磨得光滑，顯然常有東西進出。洞口前散落著吃剩的蜂巢和魚骨，還有一些被扒開的泥土。洞裡隱約傳出低沉的鼾聲和咕嚕聲，讓人遲疑該不該進去....","exits":{"west":"/d/oldpine/beast_trail"},"objects":{},"special":[{"cmd":"enter 洞口","to":"/d/oldpine/cave1"}],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[6,1,0]},"/d/oldpine/clearing_n":{"id":"/d/oldpine/clearing_n","file":"source/upstream/mudlib/d/oldpine/clearing_n.c","short":"空地","long":"老松林北緣的一塊空地，四周的老松被人砍倒了幾棵，留下一圈高低不齊的樹樁，正好圍出一片平坦的泥地。地上滿是凌亂的腳印，幾棵松樹的樹幹上留著深淺不一的刀痕，有些痕跡又深又齊，像是有人經常在這裡練刀，而且刀法十分了得。林風穿過松針沙沙作響，四下顯得格外清靜。往南可以走進一片及腰的草叢。","exits":{"south":"/d/oldpine/grass1"},"objects":{"/d/oldpine/npc/kao_shen":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[8,1,0]},"/d/oldpine/clearing_w":{"id":"/d/oldpine/clearing_w","file":"source/upstream/mudlib/d/oldpine/clearing_w.c","short":"林間空地","long":"林子中間一塊不大的空地，中央用石頭圍了個火堆，裡面的灰燼還帶著餘溫，旁邊散落著酒罈的碎片和吃剩的獸骨。幾棵松樹的枝椏上掛著破爛的衣物，樹下堆著好幾個被扯開的包袱，裡頭的東西早被搜刮一空，看來是土匪臨時落腳的地方。往北可以回到林子邊緣，往東南則有一條小路穿過樹林。","exits":{"north":"/d/oldpine/entrance","southeast":"/d/oldpine/path0"},"objects":{"/d/oldpine/npc/bandit":2},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[0,1,0]},"/d/oldpine/crossing":{"id":"/d/oldpine/crossing","file":"source/upstream/mudlib/d/oldpine/crossing.c","short":"空地","long":"一塊地面被踩得光禿禿的空地，四周的松樹上綁著幾根斷掉的繩子，地上散落著被翻得亂七八糟的行李和撕破的衣物，看來不久前才有旅人在這裡遭到洗劫。這塊空地是老松林裡幾條小路的交會處，往北、往西、往西南都有路通往林中，往東走則是一片霧氣瀰漫的森林。","exits":{"north":"/d/oldpine/forest_w","west":"/d/oldpine/path2","east":"/d/oldpine/mist_entrance","southwest":"/d/oldpine/hideout"},"objects":{"/d/oldpine/npc/bandit_minion":1,"/d/oldpine/npc/injured_traveller":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[4,3,0]},"/d/oldpine/entrance":{"id":"/d/oldpine/entrance","file":"source/upstream/mudlib/d/oldpine/entrance.c","short":"老松林","long":"出了雪亭鎮往東南不遠，便是這片綿延數里的老松林。高大的松樹一株挨著一株，枝葉遮天，即使是正午，林子裡也顯得陰暗。這裡原是雪亭鎮往來喬陰的捷徑，近來卻因為土匪出沒，旅人多半寧可繞道五堂鎮。路旁立著一塊被風雨侵蝕的木牌，上頭的字跡已經模糊難辨。往西北可以回到雪亭鎮，往南則有一條小路深入林中。","exits":{"northwest":"/d/snow/sgate","south":"/d/oldpine/clearing_w"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[0,0,0]},"/d/oldpine/forest_n1":{"id":"/d/oldpine/forest_n1","file":"source/upstream/mudlib/d/oldpine/forest_n1.c","short":"樹林","long":"松林在這裡長得特別茂密，樹與樹之間的空隙只容一人側身通過，地上的松針積了厚厚一層，踩上去軟綿綿的，沒有半點聲響。灌木叢後隱約有被人踩平的痕跡，旁邊還丟著幾根啃過的雞骨頭和一個空酒葫蘆，看來常有人躲在這裡守株待兔。往東樹林延伸開去，往西南則有一條被人踩出來的小徑。","exits":{"east":"/d/oldpine/forest_n2","southwest":"/d/oldpine/forest_w"},"objects":{"/d/oldpine/npc/bandit":2},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[5,1,0]},"/d/oldpine/forest_n2":{"id":"/d/oldpine/forest_n2","file":"source/upstream/mudlib/d/oldpine/forest_n2.c","short":"樹林","long":"一片幽靜的松林，粗大的樹幹上爬滿了青苔，偶爾有幾隻野鳥在枝頭吱吱喳喳地叫著，又倏地飛走。林間沒有像樣的路，只有前人砍斷的枝條和繫在樹上的布條指引方向，布條早已褪色，在風中無力地飄動著。往東、往西都還是一眼望不到盡頭的樹林。","exits":{"west":"/d/oldpine/forest_n1","east":"/d/oldpine/forest_n3"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[6,1,0]},"/d/oldpine/forest_n3":{"id":"/d/oldpine/forest_n3","file":"source/upstream/mudlib/d/oldpine/forest_n3.c","short":"樹林","long":"這裡的松樹稍微稀疏了些，陽光從枝葉的縫隙灑下來，在地上投出斑駁的光影。東北方的林子後面不時傳來刀刃劈開空氣的呼呼聲；東南方的地勢漸漸低下去，長滿了半人高的雜草。往西則是更深的松林，林子裡靜得只剩下自己的腳步聲。","exits":{"west":"/d/oldpine/forest_n2","southeast":"/d/oldpine/grass1"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[7,1,0]},"/d/oldpine/forest_w":{"id":"/d/oldpine/forest_w","file":"source/upstream/mudlib/d/oldpine/forest_w.c","short":"樹林","long":"高大的老松將天空遮得只剩下零星幾點光亮，林中瀰漫著一股松脂的清香。一棵被雷劈倒的大松橫躺在地上，樹身早已腐朽中空，幾朵白色的菇菌從裂縫裡冒出頭來，倒下的樹幹旁長出了一圈嫩綠的小松苗。往東北可以穿過樹林，往南不遠處就是一塊較為開闊的空地。","exits":{"northeast":"/d/oldpine/forest_n1","south":"/d/oldpine/crossing"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[4,2,0]},"/d/oldpine/glade":{"id":"/d/oldpine/glade","file":"source/upstream/mudlib/d/oldpine/glade.c","short":"林間空地","long":"迷霧森林中一塊難得開闊的空地，霧氣在這裡變得稀薄，抬頭還能望見一角灰濛濛的天空。空地西邊有一間冒著炊煙的野店，幾條小路從這裡向四方延伸，是林中往來的人必經之處。空地中央有一截被砍平的大樹樁，上面刻滿了旅人留下的名字。往西是野店，往北、西北、東、南都有路通往森林各處。","exits":{"west":"/d/oldpine/inn","north":"/d/oldpine/mist4","northwest":"/d/oldpine/mist3","east":"/d/oldpine/wood1","south":"/d/oldpine/shrubs"},"objects":{"/d/oldpine/npc/lin_yuchan":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,2,0]},"/d/oldpine/grass1":{"id":"/d/oldpine/grass1","file":"source/upstream/mudlib/d/oldpine/grass1.c","short":"草叢","long":"松林在這裡忽然斷開，眼前是一大片及腰的野草，風一吹便如波浪般起伏。草叢裡不時傳來窸窸窣窣的聲音，偶爾還能看見一雙發亮的眼睛在草間一閃而過，叫人心裡發毛。草地上有幾處被壓倒的痕跡，像是有什麼大傢伙在這裡打過滾。往西北可以回到松林，往北是一塊空地，往東南的草長得更高更密。","exits":{"northwest":"/d/oldpine/forest_n3","north":"/d/oldpine/clearing_n","southeast":"/d/oldpine/grass2","east":"/d/kangping/forest_exit"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[8,2,0]},"/d/oldpine/grass2":{"id":"/d/oldpine/grass2","file":"source/upstream/mudlib/d/oldpine/grass2.c","short":"草叢","long":"這裡的野草長得比人還高，四周只聽得見草葉摩擦的沙沙聲，根本看不清三步以外的東西。草叢中被壓出了一條條獸徑，泥地上滿是爪印，草根處還散落著幾撮灰黃色的獸毛。北邊的山壁下有一個黑黝黝的洞穴，裡頭不時傳出低沉的吼聲。往西北可以回到較矮的草叢。","exits":{"northwest":"/d/oldpine/grass1","southeast":"/d/baihua/hillside"},"objects":{"/d/npc/goat":3},"special":[{"cmd":"cave","to":"/d/oldpine/bear_cave"}],"area":"老松林","layer":null,"areaKey":"老松林","pos":[9,3,0]},"/d/oldpine/gravel_road":{"id":"/d/oldpine/gravel_road","file":"source/upstream/mudlib/d/oldpine/gravel_road.c","short":"碎石路","long":"一條鋪著碎石的小路，碎石大小不一，走起來喀啦作響，是彤雲寺的僧人一擔一擔挑來鋪成的。路旁立著一塊小石碑，刻著「彤雲寺由此往西」。這裡是老松林中少數有人整理的路，往西可以到彤雲寺，往南接上官道，往北的林子裡卻不時傳來粗野的喧鬧聲。","exits":{"west":"/d/oldpine/temple_gate","north":"/d/oldpine/hideout","south":"/d/oldpine/highway"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,5,0]},"/d/oldpine/hideout":{"id":"/d/oldpine/hideout","file":"source/upstream/mudlib/d/oldpine/hideout.c","short":"林間空地","long":"松林深處一塊隱密的空地，四周用砍下的樹枝圍起了簡陋的柵欄，柵欄上掛著幾面破舊的布旗。空地中央搭著一個獸皮棚子，裡面堆著搶來的米糧和兵器，棚前插著一把生了鏽的大刀，刀柄上纏著褪色的紅布。這裡顯然是土匪在老松林裡的據點。往東北和往南各有一條小路。","exits":{"northeast":"/d/oldpine/crossing","south":"/d/oldpine/gravel_road"},"objects":{"/d/oldpine/npc/xue_biao":1,"/d/oldpine/npc/bandit":2},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,4,0]},"/d/oldpine/highway":{"id":"/d/oldpine/highway","file":"source/upstream/mudlib/d/oldpine/highway.c","short":"官道","long":"老松林南邊的官道，路面寬闊平坦，兩旁種著整齊的柳樹，與林中崎嶇的小路相比，走起來輕鬆許多。路邊立著一塊里程碑，刻著往喬陰縣的方向與里數。由於近來老松林土匪橫行，官道上往來的旅人寥寥無幾，只有幾隻烏鴉停在柳枝上啞啞叫著。往北可以進入老松林，往南的官道通往喬陰縣。","exits":{"north":"/d/oldpine/gravel_road","south":"/d/qiaoyin/ngate"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,6,0]},"/d/oldpine/inn":{"id":"/d/oldpine/inn","file":"source/upstream/mudlib/d/oldpine/inn.c","short":"野店","long":"迷霧森林裡一間用原木搭成的野店，屋簷下掛著一串串獸皮與風乾的鹿腿，門口豎著一根竹竿，挑著寫有「酒」字的布幌子。野店來往的人雖然不多，但獵戶和採藥人經常在此落腳，生意倒也還過得去；偶爾有獵人把打到的獵物賣給野店，烤肉的香味還吸引了附近的老饕前來光顧。往東可以回到林間空地，後頭掛著一塊油膩的布簾，裡面就是廚房。","exits":{"east":"/d/oldpine/glade","enter":"/d/oldpine/kitchen"},"objects":{"/d/oldpine/npc/waiter":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,2,0]},"/d/oldpine/kitchen":{"id":"/d/oldpine/kitchen","file":"source/upstream/mudlib/d/oldpine/kitchen.c","short":"廚房","long":"野店後頭的小廚房，牆壁被煙燻得烏黑，灶上架著一口大鐵鍋，鍋裡燉著不知名的野味，香氣四溢。屋樑上吊著幾串風乾的獸肉和辣椒，牆角堆滿了柴火與裝米的麻袋，麻袋上被咬出了好幾個破洞，地上還散落著米粒和老鼠屎。掀開布簾就能回到前頭的店裡。","exits":{"out":"/d/oldpine/inn"},"objects":{"/d/oldpine/npc/rat":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[1,2,0]},"/d/oldpine/ledge":{"id":"/d/oldpine/ledge","file":"source/upstream/mudlib/d/oldpine/ledge.c","short":"平台","long":"一塊突出的大石頭形成的平台，位置高出洞底許多，下面的動靜看得一清二楚。石面上有幾處被人用刀刻下的記號，旁邊還丟著一個乾癟的水袋，看來曾有人在此躲避野獸。在這裡總算可以暫時喘口氣，但下面的低吼聲不時傳來，提醒你危險並未遠離。從這裡可以爬下去，回到山洞深處。","exits":{"down":"/d/oldpine/cave_deep"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[8,3,0]},"/d/oldpine/main_hall":{"id":"/d/oldpine/main_hall","file":"source/upstream/mudlib/d/oldpine/main_hall.c","short":"大雄寶殿","long":"這裡是彤雲寺的大雄寶殿﹐正殿供奉的是一尊巨大的大日如來神像﹐各式法器均整齊地放在一旁﹐神像前放著幾個蒲團﹐大殿的入口在你的南邊﹐東西兩邊各有一扇門通往寺院內部。","exits":{"west":"/d/oldpine/side_hall_w","east":"/d/oldpine/side_hall_e","south":"/d/oldpine/temple_square"},"objects":{"/d/oldpine/npc/da_guan":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[1,4,0]},"/d/oldpine/mist1":{"id":"/d/oldpine/mist1","file":"source/upstream/mudlib/d/oldpine/mist1.c","short":"迷霧森林","long":"白茫茫的霧氣在樹林間緩緩流動，十步以外的景物便模糊不清，只剩下一團團灰色的樹影。腳下是濕滑的落葉和腐土，空氣中飄著草藥的苦香，路旁偶爾能看見採藥人遺落的竹簍和斷掉的藥鋤。森林雖然深不可測，往來的人倒也不算少。往西可以走出森林，往東霧氣更加濃重。","exits":{"west":"/d/oldpine/mist_entrance","east":"/d/oldpine/mist2"},"objects":{"/d/oldpine/npc/traveller":2},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[1,0,0]},"/d/oldpine/mist2":{"id":"/d/oldpine/mist2","file":"source/upstream/mudlib/d/oldpine/mist2.c","short":"迷霧森林","long":"霧氣濃得像化不開的牛乳，衣服沒多久就被沾得濕漉漉的。林間有一塊稍微乾燥的高地，被往來的人當成了歇腳處，地上留著熄滅的火堆和一些吃剩的乾糧碎屑。不時有人影從霧中出現又消失，分不清是旅人還是商販。往西可以回去，往南有一條被人踩出來的小徑。","exits":{"west":"/d/oldpine/mist1","south":"/d/oldpine/mist3"},"objects":{"/d/oldpine/npc/seller":1,"/d/npc/man":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,0,0]},"/d/oldpine/mist3":{"id":"/d/oldpine/mist3","file":"source/upstream/mudlib/d/oldpine/mist3.c","short":"迷霧森林","long":"這裡的樹木長得歪歪斜斜，樹根像一條條巨蛇般隆出地面，一不留神就會被絆倒。霧氣中隱約傳來潺潺的水聲，循聲望去卻什麼也看不見。樹幹上被人用刀刻了幾個箭頭，指向東南方，大概是往來的獵戶留下的記號。往北可以回到林中的歇腳處，往東南的霧氣稍微淡了一些。","exits":{"north":"/d/oldpine/mist2","southeast":"/d/oldpine/glade"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,1,0]},"/d/oldpine/mist4":{"id":"/d/oldpine/mist4","file":"source/upstream/mudlib/d/oldpine/mist4.c","short":"迷霧森林","long":"一片長滿青草的林間窪地，霧氣在此聚積不散，像一池靜止的白水。草地上滿是蹄印和被啃食過的草根，四周的樹皮也被磨去了一塊塊，看來常有野鹿成群在此覓食。一有風吹草動，草叢深處便傳來一陣慌亂的蹄聲，接著又歸於平靜。往南可以走到一塊林間空地。","exits":{"south":"/d/oldpine/glade"},"objects":{"/d/oldpine/npc/deer":4},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,1,0]},"/d/oldpine/mist_entrance":{"id":"/d/oldpine/mist_entrance","file":"source/upstream/mudlib/d/oldpine/mist_entrance.c","short":"森林入口","long":"老松林往東走到盡頭，樹木的種類漸漸變得雜亂，高大的樟樹與楓樹取代了松樹，林間開始飄起一層薄薄的白霧。路旁一棵大樟樹上刻著歪歪扭扭的幾個字：「霧深勿入」，旁邊還畫了個骷髏頭。這裡便是迷霧森林的入口，往西可以回到老松林，往東則是霧氣更濃的森林深處。","exits":{"west":"/d/oldpine/crossing","east":"/d/oldpine/mist1"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[0,0,0]},"/d/oldpine/path0":{"id":"/d/oldpine/path0","file":"source/upstream/mudlib/d/oldpine/path0.c","short":"林間小路","long":"一段狹窄的林間小路，兩旁的老松枝椏低垂，行人得不時低頭，才不會被松枝刮到臉。路面上散落著被踩碎的松果，泥土裡還半埋著一隻斷了繩的草鞋和幾枚生鏽的銅錢，看來曾有人在這裡慌忙逃命。西北方隱約飄來柴火的煙味和粗野的笑罵聲，往東則接上一條較為平坦的小路。","exits":{"northwest":"/d/oldpine/clearing_w","east":"/d/oldpine/path1"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[1,2,0]},"/d/oldpine/path1":{"id":"/d/oldpine/path1","file":"source/upstream/mudlib/d/oldpine/path1.c","short":"林間小路","long":"一條夾在松樹之間的泥土小路，路面被往來的人踩得結實，兩旁卻長滿了帶刺的荊棘，稍不留神就會勾破衣裳。路邊的泥地上留著幾個新鮮的馬蹄印，不遠處還有一小攤乾掉的血跡和一隻掉落的布鞋，讓人不禁加快了腳步。小路往西越走越窄，往東南則蜿蜒深入林中。","exits":{"west":"/d/oldpine/path0","southeast":"/d/oldpine/path2"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[2,2,0]},"/d/oldpine/path2":{"id":"/d/oldpine/path2","file":"source/upstream/mudlib/d/oldpine/path2.c","short":"林間小路","long":"林間的小路在這裡轉了個彎，路旁一棵老松的根部盤結隆起，被往來的人當成了歇腳的石凳，坐得光滑發亮。樹枝上掛著幾串風乾的野果，不知是哪個好心的旅人留下來給後人充飢的。近來路上行人稀少，樹根旁已經積了一層沒人掃的落葉。小路往西北通向林子深處，往東則能走到一塊空地。","exits":{"northwest":"/d/oldpine/path1","east":"/d/oldpine/crossing"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,3,0]},"/d/oldpine/reeds":{"id":"/d/oldpine/reeds","file":"source/upstream/mudlib/d/oldpine/reeds.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds2","south":"/d/oldpine/reeds","east":"/d/oldpine/wood3","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林","pos":[3,4,-1]},"/d/oldpine/reeds2":{"id":"/d/oldpine/reeds2","file":"source/upstream/mudlib/d/oldpine/reeds2.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds3","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds3":{"id":"/d/oldpine/reeds3","file":"source/upstream/mudlib/d/oldpine/reeds3.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds4","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds4":{"id":"/d/oldpine/reeds4","file":"source/upstream/mudlib/d/oldpine/reeds4.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds","west":"/d/oldpine/reeds5"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds5":{"id":"/d/oldpine/reeds5","file":"source/upstream/mudlib/d/oldpine/reeds5.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds_exit","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds_exit":{"id":"/d/oldpine/reeds_exit","file":"source/upstream/mudlib/d/oldpine/reeds_exit.c","short":"蘆葦叢","long":"蘆葦叢的邊緣，高大的蘆葦終於稀疏了下來，露出一小片乾燥的土丘。土丘上長著幾株罕見的草藥，在潮濕的霧氣中顯得格外青翠，看來很少有人能找到這裡。從土丘上望出去，東邊隱約可以看見樹林的輪廓，總算是找到了出路。往東可以離開蘆葦叢。","exits":{"east":"/d/oldpine/wood3"},"objects":{"/d/oldpine/npc/herbalist":1},"special":[],"area":"迷霧森林","layer":"蘆葦叢邊緣","areaKey":"迷霧森林","pos":[3,4,1]},"/d/oldpine/shrubs":{"id":"/d/oldpine/shrubs","file":"source/upstream/mudlib/d/oldpine/shrubs.c","short":"矮樹叢","long":"一片低矮的灌木叢，枝葉間結滿了紅色的小漿果，酸甜的氣味混在霧氣裡。灌木叢中被人砍出了一條小路，路旁的樹枝上綁著一條褪色的紅布，大概是給迷路的人做的記號。霧中不時傳來幾聲粗魯的吆喝和大笑，聽起來不像是善類。往北可以回到林間空地，往西南是一片空地。","exits":{"north":"/d/oldpine/glade","southwest":"/d/oldpine/bandit_clearing"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,3,0]},"/d/oldpine/side_hall_e":{"id":"/d/oldpine/side_hall_e","file":"source/upstream/mudlib/d/oldpine/side_hall_e.c","short":"側殿","long":"大雄寶殿東側的偏殿，殿內供奉著十八羅漢的泥塑像，有的怒目圓睜，有的含笑撫膝，個個神態不同、栩栩如生。殿角放著一面大鼓和一口銅鐘，鐘身刻滿了經文，看得出年代久遠。地上的青磚被跪拜的人磨得光亮，蒲團上還留著淺淺的膝印。往西可以回到大雄寶殿。","exits":{"west":"/d/oldpine/main_hall"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[2,4,0]},"/d/oldpine/side_hall_w":{"id":"/d/oldpine/side_hall_w","file":"source/upstream/mudlib/d/oldpine/side_hall_w.c","short":"側殿","long":"大雄寶殿西側的偏殿，殿內供奉著一尊手持淨瓶的觀音菩薩像，菩薩低眉垂目，神情慈悲。兩旁的木架上擺滿了經書，許多書頁已經泛黃，用細繩小心地綑紮著。供桌上點著一盞長明燈，微弱的火光映著牆上褪色的壁畫，畫的是菩薩救苦救難的故事。往東可以回到大雄寶殿。","exits":{"east":"/d/oldpine/main_hall"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[0,4,0]},"/d/oldpine/temple_gate":{"id":"/d/oldpine/temple_gate","file":"source/upstream/mudlib/d/oldpine/temple_gate.c","short":"彤雲寺","long":"彤雲寺的山門，兩扇朱漆木門斑駁褪色，門楣上懸著一塊匾額，以蒼勁的筆法寫著「彤雲寺」三個大字。門前蹲著兩隻石獅，被風雨侵蝕得只剩下模糊的輪廓。聽說寺裡的住持到南方雲遊了好些年，香火一度冷清，最近才又熱鬧起來。往西進入寺內的廣場，往東是一條碎石路。","exits":{"west":"/d/oldpine/temple_square","east":"/d/oldpine/gravel_road"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[2,5,0]},"/d/oldpine/temple_square":{"id":"/d/oldpine/temple_square","file":"source/upstream/mudlib/d/oldpine/temple_square.c","short":"彤雲寺","long":"彤雲寺大殿前的廣場，地上鋪著平整的青石板，石縫裡長出幾叢青草。廣場中央立著一座三足銅香爐，爐中插滿了香，裊裊青煙飄向北邊莊嚴的大雄寶殿。廣場兩側種著幾棵老松，樹下擺著石凳，偶爾有僧人拿著竹掃帚在此清掃落葉。往北是大雄寶殿，往東可以走出寺門。","exits":{"north":"/d/oldpine/main_hall","east":"/d/oldpine/temple_gate"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[1,5,0]},"/d/oldpine/wood1":{"id":"/d/oldpine/wood1","file":"source/upstream/mudlib/d/oldpine/wood1.c","short":"樹林","long":"霧氣籠罩下的雜木林，樹幹上纏滿了藤蔓，藤上結著一串串紫黑色的果實，引來不少鳥雀啄食。地面上有幾道被重物拖過的痕跡，一路延伸到東北方的林子裡，痕跡旁還印著碗口大的爪印，看得人心頭一緊。往西可以回到空地，往東北和往南各有小路。","exits":{"west":"/d/oldpine/glade","northeast":"/d/oldpine/beast_trail","south":"/d/oldpine/wood2"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[4,2,0]},"/d/oldpine/wood2":{"id":"/d/oldpine/wood2","file":"source/upstream/mudlib/d/oldpine/wood2.c","short":"樹林","long":"林中的霧氣潮濕而清涼，樹下長著各式各樣的蕨類和野草，其中有不少是珍貴的藥材。地上被挖出了許多小坑，坑邊還留著新鮮的泥土，看來有採藥人剛在這裡忙碌過。遠處傳來一陣陣蘆葦被風吹動的沙沙聲，在霧中聽來格外清晰。往北和往南都有路可走。","exits":{"north":"/d/oldpine/wood1","south":"/d/oldpine/wood3"},"objects":{"/d/oldpine/npc/herbalist":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[4,3,0]},"/d/oldpine/wood3":{"id":"/d/oldpine/wood3","file":"source/upstream/mudlib/d/oldpine/wood3.c","short":"樹林","long":"森林的南邊，霧氣在這裡被一片廣大的蘆葦叢擋住，樹林與蘆葦交界處長滿了濕漉漉的苔蘚。西邊的蘆葦叢一望無際，隨風起伏如海，據說曾有人走進去就再也沒有出來，附近的獵戶都繞道而行。往北可以回到林中，往西是蘆葦叢，往西南的樹林則越來越幽深。","exits":{"north":"/d/oldpine/wood2","west":"/d/oldpine/reeds","southwest":"/d/oldpine/wood4"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[4,4,0]},"/d/oldpine/wood4":{"id":"/d/oldpine/wood4","file":"source/upstream/mudlib/d/oldpine/wood4.c","short":"樹林","long":"這裡的樹木又高又密，枝葉交錯成一片厚實的頂篷，霧氣被困在林下，濃得幾乎可以用手撈起。地上的落葉積了不知多少年，踩下去鬆鬆軟軟，散發出一股潮濕的霉味。樹枝間不時有小動物竄過，抖落一串冰涼的水珠。往東北可以回去，往南是森林更深的地方。","exits":{"northeast":"/d/oldpine/wood3","south":"/d/oldpine/wood_deep"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,5,0]},"/d/oldpine/wood_deep":{"id":"/d/oldpine/wood_deep","file":"source/upstream/mudlib/d/oldpine/wood_deep.c","short":"樹林深處","long":"迷霧森林的最深處，幾棵需要數人合抱的古松挺立在霧中，樹幹上滿是樹洞，松果落了一地。松鼠們在枝頭間跳來跳去，一點也不怕人，偶爾還會抱著松果好奇地打量你。四周靜謐得出奇，彷彿與外面的世界完全隔絕。往北是唯一的出路。","exits":{"north":"/d/oldpine/wood4"},"objects":{"/d/npc/squirrel":4},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,6,0]},"/d/qiaoyin/alchemy_room":{"id":"/d/qiaoyin/alchemy_room","file":"source/upstream/mudlib/d/qiaoyin/alchemy_room.c","short":"煉丹房","long":"這裡是方士煉丹的房間，裡面有許多的丹爐跟丹鼎，還有許多的松柴，由於煉丹需要專心，為了避免在煉丹時受到別人的打擾，這個房間有高級方士施以法術，專供方士專心煉丹用。","exits":{"south":"/d/qiaoyin/big_hall"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-1,-2,0]},"/d/qiaoyin/alley":{"id":"/d/qiaoyin/alley","file":"source/upstream/mudlib/d/qiaoyin/alley.c","short":"小巷子","long":"一條狹窄的小巷子，從東大街往北延伸過來，兩旁的高牆擋住了大半的陽光，青石板路面長著一層薄薄的青苔，走起來有些溼滑。巷子西邊有一間大屋，門口飄出淡淡的藥香與煙火味，偶爾還傳來陶罐碰撞的聲響。","exits":{"west":"/d/qiaoyin/big_hall","south":"/d/qiaoyin/east_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[0,-1,0]},"/d/qiaoyin/bank":{"id":"/d/qiaoyin/bank","file":"source/upstream/mudlib/d/qiaoyin/bank.c","short":"景隆錢莊","long":"景隆錢莊在喬陰縣的分號，店面雖然不如五堂鎮的本號氣派，但櫃臺後的夥計一樣忙著撥算盤，門口與內堂都有護院武師把守。在這裡可以存款、提款，也可以兌換銀兩，城裡的商家大多在此往來。","exits":{"north":"/d/qiaoyin/west_street3"},"objects":{"/d/npc/guard":2},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,1,0]},"/d/qiaoyin/big_hall":{"id":"/d/qiaoyin/big_hall","file":"source/upstream/mudlib/d/qiaoyin/big_hall.c","short":"大屋正廳","long":"進了這間大屋才發現，原來這裡是間方士們煉丹燒爐的丹房，大廳中擺設很簡單，只有一些木櫃跟香煙裊繞的青銅丹爐，幾名童子正用蒲扇在丹爐旁搧火，另外一些童子則蹲在一旁用瓷缽研磨不知名的藥物。","exits":{"north":"/d/qiaoyin/alchemy_room","east":"/d/qiaoyin/alley"},"objects":{"/d/qiaoyin/npc/jiang_hsuren":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-1,-1,0]},"/d/qiaoyin/bookstore":{"id":"/d/qiaoyin/bookstore","file":"source/upstream/mudlib/d/qiaoyin/bookstore.c","short":"名山書肆","long":"你現在來到一間燈光昏暗的書肆，除了你進來的那面牆上開了道門之外，三面牆壁都是書架，滿滿地排列著各式各樣的書。靠裡面的一個矮櫃上面放著文房四寶，一股淡淡的松煙墨香氣縈繞著整間屋子。","exits":{"east":"/d/qiaoyin/west_lane2"},"objects":{"/d/qiaoyin/npc/oldman":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-8,-1,0]},"/d/qiaoyin/east_street1":{"id":"/d/qiaoyin/east_street1","file":"source/upstream/mudlib/d/qiaoyin/east_street1.c","short":"東大街","long":"東大街的西端，鄰近城中心的樹王墳，街邊幾家茶館坐滿了閒聊的鄉民，說書人拍著醒木的聲音隔著窗子都聽得見，講到精彩處還會引來滿堂喝采。街口有個賣糖葫蘆的老漢，身邊總圍著幾個孩子。","exits":{"west":"/d/qiaoyin/tree_tomb","east":"/d/qiaoyin/east_street2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-2,0,0]},"/d/qiaoyin/east_street2":{"id":"/d/qiaoyin/east_street2","file":"source/upstream/mudlib/d/qiaoyin/east_street2.c","short":"東大街","long":"東大街的中段，兩旁多是賣布匹、雜貨的店鋪，綢緞莊門口掛著幾匹染得鮮豔的花布，在陽光下格外顯眼。這一帶往來的行人比西大街少了一些，顯得清閒許多，偶爾有轎子從街心經過。","exits":{"west":"/d/qiaoyin/east_street1","east":"/d/qiaoyin/east_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-1,0,0]},"/d/qiaoyin/east_street3":{"id":"/d/qiaoyin/east_street3","file":"source/upstream/mudlib/d/qiaoyin/east_street3.c","short":"東大街","long":"東大街的東段，離東門已經不遠，街上的店鋪漸漸稀疏，多了幾分冷清。東北方是一座清幽的宅院，門前打掃得一塵不染，南邊則是同仁藥鋪，門口飄著淡淡的藥香，往來的多是抓藥看病的街坊。","exits":{"west":"/d/qiaoyin/east_street2","east":"/d/qiaoyin/egate","north":"/d/qiaoyin/alley","northeast":"/d/qiaoyin/fonxan_hall","south":"/d/qiaoyin/pharmacy"},"objects":{"/d/qiaoyin/npc/girl":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[0,0,0]},"/d/qiaoyin/egate":{"id":"/d/qiaoyin/egate","file":"source/upstream/mudlib/d/qiaoyin/egate.c","short":"喬陰縣城東門","long":"喬陰縣城的東門，城門緊緊關著，門閂上還加了一道大鎖。出了東門的路原本可以通往黑風山與天寒村，但近來山路不太平靜，官府已經下令暫時封閉，城門邊貼著一張告示，圍觀的鄉民議論紛紛。城牆腳下另有一條小徑繞向東北，看來是附近農戶往來田間的路。","exits":{"west":"/d/qiaoyin/east_street3","northeast":"/d/qiaoyin_east/outside"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[1,0,0]},"/d/qiaoyin/fonxan_hall":{"id":"/d/qiaoyin/fonxan_hall","file":"source/upstream/mudlib/d/qiaoyin/fonxan_hall.c","short":"正廳","long":"這是一座清幽宅院的正廳，據說是封山派在喬陰縣的落腳之處。廳中陳設簡樸，正面牆上掛著一幅山水，畫的正是封山的景色，兩旁擺著幾張太師椅，桌上的茶還冒著熱氣。東邊的門通往一處別院。","exits":{"east":"/d/qiaoyin/fonxan_yard","southwest":"/d/qiaoyin/east_street3"},"objects":{"/d/qiaoyin/npc/liuh_don_lu":1,"/d/qiaoyin/npc/doo_yeng":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[1,-1,0]},"/d/qiaoyin/fonxan_yard":{"id":"/d/qiaoyin/fonxan_yard","file":"source/upstream/mudlib/d/qiaoyin/fonxan_yard.c","short":"別院","long":"正廳東邊的一處別院，院子裡種著幾株老梅與修竹，牆角一口古井上覆著木蓋。一張石桌旁擺著幾個石凳，四周十分清靜，只聽得見風吹竹葉的沙沙聲，看來是封山派用來招待貴客的地方。","exits":{"west":"/d/qiaoyin/fonxan_hall"},"objects":{"/d/qiaoyin/npc/wu_yu_nun":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[2,-1,0]},"/d/qiaoyin/grocery":{"id":"/d/qiaoyin/grocery","file":"source/upstream/mudlib/d/qiaoyin/grocery.c","short":"雜貨舖","long":"一間堆得滿滿的雜貨舖，櫃臺上擺著鹽、糖、符紙之類的日常雜貨，牆角疊著一捆捆的松材，屋樑上還吊著幾串乾辣椒。老闆老何在喬陰縣住了大半輩子，城裡人要買什麼零碎東西，多半都往這兒來。","exits":{"east":"/d/qiaoyin/north_street1"},"objects":{"/d/qiaoyin/npc/old_ho":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,-3,0]},"/d/qiaoyin/highway":{"id":"/d/qiaoyin/highway","file":"source/upstream/mudlib/d/qiaoyin/highway.c","short":"官道","long":"從五堂鎮通往喬陰縣的官道，路面被往來的車馬碾出兩道深深的車轍，兩旁是一畦畦的稻田，遠處已經可以望見喬陰縣城灰色的城牆。路旁的大樹下擺著一座茶棚，供趕路的旅人歇腳。","exits":{"northwest":"/d/wutang/three_way","east":"/d/qiaoyin/wgate"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-8,-3,0]},"/d/qiaoyin/inn":{"id":"/d/qiaoyin/inn","file":"source/upstream/mudlib/d/qiaoyin/inn.c","short":"金水客棧","long":"一家寬敞的客棧，門口高高掛著「金水客棧」的招牌。大廳裡擺著十幾張桌子，跑堂的店小二穿梭其間，招呼著南來北往的客人，櫃臺後的酒罈堆得老高。牆角有一座木梯通往二樓的雅座。","exits":{"east":"/d/qiaoyin/south_street2","up":"/d/qiaoyin/inn2"},"objects":{"/d/qiaoyin/npc/waiter":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,2,0]},"/d/qiaoyin/inn2":{"id":"/d/qiaoyin/inn2","file":"source/upstream/mudlib/d/qiaoyin/inn2.c","short":"金水客棧二樓","long":"這裡是金水客棧的二樓，或者應該說是一樓和二樓之間的閣樓，這有座木梯通往樓下，靠窗一面是二樓的雅座，往北則通往客房。","exits":{"down":"/d/qiaoyin/inn"},"objects":{"/d/qiaoyin/npc/cao_xuanzhi":1,"/d/qiaoyin/npc/yin_euyen":1},"special":[],"area":"喬陰縣","layer":"二樓","areaKey":"喬陰縣","pos":[-4,2,1]},"/d/qiaoyin/mid_lane1":{"id":"/d/qiaoyin/mid_lane1","file":"source/upstream/mudlib/d/qiaoyin/mid_lane1.c","short":"街道","long":"一條不太寬的街道，兩旁的店面大多關著門，東邊是和豐當鋪的大門，門口掛著一塊褪了色的招牌。路邊的牆角堆著一些破竹簍，常有野狗在這裡翻找吃食，弄得滿地狼藉。","exits":{"east":"/d/qiaoyin/pawnshop","south":"/d/qiaoyin/mid_lane2"},"objects":{"/d/npc/wild_dog":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,-2,0]},"/d/qiaoyin/mid_lane2":{"id":"/d/qiaoyin/mid_lane2","file":"source/upstream/mudlib/d/qiaoyin/mid_lane2.c","short":"街道","long":"一條安靜的街道，兩旁是幾戶人家的後牆，牆頭探出幾枝桃花，在風中輕輕搖曳，落下的花瓣鋪了一地。偶爾有人家推開後門倒水，見到生人便又急忙關上，似乎不太喜歡外人打擾。","exits":{"north":"/d/qiaoyin/mid_lane1","south":"/d/qiaoyin/west_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,-1,0]},"/d/qiaoyin/ngate":{"id":"/d/qiaoyin/ngate","file":"source/upstream/mudlib/d/qiaoyin/ngate.c","short":"喬陰縣城北門","long":"喬陰縣城的北門，城門洞裡陰涼幽暗，幾名官兵手按刀柄，仔細盤查著進出的行人，連挑擔的小販也得打開擔子讓他們翻看。城門外是一條通往老松林的官道，近來老松林裡的土匪越聚越多，往北去的商旅都得結伴而行，城牆上也新貼了幾張緝拿盜匪的告示。","exits":{"north":"/d/oldpine/highway","south":"/d/qiaoyin/north_street1"},"objects":{"/d/npc/garrison":4},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-4,0]},"/d/qiaoyin/north_street1":{"id":"/d/qiaoyin/north_street1","file":"source/upstream/mudlib/d/qiaoyin/north_street1.c","short":"北大街","long":"北大街的北段，離北門已經不遠，西邊開著一間雜貨舖。由於北門外不太平靜，這一帶的行人比往年少了許多，偶爾才有幾個挑著擔子的鄉民匆匆走過，連路邊的攤販也早早收了攤。","exits":{"north":"/d/qiaoyin/ngate","west":"/d/qiaoyin/grocery","south":"/d/qiaoyin/north_street2"},"objects":{"/d/npc/man":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-3,0]},"/d/qiaoyin/north_street2":{"id":"/d/qiaoyin/north_street2","file":"source/upstream/mudlib/d/qiaoyin/north_street2.c","short":"北大街","long":"北大街的中段，街道兩旁店鋪林立，酒旗招展，挑擔的小販沿街叫賣，是喬陰縣城裡最熱鬧的地方之一。路邊的酒樓傳出划拳行令的喧鬧聲，門口停著幾輛馬車，車伕們蹲在一旁閒聊。","exits":{"north":"/d/qiaoyin/north_street1","south":"/d/qiaoyin/north_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-2,0]},"/d/qiaoyin/north_street3":{"id":"/d/qiaoyin/north_street3","file":"source/upstream/mudlib/d/qiaoyin/north_street3.c","short":"北大街","long":"北大街的南段，東邊傳來叮叮噹噹的打鐵聲，原來是一間鐵匠鋪，鋪子門口堆著一些剛打好的鋤頭與柴刀，幾個莊稼漢正蹲在一旁挑揀。街上不時有些遊手好閒的人晃來晃去，路人見了都繞道而行。","exits":{"north":"/d/qiaoyin/north_street2","east":"/d/qiaoyin/smithy","south":"/d/qiaoyin/tree_tomb"},"objects":{"/d/qiaoyin/npc/vagabond":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-1,0]},"/d/qiaoyin/pawnshop":{"id":"/d/qiaoyin/pawnshop","file":"source/upstream/mudlib/d/qiaoyin/pawnshop.c","short":"和豐當鋪","long":"一間門面不大的當鋪，高高的櫃臺後面坐著朝奉，只露出一雙精明的眼睛，櫃臺前擺著一張長凳，供來典當的客人歇腳。牆上掛著一塊寫著「童叟無欺」的木牌，字跡已經有些模糊。","exits":{"west":"/d/qiaoyin/mid_lane1"},"objects":{"/d/qiaoyin/npc/hsiao_bi_chen":1,"/d/qiaoyin/npc/hsiao_lang_sheng":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,-2,0]},"/d/qiaoyin/pharmacy":{"id":"/d/qiaoyin/pharmacy","file":"source/upstream/mudlib/d/qiaoyin/pharmacy.c","short":"同仁藥鋪","long":"這裡是一間藥鋪，如果你有什麼需要，可以向藥鋪的掌櫃訊問一下。這種山村裡的小藥鋪，雖然治不了什麼大病，但是治療一般的跌打損傷還是綽綽有餘的。在你的正上方有一塊匾額，上面寫著濟世救人。","exits":{"north":"/d/qiaoyin/east_street3"},"objects":{"/d/qiaoyin/npc/keeper":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[0,1,0]},"/d/qiaoyin/sgate":{"id":"/d/qiaoyin/sgate","file":"source/upstream/mudlib/d/qiaoyin/sgate.c","short":"喬陰縣城南門","long":"喬陰縣城的南門，城牆上的磚石有些斑駁，看來已經許久沒有修繕。城門外是一片平坦的田野，阡陌縱橫，此刻城門卻已關上，幾名官兵守在門邊，不讓閒雜人等隨意出城。","exits":{"north":"/d/qiaoyin/south_street2"},"objects":{"/d/npc/garrison":4},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,3,0]},"/d/qiaoyin/smithy":{"id":"/d/qiaoyin/smithy","file":"source/upstream/mudlib/d/qiaoyin/smithy.c","short":"鐵匠鋪","long":"一間熱氣騰騰的鐵匠鋪，屋子中央的火爐燒得通紅，一旁擺著鐵砧與水箱，燒紅的鐵塊浸入水中時便冒起一陣白煙。牆上掛滿了刀、劍、斧頭等各式兵器，都是鐵匠閒暇時打造的。","exits":{"west":"/d/qiaoyin/north_street3"},"objects":{"/d/qiaoyin/npc/smith":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-2,-1,0]},"/d/qiaoyin/south_street1":{"id":"/d/qiaoyin/south_street1","file":"source/upstream/mudlib/d/qiaoyin/south_street1.c","short":"南大街","long":"南大街的北段，鄰近城中心的樹王墳。街邊有幾家小吃攤，蒸籠裡冒著白煙，飄來陣陣香味，攤子前的長凳上坐滿了埋頭吃喝的客人。路旁一棵老槐樹下，幾個老人正圍著棋盤，看得目不轉睛。","exits":{"north":"/d/qiaoyin/tree_tomb","south":"/d/qiaoyin/south_street2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,1,0]},"/d/qiaoyin/south_street2":{"id":"/d/qiaoyin/south_street2","file":"source/upstream/mudlib/d/qiaoyin/south_street2.c","short":"南大街","long":"南大街的南段，西邊是金水客棧，客棧門口常有往來的江湖人物進出，腰間佩刀掛劍，神色各異。街邊幾名穿著儒衫的年輕人正高聲談論著詩文，看來是哪家書院的弟子，路人也不禁駐足聆聽。","exits":{"north":"/d/qiaoyin/south_street1","west":"/d/qiaoyin/inn","south":"/d/qiaoyin/sgate"},"objects":{"/d/qiaoyin/npc/apprentice":3},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,2,0]},"/d/qiaoyin/tree_tomb":{"id":"/d/qiaoyin/tree_tomb","file":"source/upstream/mudlib/d/qiaoyin/tree_tomb.c","short":"樹王墳","long":"這裡便是喬陰縣著名的樹王墳了﹐一株約十多人合抱的大樹齊腰而斷﹐上面的紋理因為經常被撫摸而清晰可見﹐樹王墳的周圍方圓數十丈內都沒有建築﹐顯然縣城的居民對樹王墳十分崇敬﹐樹旁立著一塊石碑﹐上面刻得有字。","exits":{"west":"/d/qiaoyin/west_street4","east":"/d/qiaoyin/east_street1","north":"/d/qiaoyin/north_street3","south":"/d/qiaoyin/south_street1"},"objects":{"/d/qiaoyin/npc/fortune_teller":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,0,0]},"/d/qiaoyin/west_lane1":{"id":"/d/qiaoyin/west_lane1","file":"source/upstream/mudlib/d/qiaoyin/west_lane1.c","short":"街道","long":"西門內的一條街道，路面鋪著青石板，兩旁是低矮的民宅，牆角長滿了青苔。這裡離城門不遠，常可以聽見守城官兵換班時的吆喝聲，住在附近的人家對此早已習以為常。","exits":{"north":"/d/qiaoyin/wgate","south":"/d/qiaoyin/west_lane2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,-2,0]},"/d/qiaoyin/west_lane2":{"id":"/d/qiaoyin/west_lane2","file":"source/upstream/mudlib/d/qiaoyin/west_lane2.c","short":"街道","long":"西大街北邊的一條街道，西邊有一間書肆，門口掛著一塊寫著「名山書肆」的舊招牌，偶爾可以聞到從裡面飄出來的墨香。街角蹲著一個衣衫襤褸的老婦人，向路過的行人伸手乞討。","exits":{"north":"/d/qiaoyin/west_lane1","west":"/d/qiaoyin/bookstore","south":"/d/qiaoyin/west_street1"},"objects":{"/d/qiaoyin/npc/crone":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,-1,0]},"/d/qiaoyin/west_street1":{"id":"/d/qiaoyin/west_street1","file":"source/upstream/mudlib/d/qiaoyin/west_street1.c","short":"西大街","long":"西大街的西端，街角有幾個孩童在玩耍，不時傳來嬉笑聲，一隻黃狗懶洋洋地趴在牆邊曬太陽。路旁的屋簷下掛著一串串風乾的辣椒和玉米，看來這一帶住的多是尋常百姓人家。","exits":{"north":"/d/qiaoyin/west_lane2","east":"/d/qiaoyin/west_street2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,0,0]},"/d/qiaoyin/west_street2":{"id":"/d/qiaoyin/west_street2","file":"source/upstream/mudlib/d/qiaoyin/west_street2.c","short":"西大街","long":"西大街上人來人往，路邊擺著幾個賣菜賣果子的攤子，攤販們扯著嗓子招攬生意，偶爾還有官府的差役穿過人群。地上散落著菜葉和果皮，幾隻雞在攤子底下啄食，熱鬧中帶著幾分雜亂。","exits":{"west":"/d/qiaoyin/west_street1","east":"/d/qiaoyin/west_street3"},"objects":{"/d/qiaoyin/npc/chaxigol":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-6,0,0]},"/d/qiaoyin/west_street3":{"id":"/d/qiaoyin/west_street3","file":"source/upstream/mudlib/d/qiaoyin/west_street3.c","short":"西大街","long":"西大街的中段，南邊是一間氣派的錢莊，朱漆大門上釘著一排銅釘，門口站著幾名護院武師，目光不住地打量著來往的行人。錢莊對面的牆根下，幾個閒漢倚著牆曬太陽，不時朝錢莊門口張望。","exits":{"west":"/d/qiaoyin/west_street2","east":"/d/qiaoyin/west_street4","north":"/d/qiaoyin/mid_lane2","south":"/d/qiaoyin/bank"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,0,0]},"/d/qiaoyin/west_street4":{"id":"/d/qiaoyin/west_street4","file":"source/upstream/mudlib/d/qiaoyin/west_street4.c","short":"西大街","long":"西大街的東端，遠遠就能望見城中心那株齊腰而斷的大樹。這一帶的店家多半賣些香燭紙錢，據說是給前往樹王墳祭拜的人準備的，整條街的空氣中總帶著一股淡淡的檀香味。","exits":{"west":"/d/qiaoyin/west_street3","east":"/d/qiaoyin/tree_tomb"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,0,0]},"/d/qiaoyin/wgate":{"id":"/d/qiaoyin/wgate","file":"source/upstream/mudlib/d/qiaoyin/wgate.c","short":"喬陰縣城西門","long":"這裡是喬陰縣城的西門，西門的城樓是喬陰縣城四個城門中最完整的，城牆並不甚高，但是縱深極深，從城樓這端到另一端足足有二十多丈，兩重鐵柵門，四重護城門，當初建造這裡的城樓時正是北方大山裡青邪起兵侵擾最烈的時候，因此城樓建得格外堅固。往西出城門的大路可以通往五堂鎮。","exits":{"west":"/d/qiaoyin/highway","south":"/d/qiaoyin/west_lane1"},"objects":{"/d/qiaoyin/npc/han_wen_suei":1,"/d/npc/garrison":4},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,-3,0]},"/d/qiaoyin_east/cell":{"id":"/d/qiaoyin_east/cell","file":"source/upstream/mudlib/d/qiaoyin_east/cell.c","short":"靜室","long":"這是一間狹小的靜室，地上放著一對蒲團，牆角的香爐裏插著三炷線香，煙氣筆直地往上升。窗紙糊得嚴嚴實實，外頭的聲響到了這裡都悶了下來，只剩自己的呼吸聲，壁上懸著一幅「靜」字條幅，墨色已有些褪淡。","exits":{"east":"/d/qiaoyin_east/corridor_w"},"objects":{},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[-1,0,0]},"/d/qiaoyin_east/clinic":{"id":"/d/qiaoyin_east/clinic","file":"source/upstream/mudlib/d/qiaoyin_east/clinic.c","short":"武陀灸堂","long":"這裡便是武陀灸堂﹐一陣陣的藥香從裡頭的針房傳了出來。四周的空間並不算大, 只兩張小桌, 一個書櫃, 幾張破椅就差不多塞滿了。四面的牆壁為未經粉刷的土牆, 零落地掛著幾張字畫, 正面的牆上貼著兩張紅聯, 上頭寫著:　　　 　　　　　　　　　　　　 持針濟世道通當仁不讓　　　　　　　　　　　　 　　　　　　　　　　　　 煉丹救民華陀逃之夭夭","exits":{"north":"/d/qiaoyin_east/hut"},"objects":{"/d/qiaoyin_east/npc/wu_dauton":1},"special":[],"area":"喬陰東郊","layer":null,"areaKey":"喬陰東郊","pos":[2,3,0]},"/d/qiaoyin_east/corridor_e":{"id":"/d/qiaoyin_east/corridor_e","file":"source/upstream/mudlib/d/qiaoyin_east/corridor_e.c","short":"東廊","long":"簷下掛著一排銅鈴，鈴舌靜靜垂著，積了薄薄一層灰。廊邊的長凳被坐得溫潤，靠柱處擺著一盆養得極好的菊花。牆那一頭的練武場人聲不斷，這裡卻只聽得見自己的腳步聲。","exits":{"north":"/d/qiaoyin_east/ground_e","south":"/d/qiaoyin_east/refectory","west":"/d/qiaoyin_east/court"},"objects":{},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[2,0,0]},"/d/qiaoyin_east/corridor_w":{"id":"/d/qiaoyin_east/corridor_w","file":"source/upstream/mudlib/d/qiaoyin_east/corridor_w.c","short":"西廊","long":"迴廊的木柱漆色斑駁，柱腳被往來衣擺磨得發亮。廊外的青磚地鋪得齊整，縫隙間長著幾叢細草。練武場那頭傳來的呼喝與拳腳聲，隔著廊壁變得悶悶的，倒讓這裡多了幾分肅靜。","exits":{"north":"/d/qiaoyin_east/ground_w","south":"/d/qiaoyin_east/sutra_hall","west":"/d/qiaoyin_east/cell","east":"/d/qiaoyin_east/court"},"objects":{},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[0,0,0]},"/d/qiaoyin_east/court":{"id":"/d/qiaoyin_east/court","file":"source/upstream/mudlib/d/qiaoyin_east/court.c","short":"中庭","long":"中庭鋪著整片的青石板，正中一座三足銅鼎，鼎裏的香灰積得老高，檀香的氣息淡淡地縈繞不散。四面廊廡環抱，簷下的朱漆已褪成暗紅，石板縫裏鑽出幾莖青苔，有種不為歲月所擾的清幽。","exits":{"north":"/d/qiaoyin_east/yard","south":"/d/qiaoyin_east/hall","west":"/d/qiaoyin_east/corridor_w","east":"/d/qiaoyin_east/corridor_e"},"objects":{},"special":[],"area":"白雲觀","layer":null,"areaKey":"白雲觀","pos":[1,0,0]},"/d/qiaoyin_east/fork":{"id":"/d/qiaoyin_east/fork","file":"s
